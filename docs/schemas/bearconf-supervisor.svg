<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 680 425" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Mode superviseur BearConf</title>
