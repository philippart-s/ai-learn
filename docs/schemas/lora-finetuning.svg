<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 680 425" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Fine-tuning avec LoRA</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="425" fill="#FFFFFF"/>

  <rect x="20" y="132" width="110" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
  <text x="75" y="151" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="500" fill="#444441">📥 Entrée</text>
  <text x="75" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">de la couche</text>

  <rect x="260" y="40" width="110" height="110" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="315" y="78" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="500" fill="#0C447C">🧊 W gelé</text>
  <text x="315" y="100" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#185FA5">3072 × 3072</text>
  <text x="315" y="118" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#185FA5">≈ 9,4 M poids</text>

  <text x="234" y="164" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#712B13">A : 3072 × 128</text>
  <rect x="230" y="175" width="8" height="110" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="1.3"/>
  <rect x="300" y="226" width="110" height="8" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="1.3"/>
  <text x="355" y="252" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#712B13">B : 128 × 3072</text>
  <text x="315" y="302" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#712B13">🔥 A + B : ≈ 0,8 M poids entraînables, 12× moins</text>

  <circle cx="490" cy="160" r="14" fill="#FFFFFF" stroke="#73726C" stroke-width="1.5"/>
  <text x="490" y="160" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="500" fill="#444441">+</text>

  <rect x="540" y="132" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
  <text x="600" y="151" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="500" fill="#444441">📤 Sortie</text>
  <text x="600" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">de la couche</text>

  <g stroke="#73726C" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M130 160 L160 160 L160 95 L258 95"/>
    <path d="M160 160 L160 230 L228 230"/>
    <line x1="240" y1="230" x2="298" y2="230"/>
    <path d="M372 95 L490 95 L490 144"/>
    <path d="M412 230 L490 230 L490 176"/>
    <line x1="506" y1="160" x2="538" y2="160"/>
  </g>

  <text x="20" y="330" dominant-baseline="central" font-size="13" font-weight="500" fill="#5F5E5A">Après l’entraînement : merge</text>
  <rect x="20" y="346" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text x="105" y="365" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">🧊 Llama 3.2 3B</text>
  <text x="105" y="385" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Inchangé</text>
  <text x="205" y="374" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="500" fill="#444441">+</text>
  <rect x="220" y="346" width="190" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.3"/>
  <text x="315" y="365" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">🔥 Adaptateur LoRA</text>
  <text x="315" y="385" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Entraîné sur BearConf</text>
  <line x1="414" y1="374" x2="466" y2="374" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="470" y="346" width="190" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.6"/>
  <text x="565" y="365" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#27500A">✅ Modèle fusionné</text>
  <text x="565" y="385" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">Aucun surcoût à l’inférence</text>
</svg>
