<script>
const PROGRAM = [{"id":7899,"title":"DevOps : tournons la page, place au Platform Engineering !","description":"Pendant des années, le DevOps et son principe \u0026quot;you build it, you run it\u0026quot; ont été présentés comme la solution ultime pour accélérer la livraison logicielle. Pourtant, sur le terrain, une réalité s\u0026#39;impose : la majorité des développeurs n\u0026#39;aiment pas gérer l\u0026#39;infrastructure. Entre Kubernetes, les configurations cloud multi-providers, l\u0026#39;observabilité, la sécurité et les pipelines CI/CD, cette charge cognitive les éloigne de leur véritable valeur ajoutée : concevoir et développer des applications robustes.\u003cbr\u003e\u003cbr\u003eCe talk propose une analyse critique du modèle DevOps classique et présente le Platform Engineering comme son évolution naturelle. Nous explorerons comment les Internal Developer Platforms (IDPs) transforment l\u0026#39;expérience développeur en abstrayant la complexité infrastructure sans sacrifier l\u0026#39;autonomie des équipes. Au programme : les limites concrètes du \u0026quot;you build it, you run it\u0026quot;, l\u0026#39;anatomie d\u0026#39;une IDP efficace, le rôle des Platform Engineers, et une démonstration live de self-service avec Backstage. Nous verrons comment ce paradigme améliore les DORA metrics, réduit le time-to-market et augmente la satisfaction des équipes, tout en conservant les acquis culturels du DevOps.","summary":"Ce talk critique les limites du modèle DevOps \"you build it, you run it\" et présente le Platform Engineering comme solution, via les Internal Developer Platforms (IDP) qui simplifient l’infrastructure pour les développeurs. Démonstration de Backstage et analyse des gains en efficacité, autonomie et satisfaction des équipes.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":184,"track":{"id":1256,"name":"Cloud \u0026 Plateformes","description":"Backend and platform engineering across technologies: frameworks (Java, Go, Node, Rust…), Kubernetes, serverless, observability, SRE practices and infrastructure-as-code for production systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2569,"firstName":"Karim","lastName":"Moreau","fullName":"Karim Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":12048,"firstName":"Samir","lastName":"Garnier","fullName":"Samir Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"développeur"},{"name":"devops"},{"name":"plateforme"},{"name":"infrastructure"}],"timeSlots":[]},{"id":91513,"title":"Décrypter un domaine en profondeur à travers la littérature scientifique","description":"Je lis des publications scientifiques tout le temps, pour n\u0026#39;importe quel sujet que je veux apprendre sérieusement. Pourquoi perdre son temps à lire des opinions et des résumés superficiels quand vous pouvez trouver des réponses fiables et précises directement dans des publications scientifiques ? Mais on ne va pas se mentir, la littérature académique peut paraître intimidante si vous ne savez pas comment l\u0026#39;aborder. Et même avec l\u0026#39;IA, la lecture d\u0026#39;articles reste un ingrédient clé.\u003cbr\u003e\u003cbr\u003eSi vous n\u0026#39;êtes pas familier avec l\u0026#39;univers des publications scientifiques, rejoignez-moi pour découvrir comment explorer ces contenus austères mais fascinants propulsera votre apprentissage, quel que soit le sujet. Nous illustrerons cela à la fois pour modéliser un domaine métier (à la DDD) et pour comprendre le groove en musique (pour le fun).","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":70,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":89112,"firstName":"Ethan","lastName":"Perrin","fullName":"Ethan Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"apprentissage"},{"name":"lecture"},{"name":"science"},{"name":"recherche"}],"timeSlots":[]},{"id":26815,"title":"Compose \u0026 Dragons : un jeu de rôle d\u0027agents propulsés par des Tiny Language Models","description":"Debunkons quelques croyances relatives aux (tout) petits LLMs, ceux qui font moins de 4b de paramètres. On entend souvent:\u003cbr\u003eIls sont inutiles et ne savent rien faire, ils ne connaissent rien, ils sont mauvais en function calling (donc pas de MCP)\u003cbr\u003e\u003cbr\u003eC\u0026#39;est en partie faux, et on peut remédier au reste et construire des systèmes d\u0026#39;IA générative avec ces très petits modèles.\u003cbr\u003e\u003cbr\u003eC\u0026#39;est ce que nous allons démontrer lors de cette université d\u0026#39;une façon ludique: \u003cbr\u003e\u003cbr\u003eNous avons utilisés les fonctionnalités d\u0026#39;IA de Docker, pour développer un jeu de rôle de type \u0026quot;dungeon crawler\u0026quot; (EN MODE TEXTE) avec des PNJ, des monstres, des jets de dés ... le tout piloté par des agents d\u0026#39;IA (codés from scratch par nos soins) qui utilisent uniquement de très petits modèles (comme par ex: Jan-nano-gguf 4b, qwen2.5 1.5b, granite-embedding 278m pour le RAG, ...)\u003cbr\u003e\u003cbr\u003eNous verrons entre autre comment créer des PNJ avec une personnalité, un dungeon master qui va gérer vos mouvements, combats ... et permettre de parler à tel ou tel PNJ ...\u003cbr\u003e\u003cbr\u003eAlors, notre jeu n\u0026#39;est pas Diablo (mais il reste jouable), mais vous repartirez avec des recettes et des conseils réutilisables pour développer vos propres solutions avec des tout petits modèles.","summary":"Cette présentation démonte les idées reçues sur les très petits LLMs (\u003c4B paramètres), montrant qu’ils sont capables de tâches variées. À travers la création d’un jeu de rôle textuel piloté par ces modèles, elle propose des méthodes et conseils pour concevoir des systèmes d’IA générative efficaces avec peu de ressources.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":89,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":959,"slug":"deep-dive-180","name":"3H Deep Dive","duration":180,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"3 hours sessions where attendees can rapidly immerse themselves in a subject matter with an in-depth examination of a topic or technology.","cssColor":"#c2cced","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":7356,"firstName":"Nadia","lastName":"Garnier","fullName":"Nadia Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":26753,"firstName":"Idris","lastName":"Renaud","fullName":"Idris Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"pnj"},{"name":"jeu"},{"name":"modèles"},{"name":"ia"}],"timeSlots":[]},{"id":51635,"title":"Le Clean Code, ça compte vraiment","description":"Bien que très répandu dans le monde de la programmation, le \u003cstrong\u003eClean Code\u003c/strong\u003e est souvent — à tort — considéré comme facultatif ou comme un simple \u003cem\u003e“nice to have”\u003c/em\u003e. Le but de cette présentation est de sensibiliser aux principes fondamentaux du Clean Code, en montrant qu’il s’agit d’une \u003cstrong\u003evéritable nécessité\u003c/strong\u003e pour produire un code \u003cstrong\u003elisible, maintenable et durable\u003c/strong\u003e.\u003cbr\u003eÀ travers des exemples concrets, nous explorerons les fondations du Clean Code :\u003cbr\u003e\u003cul\u003e\u003cli\u003eune \u003cstrong\u003edéfinition claire\u003c/strong\u003e de ce qu’est le Clean Code ;\u003c/li\u003e\u003cli\u003epourquoi la \u003cstrong\u003elisibilité\u003c/strong\u003e doit toujours passer en premier ;\u003c/li\u003e\u003cli\u003ecomment \u003cstrong\u003esimplicité\u003c/strong\u003e et \u003cstrong\u003ecohérence\u003c/strong\u003e rendent un code naturellement maintenable ;\u003c/li\u003e\u003cli\u003een quoi les principes de \u003cstrong\u003eSOLID design\u003c/strong\u003e aident à construire des systèmes robustes et évolutifs ;\u003c/li\u003e\u003cli\u003eet enfin, comment viser une \u003cstrong\u003equalité durable\u003c/strong\u003e grâce aux tests, au TDD, aux outils et à l’automatisation (CI/CD).\u003c/li\u003e\u003c/ul\u003eL’objectif est de repartir avec des \u003cstrong\u003ehabitudes simples et concrètes\u003c/strong\u003e, faciles à mettre en place au quotidien, afin d’aider chacun à s’intéresser au Clean Code et à en adopter progressivement les concepts.","summary":"Cette présentation montre que le Clean Code est essentiel, non optionnel. À travers définitions, principes de lisibilité, simplicité, cohérence, SOLID, tests et automatisation, elle propose des pratiques concrètes pour écrire un code durable, maintenable et de qualité, et encourager chacun à adopter progressivement les réflexes du Clean Code.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":178,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":22491,"firstName":"Élise","lastName":"Renaud","fullName":"Élise Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"lisibilité"},{"name":"tests"},{"name":"maintenabilité"},{"name":"simplicité"}],"timeSlots":[]},{"id":44001,"title":"UDA (Unified Data Architecture) chez un géant du streaming","description":"À Netflix, des dizaines de systèmes coexistent : APIs GraphQL, pipelines Avro/Flink, tables Iceberg, indexes OpenSearch… Chaque système définit ses propres schémas, sa propre compréhension de ce qu\u0026#39;est \u003cem\u003eMovie\u003c/em\u003e ou \u003cem\u003eTalent\u003c/em\u003e. Quand ces définitions divergent — et elles divergent toujours — on le paie en intégrations cassées, en réconciliation manuelle, et en heures passées à répondre à la question : \u0026quot;Quel système a la bonne définition ?\u0026quot;\u003cbr\u003e\u003cbr\u003eD\u0026#39;où UDA, un endroit unique et canonique pour définir les concepts métier de l\u0026#39;entreprise. Quand une équipe définit \u003cem\u003eMovie\u003c/em\u003e dans notre framework conceptuel Upper, cette définition se projette automatiquement vers tous les systèmes: schémas GraphQL, schémas Avro, tables Iceberg, APIs Java, …\u003cbr\u003e\u003cbr\u003eTrois enseignements clés :\u003cbr\u003e\u003cbr\u003e\u003cul\u003e\u003cli\u003eLa fragmentation des données — Comment des modèles déconnectés mènent à la duplication et aux problèmes de qualité, et comment une sémantique partagée reconnecte les silos.\u003c/li\u003e\u003cli\u003eLes knowledge graphs (graphes de connaissance) — Ce qu\u0026#39;est réellement un knowledge graph et comment Netflix utilise RDF pour structurer ses données.\u003c/li\u003e\u003cli\u003eModel Once, Represent Everywhere — Comment un concept défini une seule fois se projette vers GraphQL, Avro, SQL, et plus encore.\u003c/li\u003e\u003c/ul\u003e","summary":"Cette présentation explique comment Netflix unifie ses modèles métier grâce à UDA, un cadre conceptuel unique qui projette automatiquement les définitions vers tous les systèmes (GraphQL, Avro, Iceberg, etc.). Elle aborde la fragmentation des données, l’usage des knowledge graphs RDF et le principe “Model Once, Represent Everywhere”.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":171,"track":{"id":1251,"name":"Architecture \u0026 Design","description":"Designs, trade-offs and real-world decisions for building maintainable systems. Case studies, system evolution (monolith→services), DDD, event-driven approaches, resilience and architectural anti-patterns."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":41306,"firstName":"Nathan","lastName":"Dubois","fullName":"Nathan Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"United States of America"}],"keywords":[{"name":"graphes"},{"name":"fragmentation"},{"name":"sémantique"},{"name":"modélisation"}],"timeSlots":[]},{"id":85073,"title":"Livrer vite, sécuriser jamais : l\u0027IA entre gain de productivité et chaos sécuritaire","description":"L\u0026#39;IA va nous “augmenter”. C\u0026#39;est en tout cas ce qu\u0026#39;on nous répète. Les devs, les QA, les PO/PM, les ingés sécu, les analystes - tous augmentés. Face à cette promesse, les entreprises ont fait le seul choix qui semblait logique : DEPLOYER, VITE et PARTOUT! Ne surtout pas rater le train!\u003cbr\u003e\u003cbr\u003eAujourd\u0026#39;hui, l\u0026#39;IA est dans nos téléphones, nos postes de travail, nos IDE, nos pipelines CI/CD, nos SaaS.\u003cbr\u003e\u003cbr\u003eEt la sécurité dans tout ça ? “On verra après.\u0026quot;\u003cbr\u003eLe problème, c\u0026#39;est qu\u0026#39;après, c\u0026#39;est maintenant.\u003cbr\u003e\u003cbr\u003eDans cette session, on vous propose un état des lieux concret de la sécurité de l\u0026#39;écosystème IA : LLM, agents autonomes, MCP (Model Context Protocol), chaînes multi-agents. On vous montre de vraies failles, avec de vraies démos.\u003cbr\u003e\u003cbr\u003eOn s\u0026#39;appuiera sur les travaux de l\u0026#39;OWASP, notamment le Top 10 for LLM Applications et le tout nouveau Top 10 for Agentic Applications 2026, pour cartographier les risques et proposer des pistes de mitigation concrètes.\u003cbr\u003e\u003cbr\u003eAu programme :\u003cbr\u003e\t•\tTour d\u0026#39;horizon des surfaces d\u0026#39;attaque introduites par l\u0026#39;IA en entreprise\u003cbr\u003e\t•\tDémos d\u0026#39;attaques réelles pour illustrer les scénarios d\u0026#39;attaque les plus critiques\u003cbr\u003e\t•\tFocus conformité : ce que l\u0026#39;EU AI Act implique pour vos déploiements","summary":"Cette session dresse un état des lieux de la **sécurité dans l’écosystème IA** : LLM, agents autonomes, MCP, chaînes multi‑agents. À travers des **démos de failles réelles** et les travaux de l’**OWASP**, elle expose les nouvelles surfaces d’attaque, les risques majeurs et les **pistes de mitigation** face aux exigences du **EU AI Act**.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":169,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":77873,"firstName":"Manon","lastName":"Perrin","fullName":"Manon Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":77886,"firstName":"Jade","lastName":"Perrin","fullName":"Jade Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"sécurité"},{"name":"risques"},{"name":"ia"},{"name":"conformité"}],"timeSlots":[]},{"id":41358,"title":"Unconference : le quotidien d\u0027un rôle Staff+","description":"\u003cstrong\u003eL’unconference, c’est un espace pour échanger librement sur les défis des rôles Staff et au-delà.\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003eVous êtes \u003cstrong\u003e\u003cem\u003eStaff Engineer\u003c/em\u003e, \u003cem\u003ePrincipal\u003c/em\u003e, \u003cem\u003eDistinguished Engineer\u003c/em\u003e\u003c/strong\u003e ou simplement en réflexion sur ces postes ? Cet espace est fait pour vous. Pas de programme imposé : on part de \u003cstrong\u003evos questions, vos défis, \u003c/strong\u003epour un temps d’échange utile et concret.\u003cbr\u003e\u003cbr\u003e\u003cul\u003e\u003cli\u003e\u003cem\u003e\u0026quot;Comment concilier leadership technique et influence stratégique quand on est Staff+ ?\u0026quot;\u003c/em\u003e\u003c/li\u003e\u003cli\u003e\u003cem\u003e\u0026quot;Quelles clés pour réussir sa transition vers un rôle de Staff ou Principal Engineer ?\u0026quot;\u003c/em\u003e\u003c/li\u003e\u003cli\u003e\u003cem\u003e\u0026quot;Comment garder un impact technique fort tout en accompagnant des équipes dispersées ?\u0026quot;\u003c/em\u003e\u003c/li\u003e\u003cli\u003e\u003cem\u003eGérer les attentes parfois contradictoires entre expertise technique et leadership ?\u0026quot;\u003c/em\u003e\u003c/li\u003e\u003cli\u003e\u003cem\u003e\u0026quot;Influencer sans autorité hiérarchique\u0026quot;\u003c/em\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eVenez \u003cstrong\u003eavec vos propres questions :\u003c/strong\u003e une situation complexe, une transition à préparer, votre posture ou carrière, une bonne pratique à partager...\u003cbr\u003e\u003cbr\u003eEnsemble avec des Staff et CTO expérimentés du collectif \u003ca href\u003d\"https://staff42.org/\" rel\u003d\"noopener noreferrer\" target\u003d\"_blank\"\u003eStaff42\u003c/a\u003e, explorez ces sujets en petits groupes pendant le lab, confrontez les retours d’expérience, et ressortez avec des pistes adaptées à votre réalité.","summary":"Session d’unconference dédiée aux rôles Staff+ (Staff, Principal, Distinguished Engineers). Sans programme préétabli, les participants explorent ensemble leurs défis : leadership technique, influence sans autorité, transitions de carrière, impact à grande échelle. Animée par le collectif Staff42, elle favorise échanges, retours d’expérience et solutions concrètes.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":35,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":984,"slug":"lab-120","name":"2H Hands-on Lab","duration":120,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"2 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":41304,"firstName":"Anaïs","lastName":"Dubois","fullName":"Anaïs Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":44154,"firstName":"Karim","lastName":"Dubois","fullName":"Karim Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":51504,"firstName":"Clara","lastName":"Dubois","fullName":"Clara Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":51535,"firstName":"Nadia","lastName":"Marchand","fullName":"Nadia Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":65168,"firstName":"Basile","lastName":"Marchand","fullName":"Basile Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"technique"},{"name":"influence"},{"name":"leadership"},{"name":"transition"}],"timeSlots":[]},{"id":34405,"title":"Feature flags : allié précieux ou boulet pour l\u0027équipe ?","description":"Vous avez le réflexe d\u0026#39;utiliser les feature flags dans vos projets pour gérer les mises en prod continues ou les dépendances externes et vous voyez le coût caché après, entre accumulation de code mort, complexité cyclomatique, tests de non-régression démultipliés. Ce \u0026quot;quick win\u0026quot; peut vite devenir un \u0026quot;mess\u0026quot; qui impacte le moral des équipes.\u003cbr\u003eCe talk propose de prendre du recul sur cette pratique. Nous verrons comment une utilisation inappropriée transforme votre base de code et, surtout, quelles sont les alternatives concrètes issues des pratiques agile et craft et du design d\u0026#39;architecture :\u003cbr\u003e\u003cul\u003e\u003cli\u003eDécoupage INVEST \u0026amp; Hamburger technique : pour éliminer le besoin de livraison partielle.\u003c/li\u003e\u003cli\u003eTrunk-based development \u0026amp; Branch by Abstraction : pour se passer des flags de branching.\u003c/li\u003e\u003cli\u003eDesign Patterns (Strategy, Decorator) \u0026amp; Domain-Driven Design : pour transformer un flag technique en règle métier explicite.\u003c/li\u003e\u003cli\u003eCircuit Breaker : pour automatiser la résilience face aux services tiers.\u003c/li\u003e\u003c/ul\u003eMon objectif est de ne plus utiliser les feature flags par défaut, mais comprendre leur réel \u003cstrong\u003etrade-off\u003c/strong\u003e pour ne les garder que là où ils apportent une valeur.","summary":"Ce talk analyse les dérives liées à l’usage excessif des feature flags et leurs coûts cachés. Il présente des alternatives issues de l’agilité, du craft et du design d’architecture (INVEST, Trunk-based development, DDD, Circuit Breaker) afin d’en faire un choix conscient et ciblé plutôt qu’un réflexe systématique.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":139,"track":{"id":1251,"name":"Architecture \u0026 Design","description":"Designs, trade-offs and real-world decisions for building maintainable systems. Case studies, system evolution (monolith→services), DDD, event-driven approaches, resilience and architectural anti-patterns."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":30554,"firstName":"Sacha","lastName":"Dubois","fullName":"Sacha Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"architecture"},{"name":"résilience"},{"name":"flags"},{"name":"agile"}],"timeSlots":[]},{"id":4009,"title":"Coding agents : 30 pro tips en 30 minutes, chrono en main","description":"30 minutes, 30 astuces. 1 mission : transformer votre manière de travailler avec \u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: oklch(0.21 0.034 264.665);\"\u003eClaude Code\u003c/strong\u003e et vous faire gagner en \u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: oklch(0.21 0.034 264.665);\"\u003eproductivité\u003c/strong\u003e.\u003cbr\u003e\u003cbr\u003eClaude Code est devenu bien plus qu’un simple générateur de code : c’est un co-pilote capable d’écrire, refactorer, déboguer et même anticiper vos besoins. Mais sa vraie puissance se révèle quand on connaît les bons \u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: oklch(0.21 0.034 264.665);\"\u003etips \u0026amp; tricks\u003c/strong\u003e pour en tirer le maximum.\u003cbr\u003e\u003cbr\u003eDans cette session, nous passerons en revue une série de bonnes pratiques et astuces concrètes pour \u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: oklch(0.21 0.034 264.665);\"\u003ebooster votre efficacité\u003c/strong\u003e et faire de Claude Code un outil indispensable dans votre boîte à outils de développeur :\u003cbr\u003e• Prompting efficace \u0026amp; patterns réutilisables\u003cbr\u003e• Debug, génération de tests \u0026amp; refactoring intelligent\u003cbr\u003e• APIs, documentation \u0026amp; gestion du contexte\u003cbr\u003e• UI tips, slash commands \u0026amp; astuces cachées\u003cbr\u003e\u003cbr\u003eQue vous découvriez Claude Code ou que vous l’utilisiez déjà au quotidien, vous repartirez avec une vraie boîte à outils de tips et de hacks pour coder plus vite, mieux et avec plus de confiance !\u003cbr\u003e","summary":"Cette session propose 30 astuces concrètes pour exploiter pleinement Claude Code comme copilote de développement. Elle couvre prompting, refactoring, debug, tests, APIs, gestion du contexte et UI, afin d’améliorer la productivité et faire de Claude Code un outil indispensable pour tout développeur, débutant ou confirmé.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":217,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2551,"firstName":"Zoé","lastName":"Moreau","fullName":"Zoé Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"productivité"},{"name":"mission"},{"name":"astuces"},{"name":"minutes"}],"timeSlots":[]},{"id":114351,"title":"Gouvernance partagée en équipe IT : ce qu\u0027on a gardé, jeté et retenu","description":"Et si le prochain modèle d’entreprise restait à inventer ?\u003cbr\u003eEntreprise libérée, holacratie, sociocratie 3.0… les modèles « alternatifs » promettent autonomie, engagement et performance. Mais que deviennent- ils dans une ESN en croissance, avec des consultants en mission, des clients exigeants et des contraintes économiques ?\u003cbr\u003e\u003cbr\u003eChez INOCO, nous avons beaucoup expérimenté : certaines pratiques ont changé durablement notre quotidien, d’autres se sont révélées inadaptées. Une partie des salariés est même devenue associée pour co-construire « \u003cem\u003ela meilleure organisation possible \u003c/em\u003e».\u003cbr\u003e\u003cbr\u003eSans langue de bois et avec humour, venez découvrir notre organisation actuelle, les difficultés rencontrées, les solutions encore en test et les questions ouvertes. Pas de modèle clé en main : un retour d’expérience vivant, imparfait et assumé, avec des actions concrètes à transposer pour renforcer engagement, décision partagée et cohésion.\u003cbr\u003e\u003cbr\u003eVous repartirez avec des idées d’actions, testées et approuvées chez nous, applicables à votre équipe pour renforcer l’engagement, le partage des décisions et la cohésion !","summary":"Retour d’expérience sur la mise en place de modèles organisationnels alternatifs dans une ESN en croissance : réussites, échecs, pratiques adaptées et pistes d’amélioration. Une exploration pragmatique et sans filtre pour renforcer l’engagement, la décision partagée et la cohésion au sein des équipes.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":81,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":97753,"firstName":"Maya","lastName":"Perrin","fullName":"Maya Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":112402,"firstName":"Karim","lastName":"Perrin","fullName":"Karim Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"cohésion"},{"name":"organisation"},{"name":"engagement"},{"name":"entreprise"}],"timeSlots":[]},{"id":2720,"title":"MCP par la pratique : une appli pour tout comprendre","description":"Model Context Protocol, le célèbre protocole développé par Anthropic, est sorti en 2024 et s’est rapidement imposé dans le monde des IA génératives. Conçu pour interconnecter des LLM et des systèmes externes, MCP ouvre la voie à des intégrations puissantes : appels d’API web, accès à des sources de connaissance privées, ou encore déclenchement d’autres IA !\u003cbr\u003e\u003cbr\u003eLa première utilisation de MCP est excessivement simple : on lance un serveur, on configure un client, et hop, ça marche ! Cependant, une mécanique riche se cache derrière cette simplicité apparente et il est essentiel de la comprendre pour l’intégrer dans ses projets.\u003cbr\u003e\u003cbr\u003eCe sera l’enjeu de ce talk. Je vous propose de plonger dans les entrailles de MCP. Nous développerons ensemble une petite application en Python, ce qui nous permettra de passer en revue les différentes fonctionnalités du protocole, d’observer les interactions entre les différentes briques et d’avoir une bonne connaissance de son écosystème.\u003cbr\u003e\u003cbr\u003eÀ la fin de cette session, vous partirez avec toutes les clés pour intégrer MCP dans vos projets en production.","summary":"Ce talk explore le Model Context Protocol (MCP) d’Anthropic, un protocole clé pour connecter LLM et systèmes externes. Après une introduction pratique, il détaille les mécanismes internes de MCP via un projet Python, offrant ainsi aux participants les bases pour intégrer MCP dans leurs propres projets.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":272,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2578,"firstName":"Romane","lastName":"Moreau","fullName":"Romane Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"llm"},{"name":"intégration"},{"name":"protocole"},{"name":"python"}],"timeSlots":[]},{"id":7880,"title":"Et si on soulevait le capot de PostgreSQL ?","description":"PostgreSQL est une des bases de données les plus utilisées et les plus appréciées. Mais sait-on vraiment comment elle fonctionne ? \u003cbr\u003eQu’est ce qui lui permet d’être à la fois performante, tolérante aux crashs et hautement disponible ? \u003cbr\u003e\u003cbr\u003eJe vous propose de découvrir ensemble les internals de Postgres et d\u0026#39;apprendre comment sont stockées vos données sur celle-ci.\u003cbr\u003eEn partant d’une simple requête sql et en passant par toutes les étapes pour récupérer la donnée que l\u0026#39;on recherche, découvrons comment PG fonctionne.\u003cbr\u003eNous aborderons les notions spécifiques aux implémentations de bases de données et plus spécifiquement celles de Postgres (query planner, write ahead log, mvcc, tuples, vacuum, …).","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":135,"track":{"id":1254,"name":"Data \u0026 Analytics","description":"Data storage, streaming, processing and ML engineering. Topics include data architecture, feature stores, training pipelines, MLOps and scalable analytics workflows."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":5512,"firstName":"Maya","lastName":"Lefevre","fullName":"Maya Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"internals"},{"name":"postgresql"},{"name":"mvcc"},{"name":"requête"}],"timeSlots":[]},{"id":47453,"title":"Sécurité de la supply chain : REX et points de douleur de la CI/CD en 2026","description":"Vos pipelines CI/CD sont-ils votre talon d\u0026#39;Achille ? Entre conformité réglementaire (NIS2 pour n\u0026#39;en citer qu\u0026#39;un), sécurisation des images de conteneurs et standardisation des workflows, les défis sont nombreux. L\u0026#39;\u003ca href\u003d\"https://owasp.org/www-project-top-10-ci-cd-security-risks/\" rel\u003d\"noopener noreferrer\" target\u003d\"_blank\"\u003eOWASP Top 10 CI/CD Security Risks\u003c/a\u003e existe bien pour cela !\u003cbr\u003e\u003cbr\u003eAnimé par l\u0026#39;équipe \u003ca href\u003d\"https://r2devops.io/\" rel\u003d\"noopener noreferrer\" target\u003d\"_blank\"\u003eR2Devops\u003c/a\u003e (CTO \u0026amp; Ambassadeurs), ce BOF réunit Devs, Ops, SREs, RSSIs \u0026amp; co pour échanger sans filtre sur leurs problématiques du quotidien autour de ces sujets :\u003cbr\u003e\u003cul\u003e\u003cli\u003eComment gérez-vous la conformité de vos pipelines ?\u003c/li\u003e\u003cli\u003eQuels outils pour sécuriser votre supply chain ?\u003c/li\u003e\u003cli\u003eTemplate or not Template ?\u003c/li\u003e\u003cli\u003eEt d\u0026#39;autres pistes, n\u0026#39;hésitez pas !\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eUne heure pour partager vos retours d\u0026#39;expérience sur cet angle mort du delivery, et repartir avec des pistes d\u0026#39;action.","summary":"Ce BOF animé par l’équipe R2Devops invite Devs, Ops, SREs et RSSIs à échanger sur la sécurité et la conformité des pipelines CI/CD : risques OWASP Top 10, supply chain, standardisation et bonnes pratiques. Une heure de discussions et retours d’expérience pour renforcer la fiabilité du delivery.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":40,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":954,"slug":"bof-60","name":"BOF","duration":55,"pause":false,"freeTickets":0,"minSpeakers":1,"description":"Informal sessions of one hour, where like minded people get together and discuss technology.","cssColor":"#ffb8fd","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2582,"firstName":"Basile","lastName":"Moreau","fullName":"Basile Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":2589,"firstName":"Nadia","lastName":"Lefevre","fullName":"Nadia Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":38013,"firstName":"Lina","lastName":"Dubois","fullName":"Lina Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":51536,"firstName":"Hugo","lastName":"Marchand","fullName":"Hugo Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"sécurité"},{"name":"pipelines"},{"name":"standardisation"},{"name":"conformité"}],"timeSlots":[]},{"id":162101,"title":"À la rencontre d\u0027un projet OSS : OpenFeature \u0026 GO Feature Flag","description":"Rejoignez-nous pour cette rencontre avec Thomas Poignant autour du monde des feature flags. Thomas fait partie du Governance Committee d\u0026#39;OpenFeature, un projet en cours d\u0026#39;incubation au CNCF — mais il maintient aussi sa propre solution de feature flag open source : GO Feature Flag.\u003cbr\u003e\u003cbr\u003eQue vous soyez utilisateur, contributeur ou simplement curieux, Thomas partagera son retour d\u0026#39;expérience sur ce que représente la participation à l\u0026#39;élaboration d\u0026#39;un nouveau standard, en collaboration avec les grands noms de l\u0026#39;industrie.\u003cbr\u003e\u003cbr\u003eVous pourre oard, outil open source dédié, offre une interface web centralisée pour suivre la santé de vos serveurs, configurer vos instances et automatiser les tâches de maintenance.\u003cbr\u003e\u003cbr\u003eLors de ce talk, découvrez comment TemBoard simplifie le quotidien des DBAs et DevOps : surveillance en temps réel, alertes intelligentes, gestion des configurations, et bien plus. À travers une démonstration live, vous repartirez avec les clés pour optimiser la gestion de vos parcs PostgreSQL.\u003cbr\u003e\u003cbr\u003ePublic cible : DBAs, DevOps, développeurs backend.","summary":"Découvrez comment TemBoard, outil open source, facilite la surveillance, la maintenance et la gestion centralisée des instances PostgreSQL grâce à une interface web et des automatisations. Ce talk avec démonstration live s’adresse aux DBAs, DevOps et développeurs backend souhaitant optimiser leurs parcs PostgreSQL.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":35,"track":{"id":1254,"name":"Data \u0026 Analytics","description":"Data storage, streaming, processing and ML engineering. Topics include data architecture, feature stores, training pipelines, MLOps and scalable analytics workflows."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":19273,"firstName":"Nour","lastName":"Renaud","fullName":"Nour Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"postgresql"},{"name":"maintenance"},{"name":"surveillance"},{"name":"temboard"}],"timeSlots":[]},{"id":54242,"title":"IA \u0026 jeux vidéo, des pionniers à aujourd\u0027hui : a (neural) link to the past","description":"Domaines irrémédiablement intriqués, et ayant évolué de concert depuis le milieu de XXème siècle, l’IA et le jeu vidéo s’inscrivent dans une histoire commune particulièrement riche.\u003cbr\u003e\u003cbr\u003eDes facétieux fantômes poursuivant Pac-Man à l’aube de l’industrie vidéoludique, au système de coopération IA-humain de \u003cem style\u003d\"color: rgba(0, 0, 0, 0.87); background-color: rgb(250, 250, 250);\"\u003eThe Last of Us\u003c/em\u003e, nous nous proposons de découvrir ensemble un panorama, nécessairement arbitraire et partiel, mais le plus divers et enthousiasmant possible. Des apparitions des franchises et héros les plus iconiques sont à prévoir (\u003cem style\u003d\"color: rgba(0, 0, 0, 0.87); background-color: rgb(250, 250, 250);\"\u003eDouble Dragon\u003c/em\u003e, \u003cem style\u003d\"color: rgba(0, 0, 0, 0.87); background-color: rgb(250, 250, 250);\"\u003eShenmue\u003c/em\u003e,\u003cem style\u003d\"color: rgba(0, 0, 0, 0.87); background-color: rgb(250, 250, 250);\"\u003e Mega Man\u003c/em\u003e,\u003cem style\u003d\"color: rgba(0, 0, 0, 0.87); background-color: rgb(250, 250, 250);\"\u003e \u003c/em\u003eSolid Snake\u003cem style\u003d\"color: rgba(0, 0, 0, 0.87); background-color: rgb(250, 250, 250);\"\u003e \u003c/em\u003eou même Spider-Man, parmi d’autres…). Les perspectives apportées par l’émergence de l’IA générative seront également discutées.\u003cbr\u003e\u003cbr\u003eL’intelligence artificielle est envisagée ici au sens large, dans l’ensemble de son acception, aussi bien au niveau de la gestion des ressources, des mécaniques de jeu ou encore des fameux PNJ (personnages non-joueurs gérés par la “machine”) au sein d’une présentation ludique propice aux interactions avec le public.\u003cbr\u003e\u003cbr\u003eTeaser vidéo : \u003ca href\u003d\"https://bit.ly/4q4hjQi\" rel\u003d\"noopener noreferrer\" target\u003d\"_blank\"\u003ehttps://bit.ly/4q4hjQi\u003c/a\u003e ","summary":"Cette présentation retrace l’évolution conjointe de l’IA et du jeu vidéo, de Pac‑Man aux jeux les plus modernes. Elle offre un panorama historique et ludique, évoquant certaines des franchises les plus emblématiques du domaine. Les apports récents liés à l\u0027IA générative seront également discutés.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":42,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":2352,"slug":"deep-dive-120","name":"2H Deep Dive","duration":120,"pause":false,"invitationOnly":false,"freeTickets":2,"description":"2 hours sessions where attendees can rapidly immerse themselves in a subject matter with an in-depth examination of a topic or technology.","cssColor":"#bac6e6","countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":22499,"firstName":"Karim","lastName":"Renaud","fullName":"Karim Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"vidéo"},{"name":"pnj"},{"name":"jeu"},{"name":"ia"}],"timeSlots":[]},{"id":51633,"title":"Faire de sa doc d\u0027API un levier de conversion : les bonnes pratiques","description":"Trop souvent reléguée à un rôle purement technique, la documentation API est en réalité souvent l’un des premiers points de contact avec vos utilisateurs. Elle peut devenir un outil marketing aussi puissant que votre produit lui‑même. Un outil capable de convaincre, de convertir et de fidéliser.\u003cbr\u003eCe talk construit s\u0026#39;adresse à un public de développeurs et est basé sur des études scientifiques. Il propose une méthode pragmatique pour produire une documentation API de qualité.\u003cbr\u003eNous explorerons :\u003cbr\u003e\u003cul\u003e\u003cli\u003eune analyse des approches les plus efficaces, comment produire une documentation de qualité,\u003c/li\u003e\u003cli\u003eun cadre structuré pour penser sa documentation comme un levier stratégique.\u003c/li\u003e\u003c/ul\u003ePrésenté sous une forme ludique et originale, ce talk vous permettra de vous approprier les meilleures pratiques tout en identifiant comment les adapter à vos propres consommateurs d’API.\u003cbr\u003eVenez décortiquer avec moi comment transformer une API en API “désirable”, et faire de votre documentation un actif stratégique.","summary":"Cette présentation montre comment la documentation API, souvent perçue comme technique, peut devenir un levier marketing stratégique. Basée sur des études scientifiques, elle propose une méthode pragmatique et ludique pour créer une documentation efficace, attractive et adaptée, capable de convaincre, convertir et fidéliser les utilisateurs d’API.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":121,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":51549,"firstName":"Inès","lastName":"Marchand","fullName":"Inès Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"stratégique"},{"name":"documentation"},{"name":"api"},{"name":"qualité"}],"timeSlots":[]},{"id":152201,"title":"Rencontre avec la communauté du projet OpenSearch","description":"( EN ) OpenSearch is a community-driven, Apache 2.0-licensed open source suite for search, analytics, and observability - designed to ingest, search, visualize, and analyze data at scale.\u003cbr\u003e\u003cbr\u003eWith nearly 300 members in the Paris Meetup group, the OpenSearch Project community continues to grow locally and globally.\u003cbr\u003e\u003cbr\u003eJoin us to learn more about the project, discover how to get involved, and connect with fellow practitioners. Bring your toughest questions - our experts will be ready to discuss topics ranging from lexical and semantic search to AI and observability.\u003cbr\u003e\u003cbr\u003e( FR ) OpenSearch est une suite open source pour la recherche, l’analyse de données et l’observabilité conçue pour faciliter l’indexation, la recherche, la visualisation et l’analyse de données à grande échelle.\u003cbr\u003e\u003cbr\u003eAvec près de 300 membres dans le groupe Meetup parisien, la communauté OpenSearch continue de se développer à l’échelle locale et internationale.\u003cbr\u003e\u003cbr\u003eRejoignez-nous pour en savoir plus sur le projet, découvrir comment y contribuer et échanger. Venez avec vos questions les plus pointues : nos experts seront là pour aborder des sujets allant de la recherche lexicale et sémantique à l\u0026#39;intelligence artificielle et l’observabilité.","summary":"Discover OpenSearch, an open-source suite for large-scale search, analytics, and observability. Join a growing global community to explore project insights, contribution opportunities, and discussions on topics from lexical and semantic search to AI and observability with experts from the Paris OpenSearch group.","audienceLevel":"BEGINNER","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":19,"track":{"id":1254,"name":"Data \u0026 Analytics","description":"Data storage, streaming, processing and ML engineering. Topics include data architecture, feature stores, training pipelines, MLOps and scalable analytics workflows."},"sessionType":{"id":3651,"slug":"meet-with","name":"Meet with ...","duration":90,"pause":false,"invitationOnly":true,"freeTickets":0,"minSpeakers":1,"description":"Meet with ... open-source communities. \nThis type of session doesn\u0027t provide a ticket and requires to have another session accepted.","cssColor":"#b8dbde","scheduleInSmallRoom":true,"countInQuota":false,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":31709,"firstName":"Lucas","lastName":"Dubois","fullName":"Lucas Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":51533,"firstName":"Léa","lastName":"Marchand","fullName":"Léa Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":162251,"firstName":"Zoé","lastName":"Da Silva","fullName":"Zoé Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"United States of America"}],"keywords":[{"name":"définition"},{"name":"indéfini"},{"name":"brouillon"},{"name":"provisoire"}],"timeSlots":[]},{"id":15183,"title":"Jdeps, Jlink et les layers : mettez vos images Docker Java au régime !","description":"Les images Docker Java ont tendance à prendre du poids… beaucoup trop de poids.\u003cbr\u003eEntre micro-services, Spring et un JDK complet embarqué à chaque fois, l\u0026#39;espace de stockage disponible fond rapidement.\u003cbr\u003e\u003cbr\u003eNe perdons pas de temps et préparons le \u003cem\u003esummer body\u003c/em\u003e de nos applications pour l\u0026#39;été suivant dès maintenant !\u003cbr\u003e\u003cbr\u003eDans cette session, nous allons découvrir quelques outils pour alléger efficacement les images Docker Java avec plusieurs principes :\u003cbr\u003e\u003cul\u003e\u003cli\u003eruntime custom avec \u003cstrong\u003ejdeps\u003c/strong\u003e et \u003cstrong\u003ejlink\u003c/strong\u003e,\u003c/li\u003e\u003cli\u003eles \u003cstrong\u003ebonnes pratiques\u003c/strong\u003e Docker avec les layers,\u003c/li\u003e\u003cli\u003eles \u003cstrong\u003elayers Spring\u003c/strong\u003e parfaitement adaptés à une application conteneurisée,\u003c/li\u003e\u003cli\u003enettoyage automatique grâce au \u003cstrong\u003eGarbage Collector \u003c/strong\u003ede Docker,\u003c/li\u003e\u003cli\u003eles mauvaises surprises à anticiper, liées à l’\u003cstrong\u003eAPI Reflection.\u003c/strong\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eLa présentation s\u0026#39;adresse à des intermédiaires Java / Docker. Les différentes techniques présentées sont rendues le plus accessible possible.","summary":"Cette session montre comment réduire la taille des images Docker Java : création de runtimes allégés avec jdeps/jlink, optimisation des layers Docker et Spring, nettoyage automatique et gestion des pièges liés à Reflection. Un talk pratique pour développeurs intermédiaires souhaitant des conteneurs Java plus légers et efficaces.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":41,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":15666,"firstName":"Léa","lastName":"Renaud","fullName":"Léa Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"wip"},{"name":"projet"},{"name":"brouillon"},{"name":"travail"}],"timeSlots":[]},{"id":77099,"title":"Sécuriser ses serveurs MCP avant la mise en production","description":"MCP permet la connexion des LLM aux bases de données, aux API, etc. Mais dès qu’un LLM peut agir sur une infrastructure, il devient un composant d’un système distribué et la plupart des démonstrations MCP s’arrêtent là où la sécurité devrait commencer.\u003cbr\u003e\u003cbr\u003eDans cette présentation, j’expliquerai pourquoi MCP augmente significativement la surface d’attaque des applications basées sur des LLM et pourquoi les protections au niveau du prompt ne sont pas suffisantes. Nous passerons en revue des failles de sécurité courantes, telles que des outils disposant de privilèges excessifs et la confiance entre serveurs MCP.\u003cbr\u003e\u003cbr\u003eEnfin, la présentation se concentrera sur des solutions pour concevoir une architecture MCP sécurisée, afin de vous aider à passer de démonstrations à la production.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":125,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":77862,"firstName":"Yanis","lastName":"Perrin","fullName":"Yanis Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"llm"},{"name":"security"},{"name":"mcp"},{"name":"infrastructure"}],"timeSlots":[]},{"id":2719,"title":"Jujutsu : la cerise sur le Git !","description":"Le futur de git, c’est git, et je suis tombé dans \u003ca href\u003d\"https://github.com/jj-vcs/jj\" rel\u003d\"noopener noreferrer\" target\u003d\"_blank\"\u003ejujutsu (jj)\u003c/a\u003e pour… ne plus utiliser git ?\u003cbr\u003e\u003cbr\u003eJe vais vous raconter d\u0026#39;où vient jj, et enchaîner des session est une pause ludique dans un monde obsédé par la performance. \u003cbr\u003e \u003cbr\u003eNous explorerons des démos d’IA volontairement inutiles (quoique), décalées et créatives. Nous verrons ainsi comment un violon 🎻 (enfin même un alto) pourra égayer vos meetings en générant de la 3D interactive assistée par l’IA. Il y aura également une présence assez forte de dinosaures 🦕 car on a dépensé sans compter pour cette session !\u003cbr\u003e \u003cbr\u003eUn terrain de jeu pour expérimenter, rire et redécouvrir le plaisir pur de développer, sans autre objectif que le fun. Le tout agrémenté de petites pastilles musicales jouée à l’alto qui devrait faire écho à votre cœur de développeur.\u003cbr\u003e \u003cbr\u003eMais sachez que vous serez également mis à contribution ! Votre participation active sera requise pour certaines démos. \u003cbr\u003e \u003cbr\u003eMais je n’en dis pas plus, venez pour découvrir la surprise !","summary":"Une session ludique et participative mêlant IA, créativité et humour : démos inutiles mais surprenantes, 3D interactive, dinosaures et musique d’alto. Un moment pour expérimenter, rire et retrouver le plaisir du code, loin de la performance, avec la complicité active du public.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":130,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":51549,"firstName":"Inès","lastName":"Marchand","fullName":"Inès Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":65173,"firstName":"Alex","lastName":"Perrin","fullName":"Alex Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":155803,"firstName":"Chloé","lastName":"Da Silva","fullName":"Chloé Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"musique"},{"name":"interaction"},{"name":"créativité"},{"name":"ia"}],"timeSlots":[]},{"id":4028,"title":"Spring Native et Boot 4.0 : où en est-on vraiment ?","description":"Avec Spring Boot 4, la compilation native fait un bond en avant : démarrages ultra-rapides, consommation mémoire réduite et une intégration renforcée avec GraalVM Native Image. Mais migrer une application Spring « classique » vers le monde natif n’est pas un simple clic. Cela implique de repenser certaines pratiques, d’optimiser son code et de comprendre les limites (et nouvelles possibilités) offertes par ce modèle d’exécution.\u003cbr\u003eDans cette session, nous explorerons :\u003cbr\u003e\u003cul\u003e\u003cli\u003eCe que Spring Boot 4 apporte concrètement au support natif.\u003c/li\u003e\u003cli\u003eLes évolutions de Spring AOT (Ahead-Of-Time) et comment il transforme votre application.\u003c/li\u003e\u003cli\u003eLes pièges classiques lors de la migration vers du code natif : réflexion, proxies, drivers ou librairies tierces…\u003c/li\u003e\u003cli\u003eLes bonnes pratiques pour structurer et configurer une application prête pour le natif.\u003c/li\u003e\u003cli\u003eUn retour d’expérience issu d’un cas réel : performance, taille des images, temps de build et  CI/CD\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eDéveloppeurs backend, architectes logiciels ou tech leads, vous repartirez avec une compréhension claire des enjeux de Spring Native en production, des outils nécessaires et d’un guide concret pour franchir sereinement le cap vers Spring Boot 4 en mode natif.","summary":"Présentation des avancées de Spring Boot 4 pour la compilation native avec GraalVM : démarrages rapides, mémoire optimisée, nouvelles pratiques et défis à la migration (réflexion, proxies, librairies). Conseils, bonnes pratiques, et retour d’expérience pour réussir la transition vers des applications Spring natives, performantes et prêtes pour la production.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":137,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2256,"firstName":"Nour","lastName":"Moreau","fullName":"Nour Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"migration"},{"name":"graalvm"},{"name":"performance"},{"name":"natif"}],"timeSlots":[]},{"id":149102,"title":"Le dev face à l\u0027IA : du prototypage éclair à la disparition des intermédiaires ?","description":"Les outils d’IA ont profondément changé la manière dont on développe des logiciels. Ce qui demandait des semaines peut aujourd’hui prendre \u003cstrong\u003equelques heures\u003c/strong\u003e. Une idée devient un prototype fonctionnel avant même d’être totalement formalisée.\u003cbr\u003eCette accélération, avec moins d’étapes et moins d’intermédiaires, pose de vraies questions :\u003cbr\u003e\u003cul\u003e\u003cli\u003eEst-ce que cela signifie que les \u003cstrong\u003eProduct Managers\u003c/strong\u003e vont finir par coder seuls ?\u003c/li\u003e\u003cli\u003eSi tout le monde peut lancer un \u003cstrong\u003emicro-SaaS\u003c/strong\u003e, est-ce qu’on doit tous le faire ?\u003c/li\u003e\u003c/ul\u003eDans cette conférence, \u003cstrong\u003eNicolas\u003c/strong\u003e partage des retours très concrets issus de nombreux projets construits avec l’IA comme coéquipier : des prototypes abandonnés, des démos internes, des produits lancés trop tôt ou juste à temps. Ce qui était au départ un hobby devient progressivement une nouvelle manière d’organiser le travail des équipes au quotidien.\u003cbr\u003e\u003cstrong\u003eAu programme :\u003c/strong\u003e\u003cbr\u003e\u003cul\u003e\u003cli\u003eLe rôle de l’\u003cstrong\u003eingénieur\u003c/strong\u003e aujourd’hui.\u003c/li\u003e\u003cli\u003eL’évolution des \u003cstrong\u003eworkflows\u003c/strong\u003e et la place du prototypage.\u003c/li\u003e\u003cli\u003eLes impacts concrets pour les \u003cstrong\u003eéquipes produit\u003c/strong\u003e.\u003c/li\u003e\u003c/ul\u003eUn talk ancré dans la pratique, l’expérience de terrain et le feedback réel, pensé pour des développeurs qui veulent comprendre ce qui est en train de changer, \u003cstrong\u003esans discours marketing\u003c/strong\u003e.","summary":"La conférence explore comment l’IA bouleverse le développement logiciel : création accélérée, prototypage instantané et nouvelles dynamiques d’équipe. À partir d’expériences concrètes, elle interroge l’évolution des rôles, des workflows et du métier d’ingénieur, offrant un retour pragmatique sur une transformation déjà à l’œuvre dans les équipes produit.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":408,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":955,"slug":"keynote-25","name":"Keynote","duration":25,"pause":false,"invitationOnly":true,"freeTickets":2,"minSpeakers":1,"description":"Invitation only: Inspiring and thought provoking keynotes of 20 minutes.","cssColor":"#c8b0d4","scheduleInSmallRoom":false,"countInQuota":false,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":31715,"firstName":"Louise","lastName":"Dubois","fullName":"Louise Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Spain"}],"keywords":[{"name":"équipe"},{"name":"développement"},{"name":"prototypage"},{"name":"ia"}],"timeSlots":[]},{"id":4019,"title":"Et si le SQL redevenait cool à écrire ?","description":"On nous l’a répété maintes fois : “écrire du SQL dans du code source, c’est dépassé”.\u003cbr\u003e\u003cbr\u003eLes ORMs sont partout. Ils ont facilité notre quotidien en nous permettant de manipuler nos bases de données sans nous soucier du SQL. Mais parfois, on aimerait un peu plus de contrôle, un peu plus de performance… sans pour autant revenir aux longues heures de mapping manuel et de requêtes préparées à la main.\u003cbr\u003e\u003cbr\u003eSQLC offre une autre approche. Initialement conçu pour du Go, langage dans lequel cette technologie sera présentée dans ce talk, il permet d’écrire des requêtes SQL tout en générant du code type-safe et performant, sans ajouter de lourdeur ni de dépendances. Pas question ici de rejeter les ORMs, mais plutôt d’explorer un nouvel outil qui vient enrichir notre palette de solutions.\u003cbr\u003e\u003cbr\u003eDans ce talk, nous verrons comment SQLC fonctionne, dans quels cas il brille, et comment il s’intègre parfaitement dans un stack moderne. Vous aimez le SQL ? Vous voulez juste un peu plus de maîtrise sur vos requêtes ? Venez, vous risquez d’être agréablement surpris.","summary":"Ce talk présente SQLC, un outil permettant d’écrire des requêtes SQL tout en générant du code Go type-safe et performant, sans complexité ni dépendances excessives. Il propose une alternative complémentaire aux ORMs, offrant contrôle et efficacité dans la gestion des bases de données au sein de stacks modernes.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":62,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":3630,"firstName":"Zoé","lastName":"Lefevre","fullName":"Zoé Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"go"},{"name":"sql"},{"name":"orm"},{"name":"sqlc"}],"timeSlots":[]},{"id":37753,"title":"Retrouver l\u0027étincelle : le reboot d\u0027une carrière","description":"Il y a quelques années, j\u0026#39;ai atteint un tournant étrange dans ma carrière. Sur le papier, tout semblait parfait : de bons projets, des compétences solides, un emploi stable ; mais à l\u0026#39;intérieur, quelque chose s\u0026#39;était éteint. Je ne cherchais pas un nouveau langage ou un nouveau framework, mais une raison de continuer à me passionner pour mon métier.\u003cbr\u003e\u003cbr\u003eUn jour, j\u0026#39;ai décidé de rejoindre mon JUG local. De prime abord, je m\u0026#39;attendais à approfondir mes connaissances techniques. Cependant, j\u0026#39;ai en fait découvert quelque chose de beaucoup plus profond. J\u0026#39;ai rencontré des personnes pleines d\u0026#39;énergie et de générosité qui m\u0026#39;ont rappelé que derrière chaque ligne de code se cache une histoire, un échange, une étincelle. Ce que je croyais avoir perdu a été progressivement ravivé par ce sentiment d\u0026#39;appartenance.\u003cbr\u003e\u003cbr\u003eCette redécouverte est le sujet de cette session. Je souhaite vous montrer que la réponse à l\u0026#39;apathie professionnelle ne réside pas dans un nouveau langage, mais dans une nouvelle relation avec votre craft, votre communauté et vous-même.","summary":"Après une période de désengagement professionnel malgré une carrière réussie, le conférencier retrouve sa passion en rejoignant son JUG local. Cette expérience humaine et communautaire ravive son enthousiasme et lui révèle que la clé contre l’apathie n’est pas technique, mais relationnelle : renouer avec son métier, sa communauté et soi-même.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":41,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2579,"firstName":"Idris","lastName":"Moreau","fullName":"Idris Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Belgium"}],"keywords":[{"name":"communauté"},{"name":"carrière"},{"name":"appartenance"},{"name":"passion"}],"timeSlots":[]},{"id":4020,"title":"La dette technique vous fait peur ? Découvrez la dette de conception !","description":"Dans nos métiers, la dette technique est sans doute la chose la plus frustrante, éprouvante et coriace contre laquelle nous devons lutter. Bien sûr, il existe des bonnes pratiques : refactoriser, viser la simplicité avec KISS, éviter de trop anticiper avec YAGNI afin de limiter cette dette au maximum. Et pourtant, on n’y vient jamais vraiment à bout. Pire encore, elle continue de s’accumuler même lorsque nous les appliquons, comme une fatalité.\u003cbr\u003e\u003cbr\u003eEt si ces mêmes bonnes pratiques ne faisaient parfois qu’empirer le problème au li
