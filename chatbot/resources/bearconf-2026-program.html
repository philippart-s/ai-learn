pha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":62,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":12006,"firstName":"Ethan","lastName":"Garnier","fullName":"Ethan Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"reproductibilité"},{"name":"tests"},{"name":"workflow"},{"name":"ia"}],"timeSlots":[]},{"id":37751,"title":"Node.js : boostez vos tests d\u0027intégration avec Vitest, Testcontainers et PGlite","description":"Les tests d\u0026#39;intégration sont souvent lourds à mettre en oeuvre et lents à l\u0026#39;exécution. Personne n\u0026#39;aime attendre 10 minutes que la CI passe, mais est-ce vraiment une bonne raison pour se passer de ces tests ? \u003cbr\u003eLes incidents de production proviennent souvent de soucis d\u0026#39;intégration. Un service externe qui ne répond pas correctement, le réseau qui flanche et rapidement tout part en vrille.\u003cbr\u003eLors de cette session, je vous propose de vous présenter 3 pépites de l\u0026#39;écosystème \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eNodeJS\u003c/strong\u003e permettant de développer sans douleurs des tests d\u0026#39;intégrations fiables et rapides :\u003cbr\u003e\u003cul\u003e\u003cli\u003e\u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eTestcontainers\u003c/strong\u003e un outil initialement écrit en Java et disponible désormais en \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eTypeScript\u003c/strong\u003e permettant de manipuler des environnements \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003edocker\u003c/strong\u003e en quelques lignes de code.\u003c/li\u003e\u003cli\u003e\u003cstrong style\u003d\"color: rgb(0, 0, 0); background-color: transparent;\"\u003ePGLite\u003c/strong\u003e, une version ultra rapide et légère de Postgres, compilée en \u003cstrong style\u003d\"color: rgb(0, 0, 0); background-color: transparent;\"\u003eWebAssembly\u003c/strong\u003e\u003c/li\u003e\u003cli\u003eet enfin \u003cstrong style\u003d\"color: rgb(0, 0, 0); background-color: transparent;\"\u003eVitest\u003c/strong\u003e et en particulier les paramètres avancés liés à l\u0026#39;isolation des tests ainsi que les toutes dernières fonctionnalités permettant de faciliter la gestion du code d\u0026#39;infrastructure (fixtures).\u003c/li\u003e\u003c/ul\u003eVous repartirez avec des techniques actionnables pour réduire drastiquement les temps de votre CI et augmenter la fiabilité de vos tests.","summary":"Cette session présente trois outils NodeJS — Testcontainers, PGLite et Vitest — pour simplifier et accélérer les tests d’intégration. Les participants découvriront comment réduire le temps d’exécution en CI tout en améliorant la fiabilité des tests, grâce à des environnements docker légers, une base Postgres rapide et une meilleure isolation.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":61,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":3632,"firstName":"Alice","lastName":"Lefevre","fullName":"Alice Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"nodejs"},{"name":"intégration"},{"name":"tests"},{"name":"fiabilité"}],"timeSlots":[]},{"id":85053,"title":"Semantic layer : faire parler vos données avec l\u0027IA, sans hallucinations","description":"Utiliser un LLM sur une base de données, c\u0026#39;est tentant. Lui demander « quel est le chiffre d\u0026#39;affaires du trimestre ? » et obtenir une réponse en langage naturel, c\u0026#39;est le rêve. Sauf que dans la réalité, le modèle ne comprend rien à vos colonnes cryptiques, invente des jointures fantaisistes, et vous sort des chiffres faux. \u003cbr\u003e\u003cbr\u003eLe problème n\u0026#39;est pas le LLM. Sans contexte métier, sans définition des métriques, sans règles de calcul, il navigue à l\u0026#39;aveugle, et il hallucine. La solution : intercaler une couche sémantique entre vos données et l\u0026#39;IA. Ce modèle décrit vos métriques, relations et logiques métier dans un langage que le LLM peut exploiter. Fini les approximations : le modèle sait ce qu\u0026#39;est un « client actif », comment calculer une marge, quelles tables joindre. Dans cette session, on construit cette architecture pas à pas. \u003cbr\u003e\u003cbr\u003eOn explore les outils – dbt Semantic Layer, Cube.dev, ou des approches custom – et on branche le tout sur un LLM. Démos live : d\u0026#39;une question métier floue à une requête SQL validée et un résultat fiable. Rendre vos données compréhensibles par l\u0026#39;IA, c\u0026#39;est d\u0026#39;abord les rendre compréhensibles tout court.","summary":"Cette session montre comment fiabiliser l’usage des LLMs sur les bases de données en introduisant une couche sémantique décrivant métriques et logiques métier. À travers outils et démos, elle illustre la transformation d’une question naturelle en requête SQL fiable grâce à une compréhension structurée des données.","audienceLevel":"ADVANCED","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":58,"track":{"id":1254,"name":"Data \u0026 Analytics","description":"Data storage, streaming, processing and ML engineering. Topics include data architecture, feature stores, training pipelines, MLOps and scalable analytics workflows."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":77887,"firstName":"Adam","lastName":"Perrin","fullName":"Adam Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"llm"},{"name":"données"},{"name":"sémantique"},{"name":"métriques"}],"timeSlots":[]},{"id":15177,"title":"Rendre notre expertise pertinente et résiliente au-delà de 2030","description":"Parce que l’IA générative a saturé notre monde d’informations, et que l’IA agentique qui arrive redistribue le “qui fait quoi”. Dans ce nouvel ordre, la rareté n’est plus la donnée, c’est la qualité de la question, la capacité à délimiter le problème, la rigueur d’évaluation et la mise en sens. C’est précisément là que l’expert humain excelle — à condition d’avoir la bonne posture, les bons outils et les bons rituels. Embarquez avec moi aux frontières de la connaissance, de l’intelligence, des sciences cognitives et de l’IA. Je partage un cadre de méta‑compétences concret pour vous donner des pistes pour rester pertinent au-delà de 2030, pérenniser son apprentissage et s’adapter à l’accélération du changement. Objectif: vous aider à faire évoluer votre posture d’expert, à activer l’intelligence collaborative (humain + IA) et à renforcer votre résilience dans un monde VUCA, où l’apprentissage adaptatif est l’atout ultime. Je vous propose une boussole opérationnelle en 3 volets:\u003cbr\u003e\u003col\u003e\u003cli\u003eRepenser ce qu’est être expert\u003c/li\u003e\u003cli\u003eCollaborer avec l’IA comme avec un équipier\u003c/li\u003e\u003cli\u003eRé-apprendre à apprendre, version terrain\u003c/li\u003e\u003c/ol\u003e","summary":"Cette conférence explore comment l’expert humain peut rester pertinent à l’ère de l’IA générative et agentique. Elle propose un cadre de **méta‑compétences** pour renforcer posture, collaboration humain‑IA et apprentissage adaptatif, afin de cultiver **résilience et pertinence** dans un monde en changement rapide et complexe (VUCA).","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":121,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":15663,"firstName":"Camille","lastName":"Renaud","fullName":"Camille Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"expert"},{"name":"apprentissage"},{"name":"collaboration"},{"name":"ia"}],"timeSlots":[]},{"id":85071,"title":"GitHub Actions : une bombe à retardement pour la sécurité de la supply chain","description":"GitHub Actions est devenu incontournable pour le CI/CD, mais reste insecure by default. En 2025, plusieurs supply chain attacks (tj-actions, s1ngularity, GhostAction, Shai-Hulud) ont exfiltré des secrets, prouvant que les attaquants ciblent massivement la CI. Les bonnes pratiques classiques (pin d’actions, limiter les secrets) sont loin d’être suffisantes. Ce talk montre comment ces attaques fonctionnent, pourquoi le modèle de sécurité actuel de GitHub est inadapté et surtout quelles défenses concrètes adopter : scoped secrets avec règles d’approbation, permissions minimales sur le GITHUB_TOKEN, egress controls, durcissement des runners et outils de protection runtime.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":95,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":89101,"firstName":"Noé","lastName":"Perrin","fullName":"Noé Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"sécurité"},{"name":"défenses"},{"name":"attaques"},{"name":"ci/cd"}],"timeSlots":[]},{"id":165202,"title":"À la rencontre de Quarkus","description":"Come meet Zineb and Max from the Quarkus team for an open discussion on cloud-native Java done right. Bring your projects, your questions, or your frustrations — we want to hear them. Whether you\u0026#39;re new to Quarkus or pushing it to its limits, there\u0026#39;s a conversation here for you. Hope to see you there!","summary":"Open discussion with Quarkus team members Zineb and Max on cloud-native Java. Bring projects, questions, or frustrations—whether you’re new to Quarkus or using it at scale, all are welcome.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":23,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":3651,"slug":"meet-with","name":"Meet with ...","duration":90,"pause":false,"invitationOnly":true,"freeTickets":0,"minSpeakers":1,"description":"Meet with ... open-source communities. \nThis type of session doesn\u0027t provide a ticket and requires to have another session accepted.","cssColor":"#b8dbde","scheduleInSmallRoom":true,"countInQuota":false,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":1208,"firstName":"Hugo","lastName":"Moreau","fullName":"Hugo Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":65190,"firstName":"Hugo","lastName":"Perrin","fullName":"Hugo Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Denmark"}],"keywords":[{"name":"java"},{"name":"quarkus"},{"name":"cloud-native"},{"name":"discussion"}],"timeSlots":[]},{"id":5555,"title":"Des serveurs MCP sécurisés avec Spring AI","description":"MCP (Model Context Protocol) est le protocol standard pour connecter vos applis basées sur des LLM à des serveurs tiers, et leur ajouter des fonctionnalités: prendre rendez-vous, uploader vos notes de frais, etc. Quand ces serveurs sont accessibles via Internet, impensable de les laisser en libre accès: il faut y ajouter une couche de sécurité et de contrôle d\u0026#39;accès. Pour ce faire, MCP se base sur OAuth2, et demande des intégration côté client et serveur.\u003cbr\u003e\u003cbr\u003eLa plupart des frameworks, dans tous les languages, ont déjà une librairie OAuth2, et on voit arriver de plus en plus d\u0026#39;intégration avec MCP. Mais même avec des outils, il y a de nombreux choix architecturaux à faire! Quel type de \u0026quot;grant\u0026quot; OAuth2 utiliser? Comment limiter l\u0026#39;accès à certaines features, par exemple juste pour les admins?\u003cbr\u003e\u003cbr\u003eDans cette présentation, on contruira ensemble un serveur MCP avec Spring AI et le SDK MCP. On verra comment y ajouter une couche OAuth2 en pratique, et on discutera des implications sur vos applis, et sur votre serveur d\u0026#39;authorization OAuth2.","summary":"Cette présentation explique comment sécuriser des applications LLM connectées via MCP grâce à OAuth2. À travers un exemple pratique avec Spring AI et le SDK MCP, elle détaille l’ajout d’une couche d’accès sécurisé, les choix architecturaux à faire et l’impact sur les serveurs et applications.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":131,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":5502,"firstName":"Nathan","lastName":"Lefevre","fullName":"Nathan Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"voluptate"},{"name":"consequat"},{"name":"laboris"},{"name":"dolor"}],"timeSlots":[]},{"id":4038,"title":"Le frontend aussi mérite son monitoring !","description":"On se focalise souvent sur la performance du backend : monitoring de chaque requête, service et infrastructure. Cependant, le frontend reste souvent dans le noir le plus complet. On écrit, au mieux, des tests (parfois end-to-end 😎), on déploie et on espère que tout fonctionne parfaitement. Mais l’espoir n’est pas une stratégie…\u003cbr\u003e\u003cbr\u003eDurant cette présentation, nous allons voir comment monitorer le frontend peut nous donner des insights précis sur les usages, latency et tracing end to end, vous permettant de prendre des décisions data-driven et d’éviter les erreurs en production. Du loading time aux interactions clients, apprenons ensemble comment apporter de l’observabilité au frontend !","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":142,"track":{"id":1256,"name":"Cloud \u0026 Plateformes","description":"Backend and platform engineering across technologies: frameworks (Java, Go, Node, Rust…), Kubernetes, serverless, observability, SRE practices and infrastructure-as-code for production systems."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":3646,"firstName":"Gabriel","lastName":"Lefevre","fullName":"Gabriel Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"tests"},{"name":"monitoring"},{"name":"frontend"},{"name":"observabilité"}],"timeSlots":[]},{"id":91515,"title":"CEL ? Encore un langage d\u0027expression ?!","description":"Le Common Expression Language (CEL) de Google est un langage d\u0026#39;expression rapide, portable et sûr, idéal pour les applications critiques en termes de performances. Il est conçu pour être intégré à une application. CEL est particulièrement adapté à l\u0026#39;extension des configurations déclaratives déjà utilisées par vos applications. Il permet d’y ajouter des extensions spécifiques. CEL peut-être utilisé pour des éléments tels que les filtres de listes pour les appels d\u0026#39;API, les contraintes de validation des protocol buffers et les règles d\u0026#39;autorisation des requêtes d\u0026#39;API.\u003cbr\u003eDans cette présentation nous explorerons le langage lui-même et ces propriétés qui le rende relativement unique. Nous verrons ensuite comment l’étendre aux besoins spécifiques à un domaine et comment l’intégrer dans une application, que celle-ci soit écrite en Java, Go, Rust ou C++.\u003cbr\u003e","summary":"Présentation du Common Expression Language (CEL) de Google, un langage d’expression rapide, sûr et portable, conçu pour étendre les configurations déclaratives et intégrer des règles ou validations dans les applications. La session détaille ses principes, son extensibilité et son intégration pratique en Java, Go, Rust ou C++.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":46,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":89109,"firstName":"Alice","lastName":"Perrin","fullName":"Alice Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Canada"}],"keywords":[{"name":"intégration"},{"name":"validation"},{"name":"expression"},{"name":"langage"}],"timeSlots":[]},{"id":12063,"title":"Kafka et Raft en production : une nouvelle ère pour les commit logs distribués","description":"Apache Kafka a franchi une étape historique : l’arrivée du \u003cstrong\u003e\u003cem\u003eKRaft\u003c/em\u003e\u003c/strong\u003e (\u003cstrong\u003eKafka + Raft\u003c/strong\u003e), le nouveau mode de consensus qui remplace définitivement ZooKeeper. Mais que signifie réellement cette transition pour les équipes qui exploitent Kafka en production ? Quels bénéfices, quels pièges, quelles migrations possibles… et quels retours concrets peut-on partager après plusieurs mois en environnement réel ?\u003cbr\u003e\u003cbr\u003eDans cette session, je propose de revenir sur \u003cstrong\u003el’adoption de Kafka avec Raft en production\u003c/strong\u003e, à travers un retour d’expérience structuré, honnête et sans filtre.\u003cbr\u003e\u003cbr\u003eCette présentation s’adresse aux développeurs, SRE, architectes, et toutes les équipes qui gèrent ou consomment Kafka au quotidien.\u003cbr\u003e\u003cbr\u003eL’objectif : donner une vision claire, réaliste et pragmatique de Kafka en mode Raft, afin que chacun puisse décider \u003cstrong\u003equand\u003c/strong\u003e, \u003cstrong\u003ecomment\u003c/strong\u003e et \u003cstrong\u003epourquoi\u003c/strong\u003e franchir le pas.","summary":"Cette session présente un retour d’expérience sur l’adoption d’Apache Kafka avec KRaft, le nouveau mode sans ZooKeeper. Elle analyse avantages, limites, migrations et enseignements tirés de la production pour aider développeurs, SRE et architectes à évaluer concrètement quand et comment passer à Kafka en mode Raft.","audienceLevel":"ADVANCED","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":52,"track":{"id":1251,"name":"Architecture \u0026 Design","description":"Designs, trade-offs and real-world decisions for building maintainable systems. Case studies, system evolution (monolith→services), DDD, event-driven approaches, resilience and architectural anti-patterns."},"sessionType":{"id":2352,"slug":"deep-dive-120","name":"2H Deep Dive","duration":120,"pause":false,"invitationOnly":false,"freeTickets":2,"description":"2 hours sessions where attendees can rapidly immerse themselves in a subject matter with an in-depth examination of a topic or technology.","cssColor":"#bac6e6","countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":7390,"firstName":"Nour","lastName":"Garnier","fullName":"Nour Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"migration"},{"name":"production"},{"name":"kraft"},{"name":"kafka"}],"timeSlots":[]},{"id":77085,"title":"Le 5e meetup Search, Data \u0026 AI de BearConf","description":"Le Meetup Search, Data \u0026amp; AI s\u0026#39;adresse aux développeurs, architectes, responsables de domaine passionnés par les technologies Moteurs de Recherche (ou Search), (Big) Data et Intelligence Artificielle. Nous parlerons de technologies comme Apache Lucene, Solr, Elasticsearch, OpenSearch et leur écosystèmes (Stack Elastic, Apache Nutch, Apache Tika, Kibana...) mais également des technologies Search embarquées dans les Applications, Services Cloud ou Bases de Données diverses et variées (nosql, relationnelles, graph ou autres). Les Data Engineers, Data Scientists seront également les bienvenus. Et pour finir le traitement automatique du langage naturel (NLP) et les spécificités du traitement texte en langue française (ou des langues en général) feront partie de l\u0026#39;agenda. Il s\u0026#39;agit d\u0026#39;un groupe indépendant des groupes organisés par les éditeurs de chaque solution. Nous allons essayer d\u0026#39;être exhaustifs et de couvrir toutes les technologies et initiatives autour du Search et de la Data en région parisienne et en France.","summary":"Meetup indépendant dédié aux passionnés de Search, Data et IA, abordant Lucene, Solr, Elasticsearch, OpenSearch et leurs écosystèmes. Il explore aussi le NLP, le traitement du texte en français et les technologies Cloud, bases de données et DevOps, visant à couvrir toutes les initiatives Search et Data en France.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":18,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":954,"slug":"bof-60","name":"BOF","duration":55,"pause":false,"freeTickets":0,"minSpeakers":1,"description":"Informal sessions of one hour, where like minded people get together and discuss technology.","cssColor":"#ffb8fd","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":53221,"firstName":"Lucas","lastName":"Marchand","fullName":"Lucas Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"vectorisation"},{"name":"données"},{"name":"ia"},{"name":"recherche"}],"timeSlots":[]},{"id":7882,"title":"Les maths toutes simples qui font tourner l\u0027IA","description":"Don\u0026#39;t let math intimidate you. At its core, it is simple math that powers complex systems. \u003cbr\u003e\u003cbr\u003eAs a Java developer without a formal math background, I became curious about the mathematical foundations behind AI\u0026#39;s computation. What I discovered was that intelligent systems are often rooted in surprisingly simple mathematical concepts.\u003cbr\u003eIn this beginner-friendly talk, we’ll explore all the floating point operations driving AI. You\u0026#39;ll learn that ordening these computations in vectors and matrices enables neural networks to generate text. Along the way, we’ll revisit some basics of machine-level binary number representations.\u003cbr\u003e\u003cbr\u003eRemember how to multiply and add numbers? Basically that\u0026#39;s all there is to it. Just lots of it. Traveling through the landscape of my talk, I\u0026#39;ll show you that the math behind AI is more relatable than we tend to think.","summary":"This beginner-friendly talk demystifies the math behind AI, showing that simple operations like addition and multiplication—organized in vectors and matrices—underpin neural networks. Aimed at developers without a math background, it revisits binary representations and demonstrates that AI\u0027s computations are more approachable than they seem.","audienceLevel":"BEGINNER","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":51,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2101,"firstName":"Théo","lastName":"Moreau","fullName":"Théo Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Netherlands"}],"keywords":[{"name":"vectors"},{"name":"ai"},{"name":"math"},{"name":"binary"}],"timeSlots":[]},{"id":54230,"title":"De zéro à des milliards de traces : le tracing distribué chez un opérateur de paris en ligne","description":"Chez Winamax, comprendre les interactions entre des dizaines de microservices lors d\u0026#39;une soirée de Ligue des Champions est un défi critique. Face à des contraintes strictes de confidentialité des données joueurs, les solutions SaaS (Datadog, Sentry) étaient exclues. Nous avons donc dû bâtir notre propre architecture d\u0026#39;observabilité capable d\u0026#39;absorber des milliards de traces.\u003cbr\u003e\u003cbr\u003eCe retour d\u0026#39;expérience vous dévoile comment nous sommes passés de l\u0026#39;aveuglette à une couverture totale en quelques mois, avec une stack 100% Open Source (OpenTelemetry, Quickwit, Jaeger).\u003cbr\u003eNous détaillerons :\u003cbr\u003e\u003cul\u003e\u003cli\u003eL\u0026#39;Architecture : Comment scaler les collecteurs OpenTelemetry face à un trafic massif et imprévisible.\u003c/li\u003e\u003cli\u003eLe Stockage : Pourquoi nous avons choisi Quickwit pour stocker et requêter des Téraoctets de données efficacement sur du stockage objet.\u003c/li\u003e\u003cli\u003eL\u0026#39;Implémentation : Les stratégies pour faciliter l\u0026#39;auto-instrumentation (Node.js) et l\u0026#39;adoption par les équipes.\u003c/li\u003e\u003c/ul\u003e","summary":"Ce talk décrit comment **Winamax** a conçu une **architecture d’observabilité 100 % Open Source** (OpenTelemetry, Quickwit, Jaeger) pour suivre des milliards de traces sans SaaS, afin de préserver la **confidentialité des données joueurs**. Il détaille **scalabilité**, **stockage efficace** et **auto‑instrumentation** des microservices en environnement à très fort trafic.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":218,"track":{"id":1256,"name":"Cloud \u0026 Plateformes","description":"Backend and platform engineering across technologies: frameworks (Java, Go, Node, Rust…), Kubernetes, serverless, observability, SRE practices and infrastructure-as-code for production systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":51538,"firstName":"Sofia","lastName":"Marchand","fullName":"Sofia Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":51539,"firstName":"Malik","lastName":"Marchand","fullName":"Malik Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"données"},{"name":"architecture"},{"name":"opentelemetry"},{"name":"observabilité"}],"timeSlots":[]},{"id":158702,"title":"Meetup Rust","description":"Organisation d\u0026#39;un meetup rust en partenariat avec BearConf.\u003cbr\u003e\u003cbr\u003eLes meetup rust paris se déroulent généralement comme ceci :\u003cbr\u003e\u003cbr\u003e\u003cul\u003e\u003cli\u003eArrivée des participant.e.s\u003c/li\u003e\u003cli\u003ePrésentation (-10 min) du sponsor de l\u0026#39;événement\u003c/li\u003e\u003cli\u003ePrésentation de 20 min d\u0026#39;un.e des participant.e.s\u003c/li\u003e\u003cli\u003ePrésentations de 5 min des participant.e.s (pour un total cumulé des talks de maximum une heure)\u003c/li\u003e\u003cli\u003ePause nourriture\u003c/li\u003e\u003cli\u003eSplit du meetup : d\u0026#39;un côté on organise un tutoriel sur le langage Rust (en général une heure), de l\u0026#39;autre les gens échangent entre eux\u003c/li\u003e\u003c/ul\u003e","summary":"Meetup Rust Paris organisé avec BearConf : accueil, brève présentation du sponsor, exposés techniques courts (jusqu’à une heure au total), pause conviviale, puis deux parcours : tutoriel pratique sur Rust et échanges informels entre participants. Un format collaboratif et formateur pour la communauté Rust.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":14,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":954,"slug":"bof-60","name":"BOF","duration":55,"pause":false,"freeTickets":0,"minSpeakers":1,"description":"Informal sessions of one hour, where like minded people get together and discuss technology.","cssColor":"#ffb8fd","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":162253,"firstName":"Ibrahim","lastName":"Da Silva","fullName":"Ibrahim Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"échanges"},{"name":"tutoriel"},{"name":"rust"},{"name":"meetup"}],"timeSlots":[]},{"id":15153,"title":"Specification Driven Development : coder à l\u0027ère des LLM","description":"Depuis l\u0026#39;avènement des LLMs, la question de l\u0026#39;évolution du rôle de développeur se pose.\u003cbr\u003eUne des réponse pourrait être l\u0026#39;adoption du Specification Driven Development.\u003cbr\u003e\u003cbr\u003eC’est une méthode où le développeur décrit ce qu’il veut faire sous forme de spécifications textuelles et l’IA génère le code correspondant. Cela transforme le rôle du développeur en auteur de specs intelligentes plutôt qu’en simple implémenteur.\u003cbr\u003e\u003cbr\u003eNous vous proposons donc ce Lab afin de mettre en pratique cette méthodologie au travers de l\u0026#39;extension de Github Copilot Spec-Kit :\u003cbr\u003e\u003cul\u003e\u003cli\u003eDévelopper une application Front from scratch en se basant sur des spécifications OpenApi\u003c/li\u003e\u003cli\u003eReprendre une application Backend existante et au travers de spécifications claire lui ajouter un nouvel endpoint\u003c/li\u003e\u003cli\u003eRépercuter cette évolution sur notre application Front.\u003c/li\u003e\u003cli\u003eSi le temps le permet ajouter d\u0026#39;autres fonctionnalités au grès de vos envies\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eLes prérequis :\u003cbr\u003e\u003cul\u003e\u003cli\u003eUn IDE avec Github Copilot\u003c/li\u003e\u003cli\u003eUn OS supportant Docker (Linux recommandé)\u003c/li\u003e\u003cli\u003eDocker\u003c/li\u003e\u003cli\u003eJava 21, Maven\u003c/li\u003e\u003cli\u003eReact, NPM\u003c/li\u003e\u003cli\u003eDes connaissances en développement (préférable)\u003c/li\u003e\u003c/ul\u003e","summary":"Ce lab explore le *Specification Driven Development*, où le développeur rédige des spécifications textuelles que l’IA transforme en code. À travers l’extension GitHub Copilot Spec‑Kit, les participants créeront et feront évoluer une application front‑end et back‑end selon des specs OpenAPI, illustrant l’évolution du rôle du développeur.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":130,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":968,"slug":"lab-180","name":"3H Hands-on Lab","duration":180,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"3 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2590,"firstName":"Hugo","lastName":"Lefevre","fullName":"Hugo Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":15666,"firstName":"Léa","lastName":"Renaud","fullName":"Léa Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"llm"},{"name":"développeur"},{"name":"spécification"},{"name":"copilot"}],"timeSlots":[]},{"id":77095,"title":"Tu te mets combien en CSS responsive ? Édition 2026","description":"Le responsive en CSS, c’est la base non ? Depuis l’arrivée des smartphones, nos interfaces doivent s’adapter à toutes les tailles d’écrans possibles, du moniteur 4K au plus petit téléphone portable.\u003cbr\u003e\u003cbr\u003eVous faites ça comment, vous ? Au début on n’avait que les breakpoints et une armée de media queries. Puis de nouveaux outils sont arrivés : flexbox, grid, unités relatives… Aujourd’hui avec les container queries et toujours plus d’unités (dvmin, cqh…), nous disposons d’une jungle d’outils et de techniques et rares sont celleux qui peuvent prétendre tous les maîtriser. Alors, vous vous mettez combien en responsive CSS ?\u003cbr\u003eQue ce soit 1 ou 10, venez (re)découvrir avec nous les mille et une manières de faire du responsive en 2026 : on vous a préparé quelques maquettes, de la plus simple à la plus complexe, que nous allons implémenter en live-coding pour illustrer toutes ces techniques.\u003cbr\u003e\u003cbr\u003eOn verra ensemble que pour une fois, c’était pas mieux avant !\u003cbr\u003e","summary":"Cette session revisite le **responsive design en CSS** : de l’époque des media queries aux outils modernes comme **flexbox, grid, container queries** et nouvelles unités. À travers du **live‑coding**, elle montre comment combiner ces techniques pour créer des interfaces adaptatives efficaces et contemporaines.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":47,"track":{"id":2760,"name":"Front-end \u0026 UX","description":"Web and mobile engineering: frameworks (Angular, React, Vue), performance, accessibility, design systems, PWAs and client-side integration patterns — including lightweight AI at the edge."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":10020,"firstName":"Zoé","lastName":"Garnier","fullName":"Zoé Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":77884,"firstName":"Lucas","lastName":"Perrin","fullName":"Lucas Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"responsive"},{"name":"css"},{"name":"interface"},{"name":"techniques"}],"timeSlots":[]},{"id":32124,"title":"Standards et agents IA : tour d\u0027horizon de MCP, A2A, ADK et bien plus","description":"Les fondations des agents IA reposent sur une \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003epoignée de protocoles\u003c/strong\u003e communs que vous devez maîtriser pour tirer le meilleur parti de votre LLM et de votre framework agentique. C’est pourquoi il est important de les comprendre. Certains gagnent du terrain, d’autres non.\u003cbr\u003e\u003cbr\u003eDans ce deep dive, nous explorerons l’écosystème en vous présentant ces standards et en nous concentrant sur les plus importants. Connaître certains frameworks est également utile pour démarrer plus rapidement. Bienvenue aux protocoles \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eMCP, A2A, ACP\u003c/strong\u003e, et aux frameworks \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eADK\u003c/strong\u003e, Arc, \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eQuarkus\u003c/strong\u003e, \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eLangChain4j\u003c/strong\u003e !\u003cbr\u003e\u003cbr\u003eAprès un aperçu des principaux standards et protocoles, nous commencerons par construire un agent, d\u0026#39;abord sans protocole, puis en ajoutant des interactions MCP. Nous construirons après un système multi-agents et multi-technos (ADK, Quarkus et LangChain4j) via A2A.\u003cbr\u003e\u003cbr\u003eVous apprendrez ce que \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003efont ces protocoles\u003c/strong\u003e et \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003ecomment ils fonctionnent\u003c/strong\u003e, mais aussi \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003epourquoi ils sont importants\u003c/strong\u003e, avec des parcours détaillés et des démos en direct tout au long de la session.\u003cbr\u003e\u003cbr\u003eSi vous avez du mal à comprendre tous les détails des protocoles autour des agents IA, cette session est faite pour vous !","summary":"Cette session propose un deep dive sur les protocoles clés des agents IA (MCP, A2A, ACP) et leurs frameworks associés (ADK, Arc, Quarkus, LangChain4j). À travers démos et constructions d’agents, elle explique leur rôle, leur fonctionnement et leur importance pour concevoir des systèmes multi-agents interopérables.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":156,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":959,"slug":"deep-dive-180","name":"3H Deep Dive","duration":180,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"3 hours sessions where attendees can rapidly immerse themselves in a subject matter with an in-depth examination of a topic or technology.","cssColor":"#c2cced","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":1215,"firstName":"Malik","lastName":"Moreau","fullName":"Malik Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":5532,"firstName":"Clara","lastName":"Lefevre","fullName":"Clara Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"protocoles"},{"name":"agents"},{"name":"mcp"},{"name":"frameworks"}],"timeSlots":[]},{"id":83148,"title":"La révolution WebGPU : toute la puissance du GPU, sur le web et au-delà","description":"Si je vous parle de GPU sur le web, vous pensez à ... ? WebGL ! L’API graphique qui est utilisée sur une bonne partie des sites Awwwards, Google Maps, Figma ou encore Tensorflow. Mais elle souffre d\u0026#39;un design un peu daté, celui de l’API OpenGL sortie en 1992. Depuis, d\u0026#39;autres APIs graphiques ont vu le jour (Vulkan, DirectX 12, Metal), mais elles n’étaient pas accessibles dans les navigateurs. Jusqu\u0026#39;à maintenant !\u003cbr\u003e\u003cbr\u003eGoogle, Apple et Mozilla ont développé conjointement WebGPU pour succéder à WebGL et amener les APIs graphiques modernes sur le web, et en dehors ! Je vous propose donc de découvrir les améliorations apportées sur le rendu graphique et le calcul sur GPU, avec des mesures de performance pour comparer les différentes implémentations.\u003cbr\u003e\u003cbr\u003eDes graphismes 3D aux simulations physiques en passant par l\u0026#39;IA ou le traitement d\u0026#39;image, vous aurez de quoi imaginer des cas d’utilisation possibles de cette API encore peu supportée, mais à l\u0026#39;avenir prometteur ✨","summary":"Cette session présente WebGPU, la nouvelle API graphique issue d’une collaboration entre Google, Apple et Mozilla. Successeur moderne de WebGL, elle apporte les performances et fonctionnalités de Vulkan, DirectX 12 et Metal au web. L’exposé explore ses avantages, mesures de performance et usages futurs en 3D, IA et calcul GPU.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":38,"track":{"id":2760,"name":"Front-end \u0026 UX","description":"Web and mobile engineering: frameworks (Angular, React, Vue), performance, accessibility, design systems, PWAs and client-side integration patterns — including lightweight AI at the edge."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":77884,"firstName":"Lucas","lastName":"Perrin","fullName":"Lucas Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"webgpu"},{"name":"performance"},{"name":"graphique"},{"name":"rendu"}],"timeSlots":[]},{"id":15157,"title":"Developers, start your nginx ! Propulsé par la Java FFM API","description":"Depuis Java 22, une nouvelle approche moderne et performante permet de connecter Java à des bibliothèques natives : la Foreign Function \u0026amp; Memory API (FFM). Mais que se passe-t-il lorsque l’on pousse cette API au-delà des démonstrations classiques pour l\u0026#39;utiliser avec un véritable serveur web tel que nginx ?\u003cbr\u003e\u003cbr\u003eDans cette session, nous explorerons jusqu’où Java peut aller lorsque FFM prend le contrôle de nginx.\u003cbr\u003eNous examinerons les structures internes de nginx depuis Java, appellerons des fonctions C de manière sûre, manipulerons des segments mémoire, et expérimenterons l’idée d’utiliser nginx non seulement comme reverse proxy, mais aussi potentiellement comme un moteur de servlets.\u003cbr\u003eOui — transformer nginx en moteur d’exécution pour des handlers Java, et imaginer son intégration au cœur de workloads Spring Boot, en tant que passerelle native haute performance ou runtime hybride.\u003cbr\u003e\u003cbr\u003ePréparez-vous à soulever le capot et à découvrir comment nginx peut apporter TLS, HTTP/3 et bien d’autres capacités puissantes directement à vos applications Java !","summary":"Cette session explore l’utilisation avancée de la Foreign Function \u0026 Memory API de Java 22 pour piloter nginx depuis Java : introspection interne, appels C sécurisés, manipulation mémoire, et transformation potentielle de nginx en moteur haute performance ou passerelle native pour applications Java, incluant TLS et HTTP/3.","audienceLevel":"ADVANCED","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":46,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":15655,"firstName":"Romane","lastName":"Garnier","fullName":"Romane Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"nginx"},{"name":"ffm"},{"name":"performance"},{"name":"mémoire"}],"timeSlots":[]},{"id":148102,"title":"Anatomie de la mémoire, chez l\u0027humain et chez les agents IA","description":"Artificial intelligence does not need to copy the human brain to advance, yet cognitive science still offers useful guidance. As agentic applications grow, understanding how humans store and retrieve information can help us design agents that act with greater context and reliability.\u003cbr\u003e\u003cbr\u003eThis talk connects human memory to the practical challenges of building AI agents with memory. We will review the main types of memory in the brain, revisit a landmark case in neuroscience, and relate these ideas to how large language models process information. We will also look at the real difficulties of taking agents to production, where choosing what to store and how to retrieve it becomes the core challenge.\u003cbr\u003e\u003cbr\u003eParticipants will learn:\u003cbr\u003e- How insights from cognitive science can guide agent design\u003cbr\u003e- The key forms of human memory and their relevance to AI\u003cbr\u003e- What neuroscience reveals about the limits of large language models\u003cbr\u003e- The main obstacles of deploying agents with memory in real systems\u003cbr\u003e- How our work at Redis led to an open-source, production-ready agent memory server\u003cbr\u003e- Practical ways to improve memory in AI agents","summary":"This talk explores how insights from cognitive science and neuroscience can inform the design of AI agents with memory. It connects human memory mechanisms to challenges in building and deploying reliable, context-aware agents, highlighting practical lessons, system design choices, and open‑source tools for improving memory in real‑world AI systems.","audienceLevel":"BEGINNER","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":44,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2104,"firstName":"Manon","lastName":"Moreau","fullName":"Manon Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Netherlands"},{"id":161401,"firstName":"Louise","lastName":"Da Silva","fullName":"Louise Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"United Kingdom"}],"keywords":[{"name":"cognition"},{"name":"agents"},{"name":"neuroscience"},{"name":"memory"}],"timeSlots":[]},{"id":153851,"title":"Meetup Dev With AI : l\u0027avenir des développeurs","description":"L’intelligence artificielle transforme en profondeur le métier de développeur.\u003cbr\u003eMais ce n’est pas le seul bouleversement que nous traversons.\u003cbr\u003e\u003cbr\u003eDepuis 2023, la situation économique de la tech s’est durcie, et rien n’indique un retour rapide à l’euphorie des années précédentes.\u003cbr\u003e\u003cbr\u003ePris entre ces deux dynamiques, révolution technologique et contraction du marché, nous devons nous poser les bonnes questions.\u003cbr\u003e\u003cbr\u003eAllons-nous continuer à écrire du code comme avant ?\u003cbr\u003eDeviendrons-nous principalement des reviewers de PR générées par IA ?\u003cbr\u003eLes profils du produit ou du métier vont-ils, eux aussi, se mettre à coder ?\u003cbr\u003eComment va évoluer notre valeur dans les équipes ?\u003cbr\u003eEt surtout : quelles sont les opportunités derrière ces transformations ?\u003cbr\u003e\u003cbr\u003eCe BOF est un espace ouvert pour partager nos doutes, nos espoirs, nos expériences et nos convictions sur l’avenir du métier de développeur.\u003cbr\u003e\u003cbr\u003eQuel que soit votre niveau d\u0026#39;expérience, votre intérêt ou votre réticence face à l\u0026#39;IA, venez en discuter avec nous 😉\u003cbr\u003e","summary":"Ce BOF invite à débattre de l’avenir du métier de développeur face à la double pression de l’intelligence artificielle et du ralentissement économique. Il propose d’échanger sur l’évolution des rôles, des compétences et des opportunités dans un contexte de transformation technologique profonde.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":42,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":954,"slug":"bof-60","name":"BOF","duration":55,"pause":false,"freeTickets":0,"minSpeakers":1,"description":"Informal sessions of one hour, where like minded people get together and discuss technology.","cssColor":"#ffb8fd","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":153801,"firstName":"Malik","lastName":"Da Silva","fullName":"Malik Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"développeur"},{"name":"avenir"},{"name":"ia"},{"name":"transformation"}],"timeSlots":[]},{"id":2704,"title":"The Hive : un monolithe modulaire prêt à devenir microservices","description":"Après une décennie, notre industrie s’est rendu compte que des microservices mal conçus peuvent très facilement se transformer en un monolithe distribué, encore plus problématique que le monolithe spaghetti qu’il était censé corriger. Pour répondre à ce problème, le concept de monolithe modulaire apparaît aujourd’hui comme une alternative intéressante.\u003cbr\u003e\u003cbr\u003eCependant, dans cette approche de monolithe modulaire, la difficulté réside plus que jamais dans la capacité à le découper efficacement sans créer de modules trop fortement couplés. Si cette étape est mal gérée, il peut devenir impossible de le scinder ultérieurement en plusieurs services, lorsque cela s’avèrera indispensable.\u003cbr\u003e\u003cbr\u003eLe pattern de la ruche (The Hive) permet construction d’un monolithe modulaire prêt pour pour être découpé en microservices en combinant plusieurs architectures hexagonales au concept du vertical slicing.\u003cbr\u003e\u003cbr\u003eLors de cette session de live coding, nous partirons d’une situation de monolithe spaghetti legacy, que nous ferons évoluer étape par étape vers un monolithe modulaire basé sur le pattern Hive, avant de conclure par une démonstration d’extraction et de transformation d’un module en microservice séparé.","summary":"Ce talk présente comment le pattern Hive permet de transformer un monolithe spaghetti en monolithe modulaire, prêt à être découpé en microservices grâce à l’architecture hexagonale et au vertical slicing, illustré par du live coding allant de l’existant legacy à l’extraction d’un module en microservice.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":248,"track":{"id":1251,"name":"Architecture \u0026 Design","description":"Designs, trade-offs and real-world decisions for building maintainable systems. Case studies, system evolution (monolith→services), DDD, event-driven approaches, resilience and architectural anti-patterns."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2251,"firstName":"Sacha","lastName":"Moreau","fullName":"Sacha Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":2560,"firstName":"Lina","lastName":"Moreau","fullName":"Lina Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"monolithe"},{"name":"hive"},{"name":"modulaire"},{"name":"microservices"}],"timeSlots":[]},{"id":2724,"title":"JCStress : au cœur de la concurrence et des systèmes distribués en Java","description":"La concurrence en Java, c’est un peu comme la mécanique quantique : on croit comprendre… jusqu’à ce que tout parte en vrille.\u003cbr\u003eEntre threads, caches CPU et mémoire volatile, certains comportements semblent impossible... jusqu\u0026#39;à ce qu\u0026#39;ils surviennent en production. Dans un système distribué, ces “glitches” locaux peuvent vite se transformer en un véritable cauchemar.\u003cbr\u003eComment savoir si votre code multi-threadé est vraiment sûr ?\u003cbr\u003eC’est là qu’intervient JCStress, l’outil officiel d’OpenJDK.\u003cbr\u003eIl pousse votre code dans ses retranchements en testant toutes les façons possibles dont les threads peuvent s’entrelacer, afin de révéler les bugs non décelables par les tests unitaires comme les problèmes de visibilité, d’ordre d’exécution ou d’atomicité.\u003cbr\u003eDans ce \u003cem style\u003d\"background-color: rgb(255, 255, 255); color: rgb(31, 35, 40);\"\u003eTools in Action\u003c/em\u003e, vous verrez comment :\u003cbr\u003e\u003cul\u003e\u003cli\u003eécrire et exécuter des tests JCStress,\u003c/li\u003e\u003cli\u003ecomprendre ce que la JVM fait réellement derrière vos threads,\u003c/li\u003e\u003cli\u003eet appliquer ces principes pour fiabiliser vos applications concurrentes et distribuées.\u003c/li\u003e\u003c/ul\u003eVenez découvrir JCStress et laisser la JVM vous montrer la vérité cachée du parallélisme Java.\u003cbr\u003e","summary":"Ce talk présente JCStress, l’outil d’OpenJDK pour tester la sûreté des codes Java concurrents. Il montre comment écrire et exécuter des tests JCStress afin de détecter des bugs subtils liés à l’exécution multi-threadée, et fiabiliser ainsi les applications concurrentes et distribuées.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":41,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2583,"firstName":"Camille","lastName":"Lefevre","fullName":"Camille Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":2591,"firstName":"Sofia","lastName":"Lefevre","fullName":"Sofia Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"threads"},{"name":"jvm"},{"name":"concurrence"},{"name":"jcstress"}],"timeSlots":[]},{"id":138301,"title":"Le jeu d\u0027échecs à l\u0027ère de l\u0027intelligence artificielle","description":"\u003cstrong\u003eÀ l’ère de l’intelligence artificielle, le jeu d’échecs a connu une transformation sans précédent.\u003c/strong\u003e\u003cbr\u003eLongtemps symbole du raisonnement humain et de la créativité, il est devenu un \u003cstrong\u003elaboratoire privilégié\u003c/strong\u003e pour observer la rencontre entre \u003cstrong\u003el’homme et la machine\u003c/strong\u003e.\u003cbr\u003eEn tant que \u003cstrong\u003egrand maître international\u003c/strong\u003e, ayant traversé l’époque \u003cstrong\u003epré-informatique\u003c/strong\u003e, puis celle des \u003cstrong\u003emoteurs classiques\u003c/strong\u003e, jusqu’à l’avènement des \u003cstrong\u003eréseaux neuronaux\u003c/strong\u003e comme \u003cem\u003eAlphaZero\u003c/em\u003e, je proposerai un \u003cstrong\u003eregard de l’intérieur\u003c/strong\u003e sur cette révolution.\u003cbr\u003e\u003cstrong\u003eComment l’IA a-t-elle bouleversé :\u003c/strong\u003e\u003cbr\u003e\u003cul\u003e\u003cli\u003ela \u003cstrong\u003epréparation\u003c/strong\u003e des joueurs,\u003c/li\u003e\u003cli\u003ela \u003cstrong\u003ecompréhension stratégique\u003c/strong\u003e,\u003c/li\u003e\u003cli\u003eet même l’\u003cstrong\u003eesthétique du jeu\u003c/strong\u003e ?\u003c/li\u003e\u003c/ul\u003eQue nous a-t-elle appris sur les \u003cstrong\u003eéchecs\u003c/strong\u003e… et sur \u003cstrong\u003enous-mêmes\u003c/strong\u003e ?\u003cbr\u003eLoin d’avoir « tué » la \u003cstrong\u003ecréativité humaine\u003c/strong\u003e, l’IA a au contraire \u003cstrong\u003eouvert de nouveaux horizons\u003c/strong\u003e, redéfini l’\u003cstrong\u003eapprentissage\u003c/strong\u003e et posé des \u003cstrong\u003equestions essentielles\u003c/strong\u003e sur la collaboration entre \u003cstrong\u003eintelligence humaine et artificielle\u003c/strong\u003e, bien au-delà de l’\u003cstrong\u003eéchiquier\u003c/strong\u003e.","summary":"Le texte explore l’impact de l’IA sur les échecs, vue par un grand maître témoin de son évolution. Il montre comment l’IA a transformé la préparation, la stratégie et l’esthétique du jeu, révélant de nouvelles formes de créativité et de collaboration entre intelligence humaine et artificielle.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":408,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":955,"slug":"keynote-25","name":"Keynote","duration":25,"pause":false,"invitationOnly":true,"freeTickets":2,"minSpeakers":1,"description":"Invitation only: Inspiring and thought provoking keynotes of 20 minutes.","cssColor":"#c8b0d4","scheduleInSmallRoom":false,"countInQuota":false,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":112403,"firstName":"Juliette","lastName":"Perrin","fullName":"Juliette Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"échecs"},{"name":"apprentissage"},{"name":"créativité"},{"name":"intelligence"}],"timeSlots":[]},{"id":19024,"title":"Voyage au bout des API d\u0027I/O de Linux (de poll à io_uring)","description":"Que l’on travaille avec des bases de données, des serveurs web ou même que l’on lise simplement des fichiers, on retrouvera toujours sous Linux les mêmes API en dessous : « poll » ou « select » pour les plus anciens d’entre nous, « epoll » pour les plus récents.\u003cbr\u003eMais depuis 2019, une révolution bouscule le monde Linux et propose une alternative à ces API historiques : il s’agit de « io_uring ».\u003cbr\u003eAu cours de cette conférence, nous vous expliquerons, via un exemple simple (une socket) et du code, les différentes API Linux, leurs évolutions et les problématiques que ces évolutions résolvent.\u003cbr\u003e","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":66,"track":{"id":1256,"name":"Cloud \u0026 Plateformes","description":"Backend and platform engineering across technologies: frameworks (Java, Go, Node, Rust…), Kubernetes, serverless, observability, SRE practices and infrastructure-as-code for production systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":19279,"firstName":"Jade","lastName":"Renaud","fullName":"Jade Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":19281,"firstName":"Louise","lastName":"Renaud","fullName":"Louise Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"io_uring"},{"name":"linux"},{"name":"évolutions"},{"name":"api"}],"timeSlots":[]},{"id":114353,"title":"Bâtir des agents IA en Kotlin avec Koog","description":"Koog est le framework open-source de JetBrains, conçu pour créer des agents d’IA en Kotlin, il est compatible avec la JVM, Android/iOS et JS/WASM. \u003cbr\u003eDans cette présentation, je montrerai comment fonctionne Koog, comment structurer un agent à l’aide de sa DSL, intégrer des outils externes et orchestrer des scénarios complexes.\u003cbr\u003eLa présentation sera illustrée par un cas d’usage concret.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":38,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":97752,"firstName":"Nathan","lastName":"Perrin","fullName":"Nathan Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"koog"},{"name":"agents"},{"name":"framework"},{"name":"kotlin"}],"timeSlots":[]},{"id":34412,"title":"Être payé en equity : comment ça marche vraiment ?","description":"Avez-vous déjà rencontré quelqu\u0026#39;un qui vous dit \u0026quot;je ne peux pas te payer € mais je peux te donner des actions\u0026quot; ?\u003cbr\u003e\u003cbr\u003eMoi oui et j\u0026#39;ai accepté ! \u003cbr\u003e\u003cbr\u003eÊtre rémunéré en equity fait rêver, intrigue… et soulève beaucoup de questions, surtout quand on en connaît rien ! C\u0026#39;était mon cas quand je me suis lancée en tant que freelance et je vais vous partager ce que j\u0026#39;ai appris. Au moins si jamais vous devez évaluer une telle proposition, vous ne partirez pas de zéro.","summary":"Le texte raconte l’expérience d’une freelance ayant accepté une rémunération en actions plutôt qu’en argent. Elle partage les leçons tirées de cette décision afin d’aider d’autres professionnels à mieux comprendre et évaluer ce type de proposition avant de s’y engager.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":36,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":34560,"firstName":"Alice","lastName":"Dubois","fullName":"Alice Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"freelance"},{"name":"actions"},{"name":"equity"},{"name":"rémunération"}],"timeSlots":[]},{"id":158701,"title":"Construire une taxonomie produit par une approche bottom-up","description":"Chez Mirakl, nous alimentons des centaines de marketplaces couvrant des industries très diverses, allant de l\u0026#39;électronique à des secteurs B2B comme des pièces aéronautiques. Chacune possède sa taxonomie, et aucun standard ne peut capturer cette diversité.\u003cbr\u003eConcevoir une taxonomie selon une approche top-down impose des choix structurants : quel niveau de granularité adopter ? Comment garantir la couverture ? Ces décisions conduisent souvent à une taxonomie trop large dans certains domaines et incomplète dans d\u0026#39;autres.\u003cbr\u003eNous avons donc adopté une approche bottom-up, où la taxonomie émerge de millions de produits. En combinant embeddings de produits et LLMs, nous regroupons automatiquement les produits pour créer des catégories adaptées à chaque domaine. Résultat : si un produit existe, il trouve sa catégorie. Ces regroupements nous permettent aussi d\u0026#39;identifier les attributs les plus pertinents pour chaque catégorie en agrégeant ceux observés dans les produits.\u003cbr\u003eDans ce talk, nous présenterons l\u0026#39;architecture et les choix techniques derrière cette méthode, et pourquoi l\u0026#39;approche bottom-up est particulièrement adaptée pour créer une taxonomie couvrant de multiples industries.","summary":"Mirakl conçoit une taxonomie produit émergente à partir des données réelles plutôt qu’imposée. En combinant embeddings et LLMs, les produits se regroupent automatiquement en catégories spécifiques à chaque domaine, garantissant couverture et pertinence. Le talk détaille l’architecture et les avantages de cette approche bottom-up multi-industries.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":36,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":158353,"firstName":"Théo","lastName":"Da Silva","fullName":"Théo Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"llm"},{"name":"classification"},{"name":"taxonomie"},{"name":"embeddings"}],"timeSlots":[]},{"id":26806,"title":"G1, ZGC, Shenandoah… quel GC Java choisir ?","description":"On a l\u0026#39;impression qu\u0026#39;avec chaque version de Java il y a de plus en plus de Garbage Collectors (GCs) avec de plus en plus d\u0026#39;options. On entend des phrases cryptiques telles que \u0026quot;Oh, trop bien, ZGC est devenu générationnel alors que Shenandoah ne l\u0026#39;est pas\u0026quot; ou \u0026quot;T\u0026#39;as vu chez Netflix ils ont réduit leurs tail latencies avec ZGC\u0026quot;\u003cbr\u003e\u003cbr\u003eDu coup on se pose plein de questions:\u003cbr\u003e\u003cul\u003e\u003cli\u003equ\u0026#39;est-ce qu\u0026#39;ils racontent ?\u003c/li\u003e\u003cli\u003eZGC c\u0026#39;est quoi ?\u003c/li\u003e\u003cli\u003esi ce ZGC est si magique, pourquoi il y a d\u0026#39;autres GCs dans Java, hein ?\u003c/li\u003e\u003cli\u003epourquoi on ne parle toujours que des différents GCs de Java mais jamais pour Go ou JavaScript ? chez Java ils ne sont pas capables d\u0026#39;en choisir un ?\u003c/li\u003e\u003cli\u003eet en natif, on a besoin d\u0026#39;un GC ?\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eDev Java ou simples curieuses et curieux, tout le monde est bienvenu. On va repartir de la création de Java jusqu\u0026#39;à maintenant pour comprendre pourquoi on a besoin d\u0026#39;un GC et pourquoi ce n\u0026#39;est pas un problème résolu. On fera aussi un tour des GCs, de leurs évolutions, de leurs forces et de leurs faiblesses. (spoiler alert: ZGC n\u0026#39;est pas le GC qui les remplacera tous)\u003cbr\u003e\u003cbr\u003eÀ l\u0026#39;issue de ce talk vous saurez quand utiliser quel GC afin de
