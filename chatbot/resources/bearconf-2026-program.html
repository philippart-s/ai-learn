es de connaissances à grande échelle et la génération d’images cohérentes, le tout sans prérequis technique ni installation.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":75,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":984,"slug":"lab-120","name":"2H Hands-on Lab","duration":120,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"2 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":63408,"firstName":"Maya","lastName":"Marchand","fullName":"Maya Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":63413,"firstName":"Karim","lastName":"Marchand","fullName":"Karim Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"llm"},{"name":"multimodalité"},{"name":"connaissances"},{"name":"transcription"}],"timeSlots":[]},{"id":65345,"title":"Et si votre backend savait parler ? Créer des agents vocaux IA en temps réel","description":"Parler à une application comme à un humain n’est plus de la science-fiction. Les \u003cstrong\u003eagents vocaux d’IA\u003c/strong\u003e permettent aujourd’hui des conversations fluides, en temps réel, avec une compréhension du langage naturel et des réponses parlées proches de l’humain.\u003cbr\u003eDans ce \u003cstrong\u003elab pratique de 2 heures\u003c/strong\u003e, vous construirez \u003cstrong\u003eun agent conversationnel vocal de bout en bout\u003c/strong\u003e. Vous apprendrez à assembler les briques essentielles d’un système voix-à-voix moderne : capture audio en streaming, compréhension du langage, logique de dialogue et génération de réponses vocales.\u003cbr\u003eLe lab abordera notamment :\u003cbr\u003e\u003cul\u003e\u003cli\u003ele fonctionnement d’un \u003cstrong\u003eagent vocal temps réel\u003c/strong\u003e et ses contraintes (latence, streaming, multi-tours) ;\u003c/li\u003e\u003cli\u003el’orchestration des composants voix, raisonnement et réponse à l’aide d’un \u003cstrong\u003eframework open-source\u003c/strong\u003e ;\u003c/li\u003e\u003cli\u003ela mise en place d’un pipeline \u003cstrong\u003espeech-to-speech\u003c/strong\u003e permettant à l’agent d’écouter, comprendre et répondre naturellement ;\u003c/li\u003e\u003cli\u003eles bonnes pratiques pour obtenir des \u003cstrong\u003econversations fluides et humaines\u003c/strong\u003e.\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cstrong\u003ePré-requis\u003c/strong\u003e : bases en Python et APIs.\u003cbr\u003e \u003cstrong\u003eFormat\u003c/strong\u003e : 100 % hands-on.","summary":"Atelier pratique de 2 heures pour créer un agent conversationnel vocal complet : capture audio en streaming, compréhension du langage, logique de dialogue et génération de réponses parlées. Les participant·es apprendront à orchestrer un pipeline voix‑à‑voix temps réel avec un framework open‑source pour des interactions naturelles et fluides.","audienceLevel":"ADVANCED","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":57,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":2352,"slug":"deep-dive-120","name":"2H Deep Dive","duration":120,"pause":false,"invitationOnly":false,"freeTickets":2,"description":"2 hours sessions where attendees can rapidly immerse themselves in a subject matter with an in-depth examination of a topic or technology.","cssColor":"#bac6e6","countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":19294,"firstName":"Zoé","lastName":"Renaud","fullName":"Zoé Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":60474,"firstName":"Alice","lastName":"Marchand","fullName":"Alice Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"agent"},{"name":"conversationnel"},{"name":"voix"},{"name":"ia"}],"timeSlots":[]},{"id":34420,"title":"Construire des pipelines vidéo IA multimodaux à grande échelle : de zéro à héros","description":"Today, a growing number of applications rely on video as a primary data source. Analyzing video at scale requires more than running individual models; it demands well designed multimodal pipelines that combine vision, audio, and text while remaining accurate, cost-efficient, and compliant.\u003cbr\u003e\u003cbr\u003eIn this session, we build a high-throughput pipeline for video streams. Participants will see how raw feeds are transformed into aligned, queryable components by orchestrating ASR and visual embeddings, and by producing higher-level outputs such as speaker identity, facial recognition, and summaries under noisy conditions.\u003cbr\u003e\u003cbr\u003eWe focus on key engineering challenges: audio-video synchronization and clock drift, stream fragmentation and context handling, hallucination mitigation, and scaling the system while controlling latency, cost and resilience.\u003cbr\u003e\u003cbr\u003e\u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eKey takeaways include\u003c/strong\u003e designing scalable multimodal pipelines, solving alignment and signal-quality issues at scale, and applying practical patterns for building compliant, auditable, and resilient video analysis systems.\u003cbr\u003e\u003cbr\u003eFamiliarity with data pipelines and basic ML concepts is helpful but not required.","summary":"This session demonstrates how to design scalable multimodal pipelines for large‑scale video analysis. It covers synchronizing audio and video, mitigating noise and hallucinations, and managing cost, latency, and compliance. Attendees learn to transform raw streams into queryable, auditable outputs using ASR, visual embeddings, and higher‑level recognition tasks.","audienceLevel":"INTERMEDIATE","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":14,"track":{"id":1254,"name":"Data \u0026 Analytics","description":"Data storage, streaming, processing and ML engineering. Topics include data architecture, feature stores, training pipelines, MLOps and scalable analytics workflows."},"sessionType":{"id":984,"slug":"lab-120","name":"2H Hands-on Lab","duration":120,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"2 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":12020,"firstName":"Nathan","lastName":"Garnier","fullName":"Nathan Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"United Arab Emirates"},{"id":165101,"firstName":"Lina","lastName":"Da Silva","fullName":"Lina Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"United Arab Emirates"}],"keywords":[{"name":"video"},{"name":"pipeline"},{"name":"scalability"},{"name":"multimodal"}],"timeSlots":[]},{"id":61651,"title":"Chiffrement au repos : une clé maître fondée sur un KEM hybride","description":"La FAQ de l’ANSSI d’octobre 2025 recommande d’inventorier les usages cryptographiques afin de préparer la transition post-quantique.\u003cbr\u003eElle souligne qu’à l’horizon 2030, l’acquisition de produits n’intégrant pas de cryptographie post-quantique ne paraîtra plus raisonnable. La prise en compte des enjeux post-quantiques doit donc s’inscrire dans les cycles de renouvellement des systèmes d’information.\u003cbr\u003eNotre mécanisme de chiffrement au repos s’appuie sur une hiérarchie de clés afin de limiter l’impact d’une compromission, permettre une rotation périodique des clés et garantir la confidentialité des données sur le long terme.\u003cbr\u003eL’objectif de cette présentation consiste à montrer comment, à partir de la RFC 9180 et de la spécification JEP 452, un KEM hybride. \u003cbr\u003eCette approche apporte une garantie forte : la clé maître conserve son niveau de sécurité tant qu’au moins l’un des deux algorithmes demeure robuste, qu’il relève de la cryptographie classique ou post-quantique.\u003cbr\u003eCe design s’aligne sur les recommandations actuelles de l’IETF concernant les mécanismes hybrides et concilie sécurité immédiate et résilience cryptographique à long terme.","summary":"Cette présentation illustre la mise en œuvre d’un chiffrement au repos fondé sur un KEM hybride (RFC 9180, JEP 452) combinant cryptographie classique et post‑quantique. Alignée sur les recommandations ANSSI et IETF, l’approche assure rotation des clés, sécurité durable et préparation à la transition post‑quantique d’ici 2030.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":41,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":60481,"firstName":"Lina","lastName":"Marchand","fullName":"Lina Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"post-quantique"},{"name":"sécurité"},{"name":"chiffrement"},{"name":"cryptographie"}],"timeSlots":[]},{"id":19012,"title":"À cet atelier, vous pouvez venir les yeux fermés","description":"La navigation sur les sites internet à l\u0026#39;aide d\u0026#39;un lecteur d\u0026#39;écran comment ça marche ?\u003cbr\u003e\u003cbr\u003eComment \u0026quot;voit-on\u0026quot; un site sans le voir ?\u003cbr\u003e\u003cbr\u003eQuels sont les problèmes rencontrés par les utilisateurs de lecteurs d\u0026#39;écrans et surtout, comment faciliter cette navigation et éviter de faire un site inutilisable pour certains.\u003cbr\u003e\u003cbr\u003eDurant cet atelier, on écouteras des sites web, on parlera de sémantique, d\u0026#39;accès rapide, de landmarks, d\u0026#39;alternatives aux images, de tableaux, d\u0026#39;Aria, de formulaires, de liens et de boutons (spoiler : un div n\u0026#39;est pas un bouton).\u003cbr\u003e\u003cbr\u003eOn parlera aussi un peu de SEO : l\u0026#39;aveugle le plus célèbre au monde n\u0026#39;est il pas Google ?\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eMatériel\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003eLes personnes assistants à l\u0026#39;atelier devront apporter un ordinateur (PC, Mac ou linux) et un casque audio.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":38,"track":{"id":2760,"name":"Front-end \u0026 UX","description":"Web and mobile engineering: frameworks (Angular, React, Vue), performance, accessibility, design systems, PWAs and client-side integration patterns — including lightweight AI at the edge."},"sessionType":{"id":984,"slug":"lab-120","name":"2H Hands-on Lab","duration":120,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"2 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":19264,"firstName":"Inès","lastName":"Renaud","fullName":"Inès Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":19265,"firstName":"Théo","lastName":"Renaud","fullName":"Théo Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"aria"},{"name":"sémantique"},{"name":"navigation"},{"name":"accessibilité"}],"timeSlots":[]},{"id":83112,"title":"Polars : la fin de Spark ?","description":"Vous devez choisir quelle technologie utiliser pour traiter des dizaines, voir des centaines de Go de données. L\u0026#39;éléphant dans la pièce c\u0026#39;est Spark, qui a largement fait ses preuves. Un éléphant tellement gros que vous ne voyez rien d\u0026#39;autre.\u003cbr\u003e\u003cbr\u003eJe vais vous convaincre d\u0026#39;abandonner Spark pour faire du Polars. Cette présentation propose une comparaison directe entre Apache Spark et Polars, mettant en évidence les avantages de performance, de simplicité d\u0026#39;utilisation et d\u0026#39;efficacité de Polars par rapport à Spark pour le traitement de données. L\u0026#39;objectif est de démontrer pourquoi Polars pourrait représenter l\u0026#39;avenir du traitement de données, offrant une alternative moderne et performante à l\u0026#39;écosystème Spark traditionnel.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":26,"track":{"id":1254,"name":"Data \u0026 Analytics","description":"Data storage, streaming, processing and ML engineering. Topics include data architecture, feature stores, training pipelines, MLOps and scalable analytics workflows."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":77868,"firstName":"Théo","lastName":"Perrin","fullName":"Théo Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"données"},{"name":"polars"},{"name":"performance"},{"name":"spark"}],"timeSlots":[]},{"id":85057,"title":"BOF Scala User Group : REX Loom en Scala 3, trois ans après","description":"Java 21 (LTS, sept. 2023) a consacré les threads virtuels du projet Loom. Trois ans plus tard, l\u0026#39;écosystème JVM a largement adopté cette révolution. Les scoped values et la concurrence structurée arrivent en preview dans Java 25.Côté Scala, le bilan est plus nuancé.\u003cbr\u003e\u003cul\u003e\u003cli\u003eScala Gears et Ox ont embrassé Loom avec un style direct\u003c/li\u003e\u003cli\u003eKyo propose une approche hybride (effets + direct style)\u003c/li\u003e\u003cli\u003eZIO et Cats Effect ont fait le choix explicite de \u003cem style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003ene pas\u003c/em\u003e intégrer Loom dans leur runtime\u003c/li\u003e\u003cli\u003eLes capabilities (Scala 3.5+) ouvrent de nouvelles perspectives pour la gestion des effets\u003c/li\u003e\u003c/ul\u003eComment ces choix se traduisent-ils en production ? Quels sont les compromis ? Qu\u0026#39;avons-nous appris après trois ans d\u0026#39;expérimentation ? Après un court rappel du contexte et un retour d\u0026#39;expérience de notre utilisation de Loom en Scala (Kyo, style direct, capabilities), nous vous proposons d\u0026#39;échanger sur vos propres expériences, vos choix techniques, et les perspectives à venir.Que vous utilisiez déjà Loom ou non, que vous soyez familier avec la programmation concurrente ou curieux de découvrir, ce BoF est fait pour vous.","summary":"Trois ans après l’arrivée des threads virtuels avec Java 21, l’écosystème JVM les a largement adoptés, tandis que Scala explore diverses approches (Kyo, Gears, Ox, ZIO, Cats Effect). Cette session propose un retour d’expérience sur Loom, Scala et les capabilities, pour discuter des compromis, usages en production et perspectives futures.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":9,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":954,"slug":"bof-60","name":"BOF","duration":55,"pause":false,"freeTickets":0,"minSpeakers":1,"description":"Informal sessions of one hour, where like minded people get together and discuss technology.","cssColor":"#ffb8fd","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":77891,"firstName":"Louise","lastName":"Perrin","fullName":"Louise Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":77896,"firstName":"Rayan","lastName":"Perrin","fullName":"Rayan Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"scala"},{"name":"concurrence"},{"name":"effets"},{"name":"loom"}],"timeSlots":[]},{"id":65312,"title":"Jailbreak, prompt injection, MCP poisoning… Don\u0027t Panic and Hack AI","description":"LLM, RAG, désormais Agentique et MCP : y\u0026#39;a-t-il d\u0026#39;autres risques à connaître que les \u0026quot;hallucinations\u0026quot; ?\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003e\u003cem\u003eLearn AI\u003c/em\u003e 🤓\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003eDans ce codelab vous découvrirez les attaques les plus fréquentes sur les chatbots gonflés à l\u0026#39;IAGen, vous comprendrez les menaces qui visent le Prompt et maintenant les Agents et Tools MCP.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003e\u003cem\u003eHack AI\u003c/em\u003e 😈\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003eVous pratiquerez des exercices de \u0026quot;\u003cem\u003eJailbreak\u003c/em\u003e\u0026quot; inspirés de publications universitaires et du Pentest, testerez les vulnérabilités de bots sur un playground avec des outils open source comme Garak et PyRIT, découvrirez les failles inhérentes aux architectures agentiques et les risques pour les Agents et le MCP : \u003cem\u003eTool Poisoning\u003c/em\u003e, \u003cem\u003eShadowing\u003c/em\u003e, \u003cem\u003eCommand Injection\u003c/em\u003e, etc.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003e\u003cem\u003eProtect AI\u003c/em\u003e 😇\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003eÀ l’issue de l\u0026#39;atelier, vous saurez non seulement expliquer les principes et conséquences de ces attaques, mais vous aurez aussi mis en oeuvre des protections adaptées pour renforcer la sécurité de vos applications, Tools et Agents.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003e\u003cem\u003eDon\u0026#39;t Worry, be Happy AI \u003c/em\u003e🤖 🥰\u003c/strong\u003e","summary":"Cet atelier pratique explore les menaces contre les chatbots et agents IA : attaques de prompt, failles agentiques, Tool Poisoning ou Command Injection. Les participants expérimentent des techniques de “jailbreak” avec des outils open source et apprennent à identifier, comprendre et protéger leurs applications, outils et agents contre ces vulnérabilités.","audienceLevel":"ADVANCED","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":72,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":968,"slug":"lab-180","name":"3H Hands-on Lab","duration":180,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"3 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":1553,"firstName":"Chloé","lastName":"Moreau","fullName":"Chloé Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":44154,"firstName":"Karim","lastName":"Dubois","fullName":"Karim Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":60498,"firstName":"Anaïs","lastName":"Marchand","fullName":"Anaïs Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de .","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":3619,"firstName":"Louise","lastName":"Lefevre","fullName":"Louise Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"webaudio"},{"name":"oscillateurs"},{"name":"synthétiseur"},{"name":"accessibilité"}],"timeSlots":[]},{"id":26801,"title":"Fini les nuits blanches : comment l\u0027IA a transformé nos astreintes","description":"Chaque nuit, des ingénieurs sont réveillés, pas toujours pour des urgences critiques mais très souvent pour des incidents simples : limite d\u0026#39;espace disque, service qui ne répond plus, charge CPU anormale.\u003cbr\u003e\u003cbr\u003eCes incidents, dits de \u0026quot;niveau 1\u0026quot; sont faciles à résoudre en quelques minutes. Pourtant on réveille l\u0026#39;astreinte pour cela.\u003cbr\u003eLa durée totale va prendre 1 heure:\u003cbr\u003e\u003cul\u003e\u003cli\u003ereveil de l\u0026#39;agent,\u003c/li\u003e\u003cli\u003eprise en compte de l\u0026#39;alerte\u003c/li\u003e\u003cli\u003einvestiguer\u003c/li\u003e\u003cli\u003erésoudre le soucis\u003c/li\u003e\u003cli\u003evérifier que c\u0026#39;est ok\u003c/li\u003e\u003cli\u003erépondre au ticket\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e1 heure pendant laquelle:\u003cbr\u003e\u003cul\u003e\u003cli\u003ele service in indisponible\u003c/li\u003e\u003cli\u003eperte de revenue\u003c/li\u003e\u003cli\u003eun agent est sous pression\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eChez \u003cstrong\u003eIguane Solutions\u003c/strong\u003e, on développe \u003cstrong style\u003d\"color: oklch(0.21 0.034 264.665); background-color: rgb(255, 255, 255);\"\u003enAIghts Watch\u003c/strong\u003e : un système multi-agents IA qui résoud automatiquement des incidents de niveau 1 h24.\u003cbr\u003e\u003cbr\u003eDetection d\u0026#39;alerte\u003cbr\u003eAnalyse des logs et métriques\u003cbr\u003eExécute des commandes pré-validés par des SREs: restart, log rotate, ...\u003cbr\u003eVérifie le retour à la normale\u003cbr\u003eRédige un rapport d\u0026#39;incident complet.\u003cbr\u003e\u003cbr\u003e\u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: oklch(0.21 0.034 264.665);\"\u003eRésultats:\u003c/strong\u003e\u003cbr\u003e-\u0026gt; D\u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: oklch(0.373 0.034 259.733);\"\u003eiminution\u003c/strong\u003e de la sollicitation des astreintes de \u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: oklch(0.21 0.034 264.665);\"\u003e80%\u003c/strong\u003e\u003cbr\u003e-\u0026gt; Résolution \u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: oklch(0.21 0.034 264.665);\"\u003e20x plus rapide\u003c/strong\u003e (60 minutes → 3 minutes)\u003cbr\u003e-\u0026gt; Amélioration de la satisfaction de nos techs et de nos clients: chaque incident à un rapport!\u003cbr\u003e-\u0026gt; Nos SREs ont plus de temps pour innover et entrainer le système agentique","summary":"nAIghts Watch automatise la gestion des incidents IT de niveau 1 grâce à une IA multi-agents : détection, analyse, exécution d’actions et reporting. Résultats : astreintes réduites de 80 %, résolution 20 fois plus rapide, amélioration de la satisfaction et libération de temps pour l’innovation SRE.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":77,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":26751,"firstName":"Romane","lastName":"Renaud","fullName":"Romane Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"alerte"},{"name":"incidents"},{"name":"automatisation"},{"name":"infrastructure"}],"timeSlots":[]},{"id":61659,"title":"Chers devs : votre PM n\u0027est (sans doute) pas là pour vous pourrir la vie","description":"Vous avez écrit du code élégant, pondu une belle archi scalable, et (presque) zéro dette technique... \u003cbr\u003eSoudain, le PM débarque avec \u0026quot;juste un micro-ajust\u0026#39;\u0026quot; qui fait tout péter. Encore \u0026gt;_\u0026lt; Ça vous parle ?\u003cbr\u003e\u003cbr\u003eDans ce lightning talk un peu speed et légèrement thérapeutique, on décode le monde mystérieux du Product Management :\u003cbr\u003e\u003cul\u003e\u003cli\u003ePourquoi les PMs changent d\u0026#39;avis (spoiler : ce n\u0026#39;est pas pour vous faire ch***, même si ça y ressemble)\u003c/li\u003e\u003cli\u003eCe que \u0026quot;valeur\u0026quot; veut VRAIMENT dire (si si)\u003c/li\u003e\u003cli\u003eComment parler Product sans vendre votre âme (petit dico inclus)\u003c/li\u003e\u003cli\u003eLa phrase magique pour que les PMs vous respectent à vie (indice : ce n\u0026#39;est pas \u0026quot;techniquement impossible\u0026quot;)\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eHistoires de guerre et confessions honnêtes des deux côtés : apprenez à transformer la guéguerre en vraie collab.\u003cbr\u003eAttention : Contient des vérités qui piquent (mais avec amour) sur les deux camps ! \u003cbr\u003ePour qui ? Pour les devs qui en ont marre de coder parfaitement les mauvais trucs, quoi 😉","summary":"Lightning talk humoristique et percutant sur la collaboration entre développeurs et Product Managers : pourquoi les PM changent d’avis, ce que signifie vraiment la “valeur”, comment mieux communiquer sans perdre son intégrité, et transformer les tensions dev/PM en coopération efficace, avec anecdotes et conseils pratiques.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":72,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":26759,"firstName":"Aurore","lastName":"Renaud","fullName":"Aurore Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"collaboration"},{"name":"developers"},{"name":"product"},{"name":"management"}],"timeSlots":[]},{"id":4007,"title":"Les dangers de sécurité cachés dans votre stack Java","description":"Building cloud-native Java apps feels smooth. You move fast, code freely, and ship often. But that same vibe coding mindset can open the door to serious security problems. Copying code from the internet or trusting your AI assistant too much can introduce unsafe logic. Adding libraries without checking them and running container images you did not build can silently expose your application to attacks.\u003cbr\u003e\u003cbr\u003eIn this session, you will see how modern Java stacks become vulnerable through real-world examples and live hacking. From untrusted dependencies to misconfigured containers, we will explore the common traps developers fall into. You will walk away with practical techniques to spot these risks early and keep your code secure in the cloud-native world.\u003cbr\u003e","summary":"This session exposes common security pitfalls in cloud-native Java development, such as unsafe dependencies, unverified containers, and overreliance on AI or internet code. Through real-world examples and live demos, attendees learn practical techniques to identify and mitigate these risks, ensuring safer and more secure cloud-native Java applications.","audienceLevel":"INTERMEDIATE","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":15,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2270,"firstName":"Rayan","lastName":"Moreau","fullName":"Rayan Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Netherlands"}],"keywords":[{"name":"java"},{"name":"security"},{"name":"containers"},{"name":"dependencies"}],"timeSlots":[]},{"id":5599,"title":"Another World : une belle leçon d\u0027architecture logicielle","description":"Sorti il y a près de 35 ans, en 1991, le jeu Another World est bien plus qu’un jeu culte : c’est une prouesse tant technique qu\u0026#39;artistique. Portée par la vision singulière d’Éric Chahi, alors jeune développeur d\u0026#39;à peine 22 ans, sa réalisation cache une architecture logicielle très audacieuse et résolument moderne : une machine virtuelle sur mesure pensée pour contourner les limites matérielles de l’époque, faciliter le développement et le portage, tout en offrant une expérience de qualité cinématographique jusqu\u0026#39;alors inédite.\u003cbr\u003e\u003cbr\u003eDans ce talk nous décortiquerons l’architecture logicielle de ce jeu vidéo culte, en explorant les choix de conception, sa machine virtuelle et son langage intermédiaire. Nous verrons comment cette approche visionnaire a permis à ce jeu culte d’être porté à travers les décennies, jusqu\u0026#39;à mon portage pour le faire fonctionner dans un navigateur web grâce au WebAssembly.\u003cbr\u003e\u003cbr\u003eUne belle leçon d\u0026#39;architecture logicielle qui pourrait vous inspirer pour vos développements ...","summary":"Ce talk analyse l’architecture logicielle innovante d’Another World, jeu culte de 1991, basé sur une machine virtuelle et un langage intermédiaire. Il montre comment ces choix ont facilité portage et longévité, jusqu’à une adaptation WebAssembly, offrant une leçon d’architecture inspirante pour les développeurs.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":186,"track":{"id":1251,"name":"Architecture \u0026 Design","description":"Designs, trade-offs and real-world decisions for building maintainable systems. Case studies, system evolution (monolith→services), DDD, event-driven approaches, resilience and architectural anti-patterns."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":7360,"firstName":"Sofia","lastName":"Garnier","fullName":"Sofia Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"portage"},{"name":"virtuelle"},{"name":"architecture"},{"name":"webassembly"}],"timeSlots":[]},{"id":19044,"title":"Performance des backends Spring : les techniques que tout dev devrait connaître","description":"Beaucoup de backends Spring souffrent de lenteurs évitables ou de consommation excessive de ressources. Pourtant, il existe des optimisations simples et efficaces, mais elles ne sont pas toujours connues ou comprises.\u003cbr\u003e\u003cbr\u003eCette session explique les techniques essentielles pour booster les performances de vos backends. Au programme : bon paramétrage des entités JPA, lectures de données efficaces et N+1 Select, insertions par blocs, modifications par lot, logs et métriques d\u0026#39;Hibernate, pool de connexion, gestion des transactions, cache, virtual threads, mesures avec Gatling et autres.\u003cbr\u003e\u003cbr\u003eDes conseils clairs, pratiques et accessibles, pour rendre vos backends plus rapides et économes.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":160,"track":{"id":1256,"name":"Cloud \u0026 Plateformes","description":"Backend and platform engineering across technologies: frameworks (Java, Go, Node, Rust…), Kubernetes, serverless, observability, SRE practices and infrastructure-as-code for production systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":19263,"firstName":"Yanis","lastName":"Renaud","fullName":"Yanis Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"optimisation"},{"name":"concurrence"},{"name":"performances"},{"name":"cache"}],"timeSlots":[]},{"id":37772,"title":"Un mot de passe ? Non merci, j\u0027ai une passkey","description":"Les mots de passe, on en a tous marre. Entre les règles tordues, les resets toutes les deux semaines, et les tentatives de phishing, c’est plus de la sécu, c’est du sport.\u003cbr\u003e\u003cbr\u003eHeureusement, les passkeys arrivent avec une promesse simple : plus de galère, plus de mot de passe. Basées sur WebAuthn (soutenues par Google, Apple, et Microsoft), elles pourraient bien changer notre manière d’authentifier les utilisateurs.\u003cbr\u003e\u003cbr\u003eDans ce talk, on voit ensemble :\u003cbr\u003e\u003cul\u003e\u003cli\u003eCe qu’est une passkey, concrètement\u003c/li\u003e\u003cli\u003ePourquoi c’est plus sécurisé \u003cstrong\u003eet\u003c/strong\u003e plus simple\u003c/li\u003e\u003cli\u003eUn retour d\u0026#39;expérience sur l\u0026#39;intégration dans une application réelle\u003c/li\u003e\u003cli\u003eUne rapide démo du fonctionnement des passkeys\u003c/li\u003e\u003c/ul\u003e","summary":"Ce talk présente les passkeys, une alternative sans mot de passe basée sur WebAuthn. Plus simples et plus sûres, elles promettent de transformer l’authentification. La session détaille leur fonctionnement, leurs avantages, un retour d’expérience d’intégration et une démonstration pratique.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":114,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":26799,"firstName":"Théo","lastName":"Dubois","fullName":"Théo Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"authentification"},{"name":"webauthn"},{"name":"sécurité"},{"name":"passkeys"}],"timeSlots":[]},{"id":7867,"title":"The Sound of Your Secrets : apprendre à votre modèle à espionner pour mieux se défendre","description":"Every keyboard has a sound signature. Every click and clack carries information. With deep learning and a decent microphone, that information can be weaponized. In this session, we\u0026#39;ll explore how modern AI models can identify what you\u0026#39;re typing just from the sound of your keyboard. Using a dataset of recorded keystrokes and an open source sound classification pipeline, we\u0026#39;ll walk through building a model that can recover text with startling accuracy. You\u0026#39;ll see firsthand how a few lines of Python and a trained network can turn your laptop into an acoustic fingerprint.\u003cbr\u003e\u003cbr\u003eBut this talk isn\u0026#39;t about enabling surveillance... it\u0026#39;s about understanding it to fight back. We\u0026#39;ll unpack why uniform keyboard layouts and consistent typing styles make these attacks so effective, then explore real countermeasures: signal masking, password entropy, and environmental noise defenses. You\u0026#39;ll leave with a practical understanding of how these attacks work, how to reproduce them for research or awareness, and how to harden your systems (and yourself) against them.","summary":"This session demonstrates how AI and audio recordings can reconstruct typed text from keyboard sounds, revealing a new surveillance risk. Attendees will learn how such acoustic attacks work, why they’re effective, and practical defenses like noise masking and password strategies to protect against them, gaining both technical insight and mitigation skills.","audienceLevel":"INTERMEDIATE","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":44,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2557,"firstName":"Alice","lastName":"Moreau","fullName":"Alice Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"United States of America"}],"keywords":[{"name":"keystrokes"},{"name":"deep learning"},{"name":"countermeasures"},{"name":"sound"}],"timeSlots":[]},{"id":2742,"title":"Débugger avec IntelliJ IDEA","description":"Historically, debuggers are used to help locate and fix bugs. Nowadays, the debugger in IntelliJ IDEA can help you do much more than that. Let\u0026#39;s see how the debugger helps make the development process more productive. I demo various features for debugging Java applications, including not-so-standard ones, like:\u003cbr\u003e\u003cbr\u003e* Lambda breakpoints\u003cbr\u003e* Stream chain tracing\u003cbr\u003e* Dropping the frame\u003cbr\u003e* Emulated method breakpoint\u003cbr\u003e* Evaluate and log\u003cbr\u003e* Non-suspending breakpoints\u003cbr\u003e* Custom data renderers and more\u003cbr\u003e\u003cbr\u003e100% live coding session","summary":"This session showcases advanced debugging features in IntelliJ IDEA for Java, going beyond traditional bug fixing. Through live coding, it demonstrates tools like lambda breakpoints, stream chain tracing, dropping frames, emulated method breakpoints, evaluate and log, non-suspending breakpoints, and custom data renderers to boost developer productivity.","audienceLevel":"INTERMEDIATE","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":156,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2599,"firstName":"Yanis","lastName":"Lefevre","fullName":"Yanis Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Estonia"}],"keywords":[{"name":"java"},{"name":"intellij"},{"name":"breakpoints"},{"name":"debugger"}],"timeSlots":[]},{"id":26845,"title":"Local-first et sync engines : l\u0027architecture du futur ?","description":"Et si on arrêtait de \u0026quot;récupérer\u0026quot; des données ? et qu\u0026#39;on les synchronisait plutôt.\u003cbr\u003e\u003cbr\u003eVous avez surement déjà utilisé ce type d\u0026#39;applications web, qui semblent un peu magiques tellement elles sont rapides et agréables à utiliser : Linear, Figma, Trello, pour n\u0026#39;en citer que quelques-unes.\u003cbr\u003e\u003cbr\u003eToutes se sont retrouvées autour du concept de \u0026quot;local-first\u0026quot; et à implémenter ce qu\u0026#39;on appelle un moteur de synchronisation.\u003cbr\u003e\u003cbr\u003eFinies les requêtes réseau à chaque interaction : c\u0026#39;est le retour du hors-ligne, et de l\u0026#39;instantanéité dans nos interfaces utilisateurs.\u003cbr\u003e\u003cbr\u003eComment ça fonctionne ? Quels sont les impacts de cette architecture sur nos projets, et qu\u0026#39;est-ce que ça veut dire pour le code de nos applications ?\u003cbr\u003e\u003cbr\u003eEnsemble, nous verrons les grands principes du local-first, qu\u0026#39;est-ce qu\u0026#39;un moteur de synchronisation, et quelques exemples de librairies et bases de données permettant de les mettre en œuvre.","summary":"Cette présentation explore l’architecture “local-first” et les moteurs de synchronisation, qui rendent les applications web rapides, agréables et utilisables hors-ligne. Elle détaille leur fonctionnement, leurs impacts sur le code et les projets, et présente des exemples de librairies et bases de données adaptées à ce modèle.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":108,"track":{"id":1251,"name":"Architecture \u0026 Design","description":"Designs, trade-offs and real-world decisions for building maintainable systems. Case studies, system evolution (monolith→services), DDD, event-driven approaches, resilience and architectural anti-patterns."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":3619,"firstName":"Louise","lastName":"Lefevre","fullName":"Louise Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"instantanéité"},{"name":"hors-ligne"},{"name":"synchronisation"},{"name":"local-first"}],"timeSlots":[]},{"id":85092,"title":"SVG et IA générative : repenser l\u0027image interactive sur le web","description":"Le SVG est un outil précieux pour n’importe quel développeur web. Optimisé pour toutes les tailles d’écran, il offre une puissance et une élégance pixel-perfect. Mais pas seulement : d’une flexibilité incomparable, il est capable de s’adapter à vos utilisateurs avec un minimum de JavaScript.\u003cbr\u003e\u003cbr\u003eSeul problème, sa complexité peut effrayer :\u003cbr\u003e\u0026lt;path d\u003d\u0026quot;M30,45 C30,45 10,30 10,18 C10,12 14,8 20,8 C24,8 27,10 30,13 C33,10 36,8 40,8 C46,8 50,12 50,18 C50,30 30,45 30,45 Z\u0026quot;  fill\u003d\u0026quot;#e74c3c\u0026quot;/\u0026gt;\u003cbr\u003e\u003cbr\u003eCette suite peut semblé abtraite pour un humain, mais heureusement, pas pour une IA ! \u003cbr\u003e\u003cbr\u003eVenez découvrir ou redécouvrir ce format d’image, dans une courte présentation avec de multiples exemples, dont certains généré en live !\u003cbr\u003e","summary":"Cette présentation met en avant la **puissance et la flexibilité du format SVG** pour le web : adaptable, précis et léger en JavaScript. Malgré sa complexité syntaxique, l’IA permet d’en exploiter tout le potentiel. Le talk propose une redécouverte du SVG à travers **démonstrations et générateurs en direct**.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":51,"track":{"id":2760,"name":"Front-end \u0026 UX","description":"Web and mobile engineering: frameworks (Angular, React, Vue), performance, accessibility, design systems, PWAs and client-side integration patterns — including lightweight AI at the edge."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":19296,"firstName":"Ibrahim","lastName":"Renaud","fullName":"Ibrahim Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"développeur"},{"name":"svg"},{"name":"image"},{"name":"javascript"}],"timeSlots":[]},{"id":77076,"title":"Créer un jeu vidéo avec un assistant de code en 3 h","description":"L\u0026#39;objectif de ce workshop est simple : passer de l\u0026#39;idée au jeu fonctionnel en un temps record. Venez découvrir par la pratique comment l\u0026#39;IA vous permet de construire un projet de A à Z, même si vous ne connaissez pas le framework ou le langage (nous utiliserons JavaScript/TypeScript avec Phaser.io).\u003cbr\u003e\u003cbr\u003eOublions les longs tutoriels pour passer en mode Vibe Coding \u0026amp; Spec-Driven! Vous décrivez vos idées et vous pilotez l\u0026#39;IA pour les transformer en code. Ensuite, avec plus de contexte, vous améliorez et contrôlez le code généré. Vous travailler sur plusieurs idées en parallèle en utilisant différents agents. \u003cbr\u003e\u003cbr\u003eAu programme :\u003cbr\u003e\u003cul\u003e\u003cli\u003eIntroduction \u0026amp; Démonstration : Nous préparons le terrain. Apprenez à donner du contexte à Copilot pour obtenir du code propre immédiatement ( Modes : Plan, Agents, Custom, … ).\u003c/li\u003e\u003cli\u003eImplémentation : Place au code ! Seul ou en équipe, développez votre MVP!\u003c/li\u003e\u003cli\u003eDémos \u0026amp; Classements : Nous comparons les jeux, et l’approche utilisée (specs, prompts, …) et nous récompensons les projets les plus créatifs.\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eQue vous soyez senior ou débutant, venez tester vos limites ! Vous allez constater que l\u0026#39;IA pour les développeurs est une réalité qui change radicalement votre façon de travailler.\u003cbr\u003e\u003cbr\u003e","summary":"Ce workshop propose de créer un **jeu fonctionnel en un temps record** grâce à l’IA. En utilisant **JavaScript/TypeScript et Phaser.io**, les participants apprennent à transformer leurs idées en code via le **Vibe Coding** et le **Spec‑Driven**, expérimentant la collaboration avec des agents IA pour concevoir, améliorer et présenter leurs projets.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":83,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":968,"slug":"lab-180","name":"3H Hands-on Lab","duration":180,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"3 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2570,"firstName":"Juliette","lastName":"Moreau","fullName":"Juliette Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":26792,"firstName":"Yanis","lastName":"Dubois","fullName":"Yanis Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":31711,"firstName":"Jade","lastName":"Dubois","fullName":"Jade Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"code"},{"name":"projet"},{"name":"jeu"},{"name":"ia"}],"timeSlots":[]},{"id":9732,"title":"Une porte sans serrure ? Parlons threat modeling","description":"Threat modeling isn’t exactly a new concept, but it has recently become a must-have in product design. With cybersecurity threats on the rise and the pressure to deliver faster, security often ends up on the back burner—usually discovered during QA or, worse, after the code is already out the door. At that point, it’s either a headless-chicken chase to fix things or a recipe for disaster.\u003cbr\u003e\u003cbr\u003eDevelopers are the ones who really know how applications are supposed to work, so security needs to be part of the conversation from the start. Yet, for some reason, threat modeling is still seen as a \u0026quot;cybersecurity expert-only\u0026quot; club.\u003cbr\u003e\u003cbr\u003eIn this talk, I’ll walk through the threat modeling process, highlight key risk concepts, and show how we can all work together to avoid those \u0026quot;oops\u0026quot; moments. Because, honestly, building secure applications is way more fun when we’re all in it together!","summary":"This talk advocates integrating threat modeling into the early stages of product design, involving developers directly rather than leaving it to security experts alone. By demystifying the process and emphasizing collaboration, it aims to prevent security oversights and make building secure applications a shared, proactive effort.","audienceLevel":"INTERMEDIATE","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":53,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":10028,"firstName":"Ibrahim","lastName":"Garnier","fullName":"Ibrahim Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Spain"}],"keywords":[{"name":"threat"},{"name":"security"},{"name":"risk"},{"name":"developers"}],"timeSlots":[]},{"id":4029,"title":"Maternité dans la tech : du témoignage à l\u0027action","description":"Le manque de parité entre hommes et femmes dans le secteur de la tech est un constat largement partagé. Pour y remédier, anticiper et comprendre les besoins des femmes constitue un véritable atout pour mieux les recruter et les fidéliser. À travers mon expérience de femme enceinte, je propose des \u003cstrong\u003estratégies concrètes\u003c/strong\u003e permettant aux entreprises d’accompagner les femmes pendant et après leur congé maternité.\u003cbr\u003eNous aborderons les \u003cstrong\u003edéfis spécifiques rencontrés dans la tech\u003c/strong\u003e, ainsi que des solutions pratiques telles que la création d’espaces sécurisés et de communautés de parents, une communication forte des leaders pour briser les tabous, et des processus RH clairs. Nous explorerons également les pratiques pour un retour au travail réussi : planification de carrière, programmes de mentorat et intégration progressive. Enfin, nous identifierons des leviers d’amélioration comme l’allongement du congé paternité, la formation des managers et la remise en question du présentéisme.\u003cbr\u003eCette intervention s’adresse particulièrement aux \u003cstrong\u003emanagers techniques, équipes RH et People, ainsi qu’aux développeurs\u003c/strong\u003e, car chacun a un rôle à jouer pour bâtir un environnement inclusif et durable.","summary":"Cette intervention propose des stratégies concrètes pour mieux recruter et fidéliser les femmes dans la tech, en s’appuyant sur l’expérience du congé maternité : espaces sécurisés, soutien RH, mentorat, communication inclusive, adaptation du retour au travail et leviers d’amélioration, à destination des managers, RH et développeurs pour plus d’inclusion.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":36,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":3636,"firstName":"Ethan","lastName":"Lefevre","fullName":"Ethan Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"maternité"},{"name":"soutien"},{"name":"retour"},{"name":"entreprise"}],"timeSlots":[]},{"id":2717,"title":"API Security 2026 : comment éviter de finir sur Have I Been Pwned ?","description":"Les attaques sur les APIs explosent, et en 2026, les menaces sont plus sophistiquées que jamais. Entre vols de tokens, attaques par re-jeu et API key exposées sur GitHub, êtes-vous sûr que vos APIs ne finiront pas sur Have I Been Pwned ?\u003cbr\u003e\u003cbr\u003eDans ce talk ultra-concret et sans bullshit, on passe en revue les meilleures pratiques de sécurisation des APIs en 2026 :\u003cbr\u003e✅ OAuth 2.1 : Ce qui change (et pourquoi vous devez vous mettre à jour)\u003cbr\u003e✅ JWT, DPoP, mTLS : Stop aux mauvaises implémentations !\u003cbr\u003e✅ Zero Trust \u0026amp; API Gateways : Faut-il encore faire confiance aux clients ?\u003cbr\u003e✅ Démo live : Comment un token mal sécurisé peut tout casser\u003cbr\u003e\u003cbr\u003eQue vous soyez architecte, dev back ou expert en sécu, venez découvrir comment éviter la fuite de vos données... et votre prochain cauchemar en prod ! 🚀","summary":"Ce talk présente les menaces API actuelles et futures (tokens volés, clés exposées, attaques par re-jeu) et détaille les meilleures pratiques 2026 : mise à jour OAuth 2.1, sécurisation JWT, DPoP, mTLS, approche Zero Trust et API gateways, avec démonstration live des risques et conseils concrets pour se protéger.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":235,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2577,"firstName":"Mehdi","lastName":"Moreau","fullName":"Mehdi Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"sécurité"},{"name":"apis"},{"name":"tokens"},{"name":"oauth"}],"timeSlots":[]},{"id":4006,"title":"Comprendre le prompt injection : techniques, défis et escalade avancée","description":"As developers, we’re embracing AI and large language models (LLMs) in our applications more than ever. However, there’s an increasing concern we need to be aware of: prompt injection. This sneaky attack can undermine our AI systems by manipulating the input to produce unintended outputs.\u003cbr\u003e\u003cbr\u003eIn this session, we’ll break down what prompt injection really means and look at some common techniques attackers use, like instruction overrides and hidden prompts. But we won\u0026#39;t stop there; we’ll also explore advanced challenges, including escalation techniques that can exacerbate the risks.\u003cbr\u003e\u003cbr\u003eMost importantly, we won’t just identify the problem. We’ll dive into practical steps you can take to mitigate these risks and keep your AI interactions secure. Join us at BearConf to gain insights that will help you stay ahead in AI security and ensure your applications remain robust against these emerging threats.\u003cbr\u003e","summary":"This session explores prompt injection attacks in AI and LLM applications, detailing common and advanced techniques used by attackers. It offers practical mitigation strategies to secure AI interactions, helping developers understand and defend against these emerging threats to maintain robust and secure applications.","audienceLevel":"INTERMEDIATE","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":110,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2270,"firstName":"Rayan","lastName":"Moreau","fullName":"Rayan Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Netherlands"}],"keywords":[{"name":"llms"},{"name":"security"},{"name":"ai"},{"name":"injection"}],"timeSlots":[]},{"id":54249,"title":"JWT : maîtrisez la sécurité des jetons sans état","description":"Au travers d\u0026#39;un cas concret - mise en place des recommandations de l\u0026#39;ANSSI pour une intégration FranceConnect+ dans une application répondant aux normes eIDAS, transformez vos JWT de simples conteneurs de données en remparts de sécurité robustes.\u003cbr\u003e\u003cbr\u003eQuand on évoque une façon d\u0026#39;authentifier ses utilisateurs de manière sécurisée, on pense immédiatement à OpenID. Que l\u0026#39;on s\u0026#39;intègre avec les API proposées par Google ou que l\u0026#39;on consomme une solution spécifique IAM, tout cela repose sur l\u0026#39;échange de jetons JWT. Mais, bien que ceux-ci soient devenus le standard de facto pour les authentifications modernes, leur apparente simplicité cache de nombreux pièges de sécurité.\u003cbr\u003e\u003cbr\u003eAttaque sur les algorithmes de signature, fuite de données dans le payload ou encore vol de jeton ? Que cela ne vous parle pas plus que cela, ou que, malheureusement, vous avez déjà rencontré quelques mésaventures, vous repartirez de cette conférence avec des bonnes pratiques à mettre en place pour durcir vos implémentations et ainsi blinder vos applications.","summary":"La présentation illustre, via un cas concret d’intégration FranceConnect+ conforme eIDAS et aux recommandations de l’ANSSI, comment renforcer la sécurité des JWT. Elle expose les vulnérabilités courantes des jetons d’authentification et propose des bonnes pratiques pour durcir les implémentations et fiabiliser les applications modernes.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":197,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":26774,"firstName":"Léa","lastName":"Dubois","fullName":"Léa Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"authentification"},{"name":"sécurité"},{"name":"jwt"},{"name":"anssi"}],"timeSlots":[]},{"id":2729,"title":"Kafka 4 : fantastique ?","description":"Vous l\u0026#39;attendiez, impatiemment, depuis quatre ans et ... ça y est ! \u003cstrong\u003eKafka 4 est là !\u003c/strong\u003e À chaque release majeure, son lot de nouveautés, et on se retrouve pour explorer les évolutions clés, leurs motivations et leurs impacts.\u003cbr\u003e\u003cbr\u003eNous aborderons, entre autres :\u003cbr\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eLa suppression de ZooKeeper\u003c/strong\u003e : le passage à KRaft pour simplifier la gestion et améliorer la scalabilité\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eLe nouveau protocole de rééquilibrage\u003c/strong\u003e : une optimisation des groupes de consommateurs pour plus de stabilité et de performance\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eLes files d\u0026#39;attente \u003c/strong\u003e: une consommation coopérative pour des cas d\u0026#39;usage point-à-point, étendant la polyvalence de Kafka\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eNous détaillerons également les changements nécessaires pour vos applications (producteurs, consommateurs) et clusters : migration de Log4j vers Log4j2, transition de ZooKeeper à KRaft, mise à jour vers Java 11 (clients/Streams) et Java 17 (brokers/Connect/tools).\u003cbr\u003e\u003cbr\u003eVous repartirez avec une compréhension claire des nouveautés de Kafka 4 (incluant 4.1.0 et 4.2.0) et des étapes concrètes pour réussir votre migration, que vous soyez développeur, architecte ou administrateur.","summary":"Cette présentation détaille les principales nouveautés de Kafka 4 : suppression de ZooKeeper au profit de KRaft, nouveau protocole de rééquilibrage, files d’attente coopératives, ainsi que les migrations techniques requises. Elle offre un guide clair pour adopter Kafka 4, destiné aux développeurs, architectes et administrateurs.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":93,"track":{"id":1254,"name":"Data \u0026 Analytics","description":"Data storage, streaming, processing and ML engineering. Topics include data architecture, feature stores, training pipelines, MLOps and scalable analytics workflows."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2584,"firstName":"Alex","lastName":"Lefevre","fullName":"Alex Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"migration"},{"name":"kraft"},{"name":"scalabilité"},{"name":"kafka"}],"timeSlots":[]},{"id":85096,"title":"Écouter la prod comme elle le mérite","description":"For years, the way we monitor and alert on production systems has remained reactive. We define assumptions, set thresholds, and wait for alerts to fire, often too late, too early or too often.As systems grow, this model creates noise, operational toil, and burnout, while still failing to capture what really matters in production.\u003cbr\u003e\u003cbr\u003eIn this talk, we will explore how agentic AI can change the way we approach software reliability. Instead of relying solely on predefined rules and static alerts, AI agents can continuously observe production signals, reason about system behavior, and help engineers detect and understand issues earlier.\u003cbr\u003e\u003cbr\u003eDrawing from real-world SRE experience, we will look at the current bottlenecks of observability and alerting, and how AI agents can assist in identifying problems, surfacing weak signals, and supporting incident analysis. We will also discuss the strengths and limitations of AI agents in reliability systems: where they add real value, where they fall short, and why human expertise remains essential.\u003cbr\u003e\u003cbr\u003eFinally, we will explore what the future of reliability could look like when engineers shift from reacting to alerts to truly listening to production","summary":"This talk reimagines software reliability through agentic AI. Moving beyond static alerts, AI agents can interpret production signals, detect weak issues early, and assist incident analysis. Drawing on SRE experience, it examines observability bottlenecks, the value and limits of AI in reliability, and the evolving partnership between humans and intelligent systems.","audienceLevel":"BEGINNER","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":25,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":89106,"firstName":"Ibrahim","lastName":"Perrin","fullName":"Ibrahim Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"alerts"},{"name":"agents"},{"name":"observability"},{"name":"reliability"}],"timeSlots":[]},{"id":2738,"title":"Un sprint à Tokyo : voyage agile au Japon","description":"Et si l’Agilité n’était pas réservée qu\u0026#39;aux équipes tech ? Et si elle pouvait aussi vous emmener à l’autre bout du monde ?\u003cbr\u003e\u003cbr\u003eEn novembre 2024, un séjour d’un mois au Japon a été préparé. L’objectif : concilier les envies de deux voyageurs aux profils différents, tout en assurant une expérience fluide, équilibrée et mémorable.\u003cbr\u003e\u003cbr\u003eEntre temples zen, trains ultra-ponctuels et ramen brûlants, une pratique a accompagné discrètement tout le voyage : l’Agilité. Les différentes étapes ont été préparées en s’appuyant sur des outils issus de l’agilité : persona, backlog, roadmap, user stories, MVP ou encore rétrospective.\u003cbr\u003e\u003cbr\u003eCette conférence propose un retour d’expérience original sur l’application concrète de pratiques agiles dans un contexte personnel. Une façon accessible et décalée d’illustrer la pertinence de ces outils au-delà des projets numériques.\u003cbr\u003e","summary":"Cette conférence relate l’application concrète des méthodes agiles pour organiser un voyage au Japon, prouvant leur utilité au-delà du secteur tech. À travers outils comme backlog, user stories ou rétrospectives, elle offre un retour d’expérience original et accessible sur l’agilité dans un contexte personnel.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":32,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":3601,"firstName":"Inès","lastName":"Lefevre","fullName":"Inès Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"expérience"},{"name":"outils"},{"name":"agilité"},{"name":"voyage"}],"timeSlots":[]},{"id":7870,"title":"L\u0027ampoule qui en savait trop : au cœur de la sécurité des objets connectés","description":"On allume une ampoule, elle s’allume. Simple, non ?\u003cbr\u003e\u003cbr\u003eEt pourtant, derrière cette lumière se cache un monde fascinant et incroyablement complexe. En partant d’un simple objet du quotidien, ce talk vous emmène dans une expérience de reverse engineering sur une ampoule connectée grand public.\u003cbr\u003e\u003cbr\u003eL’objectif : comprendre comment l’industrie a transformé un petit bout de code qui fait briller une LED en une forteresse numérique bardée de protections.\u003cbr\u003e\u003cbr\u003eEntre secrets enfouis dans le silicium, architectures embarquées et exigences réglementaires telles la RED et la CRA, nous découvrirons que le “S” de l’IoT existe, veut bien dire Sécurité et représente la majorité du code écrit.\u003cbr\u003e\u003cbr\u003eDans un premier temps, nous dresserons le panorama réglementaire actuel afin de montrer en quoi les évolutions en cours rendent indispensables de nouvelles pratiques pour les fabricants et les ingénieurs. Nous analyserons ensuite le code d’une ampoule connectée à travers un exemple simple, avant de dérouler pas à pas une démarche de rétro-ingénierie. Cette progression permettra de comprendre comment se construit la sécurité au cœur des objets connectés.\u003cbr\u003e\u003cbr\u003eCe talk assez technique rest
