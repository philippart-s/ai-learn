 trouver le plus adapté à chaque projet, chaque application, chaque environnement.","summary":"Cette présentation démystifie les nombreux Garbage Collectors de Java, leurs évolutions et leurs différences (comme ZGC et Shenandoah). Elle explique pourquoi plusieurs GCs coexistent, comment choisir le plus adapté selon les besoins, et pourquoi la question du GC reste complexe et non résolue dans l’écosystème Java.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":92,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":25806,"firstName":"Mehdi","lastName":"Renaud","fullName":"Mehdi Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"zgc"},{"name":"java"},{"name":"performance"},{"name":"gc"}],"timeSlots":[]},{"id":26810,"title":"L\u0027IA dans le cycle de vie du logiciel : opportunités et limites","description":"L\u0026#39;intelligence artificielle ne se contente plus d\u0026#39;assister les développeurs : elle transforme chaque maillon de la chaîne logicielle. De la rédaction des spécifications jusqu\u0026#39;au monitoring en production, en passant par la génération de code, les tests et le déploiement, l\u0026#39;IA redessine concrètement le cycle de vie applicatif.\u003cbr\u003e\u003cbr\u003eNous intégrons ces outils pour rendre nos équipes plus efficaces et améliorer nos applications. En tant que banque, être un partenaire de confiance fait partie de notre ADN : nous adoptons l\u0026#39;IA avec la même exigence.\u003cbr\u003e\u003cbr\u003eA travers notre expérience au Crédit Agricole, nous vous proposons de voir :\u003cbr\u003e\u003cul\u003e\u003cli\u003eles approches qui peuvent être intégrées dans les chaînes de développement\u003c/li\u003e\u003cli\u003eles pratiques qui changent la façon de construire des applications\u003c/li\u003e\u003cli\u003eles difficultés qui peuvent être rencontrées et les pistes explorées pour y faire face\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eVous repartirez avec des repères concrets et des leviers utiles pour accélérer l\u0026#39;adoption de l\u0026#39;IA dans votre delivery.","summary":"L’IA transforme l’ensemble du cycle de vie logiciel, de la conception au déploiement. À partir de l’expérience d’une grande banque, cette présentation partage approches, pratiques et enseignements pour intégrer l’IA dans les chaînes de développement et améliorer l’efficacité des équipes grâce à des outils concrets et des retours terrain.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":187,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":12036,"firstName":"Juliette","lastName":"Garnier","fullName":"Juliette Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":19297,"firstName":"Alice","lastName":"Renaud","fullName":"Alice Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":31714,"firstName":"Adam","lastName":"Dubois","fullName":"Adam Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"développement"},{"name":"automatisation"},{"name":"innovation"},{"name":"ia"}],"timeSlots":[]},{"id":26807,"title":"Rust officiellement sur AWS Lambda : du from-scratch aux bindings progressifs","description":"Il y a quelques mois, AWS a \u003cstrong\u003eofficiellement\u003c/strong\u003e ajouté Rust aux runtimes de Lambda, soulignant ses hautes \u003cstrong\u003eperformances\u003c/strong\u003e, sa \u003cstrong\u003esécurité \u003c/strong\u003eet la \u003cstrong\u003ematurité\u003c/strong\u003e de son tooling pour des applications \u003cstrong\u003eserverless modernes\u003c/strong\u003e.\u003cbr\u003e\u003cbr\u003eChez \u003cstrong\u003e\u003cem\u003eBetclic\u003c/em\u003e\u003c/strong\u003e, nous avons fait le pari des Lambda Rust depuis plusieurs années, avec des résultats sans précédent : migrer une Lambda critique de Python vers Rust a \u003cstrong\u003edivisé par 8 ses temps d’exécution\u003c/strong\u003e et fortement réduit les coûts.\u003cbr\u003e\u003cbr\u003eÉcrire une Lambda Rust from scratch est aujourd’hui \u003cstrong\u003esimple et rapide\u003c/strong\u003e, dans ce tools-in-action, nous développerons et déploierons une Lambda Rust complète avec \u003cstrong\u003eCargo Lambda.\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003eMais tout le monde ne peut pas — ou ne veut pas — tout réécrire.\u003cbr\u003e\u003cbr\u003eLa seconde partie du talk explorera une autre facette de Rust sur Lambda : \u003cstrong\u003el’intégration progressive via des bindings\u003c/strong\u003e. \u003cbr\u003eÀ l’aide de bibliothèques comme \u003cstrong\u003ePyO3\u003c/strong\u003e (Python), \u003cstrong\u003enapi-rs\u003c/strong\u003e (JavaScript), \u003cstrong\u003eJNI\u003c/strong\u003e (Java/Kotlin) ou \u003cstrong\u003ecsbindgen\u003c/strong\u003e (C#), nous verrons comment \u003cstrong\u003eintégrer du Rust dans des Lambdas existantes\u003c/strong\u003e afin de bénéficier de ses performances là où cela compte vraiment.\u003cbr\u003e\u003cbr\u003eUn talk orienté outils, démos et code, pour découvrir comment Rust peut améliorer vos Lambdas — \u003cstrong\u003eque vous partiez de zéro ou que vous cherchiez à optimiser l’existant\u003c/strong\u003e.","summary":"AWS propose désormais Rust pour Lambda, offrant hautes performances et sécurité. Chez Betclic, migrer une Lambda de Python à Rust a réduit par 8 les temps d’exécution. Cette présentation montre comment développer une Lambda Rust complète et intégrer Rust progressivement dans des Lambdas existantes via des bindings, pour optimiser les performances.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":30,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":25804,"firstName":"Samir","lastName":"Renaud","fullName":"Samir Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"lambda"},{"name":"intégration"},{"name":"performances"},{"name":"rust"}],"timeSlots":[]},{"id":9703,"title":"Comment la Petite Souris gère ses milliards de dents grâce à TimescaleDB","description":"Gérer des milliards d\u0026#39;événements temporels en production IoT, ce n\u0026#39;est pas un conte de fées. Pourtant, avec TimescaleDB, ça peut devenir étonnamment simple.\u003cbr\u003eÀ travers la métaphore de la Petite Souris qui collecte des milliers de dents chaque nuit, je vous propose de découvrir TimescaleDB en action : de la mise en place aux optimisations avancées, en passant par la compression et les continuous aggregates, le tout en démo live avec de vraies données.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eAu programme :\u003c/strong\u003e\u003cbr\u003e\u003cul\u003e\u003cli\u003eMise en place et configuration des hypertables\u003c/li\u003e\u003cli\u003eRequêtes temporelles optimisées avec time_bucket\u003c/li\u003e\u003cli\u003eCompression automatique et retention policies\u003c/li\u003e\u003cli\u003eContinuous aggregates pour des agrégations ultra-rapides\u003c/li\u003e\u003cli\u003eRetour d\u0026#39;expérience : 7 ans en production chez Karnott (IoT agricole, 37 milliards de données temporelles, millions de requêtes quotidiennes)\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eQue vous débutiez avec TimescaleDB ou cherchiez à optimiser votre setup existant, vous repartirez avec des patterns concrets et éprouvés en production.","summary":"Ce talk présente, via une métaphore ludique, la gestion efficace de milliards d’événements IoT avec TimescaleDB : configuration, hypertables, requêtes optimisées, compression, continuous aggregates, et retour d’expérience sur 7 ans de production. Des solutions concrètes et éprouvées pour tout niveau d’utilisation sont proposées.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":29,"track":{"id":1254,"name":"Data \u0026 Analytics","description":"Data storage, streaming, processing and ML engineering. Topics include data architecture, feature stores, training pipelines, MLOps and scalable analytics workflows."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":7399,"firstName":"Louise","lastName":"Garnier","fullName":"Louise Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"iot"},{"name":"timescaledb"},{"name":"hypertables"},{"name":"compression"}],"timeSlots":[]},{"id":161701,"title":"Sécuriser code et supply chain : le REX d\u0027un grand opérateur postal","description":"Vos développeurs utilisent des LLM. Vos attaquants aussi. La question n\u0026#39;est plus de l\u0026#39;autoriser ou de l\u0026#39;interdire — c\u0026#39;est de concevoir une software factory qui reste maîtrisée dans les deux cas.\u003cbr\u003eRetour d\u0026#39;expérience concret chez Docaposte sur une approche Human first, LLM proof : partir des usages réels plutôt que de les nier, et bâtir un système robuste que le contenu soit généré par vos équipes, vos partenaires ou vos adversaires. Quatre axes opérationnels — isolation, sanitation, supply chain, auditabilité — une architecture déployée, des décisions assumées, un incident réel.\u003cbr\u003eVous repartirez avec une grille applicable. Pas une posture : un système.\u003cbr\u003e\u003cbr\u003ePour : architectes, platform engineers, DevSecOps, engineering managers.","summary":"Docaposte présente un retour d’expérience sur une software factory « Human first, LLM proof », conçue pour rester maîtrisée face aux usages des LLM par les développeurs comme par les attaquants. Quatre axes : isolation, sanitation, supply chain et auditabilité, avec architecture déployée et incident réel.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":16,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":161402,"firstName":"Rayan","lastName":"Da Silva","fullName":"Rayan Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"llm"},{"name":"supply chain"},{"name":"cybersécurité"},{"name":"auditabilité"}],"timeSlots":[]},{"id":22590,"title":"De l\u0027éco-volontariat à la promo de mon side project en Australie","description":"Comment une mission d’éco-volontariat sur un atoll paradisiaque peut transformer un développeur mobile et donner naissance à un projet qui fera le tour du monde ?\u003cbr\u003e\u003cbr\u003eJe vous propose de découvrir mon parcours atypique, des plages de Tetiaroa en Polynésie où j\u0026#39;ai effectué le suivi des sites de pontes des tortues marines jusqu’en Australie où mon application “We Spot Turtles!” a été mise en avant dans la campagne #WeArePlay de Google.\u003cbr\u003e\u003cbr\u003eCette aventure reste avant tout une histoire humaine, celle d’un side-project né d’une passion, développé sur mon canapé entre deux missions freelance, qui grandit et devient un outil concret de protection de la biodiversité marine.\u003cbr\u003e\u003cbr\u003eAu travers de ce talk je vous ferais part de :\u003cbr\u003e\u003cul\u003e\u003cli\u003eComment passer d’une expertise technique à un projet à impact\u003c/li\u003e\u003cli\u003eLes difficultés et doutes qui jalonnent la route\u003c/li\u003e\u003cli\u003eL’ importance de la communauté et des rencontres qui font vivre le projet\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eDéveloppeuse et développeur en quête de sens à donner à vos compétences, ou curieuse et curieux de découvrir comment un side-project peut vous amener bien plus loin que prévu, cette présentation vous montrera qu’il est possible de concilier passion, impact social, et développement professionnel.","summary":"Ce talk retrace comment une mission d’éco-volontariat a inspiré la création d’une application mobile internationale pour la protection des tortues marines, illustrant le parcours d’un développeur passionné, les défis rencontrés, l’importance de la communauté et la possibilité de concilier expertise technique, impact social et développement professionnel.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":11,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":22487,"firstName":"Maya","lastName":"Renaud","fullName":"Maya Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"impact"},{"name":"éco-volontariat"},{"name":"tortues"},{"name":"passion"}],"timeSlots":[]},{"id":51601,"title":"L\u0027agentic coding, nouvelle frontière du Platform Engineering","description":"100% d\u0026#39;adoption des outils IA de code par nos 600 ingénieurs. Mission accomplie ? Pas tout à fait. Aujourd’hui, les organisations techniques doivent répondre aux problématiques liées à l’agentic coding et soigner l’expérience développeur, qui se trouve profondément transformée.\u003cbr\u003e\u003cbr\u003eEn tant que Staff SRE et Senior Software Engineer dans l\u0026#39;équipe AI Scaling chez Doctolib, nous allons vous raconter comment nous avons construit une plateforme IA ouverte aux contributions.\u003cbr\u003e\u003cbr\u003eCe talk s\u0026#39;adresse aux engineering managers, tech leads et équipes plateforme qui ont déployé des outils IA pour les ingénieurs. Vous apprendrez :\u003cbr\u003e\u003cul\u003e\u003cli\u003eLes sujets identifiés avec nos utilisateur-ices comme potentiels candidats à la plateforme, et les réponses apportées\u003c/li\u003e\u003cli\u003eLes services et outils concrets de cette plateforme, notamment les principes d\u0026#39;une architecture de plugins extensible par les équipes métier\u003c/li\u003e\u003cli\u003eQuelles métriques suivre au-delà du taux d\u0026#39;adoption\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eNous partagerons aussi nos échecs et les réalités d\u0026#39;une adoption qui reste inégale.\u003cbr\u003e\u003cbr\u003eCe n’est pas un talk sur l’IA, mais bien sur les nouveaux challenges des équipes plateforme à l’heure du développement assisté par des agents IA.\u003cbr\u003e","summary":"Ce talk de **Doctolib** présente la création d’une plateforme IA collaborative pour 600 ingénieurs, au‑delà du simple taux d’adoption. Il aborde l’**agentic coding**, l’expérience développeur, une architecture de plugins extensible, les métriques pertinentes et les défis réels rencontrés par les équipes plateforme.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":166,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":38021,"firstName":"Gabriel","lastName":"Dubois","fullName":"Gabriel Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":51501,"firstName":"Juliette","lastName":"Dubois","fullName":"Juliette Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"développeur"},{"name":"plateforme"},{"name":"adoption"},{"name":"ia"}],"timeSlots":[]},{"id":12060,"title":"Votre entreprise est-elle prête à devenir bionique ?","description":"\u003cstrong\u003eRésumé court :\u003c/strong\u003e Ne cherchez plus 5% de gain, visez x10. Découvrez comment l\u0026#39;agentique transforme l\u0026#39;entreprise en une entité bionique : Humain + Technologie.\u003cbr\u003e\u003cbr\u003eL\u0026#39;IA est un shift identique à l\u0026#39;arrivée de l\u0026#39;écriture. Il est désormais possible de passer de l\u0026#39;idée à une application sur téléphone en 10\u0026#39;. Mais sommes-nous prêts pour le changement de paradigme organisationnel ? Nous explorons le concept de \u003cstrong\u003el\u0026#39;entreprise bionique\u003c/strong\u003e à l\u0026#39;horizon 2030. Loin de la déshumanisation crainte, ce modèle propose une fusion \u0026quot;Humain + Technologie\u0026quot; où l\u0026#39;automatisation libère la créativité et l\u0026#39;empathie. À travers cas concrets et analyse des impacts financiers, nous expliquons pourquoi il faut arrêter de chercher des gains de 5% pour viser une efficacité multipliée par 10.\u003cbr\u003e\u003cstrong\u003eTrois piliers de la transformation sont abordés\u003c/strong\u003e\u003cbr\u003e\u003col\u003e\u003cli\u003e\u003cstrong\u003eL\u0026#39;impact cognitif et sociétal :\u003c/strong\u003e le \u0026quot;monopsychisme technologique\u0026quot; et l\u0026#39;externalisation de l\u0026#39;expertise vers une mémoire ubiquitaire.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eLa révolution \u0026quot;AI4*\u0026quot; :\u003c/strong\u003e l\u0026#39;IA redéfinit les métiers de l\u0026#39;IT (AI4Dev, AI4Ops, AI4UX) en permettant, par exemple, à un agent autonome de gérer le support N1 ou de générer des dashboards complexes instantanément.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eLe SI cognitif :\u003c/strong\u003e passage à l\u0026#39;interface conversationnelle\u003c/li\u003e\u003c/ol\u003e","summary":"Cette présentation explore l’entreprise bionique, fusionnant humain et technologie grâce à l’IA, pour viser une efficacité décuplée d’ici 2030. À travers cas concrets, elle analyse impacts cognitifs, révolution des métiers IT et interfaces conversationnelles, invitant à repenser l’organisation plutôt que de chercher de modestes gains incrémentaux.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":64,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":12009,"firstName":"Gabriel","lastName":"Garnier","fullName":"Gabriel Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":153152,"firstName":"Sofia","lastName":"Da Silva","fullName":"Sofia Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"agentique"},{"name":"automatisation"},{"name":"bionique"},{"name":"ia"}],"timeSlots":[]},{"id":26841,"title":"L\u0027expérience développeur pilotée par la CLI : l\u0027ingrédient secret d\u0027une équipe alignée","description":"Comment fait-on collaborer efficacement des développeurs backend, des SREs, des ingénieurs Infra, et un nouveau venu qui ne jure que par Bash… Le tout réparti sur aux quatre coins de la France, sans sombrer dans le chaos ? \u003cbr\u003e\u003cbr\u003eEn créant un langage commun. Et ce langage, ce fut… \u003cstrong style\u003d\"color: rgb(35, 3, 61);\"\u003e\u003cu\u003eune CLI\u003c/u\u003e\u003c/strong\u003e. \u003cbr\u003e\u003cbr\u003eDans ce talk, je vous raconte comment un simple outil en ligne de commande, taillé sur-mesure pour notre stack et nos équipes, est devenu l’interface préférée des contributeurs pour interagir avec notre plateforme cloud. Pas de surcouche magique, pas de YAML ésotérique, pas de framework dernier cri. \u003cbr\u003e\u003cbr\u003eOn parlera de : \u003cbr\u003e\u003cul\u003e\u003cli\u003ePourquoi une CLI peut être plus puissante qu’un portail self-service\u003c/li\u003e\u003cli\u003eComment elle a aidé à aplanir la courbe d’apprentissage sans infantiliser personne \u003c/li\u003e\u003cli\u003eLes pièges qu’on a évités… et ceux dans lesquels on a sauté à pieds joints \u003c/li\u003e\u003cli\u003eCe que ça a changé dans notre culture d’équipe : contribution, confiance, clarté \u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eCe retour d’expérience vous montrera comment une CLI peut devenir un véritable levier d’alignement et d’efficacité collective, en particulier dans les environnements contraints où la plateforme évolue vite… mais pas les effectifs.","summary":"Ce talk raconte comment la création d’une CLI personnalisée est devenue le langage commun entre développeurs, SRE et ingénieurs répartis à distance. À travers un retour d’expérience, il montre comment cet outil a simplifié la collaboration, favorisé l’autonomie et renforcé la culture d’équipe sans complexifier la plateforme.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":121,"track":{"id":1251,"name":"Architecture \u0026 Design","description":"Designs, trade-offs and real-world decisions for building maintainable systems. Case studies, system evolution (monolith→services), DDD, event-driven approaches, resilience and architectural anti-patterns."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":5544,"firstName":"Idris","lastName":"Lefevre","fullName":"Idris Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"collaboration"},{"name":"efficacité"},{"name":"plateforme"},{"name":"cli"}],"timeSlots":[]},{"id":7851,"title":"La revanche des VMs : le sandboxing avec NerdBox","description":"Alors qu\u0026#39;ils ont radicalement bouleversé notre façon de concevoir le déploiements des applications, les containers sont aujourd\u0026#39;hui considérés comme un \u0026quot;commodité\u0026quot;, un détail d\u0026#39;implémentation. Le runtime qui leur permet de tourner n\u0026#39;intéresse que les experts lors de débats enflammés autour d\u0026#39;une pinte.\u003cbr\u003e\u003cbr\u003ePourtant les choses continuent d\u0026#39;évoluer. Si on pourrait croire que l\u0026#39;architecture de Docker n\u0026#39;a pas changé depuis 10 ans, en réalité de nombreux composants évoluent pour assurer performance, flexibilité et sécurité renforcée. Par ailleurs, de nouveaux besoins apparaissent: avec la déferlante des agents IA, être en mesure de fournir un environment sans restriction tout en préservant son système hôte est devenu une nécessité.\u003cbr\u003e\u003cbr\u003eJe vais vous présenter dans les grandes lignes les nouveautés de containerd 2.2 avant de m\u0026#39;attarder sur le tout nouveau projet \u003cstrong\u003eNerdBox\u003c/strong\u003e qui permet de gérer des sandbox à base de microVM avec la simplicité des containers ... et -- cerise sur le gâteau -- sans avoir besoin d\u0026#39;être root 🤩","summary":"Les containers évoluent au-delà de leur statut de commodité, avec des avancées comme containerd 2.2 et NerdBox. Ce nouveau projet facilite la gestion de sandbox sécurisées via microVM, tout en gardant la simplicité des containers et sans privilèges root, répondant ainsi aux nouveaux besoins liés aux agents IA.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":65,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":5527,"firstName":"Juliette","lastName":"Lefevre","fullName":"Juliette Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"containers"},{"name":"nerdbox"},{"name":"containerd"},{"name":"microvm"}],"timeSlots":[]},{"id":41355,"title":"BOF Duchess France : table ronde « apprendre en continu sans s\u0027épuiser »","description":"Le BOF Duchess France est de retour ! Que vous soyez un homme, une femme, un.e développeur.se, un.e tech lead, une personne non technique ... vous êtes les bienvenu.e.s !\u003cbr\u003eDuchess France est avant tout une communauté de développeuses/femmes travaillant dans la tech, passionnées qui organisent des événements techniques destinés à tous et à toutes sur diverses technologies pour apprendre, partager des connaissances et étoffer son réseau.\u003cbr\u003eD\u0026#39;autre part, l\u0026#39;une des missions de Duchess est de voir plus de femmes animer des conférences. Pour cela nous organisons des ateliers de préparation aux Call For Papers, et des sessions de coaching pour répéter les présentations.\u003cbr\u003eCette année, nous vous proposons une table ronde autour du thème \u0026quot;Apprendre en permanence sans s\u0026#39;épuiser\u0026quot;. Comment continuer à se former dans un secteur en évolution constante, sans que ça devienne une source de pression ? Comment faire le tri, poser des limites et trouver un rythme qui tient dans la durée ?\u003cbr\u003eQuatre femmes aux parcours variés viendront partager leurs expériences et stratégies concrètes.","summary":"Duchess France revient avec une table ronde sur « Apprendre en permanence sans s’épuiser ». Quatre femmes de la tech partageront leurs अनुभव et stratégies pour se former durablement, gérer la pression, fixer des limites et trouver un rythme soutenable dans un secteur en évolution constante.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":40,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":954,"slug":"bof-60","name":"BOF","duration":55,"pause":false,"freeTickets":0,"minSpeakers":1,"description":"Informal sessions of one hour, where like minded people get together and discuss technology.","cssColor":"#ffb8fd","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":41304,"firstName":"Anaïs","lastName":"Dubois","fullName":"Anaïs Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":51503,"firstName":"Samir","lastName":"Dubois","fullName":"Samir Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":51549,"firstName":"Inès","lastName":"Marchand","fullName":"Inès Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"communauté"},{"name":"technologie"},{"name":"partage"},{"name":"conférences"}],"timeSlots":[]},{"id":65304,"title":"Hackez la due diligence : 70 jours-homme économisés grâce à un agent CLI","description":"Si vous êtes prestataire pour des banques ou de grands comptes, vous connaissez l\u0026#39;enfer des questionnaires de sécurité. Des fichiers Excel de 200 questions, répétitifs et chronophages. \u003cbr\u003eChez QuickSign, avec une cinquantaine de clients, cette charge administrative représentait \u003cstrong\u003e60 à 75 jours-homme par an\u003c/strong\u003e. C\u0026#39;est \u003cstrong\u003e34% d\u0026#39;un ETP\u003c/strong\u003e sacrifié à faire du \u0026quot;remplissage\u0026quot; de cases plutôt que de la vraie cyberdéfense ou de l\u0026#39;implémentation ISO 27001.\u003cbr\u003eJ\u0026#39;ai décidé d\u0026#39;automatiser ce processus pour récupérer ce temps précieux. Dans ce talk, je vous montre comment nous utilisons \u003cstrong\u003egemini-cli\u003c/strong\u003e pour industrialiser nos réponses.\u003cbr\u003eAu programme :\u003cbr\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eLa méthode :\u003c/strong\u003e Comment structurer sa base documentaire (PSSI, audits) pour que l\u0026#39;IA maîtrise votre contexte.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eL\u0026#39;outil :\u003c/strong\u003e Démo de l\u0026#39;utilisation de \u003ccode\u003egemini-cli\u003c/code\u003e pour scripter et automatiser le traitement par lots.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eLe résultat :\u003c/strong\u003e Comment nous avons drastiquement réduit la charge de travail tout en améliorant la cohérence et la qualité des réponses fournies aux auditeurs.\u003c/li\u003e\u003c/ul\u003eNe perdez plus votre vie sur Excel. Venez voir comment l\u0026#39;IA générative devient votre meilleure alliée conformité.","summary":"QuickSign automatise les fastidieux questionnaires de sécurité bancaires grâce à **gemini‑cli**. Le talk détaille la structuration documentaire pour contextualiser l’IA, la mise en œuvre du scripting et l’automatisation des réponses. Résultat : une forte réduction de la charge administrative et une meilleure cohérence des réponses en conformité et cybersécurité.","audienceLevel":"ADVANCED","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":21,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":65154,"firstName":"Idris","lastName":"Marchand","fullName":"Idris Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"sécurité"},{"name":"automatisation"},{"name":"ia"},{"name":"conformité"}],"timeSlots":[]},{"id":32137,"title":"Chrome DevTools en MCP : donnez des yeux à votre IA","description":"L\u0026#39;IA est utile dans beaucoup de cas, mais dès qu\u0026#39;on touche au frontend web, c\u0026#39;est la galère. Vous vous retrouvez à faire des allers-retours entre votre navigateur et votre assistant de code qui ne voit rien de ce qui se passe côté browser.\u003cbr\u003e\u003cbr\u003eDans cette session Tools-in-Action, je vous montre le MCP Chrome DevTools qui révolutionne le développement frontend en donnant enfin des yeux à votre IA. Votre agent IA peut désormais voir ce qui se passe dans votre navigateur, analyser les performances en temps réel, inspecter les requêtes réseau, faire des screenshots, et naviguer dans votre application.\u003cbr\u003e\u003cbr\u003eAu programme sur une vrai application React/Next.js : traquer et fixer un bug via le navigateur, profiler et résoudre un problème de performance, et corriger un layout responsive. Le tout sans quitter l\u0026#39;IDE.\u003cbr\u003e\u003cbr\u003eFini les interactions à l\u0026#39;aveugle pour votre IA : votre agent voit ce que vous voyez !","summary":"Le MCP Chrome DevTools donne enfin des “yeux” à l’IA pour le développement frontend : inspection du navigateur, analyse des performances, requêtes réseau, screenshots et navigation. Démo sur une app React/Next.js pour corriger un bug, optimiser les performances et ajuster le responsive, sans quitter l’IDE.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":116,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":19293,"firstName":"Noé","lastName":"Renaud","fullName":"Noé Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"performance"},{"name":"navigateur"},{"name":"frontend"},{"name":"ia"}],"timeSlots":[]},{"id":9701,"title":"Appliquer (enfin) l\u0027article 25 du RGPD avec PostgreSQL Anonymizer","description":"Quelles sont les données sensibles stockées ? Qui en a l\u0026#39;accès ? Ou partent-elles ? Comment effacer les données d\u0026#39;un utilisateur réclamant son droit à l\u0026#39;oubli ? Comment tester avec les données de prod ? Comment accéder à la base de données sans exposer les données sensibles ?\u003cbr\u003eTant de questions qui se posent trop tard, une fois l\u0026#39;application en production parce qu\u0026#39;on n\u0026#39;a pas respecté l\u0026#39;article 25 du RGPD : \u003cstrong style\u003d\"color: oklch(0.21 0.034 264.665); background-color: rgb(255, 255, 255);\"\u003ela protection des données personnelles dès la conception\u003c/strong\u003e.\u003cbr\u003e\u003cstrong style\u003d\"color: oklch(0.21 0.034 264.665); background-color: rgb(255, 255, 255);\"\u003ePostgreSQL Anonymizer\u003c/strong\u003e a été conçu pour faire du \u0026quot;\u003cem style\u003d\"color: oklch(0.373 0.034 259.733); background-color: rgb(255, 255, 255);\"\u003eprivacy by design\u003c/em\u003e\u0026quot; et de l\u0026#39;anonymisation \u0026quot;\u003cem style\u003d\"color: oklch(0.373 0.034 259.733); background-color: rgb(255, 255, 255);\"\u003eas code\u003c/em\u003e\u0026quot; de la manière la plus simple qui soit.\u003cbr\u003e\u003cstrong style\u003d\"color: oklch(0.21 0.034 264.665); background-color: rgb(255, 255, 255);\"\u003eEn sortant de cette conférence :\u003c/strong\u003e\u003cbr\u003e\u003cul\u003e\u003cli\u003evous n\u0026#39;aurez plus d\u0026#39;excuses pour reporter la considération de données personnelles à plus tard\u003c/li\u003e\u003cli\u003evous constaterez a quel point il est facile d\u0026#39;installer et d\u0026#39;utiliser cette extension PostgreSQL répondant à tous les besoins de protection des données personnelles\u003c/li\u003e\u003cli\u003evous pourrez donner un accès direct à la base de prod à tout le monde sans exposer les données sensibles\u003c/li\u003e\u003c/ul\u003e","summary":"Cette conférence présente **PostgreSQL Anonymizer**, une extension facilitant l’anonymisation « as code » et le **privacy by design**. Elle montre comment protéger les données personnelles dès la conception, respecter le **RGPD (article 25)**, tester en sécurité sur la production et accorder des accès sans exposer d’informations sensibles.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":93,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":7397,"firstName":"Adam","lastName":"Garnier","fullName":"Adam Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"données"},{"name":"anonymisation"},{"name":"postgresql"},{"name":"rgpd"}],"timeSlots":[]},{"id":160251,"title":"Café BearConf édition 2026","description":"C\u0026#39;est en confrontant vos idées avec celles des autres que vous en tirerez une synthèse plus profonde. Le Café BearConf est une auberge espagnole, dans laquelle chacun est libre d\u0026#39;exprimer ses réflexions et de faire sienne celles des autres. Venez écouter pour vous faire une idée (ou plusieurs), et participez, parce que : pourquoi pas !\u003cbr\u003eSujets abordés : les thèmes des keynotes servent souvent de points de départ, mais rien n\u0026#39;est figé quand le geek se met à philosopher, alors n\u0026#39;hésitez pas à venir avec vos envies à partager. Des sandwichs seront à disposition sur place pour faciliter la pause midi.","summary":"Le Café BearConf invite à échanger librement autour de réflexions inspirées des keynotes. Chacun partage ses idées pour en tirer des synthèses plus profondes, dans une ambiance conviviale et ouverte, propice à la philosophie et à la curiosité — le tout agrémenté d’un moment de partage autour d’un repas.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":20,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":20902,"slug":"caféBearConf","name":"Café BearConf","duration":105,"pause":false,"invitationOnly":true,"freeTickets":2,"minSpeakers":1,"description":"When IT meets Philosophy","cssColor":"#77edd9","countInQuota":false,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":160003,"firstName":"Jade","lastName":"Da Silva","fullName":"Jade Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":160004,"firstName":"Adam","lastName":"Da Silva","fullName":"Adam Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"partage"},{"name":"réflexion"},{"name":"échange"},{"name":"philosophie"}],"timeSlots":[]},{"id":2749,"title":"Concevoir une IA de jeu vidéo par apprentissage par renforcement","description":"\u003cstrong\u003e\u0026quot;Programmez un objectif, pas des règles.\u0026quot;\u003c/strong\u003e C\u0026#39;est la promesse de l\u0026#39;apprentissage par renforcement. Vous définissez ce qui vaut des points, l\u0026#39;IA trouve toute seule comment en marquer.\u003cbr\u003ePendant plusieurs mois, j\u0026#39;ai mis cette promesse à l\u0026#39;épreuve sur un jeu de palet fonte/laiton sur planche bois/plomb, en entraînant une IA à jouer contre un adversaire humain — sans lui coder une seule règle de stratégie.\u003cbr\u003eDans ce talk, je vous raconte le vrai parcours :\u003cbr\u003e\u003cul\u003e\u003cli\u003eComment une IA apprend, avec 3 cerveaux qui collaborent\u003c/li\u003e\u003cli\u003eLes 3 approches que j\u0026#39;ai enchaînées — chacune résolvant le problème de la précédente, chacune en créant un nouveau\u003c/li\u003e\u003cli\u003eLe \u0026quot;piège de l\u0026#39;imitation de soi-même\u0026quot; : quand une IA qui s\u0026#39;entraîne contre elle-même finit par ne plus jouer qu\u0026#39;un seul coup\u003c/li\u003e\u003c/ul\u003eAvec du vrai code, des démos live, et un message qui dépasse le jeu vidéo : \u003cstrong\u003el\u0026#39;IA optimise ce qu\u0026#39;on lui demande, pas ce qu\u0026#39;on veut\u003c/strong\u003e.\u003cbr\u003ePour les développeurs curieux d\u0026#39;explorer l\u0026#39;IA dans les jeux vidéo, avec démos concrètes et conseils pratiques pour lancer vos propres projets RL.","summary":"Découvrez la conception d’une IA jouant à un jeu de palet grâce à l’apprentissage par renforcement et à l’architecture Actor-Critic. Le talk détaille l’implémentation technique, les défis rencontrés et les résultats, avec conseils pratiques pour développer des IA similaires dans les jeux vidéo à actions continues.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":88,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":3611,"firstName":"Lucas","lastName":"Lefevre","fullName":"Lucas Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"apprentissage"},{"name":"intelligence"},{"name":"jeu"},{"name":"neurones"}],"timeSlots":[]},{"id":149103,"title":"L\u0027IA face au défi de la condition humaine","description":"Les approches philosophiques traditionnelles conditionnent la plénitude, la sérénité et le bonheur à un \u003cstrong\u003etravail sur soi\u003c/strong\u003e, à une ascèse et à un effort long et douloureux. L’IA semble nous offrir tout cela à moindre coût, presque gratuitement.\u003cbr\u003e\u003cstrong\u003eLes promesses du futur :\u003c/strong\u003e\u003cbr\u003e\u003cul\u003e\u003cli\u003eUne vie de paresse facilitée par l\u0026#39;automatisation.\u003c/li\u003e\u003cli\u003eUn allongement quasiment infini de l’existence et la fin des maladies.\u003c/li\u003e\u003cli\u003eLa survie au-delà de nos \u003cstrong\u003ecorps biologiques\u003c/strong\u003e, au cœur de processeurs informatiques ou sur des corps d’emprunt.\u003c/li\u003e\u003c/ul\u003eNous passerons en revue ces annonces en nous demandant si elles sont \u003cstrong\u003evraisemblables\u003c/strong\u003e et si elles comblent réellement les aspirations humaines. L’\u003cstrong\u003eennui\u003c/strong\u003e ne nous guettera-t-il pas ?\u003cbr\u003eEn mettant en regard la condition humaine des sociétés passées avec la nôtre, à l’heure du numérique, nous examinerons les nouvelles possibilités de \u003cstrong\u003eréalisation de soi\u003c/strong\u003e qui s’offrent désormais à chacun, en tant qu’individus, en deçà du \u0026quot;nirvana numérique\u0026quot;.","summary":"La présentation interroge les promesses d’une IA libérant l’humain de l’effort : confort, immortalité, conscience numérique. En confrontant ces visions aux aspirations humaines et aux sociétés passées, elle questionne leur vraisemblance et explore d’autres voies de réalisation de soi, en deçà du fantasme d’un « nirvana numérique ».","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":285,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":955,"slug":"keynote-25","name":"Keynote","duration":25,"pause":false,"invitationOnly":true,"freeTickets":2,"minSpeakers":1,"description":"Invitation only: Inspiring and thought provoking keynotes of 20 minutes.","cssColor":"#c8b0d4","scheduleInSmallRoom":false,"countInQuota":false,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":148902,"firstName":"Romane","lastName":"Perrin","fullName":"Romane Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"humanité"},{"name":"bonheur"},{"name":"automatisation"},{"name":"philosophie"}],"timeSlots":[]},{"id":5582,"title":"Créer son propre jeu de rôle en agentic AI avec Strands Agents","description":"Viens coder un Maître du jeu (MJ) qui sera chargé d\u0026#39;orchestrer plusieurs agents IA, chacun spécialisé dans une tâche particulière.\u003cbr\u003e\u003cbr\u003eOn y verra des concepts comme les agent tools, le protocole MCP (Model Context Protocol), A2A (Agent to Agent) et RAG (Retrieval-augmented generation) afin de créer des agents et/ou serveurs MCP qui tirent les dés, vérifient les règles de DnD, et génèrent l\u0026#39;histoire au fur et à mesure.\u003cbr\u003e\u003cbr\u003eQue tu sois fan de jeu de rôle ou non, il y aura des choses à apprendre pendant le workshop :)","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":83,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":968,"slug":"lab-180","name":"3H Hands-on Lab","duration":180,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"3 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2257,"firstName":"Lucas","lastName":"Moreau","fullName":"Lucas Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":5538,"firstName":"Mehdi","lastName":"Lefevre","fullName":"Mehdi Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Germany"},{"id":5545,"firstName":"Aurore","lastName":"Lefevre","fullName":"Aurore Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"agents"},{"name":"mcp"},{"name":"jeu"},{"name":"rag"}],"timeSlots":[]},{"id":77096,"title":"Le guide du testeur : 6 mauvaises habitudes à briser d\u0027urgence","description":"Nous l\u0026#39;avons tous déjà vécu : un pipeline CI qui brille de mille feux avec 100 % de couverture de tests, et pourtant, une production qui part en fumée. Comment se fait-il que nous écrivons toujours plus de tests, mais que notre sentiment de confiance n\u0026#39;ait jamais été aussi bas ?\u003cbr\u003e\u003cbr\u003eLa vérité est cruelle : bon nombre de nos \u0026quot;bonnes pratiques\u0026quot; de test actuelles sont en réalité des tueurs silencieux. Du \u0026quot;Coverage-Driven Development\u0026quot;, qui ne teste parfois rien, aux hacks Thread.sleep() qui rendent nos tests lents et instables, en passant par la surutilisation des mocks, nous produisons souvent du code qui ressemble à une suite de tests, mais qui agit comme un boulet.\u003cbr\u003e\u003cbr\u003eDans cette session ultra-rapide de 15 minutes, code à l\u0026#39;appui (Java 21 \u0026amp; JUnit 5), nous allons réaliser une véritable \u0026quot;intervention chirurgicale\u0026quot; afin de disséquer 6 anti-patterns fréquents et repartir avec des solutions concrètes pour rendre vos tests enfin dignes de confiance.","summary":"Cette session de 15 minutes dévoile six anti‑patterns fréquents qui minent la fiabilité des tests : couverture trompeuse, usage excessif de mocks, pauses artificielles, etc. Démonstrations en Java 21 et JUnit 5 à l’appui, elle propose des solutions concrètes pour restaurer la confiance et l’efficacité des suites de tests.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":161,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":77861,"firstName":"Chloé","lastName":"Perrin","fullName":"Chloé Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"tests"},{"name":"confiance"},{"name":"qualité"},{"name":"couverture"}],"timeSlots":[]},{"id":51648,"title":"SQL contre les préjugés","description":"Silence dans la salle ! La Cour Suprême du SQL est maintenant en session.\u003cbr\u003e\u003cbr\u003eVous croyez tout connaître de SQL, n\u0026#39;est-ce pas ? Pourtant, SQL reste un mystère pour la plupart des développeurs, accusé de tous les maux : trop complexe, pas assez moderne, inutilement verbeux.\u003cbr\u003e\u003cbr\u003eDans ce procès hors du commun, je vais défendre cette norme injustement méconnue en tant qu\u0026#39;experte PostgreSQL. Je présenterai les preuves irréfutables de son innocence face aux accusations les plus courantes. On dit que SQL est obsolète, pure diffamation ! On prétend que ces fonctionnalités avancées sont trop complexes pour être utiles, calomnie ! On affirme que SQL n\u0026#39;est pas adapté aux données modernes, fake news !\u003cbr\u003e\u003cbr\u003eÀ travers démonstrations de code, cas d\u0026#39;utilisation réels et exemples concrets, je révélerai comment ces fonctionnalités peuvent transformer votre façon de travailler avec les données. Pas de catalogue interminable, mais des solutions pratiques à des problèmes que vous rencontrez tous les jours.\u003cbr\u003e\u003cbr\u003eÀ la fin de cette session, vous pourrez rendre votre verdict : coupable de complexité inutile ou solution élégante à vos défis techniques quotidiens ?\u003cbr\u003e\u003cbr\u003eVous pouvez condamner SQL, mais l\u0026#39;histoire l\u0026#39;acquittera.","summary":"Cette présentation, sous forme de procès humoristique, réhabilite SQL face à ses détracteurs. L’experte PostgreSQL démontre, par des exemples concrets et des cas réels, que ses fonctionnalités avancées sont modernes, puissantes et pratiques. Elle invite le public à reconsidérer SQL comme une solution élégante plutôt qu’un langage dépassé.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":62,"track":{"id":1254,"name":"Data \u0026 Analytics","description":"Data storage, streaming, processing and ML engineering. Topics include data architecture, feature stores, training pipelines, MLOps and scalable analytics workflows."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":53214,"firstName":"Manon","lastName":"Marchand","fullName":"Manon Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"données"},{"name":"complexité"},{"name":"postgresql"},{"name":"sql"}],"timeSlots":[]},{"id":164851,"title":"BOF Go","description":"Golang Paris \u0026amp; BearConf vous proposent un BOF (Birds of a Feather) : un rassemblement informel / unconference) le jeudi 23 avril pour discuter de sujets connexes au langage Go. Il est fort probable qu\u0026#39;on discute de :\u003cbr\u003e\u003cbr\u003e\u003cul\u003e\u003cli\u003eSituer Go dans la déferlante LLM : là où il est utile + dernières avancées\u003c/li\u003e\u003cli\u003eSujets d\u0026#39;actu : cloud native, infosec...\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eSi vous voulez discuter de vos idées en amont de cette date ping \u003d\u0026gt; gaufres@golangparis.org\u003cbr\u003e","summary":"BOF informel organisé par Golang Paris et BearConf le 23 avril autour du langage Go. Les échanges porteront notamment sur la place de Go face aux LLM, ses usages pertinents, ainsi que sur des sujets d’actualité comme le cloud native et l’infosec.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":7,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":954,"slug":"bof-60","name":"BOF","duration":55,"pause":false,"freeTickets":0,"minSpeakers":1,"description":"Informal sessions of one hour, where like minded people get together and discuss technology.","cssColor":"#ffb8fd","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":160001,"firstName":"Nour","lastName":"Da Silva","fullName":"Nour Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"llm"},{"name":"golang"},{"name":"cloud-native"},{"name":"infosec"}],"timeSlots":[]},{"id":22570,"title":"Grandir avec le numérique : apprenons aux enfants à s\u0027en protéger","description":"Dans un monde où les enfants naviguent dès le plus jeune âge entre réseaux sociaux, vidéos virales et messageries instantanées, l’idée que la nouvelle génération maîtrise le numérique est une illusion dangereuse.\u003cbr\u003e\u003cbr\u003eChez Pix, groupement d’intérêt public au service des citoyens français dans l’apprentissage du numérique, nous avons décidé d’agir afin d’apprendre aux enfants à devenir autonomes, critiques et responsables face aux outils numériques, grâce à un nouvel outil, Pix Junior.\u003cbr\u003e\u003cbr\u003eCette conférence raconte la genèse de Pix Junior, de l’indignation à l’action, à travers de retours terrains d’enseignants et d’élèves de premier degré :\u003cbr\u003eComment apprendre à un enfant à se protéger en ligne ?\u003cbr\u003eComment accompagner les enseignants sur le plan didactique et pédagogique ?\u003cbr\u003eComment créer un produit numérique pour les enfants… qui leur parle vraiment ?\u003cbr\u003e\u003cbr\u003eVous découvrirez notre approche produit, nos choix pédagogiques, nos tests terrain, etc. Et surtout : ce que vous, en tant que designer, dev, PM, CTO, ou citoyen·ne, pouvez faire pour devenir un vecteur de changement.\u003cbr\u003e","summary":"Cette conférence retrace la création de Pix Junior, outil pour développer l’autonomie et l’esprit critique numérique des enfants. Elle présente retours d’expérience, choix pédagogiques et conseils concrets pour impliquer tous les acteurs (designers, devs, enseignants, citoyens) dans l’éducation numérique responsable des plus jeunes.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":131,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":22475,"firstName":"Gabriel","lastName":"Renaud","fullName":"Gabriel Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"numérique"},{"name":"autonomie"},{"name":"éducation"},{"name":"enfants"}],"timeSlots":[]},{"id":29765,"title":"A2A en 30 minutes : construire des agents IA qui communiquent","description":"Nous avons vu une augmentation du nombre d\u0026#39;agents IA et de leur \u0026quot;intelligence\u0026quot;. Cependant, ceux-ci restent isolés. Pour les faire collaborer, on a tenté de détourner des protocoles comme MCP. À mesure que les agents devenaient plus complexes, cette limite est devenue évidente. En avril 2025, Google a annoncé A2A, un standard ouvert permettant aux agents de se découvrir, de communiquer et de collaborer à travers différents écosystèmes.\u003cbr\u003e\u003cbr\u003eCette session introduit A2A. Nous verrons comment A2A supporte des scénarios multi-agents, multi-modaux et de longue durée. Nous passerons en revue ses principes clés comme la communication sécurisée, la découverte de capacités via les Agent Cards, ainsi que la manière dont les agents négocient des tâches et échangent du contexte. Nous verrons également comment A2A complète MCP. Nous terminerons par une démo de A2A en action en Java.\u003cbr\u003e\u003cbr\u003eSuite à cette présentation, vous comprendrez le rôle d’A2A dans l’écosystème des agents et comment concevoir des agents réellement interopérables pour l’Internet des Agents.","summary":"Cette session présente **A2A**, le standard ouvert de Google pour la collaboration entre agents IA. Elle explique ses principes — communication sécurisée, découverte via Agent Cards, négociation de tâches — et montre comment A2A complète MCP. Une démo en Java illustre la création d’agents interopérables pour l’Internet des Agents.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":118,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying
