d-color: transparent;\"\u003efilter pushdown\u003c/em\u003e, le plan physique et enfin l’exécution avec ses données en colonnes.\u003cbr\u003e\u003cbr\u003eAprès ce voyage sous le capot, vous comprendrez enfin le “\u003cem style\u003d\"color: rgb(0, 0, 0); background-color: transparent;\"\u003eexplain\u003c/em\u003e” de vos requêtes, la clé pour les optimiser !\u003cbr\u003e","summary":"Présentation pédagogique du fonctionnement interne des moteurs de requête à travers l’exemple d’Elasticsearch et d’ES|QL : parsing, plan logique, optimisation, plan physique et exécution. L’objectif : comprendre chaque étape du traitement pour mieux interpréter et optimiser les requêtes via l’analyse du “explain”.","audienceLevel":"ADVANCED","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":71,"track":{"id":1254,"name":"Data \u0026 Analytics","description":"Data storage, streaming, processing and ML engineering. Topics include data architecture, feature stores, training pipelines, MLOps and scalable analytics workflows."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":15662,"firstName":"Basile","lastName":"Garnier","fullName":"Basile Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"optimisation"},{"name":"exécution"},{"name":"requête"},{"name":"elasticsearch"}],"timeSlots":[]},{"id":37754,"title":"Concevoir une plateforme Java moderne","description":"\u003ch3\u003e\u003c/h3\u003eJDK 8 to 25 Without the Pain: Most Java teams carry far more technical debt than they realise. Moving from JDK 8 or 11 to JDK 21 or 25 is not a routine upgrade: it\u0026#39;s a leap across more than a decade of platform evolution. Along the way, developers must contend with removed APIs, stronger encapsulation, JPMS boundaries, garbage collector changes, and performance shifts that alter how Java apps are built, packaged, and deployed.\u003cbr\u003e\u003cbr\u003eThis session shows a practical, experience-driven view of what it really takes to modernise a large Java estate.\u003cbr\u003e\u003cbr\u003eCovering what breaks, why it breaks, how to detect problems early, and how to construct a migration strategy that reduces risk to both the platform and the budget.\u003cbr\u003e\u003cbr\u003e\u003cstrong style\u003d\"background-color: rgb(248, 249, 250); color: rgb(55, 65, 81);\"\u003eTopics include:\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\u003cul\u003e\u003cli\u003eUsing JDK tooling such as \u003ccode style\u003d\"background-color: rgb(248, 249, 250); color: rgb(55, 65, 81);\"\u003ejdeps\u003c/code\u003e, \u003ccode style\u003d\"background-color: rgb(248, 249, 250); color: rgb(55, 65, 81);\"\u003ejdeprscan\u003c/code\u003e, and runtime flags to uncover hidden technical debt\u003c/li\u003e\u003cli\u003eInternal API removals, split-package conflicts, and reflection failures\u003c/li\u003e\u003cli\u003ePractical migration strategies for real-world codebases\u003c/li\u003e\u003cli\u003eHow JPMS impacts legacy applications in practice\u003c/li\u003e\u003cli\u003eThe current JDK support and LTS landscape\u003c/li\u003e\u003cli\u003eWhy JDK 25 represents a stable long-term target\u003c/li\u003e\u003cli\u003e\u003c/li\u003e\u003c/ul\u003eIf you run production Java systems, this talk provides the map, highlights the hazards, and outlines a safe route forward.\u003cbr\u003e","summary":"This session offers a practical guide to upgrading from JDK 8/11 to JDK 21/25, addressing API removals, JPMS issues, and performance changes. It covers tools, migration strategies, and support lifecycles to help teams detect risks, manage technical debt, and modernize Java systems safely for long-term stability.","audienceLevel":"BEGINNER","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":71,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":38002,"firstName":"Ethan","lastName":"Dubois","fullName":"Ethan Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"UK"}],"keywords":[{"name":"java"},{"name":"migration"},{"name":"technicaldebt"},{"name":"modernization"}],"timeSlots":[]},{"id":5573,"title":"Docker Deep Dive : apprends à dompter les baleines","description":"Marre d\u0026#39;utiliser Docker comme un simple lanceur de containers ? 🤔\u003cbr\u003e\u003cbr\u003eVous pensez avoir fait le tour de la question avec un \u003cem style\u003d\"background-color: rgb(255, 255, 255); color: oklch(0.373 0.034 259.733);\"\u003edocker run\u003c/em\u003e et un \u003cem style\u003d\"background-color: rgb(255, 255, 255); color: oklch(0.373 0.034 259.733);\"\u003edocker compose up\u003c/em\u003e qui fonctionne \u0026quot;plus ou moins\u0026quot; ? Venez donc (ré-)apprendre à dompter les baleines !\u003cbr\u003e\u003cbr\u003eCe workshop est conçu pour les développeurs et les SRE qui veulent passer au niveau supérieur. Repartons des bases et allons explorer les fonctionnalités méconnues qui transformeront votre workflow :\u003cbr\u003e\u003cul\u003e\u003cli\u003e\u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: oklch(0.21 0.034 264.665);\"\u003eBuildx\u003c/strong\u003e, le couteau suisse de la construction d\u0026#39;images : Dites adieu aux builds lents et bonjour aux images multi-architectures et aux caches partagés. Nous explorerons la puissance de \u003cem style\u003d\"background-color: rgb(255, 255, 255); color: oklch(0.373 0.034 259.733);\"\u003edocker buildx \u003c/em\u003eet de \u003cem style\u003d\"background-color: rgb(255, 255, 255); color: oklch(0.373 0.034 259.733);\"\u003ebake\u003c/em\u003e pour compiler plusieurs images simultanément avec une simple configuration, comme un chef préparant un festin de containers !\u003c/li\u003e\u003cli\u003e\u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: oklch(0.21 0.034 264.665);\"\u003eMulti-stage\u003c/strong\u003e builds, le Saint Graal du build : Réduisez la taille de vos images de 90 % et faites rougir votre CI/CD.\u003c/li\u003e\u003cli\u003e\u003cstrong style\u003d\"color: oklch(0.21 0.034 264.665); background-color: rgb(255, 255, 255);\"\u003eCompose\u003c/strong\u003e, ce chef d\u0026#39;orchestre de génie : Découvrez les pouvoirs insoupçonnés des fichiers \u003cem style\u003d\"color: oklch(0.373 0.034 259.733); background-color: rgb(255, 255, 255);\"\u003edocker-compose.yml\u003c/em\u003e pour mettre en musique vos services et orchestrer des applications multi-conteneurs sans effort.\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eRejoignez-nous pour (re)découvrir que Docker et juste avec des fonctionnalités gratuites bien sûr.","summary":"Cet atelier s’adresse aux développeurs et SRE souhaitant dépasser l’usage basique de Docker. Il propose de redécouvrir Docker en explorant buildx, les builds multi-stage et les fonctionnalités avancées de Compose, pour optimiser la construction, la gestion et l’orchestration d’images et services, sans coût supplémentaire.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":71,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":968,"slug":"lab-180","name":"3H Hands-on Lab","duration":180,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"3 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2589,"firstName":"Nadia","lastName":"Lefevre","fullName":"Nadia Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":2593,"firstName":"Malik","lastName":"Lefevre","fullName":"Malik Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"buildx"},{"name":"containers"},{"name":"docker"},{"name":"compose"}],"timeSlots":[]},{"id":15162,"title":"Vous croyez connaître Git ? Challenge accepted","description":"Vous pensiez maîtriser Git parce que vous savez faire un git commit -m \u0026quot;fix\u0026quot; ? Attendez de découvrir ce qui se cache dans les méandres de cet outil que tout le monde utilise... mais que personne ne comprend vraiment.\u003cbr\u003e\u003cbr\u003eAu programme :\u003cbr\u003e- Apprendre à travailler sur 3 features en même temps sans devenir fou\u003cbr\u003e- Retrouver CE commit que vous avez supprimé par erreur (et que vous juriez avoir perdu à jamais)\u003cbr\u003e- Débusquer le bug introduit il y a 47 commits sans lire tout l\u0026#39;historique comme un roman policier raté\u003cbr\u003e- Comprendre les différents workflows et quand les utiliser : Gitflow, GitHub Flow...\u003cbr\u003e\u003cbr\u003eTout ça sur un vrai projet, avec de vrais bugs, de vrais conflits, et de vraies solutions (pas juste des slides Powerpoint soporifiques).\u003cbr\u003e\u003cbr\u003e⚠️ Attention : Ce workshop contient des révélations qui risquent de bouleverser votre vision de Git. Effets secondaires connus : addiction aux commits propres, refus catégorique de merger sans rebase, et tendance à évangéliser vos collègues sur git worktree.\u003cbr\u003e\u003cbr\u003ePrérequis : savoir ce qu\u0026#39;est un commit (si vous tapez encore git add . les yeux fermés en priant, c\u0026#39;est parfait, on est là pour ça).","summary":"Atelier avancé sur Git dévoilant ses fonctionnalités méconnues : gestion simultanée de plusieurs branches, récupération de commits perdus, recherche efficace de bugs, choix de workflows adaptés. Le tout via des exercices pratiques sur un vrai projet, pour dépasser les bases et transformer votre utilisation de Git. Prérequis minimal.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":82,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":968,"slug":"lab-180","name":"3H Hands-on Lab","duration":180,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"3 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":15652,"firstName":"Clara","lastName":"Garnier","fullName":"Clara Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":15653,"firstName":"Mehdi","lastName":"Garnier","fullName":"Mehdi Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"bug"},{"name":"commit"},{"name":"git"},{"name":"workflow"}],"timeSlots":[]},{"id":12075,"title":"Vibe-coder du lourd avec Kilocode","description":"Un assistant IA Open-Source, s\u0026#39;intégrant dans tous les IDE, et non maqué avec des fournisseurs LLM, ca existe?\u003cbr\u003eDans ce talk nous verrons:\u003cbr\u003e\u003cul\u003e\u003cli\u003eCe qu\u0026#39;est Kilocode : présentation du plugin / des modèles / de la configuration\u003c/li\u003e\u003cli\u003eNous parlerons de ces différents modes agents qui font sa force : Architect, Code, Debug, Orchestrator\u003c/li\u003e\u003cli\u003eNous parlerons de custom rules, de serveur MCP, de comment Kilocode sait s\u0026#39;intégrer avec Copilot également.\u003c/li\u003e\u003cli\u003ePuis sur une démo en live nous lui feront coder une application :-)\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eSi rname":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"application"},{"name":"plugin"},{"name":"agents"},{"name":"kilocode"}],"timeSlots":[]},{"id":34404,"title":"Chatbot ou GenUI ? Construire l\u0027assistant voyageur d\u0027un grand service de mobilité","description":"En 2026, il est possible d\u0026#39;intégrer ses offres dans l\u0026#39;expérience ChatGPT avec l\u0026#39;Apps SDK et la technologie MCP.\u003cbr\u003e\u003cbr\u003eComment l\u0026#39;implémenter de manière convaincante pour l\u0026#39;utilisateur final ?\u003cbr\u003e\u003cbr\u003eEst-il préférable de créer sa propre interface conversationnelle - avec des technos comme GenUI - pour une expérience cousue main ?\u003cbr\u003e\u003cbr\u003eEt est-ce une bonne idée de mutualiser le serveur MCP si on part sur les deux approches ?\u003cbr\u003e\u003cbr\u003eEn se basant sur notre expérience conversationnelle, du NLP de OUIBot (2016) en passant par le RAG exposé sur SNCF Connect (2024), on vous présentera l\u0026#39;arrière cuisine des nouvelles interfaces d\u0026#39;assistants de voyage avec en particulier quelques préoccupations à garder en tête :\u003cbr\u003e\u003cbr\u003e\u003cul\u003e\u003cli\u003eLimiter les hallucinations et le bad buzz quand on vend des trajets à des millions de voyageurs\u003c/li\u003e\u003cli\u003eEviter de partager les données des utilisateurs à des tiers\u003c/li\u003e\u003cli\u003eNe pas réserver toutes les places d\u0026#39;un TGV en une fois même si l\u0026#39;utilisateur le demande !\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eAvant d\u0026#39;atteindre (peut-être) le Graal de l\u0026#39;achat fluide de billet de train dans ChatGPT, vous découvrirez les stacks utilisées, les différents écueils rencontrés et les nombreuses questions encore ouvertes.","summary":"Ce talk explore la création d’assistants de voyage intégrant **ChatGPT Apps SDK** et **MCP**, comparée à des interfaces sur mesure type **GenUI**. S’appuyant sur l’expérience OUIBot et SNCF Connect, il détaille stacks, défis techniques et éthiques : **hallucinations, protection des données, limites métier**, vers un achat de billet fluide et sûr.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":59,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":34554,"firstName":"Ibrahim","lastName":"Dubois","fullName":"Ibrahim Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":51545,"firstName":"Yanis","lastName":"Marchand","fullName":"Yanis Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"llm"},{"name":"conversationnel"},{"name":"ia"},{"name":"fiabilité"}],"timeSlots":[]},{"id":29753,"title":"Shall we play a game ? La sécurité des LLM en pratique","description":"Artificial Intelligence (AI) is no longer a futuristic concept. It\u0026#39;s embedded in the systems we use daily. At the core of these innovations are Large Language Models (LLMs). These LLMs can unlock new capabilities but can also introduce novel security challenges due to their non-deterministic behavior and autonomous outputs, causing issues like data leakage and unintended model behavior from attacks such as prompt injection.\u003cbr\u003e\u003cbr\u003eThis workshop equips participants with the skills they need to build secure LLM-based applications through interactive, challenge-based exercises that gamify core security concepts. Prepare to level up your understanding of LLM security in a practical and fun way.","summary":"This workshop teaches participants how to securely build applications using Large Language Models (LLMs), addressing security risks like data leakage and prompt injection. Through interactive, challenge-based exercises, attendees will gain practical skills and a deeper understanding of LLM security concepts in an engaging, gamified environment.","audienceLevel":"BEGINNER","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":55,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":984,"slug":"lab-120","name":"2H Hands-on Lab","duration":120,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"2 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":26787,"firstName":"Malik","lastName":"Dubois","fullName":"Malik Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Cyprus"},{"id":148908,"firstName":"Léa","lastName":"Da Silva","fullName":"Léa Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"United States of America"}],"keywords":[{"name":"llms"},{"name":"security"},{"name":"ai"},{"name":"workshop"}],"timeSlots":[]},{"id":2739,"title":"Limits, Requests, QoS, PriorityClasses : démystifions le scheduling Kubernetes","description":"Limits, requests, QoS, PriorityClasses. Vous avez entendu parler de ces termes et vous savez que pour une prod qui fonctionne bien, il faut les spécifier sur vos applications. \u003cbr\u003e\u003cbr\u003eOk. Mais comment, et surtout \u0026quot;pourquoi\u0026quot; ?\u003cbr\u003e\u003cbr\u003e- Savez vous vraiment ce qu\u0026#39;il se passe quand vous n\u0026#39;avez plus assez de ressources CPU sur votre cluster ?\u003cbr\u003e- Que se passe-t-il quand des applications gourmandes consomment bien plus de RAM que vous leur avez alloué ?\u003cbr\u003e- Pourquoi mettre une limite sur le CPU peut exploser les performances de votre frontend web ?\u003cbr\u003e- Comment Kubernetes ordonnance vos applications ?\u003cbr\u003e\u003cbr\u003eÀ la fin de cette session, vous serez capables de répondre à toutes ces questions — et bien plus encore. On va vous dévoiler les coulisses, vous montrer comment ça tourne vraiment… avec des démos qui pousseront nos clusters dans leurs derniers retranchements. Préparez-vous, ça va secouer.","summary":"Cette session démystifie la gestion des ressources dans Kubernetes (limits, requests, QoS, PriorityClasses) : pourquoi et comment les configurer, leurs impacts sur la performance et l’ordonnancement, et ce qui arrive en cas de manque de ressources, le tout illustré par des démonstrations pratiques poussant les clusters à leurs limites.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":99,"track":{"id":1256,"name":"Cloud \u0026 Plateformes","description":"Backend and platform engineering across technologies: frameworks (Java, Go, Node, Rust…), Kubernetes, serverless, observability, SRE practices and infrastructure-as-code for production systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2581,"firstName":"Aurore","lastName":"Moreau","fullName":"Aurore Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":3603,"firstName":"Manon","lastName":"Lefevre","fullName":"Manon Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"kubernetes"},{"name":"ressources"},{"name":"performances"},{"name":"ordonnancement"}],"timeSlots":[]},{"id":60503,"title":"Staff \u0026 Principal Engineer : comment ça marche dans un grand assureur ?","description":"\u003cstrong\u003eStaff, Principal, Distinguished\u003c/strong\u003e... Ces titres font rêver, mais que signifient-ils concrètement une fois le contrat signé ? Chez AXA France, nous avons lancé l\u0026#39;expérimentation pour répondre à un besoin critique : offrir une évolution de carrière ambitieuse aux passionnés de technique.\u003cbr\u003e\u003cbr\u003eVenez découvrir les coulisses de cette transformation. Loin des définitions théoriques, nous plongerons dans le quotidien de nos experts : leurs objectifs, leur feuille de route, mais surtout la posture attendue. Nous aborderons des sujets souvent tabous pour les techs : comment convaincre, faire son propre marketing et naviguer dans l\u0026#39;organisation.\u003cbr\u003e\u003cbr\u003eCe n\u0026#39;est pas une recette magique, mais un REX honnête sur un chantier inachevé. Venez comparer vos expériences, poser vos questions et comprendre comment structurer l\u0026#39;expertise dans votre propre contexte.","summary":"AXA France partage son retour d’expérience sur la création d’un parcours de carrière technique ambitieux. Cette initiative explore les rôles d’experts (Staff, Principal, Distinguished), leurs missions, leur posture et les compétences d’influence nécessaires, tout en offrant une réflexion ouverte sur la valorisation et la structuration de l’expertise technique.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":68,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":53235,"firstName":"Adam","lastName":"Marchand","fullName":"Adam Marchand" uota":false,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":1201,"firstName":"Camille","lastName":"Moreau","fullName":"Camille Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":1215,"firstName":"Malik","lastName":"Moreau","fullName":"Malik Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":5532,"firstName":"Clara","lastName":"Lefevre","fullName":"Clara Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":22454,"firstName":"Ethan","lastName":"Renaud","fullName":"Ethan Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"clôture"},{"name":"castcodeurs"},{"name":"tendances"},{"name":"BearConf"}],"timeSlots":[]},{"id":45204,"title":"Docker Compose : votre boîte à outils dev pour l\u0027IA et le cloud","description":"Docker Compose est un outil incontournable pour orchestrer des environnements de développement locaux. À l’ère de l’IA, il franchit encore une nouvelle étape.\u003cbr\u003e\u003cbr\u003eDurant cette session, nous montrerons comment les dernières évolutions de Docker Compose permettent de définir de manière déclarative des applications basées sur des LLMs. \u003cbr\u003eNous verrons comment intégrer un modèle d’IA directement dans une application via la section \u003ccode\u003e\u003cstrong\u003emodels\u003c/strong\u003e\u003c/code\u003e, comment se connecter à des ressources externes grâce aux \u003cstrong\u003eprovider services\u003c/strong\u003e, et comment \u003cstrong\u003eDocker Offload\u003c/strong\u003e prend le relais lorsque les ressources de la machine locale ne suffisent plus.\u003cbr\u003e\u003cbr\u003e\u003ch3\u003eAu programme, en live :\u003c/h3\u003e\u003cul\u003e\u003cli\u003eDéfinir un LLM dans un fichier Compose avec la clé \u003ccode\u003e\u003cstrong\u003emodels\u003c/strong\u003e\u003c/code\u003e\u003c/li\u003e\u003cli\u003eAccéder à ces modèles depuis les conteneurs applicatifs\u003c/li\u003e\u003cli\u003eUtiliser les provider services pour préparer ou connecter des ressources externes\u003c/li\u003e\u003cli\u003eDéporter des charges de travail lourdes (GPU) à distance avec Docker Offload\u003c/li\u003e\u003cli\u003eUtiliser Compose unique pour orchestrer code, modèles et contexte d’exécution\u003c/li\u003e\u003c/ul\u003eUne session concrète et rythmée, pensée pour les développeurs travaillant sur l’IA, les agents ou des architectures modernes multi-services, souhaitant comprendre comment Docker s’adapte aux nouveaux usages de l’IA.","summary":"Cette session présente les nouveautés de Docker Compose pour orchestrer des applications basées sur des LLMs : définition de modèles via models, connexion à des ressources externes avec provider services et délestage GPU grâce à Docker Offload. Une démo montre comment unifier code, modèles et exécution pour les projets IA modernes.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":84,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":5527,"firstName":"Juliette","lastName":"Lefevre","fullName":"Juliette Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":7356,"firstName":"Nadia","lastName":"Garnier","fullName":"Nadia Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"llm"},{"name":"docker"},{"name":"offload"},{"name":"compose"}],"timeSlots":[]},{"id":149107,"title":"Another Brick in the WAL : quand la vitesse ne rime plus avec RAM","description":"Construire une base de données performante, résiliente et scalable reste l’un des défis les plus complexes du monde logiciel. Entre la concurrence permanente pour les ressources, la gestion critique de l\u0026#39;état des données et les exigences de distribution, les architectures mono-noeud atteignent rapidement leurs limites. \u003cbr\u003eLes bases relationnelles reposent sur des fondations solides, mais difficilement adaptables à grande échelle. \u003cbr\u003eLe NoSQL, lui, a bousculé les codes… au prix d’une fragmentation des approches, sans véritables standards universels. Mais toutes les bases de données NoSQL utilisent la mémoire pour assurer la performance que l’on attend d’elles. \u003cbr\u003eEt si le postulat de départ était à revoir ? Et si la RAM n’était pas la clé de la performance ? \u003cbr\u003eDans cette session, découvrez comment Aerospike redéfinit les standards avec une approche pensée pour les disques, capable de délivrer des millions de requêtes par seconde avec une latence inférieure à la milliseconde. \u003cbr\u003eAu programme : les principes d’ingénierie qui rendent cela possible, des retours d’expérience issus de déploiements comme Adikteev et Criteo, et une démonstration en direct pour voir la performance “post-RAM” en action.\u003cbr\u003e","summary":"Cette session explore comment Aerospike repense les bases de données en privilégiant une architecture optimisée pour les disques plutôt que la RAM, offrant des performances massives et une faible latence. Elle présente les principes techniques, des retours d’expérience concrets et une démonstration de cette approche « post-RAM » scalable et résiliente.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":44,"track":{"id":1254,"name":"Data \u0026 Analytics","description":"Data storage, streaming, processing and ML engineering. Topics include data architecture, feature stores, training pipelines, MLOps and scalable analytics workflows."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":63433,"firstName":"Clara","lastName":"Marchand","fullName":"Clara Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":162801,"firstName":"Ethan","lastName":"Da Silva","fullName":"Ethan Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"basededonnées"},{"name":"disque"},{"name":"scalabilité"},{"name":"performance"}],"timeSlots":[]},{"id":29769,"title":"La transactionnalité, enfin expliquée","description":"Les transactions sont un mécanisme structurant dans de nombreuses applications. Elles permettent en effet de garantir l\u0026#39;intégrité des données en permettant de traiter plusieurs opérations de manière atomique.\u003cbr\u003e\u003cbr\u003eMais comment les transactions fonctionnent-elles sous le capot ?\u003cbr\u003e\u003cbr\u003eEn nous appuyant sur l\u0026#39;exemple de Postgres, nous explorerons comment les mécanismes du WAL (Write-Ahead Logging) et MVCC (multi-version concurrency control) permettent de garantir cette atomicité, pour le cas unitaire, mais également lors de crash de la base.","summary":"Cette présentation explore le fonctionnement interne des transactions dans Postgres, en détaillant comment les mécanismes WAL et MVCC assurent l’atomicité et l’intégrité des données, même en cas de panne, illustrant ainsi le rôle essentiel des transactions dans la fiabilité des applications.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":23,"track":{"id":1254,"name":"Data \u0026 Analytics","description":"Data storage, streaming, processing and ML engineering. Topics include data architecture, feature stores, training pipelines, MLOps and scalable analytics workflows."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":26794,"firstName":"Inès","lastName":"Dubois","fullName":"Inès Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"transactions"},{"name":"mvcc"},{"name":"intégrité"},{"name":"wal"}],"timeSlots":[]},{"id":4008,"title":"Les femmes dans le software engineering : où en est-on ?","description":"With the advent of the age of AI software has never played such an outsized role in our daily lives and yet women only account for a small minority of software engineers. This is especially disheartening given that many - but not all - of the first software engineers were women (Katherine Johnson, Margaret Hamilton, Grace Hopper, ...). \u003cbr\u003e\u003cstrong\u003eThis talk aims to stay away from dogma or political posturing, instead focusing on explaining why more women aren\u0026#39;t software engineers and proposing concrete, tactical and doable solutions.\u003c/strong\u003e\u003cbr\u003eThe first part of the talk recounts the stories of some of the pioneers who built flight control systems for the Apollo mission. \u003cbr\u003eI then use those examples to contrast with the current state in our Industry where female developers only account for a minority of software engineers.\u003cbr\u003eI\u0026#39;ll then give an overview of why I believe more women don\u0026#39;t become software engineers, briefly explaining why this is the case.\u003cbr\u003eI\u0026#39;ll also share why some of the women who become software engineers eventually leave our Industry and what we can do to retain them. \u003cbr\u003eFinally, I\u0026#39;ll conclude with concrete actions we can all take in order to increase the amount of women in software engineering. \u003cbr\u003e\u003cbr\u003e ","summary":"This talk explores the historical and current underrepresentation of women in software engineering, highlighting early female pioneers, analyzing reasons for low participation and attrition, and concluding with actionable, practical steps to attract and retain more women in the field, avoiding dogma and focusing on real solutions.","audienceLevel":"BEGINNER","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":39,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2565,"firstName":"Anaïs","lastName":"Moreau","fullName":"Anaïs Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"engineering"},{"name":"software"},{"name":"women"},{"name":"solutions"}],"timeSlots":[]},{"id":158051,"title":"La boîte à outils tech : l\u0027écosystème interne qui simplifie la vie des développeurs","description":"\u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: rgb(34, 34, 34);\"\u003ePortail de développement interne (IDP), IA appliquée au développement... plongez dans les coulisses de l\u0026#39;IT du groupe.\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003eCe talk propose tout d\u0026#39;abord de découvrir Huber, le nouveau point d\u0026#39;entrée pour les développeurs (IDP) du Groupe BPCE. Pensé pour simplifier l\u0026#39;intégration et accélérer le travail de nos développeurs, il propose un environnement sécurisé, optimisé pour les usages containers et une intégration native avec les chaînes CI/CD du groupe.\u003cbr\u003eDécouvrez ensuite notre démarche IA4DEV et la solution \u0026quot;Continue\u0026quot; : 2 ans après le lancement, les utilisateurs dressent un vrai bilan, sans langue de bois. Autour de leurs principaux cas d\u0026#39;usages, ils vous partagent leurs enseignements, ce qui simplifie vraiment leur quotidien... et leurs surprises, aussi !","summary":"Ce talk présente **Huber**, le portail interne des développeurs du Groupe BPCE, conçu pour simplifier l’intégration et optimiser les environnements CI/CD. Il expose aussi la démarche **IA4DEV** et la solution **Continue**, avec un retour d’expérience concret sur deux ans d’usage, leurs bénéfices, enseignements et surprises.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":188,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":157851,"firstName":"Yanis","lastName":"Da Silva","fullName":"Yanis Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":158351,"firstName":"Inès","lastName":"Da Silva","fullName":"Inès Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":158354,"firstName":"Manon","lastName":"Da Silva","fullName":"Manon Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":160002,"firstName":"Lucas","lastName":"Da Silva","fullName":"Lucas Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"continue"},{"name":"ia4dev"},{"name":"idp"},{"name":"huber"}],"timeSlots":[]},{"id":5583,"title":"Neurodiversité \u0026 tech : vos profils atypiques sont votre plus grande force","description":"Cette conférence explore comment la neurodiversité transforme la performance individuelle et collective dans les environnements Tech. À partir de mon expérience de coach de dirigeants neuroatypiques et de 20 ans d’accompagnement en leadership, j’explique comment reconnaître, canaliser et valoriser les modes de fonctionnement atypiques pour en faire un levier d’innovation, d’efficacité et de collaboration. Entre pédagogie, insights neuroscientifiques et exemples concrets d’équipes Tech, la conférence montre comment passer d’une gestion « des écarts » à une stratégie de performance fondée sur la compréhension humaine.\u003cbr\u003e\u003cstrong\u003eLes clés : \u003c/strong\u003e\u003cbr\u003e • Comprendre les mécanismes neurocognitifs qui influencent attention, motivation et communication.\u003cbr\u003e • Identifier les talents invisibles des profils atypiques et les activer dans les projets Tech.\u003cbr\u003e • Adapter le management sans complexité : micro-ajustements à fort impact.\u003cbr\u003e • Installer une culture inclusive qui renforce engagement, collaboration et performance.\u003cbr\u003e\u003cstrong\u003eAudience cible : \u003c/strong\u003e\u003cbr\u003e Dirigeants, managers, DRH, responsables DSI, équipes tech, resp. inclusion \u0026amp; diversité, formateurs internes, organisations souhaitant comprendre et valoriser la neurodiversité.","summary":"Cette conférence montre comment la neurodiversité devient un atout pour l’innovation et la performance dans la Tech. Grâce à des apports neuroscientifiques, des exemples concrets et des conseils managériaux, elle propose des leviers simples pour valoriser les talents atypiques et instaurer une culture inclusive et efficace.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":90,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":5546,"firstName":"Basile","lastName":"Lefevre","fullName":"Basile Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"neurodiversité"},{"name":"leadership"},{"name":"innovation"},{"name":"performance"}],"timeSlots":[]},{"id":4015,"title":"Refactorer sans tout casser : anatomie des patterns de modernisation incrémentale","description":"Cette session répond à un problème extrêmement courant mais rarement traité de façon structurée : comment moderniser un système legacy sans big bang, sans freeze de la prod, et sans multiplier les régressions. Plutôt que de parler “microservices” ou “rewrite from scratch” de manière abstraite, la session propose un playbook de modernisation incrémentale, articulé autour de patterns éprouvés : Strangler Fig, Parallel Change (Expand/Contract), Branch by Abstraction, décomposition par capacités métier / sous-domaines / transactions, et les patterns de conception (Facade, Adapter, Proxy, Mediator) utilisés comme briques concrètes de migration.\u003cbr\u003e\u003cbr\u003eLe contenu est ancré dans la pratique : il synthétise à la fois des retours d’expérience industriels (Netflix, Khan Academy, etc.) et des travaux de recherche / rédaction. L’objectif n’est pas de présenter un catalogue de patterns, mais de montrer comment les combiner pour construire une trajectoire de migration observable, réversible et livrable en continu.\u003cbr\u003e\u003cbr\u003eVous repartirez avec une grille de lecture concrète pour garder des migrations observables, réversibles et compatibles avec le rythme produit.","summary":"Cette session propose un guide pratique pour moderniser un système legacy sans interruption, en combinant des patterns éprouvés (Strangler Fig, Parallel Change, etc.) et des retours d’expérience industriels. L’approche permet des migrations incrémentales, observables et réversibles, sans perturber la production ni multiplier les régressions.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":188,"track":{"id":1251,"name":"Architecture \u0026 Design","description":"Designs, trade-offs and real-world decisions for building maintainable systems. Case studies, system evolution (monolith→services), DDD, event-driven approaches, resilience and architectural anti-patterns."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":3621,"firstName":"Emma","lastName":"Lefevre","fullName":"Emma Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"migration"},{"name":"legacy"},{"name":"modernisation"},{"name":"patterns"}],"timeSlots":[]},{"id":9716,"title":"Secure all the things : de l\u0027IaC à Kubernetes","description":"Chez Piguet Galland \u0026amp; Cie, la sécurité est un point essentiel dans notre voyage au sein du paysage Cloud Native. Notamment parce que déployer du code sans filet, c\u0026#39;est un peu comme sauter en parachute... sans parachute.\u003cbr\u003e\u003cbr\u003eAu sein de cette présentation, je vous partagerai la mise en place concrète d\u0026#39;une approche DevSecOps où l\u0026#39;automatisation, la fiabilité et la prévention des risques accompagnent chaque étape, de l\u0026#39;Infrastructure as Code jusqu\u0026#39;aux déploiements dans Kubernetes.\u003cbr\u003e\u003cbr\u003eAu programme : pipelines CI/CD sécurisées, du GitOps pour gérer les secrets sans sueurs froides, et un cluster Kubernetes déployé avec Cluster API et Talos Linux, mais aussi renforcé grâce à de la Policy as Code, sans oublier le chiffrement des communications.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":40,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":10018,"firstName":"Emma","lastName":"Garnier","fullName":"Emma Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Switzerland"}],"keywords":[{"name":"kubernetes"},{"name":"sécurité"},{"name":"devsecops"},{"name":"automatisation"}],"timeSlots":[]},{"id":61656,"title":"Charmer les dragons : pitcher son produit tel un héros","description":"Dans les grandes légendes, les héros ne gagnent jamais seuls. Il faut convaincre un roi, rallier des alliés, obtenir la clé qui débloquera l\u0026#39;étape suivante.\u003cbr\u003e\u003cbr\u003eC\u0026#39;est pareil pour nous toustes : avoir une idée ne suffit pas. Il faut savoir l\u0026#39;incarner, la transmettre, la défendre. Que vous soyez PM, dev, tech lead, vous devez pitcher pour débloquer une situation, valider une refonte, obtenir du budget, ou embarquer l\u0026#39;équipe sur une mission critique.\u003cbr\u003e\u003cbr\u003eDans cet atelier, vous explorerez les grands archétypes du pitch : du pitch flash pour le comité produit, à la défense d\u0026#39;une dette technique devant les stakeholders, jusqu\u0026#39;au deck investisseur. Vous découvrirez des formats adaptés à chaque situation, des erreurs classiques à éviter, et des techniques pour captiver sans trahir votre vision. Vous vous entraînerez sur des cas concrets (lancement produit, migration technique, arbitrage d\u0026#39;architecture) avec des retours directs et des outils pour affûter vos armes.\u003cbr\u003e\u003cbr\u003eObjectif : repartir avec l\u0026#39;art de défendre vos idées sans vous trahir. \u003cbr\u003eCar pitcher, ce n\u0026#39;est pas conter pour plaire, c\u0026#39;est raconter pour faire avancer la quête ;-)","summary":"Atelier pratique pour apprendre à pitcher efficacement dans divers contextes — produit, technique ou stratégique. Les participants découvriront les archétypes de pitch, les erreurs à éviter et des méthodes concrètes pour convaincre, défendre une idée ou rallier des alliés, tout en restant fidèles à leur vision.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":75,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":984,"slug":"lab-120","name":"2H Hands-on Lab","duration":120,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"2 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":26759,"firstName":"Aurore","lastName":"Renaud","fullName":"Aurore Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":26773,"firstName":"Alex","lastName":"Dubois","fullName":"Alex Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"vision"},{"name":"communication"},{"name":"pitch"},{"name":"conviction"}],"timeSlots":[]},{"id":63933,"title":"Votre second cerveau IA, sans y perdre votre âme","description":"Pendant 15 ans, j\u0026#39;ai consommé une quantité astronomique de contenu sans jamais pouvoir le retrouver. Ce n\u0026#39;était pas un problème de volume, mais de VOLATILITÉ : l\u0026#39;information consommée devenait immédiatement du savoir mort.\u003cbr\u003eEt si l\u0026#39;IA servait au contraire à arrêter l\u0026#39;hémorragie pour transformer votre veille en une véritable infrastructure de connaissance ?\u003cbr\u003eDans cette session, je ne vous vendrai pas un nouvel outil SaaS. Je vous ouvrirai le capot de mon propre second cerveau : une architecture locale souveraine (Markdown, Git) où l\u0026#39;IA ne sert pas à répondre à ma place, mais à devenir mon \u0026quot;Contrôleur Aérien\u0026quot; mental.\u003cbr\u003eDécouvrez comment j\u0026#39;ai automatisé avec Antigravity ma digestion de savoir en 12 étapes pour passer de la simple synthèse à la critique stratégique. Ne soyez plus l\u0026#39;utilisateur d\u0026#39;un outil, devenez l\u0026#39;architecte de votre propre pensée.","summary":"Présentation d’une approche pour transformer la veille personnelle en véritable infrastructure de connaissance : un « second cerveau » local basé sur Markdown, Git et IA. L’auteur y détaille son système Antigravity en 12 étapes, où l’IA agit comme contrôleur mental pour passer de la synthèse à la réflexion stratégique.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":154,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":63442,"firstName":"Mehdi","lastName":"Marchand","fullName":"Mehdi Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"automatisation"},{"name":"savoir"},{"name":"ia"},{"name":"connaissance"}],"timeSlots":[]},{"id":7872,"title":"Meet \u0026 Chip : la rencontre sous tension","description":"Vous avez toujours trouvé les circuits électroniques un peu mystérieux ?\u003cbr\u003e\u003cbr\u003eCe workshop va vous prouver que l’électronique n’est pas réservée aux électroniciens. Encadré par deux passionnés d’IoT — Paul Pinault (Rtone) et Henri Gomez, cet atelier vous emmène pas à pas de la découverte des bases à la création d’un badge électronique programmable.\u003cbr\u003e\u003cbr\u003eCe badge, que vous réaliserez et souderez vous-même, sera capable d’identifier les affinités entre participants (geekeries, expertises, tartiflette…) pour créer du lien dans la communauté.\u003cbr\u003e\u003cbr\u003eUne initiation pratique, ludique et accessible à tout développeur souhaitant mettre un pied dans le monde de la microélectronique, sans se brûler les doigts (\u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: oklch(0.21 0.034 264.665);\"\u003eou presque\u003c/strong\u003e).\u003cbr\u003e\u003cbr\u003eDans ce workshop, nous allons partager les étapes et les tips qui permettent de créer un circuit électronique, le choix des composant, le matériel de base avec un vrai hands-on et un peu de code. Les participants repartent avec du matériel à hacker chez eux et toutes les bases.","summary":"Atelier d’initiation à l’électronique pour développeurs, où les participants découvrent les bases en créant et soudant un badge programmable favorisant les échanges communautaires. Encadré par deux experts IoT, le workshop inclut théorie, pratique, choix de composants, soudure et code. Chacun repart avec son badge et des connaissances concrètes.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":44,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":968,"slug":"lab-180","name":"3H Hands-on Lab","duration":180,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"3 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":7377,"firstName":"Théo","lastName":"Garnier","fullName":"Théo Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":7379,"firstName":"Manon","lastName":"Garnier","fullName":"Manon Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"atelier"},{"name":"badge"},{"name":"électronique"},{"name":"microélectronique"}],"timeSlots":[]},{"id":63923,"title":"Le mythe de la neutralité : quand la tech se fait politique","description":"Et si, demain, votre iPhone cessait de fonctionner ?\u003cbr\u003eEt si Google coupait ses services en Europe ?\u003cbr\u003e\u003cbr\u003ePeut être que vous, vous n’utilisez pas Google ou que vous n’avez pas d’iphone.\u003cbr\u003e\u003cbr\u003eMais aujourd’hui, plus de 70 % du web français dépend de services numériques américains, y compris pour des services critiques de l’État, des banques ou des hôpitaux.\u003cbr\u003e\u003cbr\u003eDonc je reformule ma question, et si demain, des acteurs américains nous coupaient l’accès à ces services, ou multipliait les prix par 10 ? Ou pire, si ces services devenaient des armes contre nous ?\u003cbr\u003e\u003cbr\u003eSi vous pensez que notre métier consiste uniquement à écrire du code et à résoudre des problèmes techniques et que vous n\u0026#39;êtes pas venu là pour parler d\u0026#39;autre chose, ce talk propose un changement de perspective. \u003cbr\u003e\u003cbr\u003eNous explorerons pourquoi la technologie n’a jamais été neutre, comment nos choix techniques ont des conséquences bien réelles et comment on peut agir pour avoir plus d\u0026#39;impact dessus.","summary":"Ce talk invite à réfléchir à la dépendance du web français envers les services numériques américains. Il questionne les conséquences d’une rupture d’accès et rappelle que la technologie n’est pas neutre : nos choix techniques ont un impact politique et sociétal, appelant à une prise de responsabilité collective.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":143,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":51504,"firstName":"Clara","lastName":"Dubois","fullName":"Clara Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"technologie"},{"name":"souveraineté"},{"name":"impact"},{"name":"dépendance"}],"timeSlots":[]},{"id":60506,"title":"Staff42 : meetup pour Staff Engineers","description":"\u003ca href\u003d\"https://staff42.org/\" rel\u003d\"noopener noreferrer\" target\u003d\"_blank\" style\u003d\"color: rgba(255, 255, 255, 0.95); background-color: rgb(15, 23, 42);\"\u003eStaff42\u003c/a\u003e est une communauté francophone créée en janvier 2024, ouverte à tous, qui permet aux personnes intéressées par les rôles de \u003cem style\u003d\"color: rgba(255, 255, 255, 0.95); background-color: rgb(15, 23, 42);\"\u003eStaff / Senior Staff / Principal Engineers\u003c/em\u003e de se rencontrer et d\u0026#39;échanger sur les problématiques spécifiques à ces positions très sénior.\u003cbr\u003e\u003cbr\u003eCréée à l\u0026#39;initiative de Staffs chez BlaBlaCar et Back Market pour témoigner et discuter sur la filière de \u0026quot;contributeur individuel\u0026quot; (IC) dans des entreprises de la tech, la communauté regroupe maintenant plus de 350 ingénieurs de toutes les entreprises majeures françaises ainsi que d\u0026#39;autres européennes et américaines.\u003cbr\u003e\u003cbr\u003eCette session est l\u0026#39;occasion de se rencontrer, partager les pratiques et en apprendre plus avec la communauté sur ces rôles en plein essor, ainsi que l\u0026#39;impact qu\u0026#39;ils peuvent avoir sur nos entreprises et notre industrie.","summary":"Staff42 est une communauté francophone rassemblant plus de 350 ingénieurs Staff, Senior Staff et Principal, fondée en 2024 par des membres de BlaBlaCar et Back Market. Elle favorise les échanges sur les rôles d’IC très seniors et leur impact croissant dans les entreprises technologiques françaises et internationales.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":21,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":954,"slug":"bof-60","name":"BOF","duration":55,"pause":false,"freeTickets":0,"minSpeakers":1,"description":"Informal sessions of one hour, where like minded people get together and discuss technology.","cssColor":"#ffb8fd","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":44154,"firstName":"Karim","lastName":"Dubois","fullName":"Karim Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":51535,"firstName":"Nadia","lastName":"Marchand","fullName":"Nadia Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":65168,"firstName":"Basile","lastName":"Marchand","fullName":"Basile Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"communauté"},{"name":"ingénierie"},{"name":"leadership"},{"name":"tech"}],"timeSlots":[]},{"id":4034,"title":"Error Prone : l\u0027arme secrète d\u0027un géant du web pour du code sans bug","description":"\u003cem\u003eFatigué des NullPointerException en production et des bugs subtils qui échappent aux tests unitaires ? \u003c/em\u003e\u003cbr\u003e\u003cem\u003eError Prone, l\u0026#39;outil d\u0026#39;analyse statique développé et éprouvé par Google, agit directement au niveau du compilateur javac. \u003c/em\u003e\u003cbr\u003e\u003cem\u003eSa force ? Une analyse sur l\u0026#39;arbre syntaxique (AST) qui détecte des patterns de bugs fins et propose des corrections précises, \u003c/em\u003e\u003cbr\u003e\u003cem\u003ebien au-delà de Checkstyle ou SpotBugs. \u003c/em\u003e\u003cbr\u003e\u003cem\u003eNous commencerons par la mise en œuvre concrète et rapide : intégration et configuration minimaliste d\u0026#39;Error Prone sur un build Maven/Gradle, en soulignant l\u0026#39;avantage technique d\u0026#39;agir au niveau du compilateur.\u003c/em\u003e\u003cbr\u003e\u003cem\u003ePuis, lors d\u0026#39;une démo live où nous ferons échouer la compilation sur des erreurs subtiles, nous montrerons comment les messages d\u0026#39;erreur détaillés facilitent la correction immédiate.\u003c/em\u003e\u003cbr\u003e\u003cem\u003eEnfin, nous terminerons par l\u0026#39;écriture de nos propres checks métier. \u003c/em\u003e","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":76,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":1556,"firstName":"Yanis","lastName":"Moreau","fullName":"Yanis Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"compilateur"},{"name":"analyse"},{"name":"corrections"},{"name":"bugs"}],"timeSlots":[]},{"id":19034,"title":"Un développeur dans le bug bounty privé d\u0027un labo d\u0027IA","description":"Je ne suis pas un pirate, un expert en cybersécurité, un \u0026quot;pentester\u0026quot;.\u003cbr\u003eJe suis développeur. Je construis des chatbots (pour des millions de voyageurs).\u003cbr\u003e\u003cbr\u003eEn 2025 je préparais un workshop ouvert à tous sur le thème « IA et Sécurité » (\u003ca href\u003d\"https://github.com/pi-2r/devfest2025-La-Guerre-des-Prompts-attaques-et-defenses-au-royaume-des-LLM\" rel\u003d\"noopener noreferrer\" target\u003d\"_blank\"\u003elien pour les curieux\u003c/a\u003e).\u003cbr\u003e\u003cbr\u003e\u003cul\u003e\u003cli\u003eJ’ai dû chatouiller un peu trop ChatGPT car j’ai été banni.\u003c/li\u003e\u003cli\u003eEn parallèle, ma candidature a été acceptée dans leur programme de Bug Bounty privé.\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eÇa vous surprend ? Comment, et surtout pourquoi un dev adopterait un mindset d’attaquant ?\u003cbr\u003e\u003cbr\u003eEn 15 min je vous raconterai cette histoire, comment penser hors du cadre pour mieux s’approprier et sécuriser vos futurs Agents IA ...avant qu’un autre ne le fasse pour vous !","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":66,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":1553,"firstName":"Chloé","lastName":"Moreau","fullName":"Chloé Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"openai"},{"name":"jailbreak"},{"name":"sécurité"},{"name":"ia"}],"timeSlots":[]},{"id":2708,"title":"Concevoir et tester un site vraiment accessible","description":"L’accessibilité numérique reste un enjeu majeur : selon l’Observatoire du respect des obligations d’accessibilité, moins de 5 % des sites internet sont réellement accessibles aux personnes handicapées.\u003cbr\u003e\u003cbr\u003eDans cette conférence, je propose de découvrir :\u003cbr\u003e\u003cul\u003e\u003cli\u003eles six erreurs d’accessibilité les plus courantes sur les sites web ;\u003c/li\u003e\u003cli\u003ecomment les corriger facilement grâce à des bonnes pratiques simples en HTML, CSS et Javascript ;\u003c/li\u003e\u003cli\u003ecomment réaliser des tests utilisateurs d\u0026#39;accessibilité avec un lecteur d’écran et le clavier ;\u003c/li\u003e\u003cli\u003eet dans quelle mesure il est possible d\u0026#39;automatiser ces tests.\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eJ’ai créé un site volontairement inaccessible pour une démonstration en live-coding.\u003cbr\u003e\u003cbr\u003eMon objectif est de montrer que l’accessibilité numérique est à la portée des développeurs et développeuses.","summary":"Cette conférence présente les six erreurs d’accessibilité web les plus fréquentes, des solutions pratiques en HTML, CSS et JavaScript, et des méthodes de test (lecteur d’écran, clavier, automatisation). À travers une démonstration en live-coding, elle montre que l’accessibilité numérique est accessible à tous les développeurs.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":80,"track":{"id":2760,"name":"Front-end \u0026 UX","description":"Web and mobile engineering: frameworks (Angular, React, Vue), performance, accessibility, design systems, PWAs and client-side integration patterns — including lightweight AI at the edge."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2566,"firstName":"Nathan","lastName":"Moreau","fullName":"Nathan Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"tests"},{"name":"handicapées"},{"name":"développeurs"},{"name":"accessibilité"}],"timeSlots":[]},{"id":19014,"title":"Quand l\u0027accessibilité rencontre le mob programming : pratiquer, tester, corriger ensemble","description":"Les ateliers d’accessibilité remplissent rarement les salles, et les conférences sur l’accessibilité numérique restent souvent théoriques : on parle du “pourquoi”, rarement du “comment”.\u003cbr\u003eDans cet atelier, nous allons changer ça.\u003cbr\u003e\u003cbr\u003eLe manque de pratique empêche les développeurs et développeuses de progresser. Tester un site avec un lecteur d’écran ou au clavier paraît complexe. Pourtant, il existe des méthodes simples pour apprendre ensemble.\u003cbr\u003ePendant l’atelier, nous corrigerons en direct un site e-commerce volontairement inaccessible, en mob programming. Nous expérimenterons les tests, les outils et les corrections pas à pas.\u003cbr\u003e\u003cbr\u003eQue vous soyez dev front, dev généraliste ou novice en accessibilité, vous repartirez avec :\u003cbr\u003e\u003cul\u003e\u003cli\u003eune méthode pour pratiquer l’accessibilité numérique en équipe\u003c/li\u003e\u003cli\u003eune vision concrète de “ce qui compte vraiment”\u003c/li\u003e\u003cli\u003eet la preuve que démarrer l’accessibilité, ce n’est pas si compliqué\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eNB : pensez à apporter vos écouteurs pour écouter le lecteur d’écran. Si vous êtes une personne sourde ou malentendante ou si vous n’avez pas d’écouteurs, vous pourrez activer la visionneuse de paroles qui transcrira ce que dit le lecteur d’écran.\u003cbr\u003e","summary":"Cet atelier propose une approche pratique de l’accessibilité numérique : en corrigeant en groupe un site e-commerce inaccessible, les participants apprendront à tester, utiliser les outils et améliorer l’accessibilité concrètement. Accessible à tous niveaux, la session offre méthodes et preuves que l’accessibilité est simple à mettre en œuvre.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":37,"track":{"id":2760,"name":"Front-end \u0026 UX","description":"Web and mobile engineering: frameworks (Angular, React, Vue), performance, accessibility, design systems, PWAs and client-side integration patterns — including lightweight AI at the edge."},"sessionType":{"id":984,"slug":"lab-120","name":"2H Hands-on Lab","duration":120,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"2 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2566,"firstName":"Nathan","lastName":"Moreau","fullName":"Nathan Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":19260,"firstName":"Chloé","lastName":"Renaud","fullName":"Chloé Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"atelier"},{"name":"équipe"},{"name":"pratique"},{"name":"accessibilité"}],"timeSlots":[]},{"id":149106,"title":"Le tatouage numérique au service de l\u0027IA générative","description":"En bref : comment fonctionne le tatouage numérique (watermarking), comment il est utilisé chez Meta et quelles en sont les limites actuelles.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003eCette présentation introduira \u003cstrong\u003eMeta Seal\u003c/strong\u003e, un framework open source conçu pour intégrer des tatouages numériques invisibles et robustes dans tous les types de contenus (image, vidéo, audio et texte), notamment :\u003cbr\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003ePixelSeal\u003c/strong\u003e : dédié à l’image et à la vidéo, le modèle le plus abouti, grâce à un entraînement adversarial stable;\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eAudioSeal\u003c/strong\u003e : une solution de tatouage audio compatible avec le streaming en temps réel;\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eTextSeal\u003c/strong\u003e : un framework complet dédié au tatouage de texte, notamment à des fins de recherche.\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eAu-delà des m
