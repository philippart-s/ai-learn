eu de le résoudre? La dette technique peut n’être que la partie visible de quelque chose de plus profond : la dette de design accidentelle (dette de conception). Un problème bien plus complexe, donnant lieu à des logiciels spaghettis et à des microservices en monolithe distribué, dont nous sommes souvent à l’origine sans même nous en rendre compte.\u003cbr\u003e\u003cbr\u003eDans cette conférence, nous explorerons les mécanismes de la dette de design et ses impacts sur notre architecture, nos processus, notre organisation, et même notre business. À travers des exemples concrets, nous verrons comment la détecter, analyser sa profondeur et agir avant qu’elle ne s’ancre durablement.","summary":"Cette conférence explore la dette de design accidentelle, souvent cachée derrière la dette technique classique. Elle analyse ses causes, ses impacts profonds sur l’architecture et l’organisation, et propose des méthodes concrètes pour la détecter, l’évaluer et la traiter avant qu’elle ne compromette durablement les projets.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":382,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2560,"firstName":"Lina","lastName":"Moreau","fullName":"Lina Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":3608,"firstName":"Nour","lastName":"Lefevre","fullName":"Nour Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"architecture"},{"name":"dette"},{"name":"microservices"},{"name":"design"}],"timeSlots":[]},{"id":7868,"title":"Mesurer l\u0027immesurable : comment évaluer les systèmes d\u0027IA générative ?","description":"Les IA génératives révolutionnent la création d’applications, ouvrant des usages variés : assistants, génération de contenu, recherche augmentée, et facilitant des tâches complexes. Mais un défi majeur subsiste : évaluer précisément des produits basés sur des modèles à la fois créatifs et imprévisibles.\u003cbr\u003eCette session explore ce paradoxe : exploiter les LLM tout en maîtrisant l’évaluation de leurs résultats. Nous verrons comment ajuster critères et méthodes pour évaluer exactitude technique, cohérence et pertinence métier. Au programme : limites des métriques classiques, évaluation automatisée via “LLM-as-a-judge” (et ses biais), importance de l’évaluation humaine, et suivi continu pour détecter dérives et effets secondaires.\u003cbr\u003eNous analyserons le cas d’un chatbot RAG, où créativité linguistique et exigence de vérité s’opposent. L’évaluation, équilibre de factualité et fluidité, contrôle la précision sans maîtriser la question posée. Ce cas concret nous servira de fil rouge pour voir comment implémenter un pipeline d\u0026#39;évaluation complet et reproductible.\u003cbr\u003eCette session offre des repères et outils pour évaluer méthodiquement les systèmes génératifs et en faire un atout stratégique en IA.","summary":"Cette session explore l’évaluation des applications d’IA générative, entre créativité et fiabilité. Elle présente les limites des métriques classiques, l’usage du “LLM-as-a-judge”, l’importance du jugement humain et du suivi continu. Un cas de chatbot RAG illustre un pipeline d’évaluation complet et reproductible.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":139,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":5531,"firstName":"Samir","lastName":"Lefevre","fullName":"Samir Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"llm"},{"name":"iagénérative"},{"name":"évaluation"},{"name":"rag"}],"timeSlots":[]},{"id":15152,"title":"Sommes-nous prêts pour la prochaine crise cyber façon Log4Shell ?","description":"\u0026quot;AI era is bright, but full of terrors!\u0026quot;\u003cbr\u003e\u003cbr\u003eIn a world where vulnerabilities like Log4Shell, Shai-Hulud, and the XZ Backdoor make headlines, securing our software ecosystem has never been more critical. In this session, Soroosh, a hands-on architect with experience working on security platform services for large enterprises like Rabobank, will share practical strategies and best practices for securing the software development process, applicable to both small startups and large organizations.\u003cbr\u003e\u003cbr\u003eKey takeaways and questions that will be answered in this session:\u003cbr\u003e\u003cul\u003e\u003cli\u003e[Live Demo] What is a \u0026quot;Supply Chain Attack,\u0026quot; and how dangerous can it be?\u003c/li\u003e\u003cli\u003eAn example of lateral movement that begins with a basic SQL injection attack and escalates to gaining root access to a Kubernetes cluster\u003c/li\u003e\u003cli\u003eExploring new attack vectors in the AI era and the defense strategies to detect, prevent and mitigate them\u003c/li\u003e\u003cli\u003eMost effective practices to secure your CI/CD process\u003c/li\u003e\u003cli\u003ePractical strategies on how Software Bill of Materials (SBOM) help us prepare for the next Log4Shell crisis?\u003c/li\u003e\u003cli\u003eWhat does DevSecOps mean, and what is its main objective?\u003c/li\u003e\u003c/ul\u003e","summary":"This session explores practical strategies to secure the software development lifecycle against modern threats like supply chain attacks and AI-era vulnerabilities. Topics include real-world attack demonstrations, CI/CD security best practices, SBOM benefits, and the role of DevSecOps, with insights relevant to both startups and large enterprises.","audienceLevel":"INTERMEDIATE","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":58,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":1202,"firstName":"Alex","lastName":"Moreau","fullName":"Alex Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Netherlands"}],"keywords":[{"name":"vulnerabilities"},{"name":"security"},{"name":"devsecops"},{"name":"ai"}],"timeSlots":[]},{"id":19003,"title":"Les 10 pièges classiques de l\u0027architecture événementielle","description":"You send a message instead of calling a REST API - what can possibly go wrong? Welcome to the \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eEvent-Driven Adventure Park\u003c/strong\u003e, where every message is a rollercoaster ride! Hold tight as we race through the wild loops of \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eduplicate deliveries\u003c/strong\u003e, swerve through \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eout-of-order twists\u003c/strong\u003e, and dodge \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003erace conditions\u003c/strong\u003e. Survive the \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003edual-write drop\u003c/strong\u003e, escape the \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003econsumer error maze\u003c/strong\u003e, solve the \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003elost message quest\u003c/strong\u003e, and mind the \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eprivacy pirates\u003c/strong\u003e lurking in the shadows. We’ll explore 10 thrilling rides — all real war stories collected with ❤️ from 150 companies Victor has run workshops at. Whether you’re the architect, coder, or ops hero, get ready for a wild tour through the quirks and best practices of messaging systems. No REST, just ride! 🎪","summary":"This talk explores real-world challenges and best practices in event-driven messaging systems, drawing on lessons from 150 companies. Attendees will learn about issues like duplicate deliveries, out-of-order events, race conditions, and more, through engaging stories and practical insights for architects, developers, and operations professionals.","audienceLevel":"INTERMEDIATE","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":193,"track":{"id":1251,"name":"Architecture \u0026 Design","description":"Designs, trade-offs and real-world decisions for building maintainable systems. Case studies, system evolution (monolith→services), DDD, event-driven approaches, resilience and architectural anti-patterns."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":19252,"firstName":"Hugo","lastName":"Renaud","fullName":"Hugo Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Romania"}],"keywords":[{"name":"messaging"},{"name":"bestpractices"},{"name":"events"},{"name":"reliability"}],"timeSlots":[]},{"id":85088,"title":"Cache-moi si tu peux : patterns et pièges du cache en prod","description":"\u0026quot;On va mettre un cache, ça ira plus vite.\u0026quot;\u003cbr\u003eCette phrase a déjà coûté des nuits blanches à bien des équipes.\u003cbr\u003e\u003cbr\u003eLe cache est souvent introduit comme une \u0026quot;optimisation\u0026quot; rapide à mettre en place. En réalité, il transforme profondément le comportement d\u0026#39;un système : cohérence éventuelle, données obsolètes, effets de bord distribués... et bugs impossibles à reproduire. Aujourd\u0026#39;hui, ces mêmes défis réapparaissent dans les architectures intégrant des LLMs, avec l\u0026#39;émergence de modèles comme le \u003cem style\u003d\"background-color: rgb(31, 31, 31); color: rgb(204, 204, 204);\"\u003esemantic caching\u003c/em\u003e.\u003cbr\u003e\u003cbr\u003ePartons ensemble pour un voyage pragmatique dans le monde du cache :\u003cbr\u003e\u003cbr\u003e- ce qu\u0026#39;est réellement un cache (et ce qu\u0026#39;il n\u0026#39;est pas),\u003cbr\u003e- les principaux patterns de caching et leurs compromis,\u003cbr\u003e- les anti-patterns classiques qui transforment une application rapide en cauchemar opérationnel,\u003cbr\u003e- un arbre de décision pour choisir la bonne stratégie.\u003cbr\u003e\u003cbr\u003eCette session vous donnera les outils pour construire des systèmes rapides et prévisibles, et vous aidera à ne plus jamais considérer le cache comme un simple détail d\u0026#39;implémentation.","summary":"Cette session explore les **vrais enjeux du caching** : au‑delà d’une simple optimisation, il modifie la cohérence et la fiabilité d’un système. À travers **patterns, anti‑patterns et stratégies**, elle fournit des repères pour concevoir des architectures rapides, stables et adaptées, jusqu’aux nouveaux usages comme le **semantic caching**.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":214,"track":{"id":1251,"name":"Architecture \u0026 Design","description":"Designs, trade-offs and real-world decisions for building maintainable systems. Case studies, system evolution (monolith→services), DDD, event-driven approaches, resilience and architectural anti-patterns."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":77899,"firstName":"Emma","lastName":"Perrin","fullName":"Emma Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"architecture"},{"name":"performance"},{"name":"cohérence"},{"name":"cache"}],"timeSlots":[]},{"id":54227,"title":"Du storytelling au rendu GPU : quand un opérateur de paris remplace ta console de jeu","description":"Chez Winamax, la gamification n\u0026#39;est pas une simple couche esthétique : c\u0026#39;est un levier stratégique. Poker et paris sont pensés comme de véritables jeux vidéo, donnant naissance à des formats immersifs et narratifs comme Expresso, Space KO ou Bang.\u003cbr\u003e\u003cbr\u003eMais cette ambition créative se heurte à une réalité technique brutale. Comment aligner la vision débridée d\u0026#39;un studio de design transverse avec les contraintes strictes de notre architecture cross-platform (React) ? Performance, mémoire, autonomie, fragmentation : l\u0026#39;équation pour équilibrer richesse visuelle et fluidité est complexe.\u003cbr\u003e\u003cbr\u003eCe talk dévoile les coulisses de City of Gold, notre dernière expérience hybride mêlant poker et paris. Nous partagerons :\u003cbr\u003e\u003cul\u003e\u003cli\u003eLa Collaboration : Comment designers, animateurs et devs itèrent ensemble pour faire de l\u0026#39;animation un outil fonctionnel.\u003c/li\u003e\u003cli\u003eL\u0026#39;Architecture : Les choix structurants pour intégrer des animations Spine complexes au cœur de notre stack technique.\u003c/li\u003e\u003cli\u003eLa Performance : Les compromis nécessaires pour garantir une expérience fluide sur tous les devices.\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eUne plongée dans l\u0026#39;ingénierie de l\u0026#39;expérience joueur.\u003cbr\u003e","summary":"Ce talk explore la **gamification stratégique** chez **Winamax**, où poker et paris deviennent de véritables jeux vidéo. À travers le projet **City of Gold**, il révèle comment design, animation et développement s’allient pour concilier **richesse visuelle**, **architecture React** et **performance multi‑device**, illustrant l’ingénierie d’une expérience joueur fluide et immersive.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":69,"track":{"id":2760,"name":"Front-end \u0026 UX","description":"Web and mobile engineering: frameworks (Angular, React, Vue), performance, accessibility, design systems, PWAs and client-side integration patterns — including lightweight AI at the edge."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":51526,"firstName":"Alex","lastName":"Marchand","fullName":"Alex Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":51538,"firstName":"Sofia","lastName":"Marchand","fullName":"Sofia Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"architecture"},{"name":"gamification"},{"name":"animation"},{"name":"performance"}],"timeSlots":[]},{"id":165201,"title":"À la rencontre de TamboUI","description":"Want to learn more about TamboUI? You\u0026#39;d like to contribute but don\u0026#39;t know how? Simply want to chat with the team or learn about open-source? That session is for you! Opportunities to chat both in French with Cédric or English with Max, don\u0026#39;t be shy!\u003cbr\u003e","summary":"TamboUI invites anyone interested in learning, contributing, or discussing open source to join an informal session. Participants can chat with the team in French with Cédric or in English with Max.","audienceLevel":"BEGINNER","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":5,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":3651,"slug":"meet-with","name":"Meet with ...","duration":90,"pause":false,"invitationOnly":true,"freeTickets":0,"minSpeakers":1,"description":"Meet with ... open-source communities. \nThis type of session doesn\u0027t provide a ticket and requires to have another session accepted.","cssColor":"#b8dbde","scheduleInSmallRoom":true,"countInQuota":false,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":65189,"firstName":"Nadia","lastName":"Perrin","fullName":"Nadia Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":65190,"firstName":"Hugo","lastName":"Perrin","fullName":"Hugo Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Denmark"}],"keywords":[{"name":"tamboui"},{"name":"contribute"},{"name":"chat"},{"name":"opensource"}],"timeSlots":[]},{"id":22577,"title":"Serveurs MCP : bonnes pratiques, choix de conception et leurs impacts","description":"Le \u003cstrong\u003eModel Context Protocol (MCP)\u003c/strong\u003e s’est imposé comme le lien entre les LLMs et les outils, API et données qu’ils utilisent. Mais faire tourner un serveur MCP n’est que le début. Les vrais problèmes apparaissent avec les \u003cstrong\u003echoix de conception\u003c/strong\u003e : serveur générique ou spécifique au domaine, accès ouvert ou contrôlé, flexibilité ou sécurité.\u003cbr\u003eDans ce \u003cstrong\u003eDeep Dive de 3 h\u003c/strong\u003e, nous irons bien au-delà d’une simple introduction. À partir de projets réels, nous analyserons ce qui fonctionne, ce qui casse, et pourquoi. Démos approfondies, discussions d’architecture et exemples concrets serviront à montrer comment ces choix impactent directement l’expérience développeur, les performances, la consommation de tokens et la sécurité.\u003cbr\u003eNous ferons aussi le parallèle avec les débuts des API REST et les erreurs que beaucoup d’équipes ont déjà commises à l’époque — avec une différence majeure aujourd’hui : les LLM et les agents n’observent plus les systèmes, ils \u003cstrong\u003eagissent\u003c/strong\u003e dessus.\u003cbr\u003eÀ l’issue de la session, vous repartirez avec un \u003cstrong\u003ecadre mental clair\u003c/strong\u003e et des \u003cstrong\u003ebonnes pratiques concrètes\u003c/strong\u003e pour concevoir des serveurs MCP \u003cstrong\u003eplus sûrs, plus efficaces et réellement exploitables en production\u003c/strong\u003e.","summary":"Cette session approfondie sur le Model Context Protocol (MCP) analyse, à partir de cas réels, les choix de conception impactant sécurité, flexibilité et expérience développeur. Démos, discussions et bonnes pratiques permettront de concevoir des serveurs MCP efficaces et sûrs, adaptés aux usages réels des LLM et agents.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":115,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":959,"slug":"deep-dive-180","name":"3H Deep Dive","duration":180,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"3 hours sessions where attendees can rapidly immerse themselves in a subject matter with an in-depth examination of a topic or technology.","cssColor":"#c2cced","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":22478,"firstName":"Anaïs","lastName":"Renaud","fullName":"Anaïs Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"llm"},{"name":"architecture"},{"name":"sécurité"},{"name":"mcp"}],"timeSlots":[]},{"id":29768,"title":"Écrire des tests front maintenables et résilients avec Playwright","description":"Tester unitairement ses composants graphiques c\u0026#39;est bien, tester le bon fonctionnement de toute son application via un navigateur pilotable programmatiquement c\u0026#39;est mieux !\u003cbr\u003e\u003cbr\u003eC\u0026#39;est ce que propose Playwright, un outil de tests end to end qui, en plus de très bonne performances, propose une excellente expérience développeur.\u003cbr\u003e\u003cbr\u003eNous vous proposons au cours de ce hand\u0026#39;s on de découvrir par la pratique cet outil et de voir comment il peut vous permettre d\u0026#39;écrire des tests simples, maintenables et résilients.","summary":"Découvrez Playwright, un outil de tests end-to-end performant offrant une excellente expérience développeur. Lors de cet atelier pratique, apprenez à écrire des tests applicatifs simples, maintenables et robustes, en automatisant le contrôle du navigateur pour valider le bon fonctionnement global de votre application web.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":107,"track":{"id":2760,"name":"Front-end \u0026 UX","description":"Web and mobile engineering: frameworks (Angular, React, Vue), performance, accessibility, design systems, PWAs and client-side integration patterns — including lightweight AI at the edge."},"sessionType":{"id":984,"slug":"lab-120","name":"2H Hands-on Lab","duration":120,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"2 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":26794,"firstName":"Inès","lastName":"Dubois","fullName":"Inès Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":26799,"firstName":"Théo","lastName":"Dubois","fullName":"Théo Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"playwright"},{"name":"résilience"},{"name":"tests"},{"name":"navigateur"}],"timeSlots":[]},{"id":2723,"title":"Question pour un cluster : le quiz Kubernetes et ses concepts","description":"Kubernetes est devenu le standard de facto pour déployer et exploiter des applications conteneurisées. Nous l\u0026#39;utilisons, ainsi que son ecosystème, au quotidien, mais le connaît-on si bien ?\u003cbr\u003e\u003cbr\u003eTout au long de ce talk, avec un mix de quiz et de démos en live, vous découvrirez (ou redécouvrirez) les concepts clés de Kubernetes (pods, secrets, services, namespaces...), les composants interne mais aussi les bonnes pratiques d\u0026#39;utilisation.\u003cbr\u003e\u003cbr\u003eUn format original avec un quiz, du fun et des démos, qui conviendra aussi bien aux débutants qu’aux confirmés, afin d\u0026#39;apprendre, réviser et challenger vos connaissances du merveilleux monde de Kubernetes et de son écosystème, tout en s\u0026#39;amusant.\u003cbr\u003e\u003cbr\u003eSoyez là ou le plus rapide pour tenter de gagner des cadeaux !","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":111,"track":{"id":1256,"name":"Cloud \u0026 Plateformes","description":"Backend and platform engineering across technologies: frameworks (Java, Go, Node, Rust…), Kubernetes, serverless, observability, SRE practices and infrastructure-as-code for production systems."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2573,"firstName":"Clara","lastName":"Moreau","fullName":"Clara Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"kubernetes"},{"name":"quiz"},{"name":"écosystème"},{"name":"pods"}],"timeSlots":[]},{"id":149101,"title":"L\u0027IA sur le terrain : remettre l\u0027humain au cœur de la valeur","description":"On présente souvent l’\u003cstrong\u003eintelligence artificielle\u003c/strong\u003e comme une révolution technologique. Pourtant, je suis convaincue qu’elle n’apporte de la valeur qu’à travers deux piliers : \u003cstrong\u003el’humain et le terrain\u003c/strong\u003e.\u003cbr\u003eMon parcours, de la \u003cstrong\u003eGendarmerie nationale\u003c/strong\u003e aux \u003cstrong\u003ePME vosgiennes\u003c/strong\u003e, m’a appris que l’IA échoue quand elle est une fin en soi. Elle réussit lorsqu’elle part des \u003cstrong\u003ebesoins réels\u003c/strong\u003e et embarque les métiers dès le départ. Co-construite avec les équipes, elle devient un levier de transformation, même pour les petites structures.\u003cbr\u003eÀ travers des exemples vécus (\u003cstrong\u003edémolition et appels d’offre, gendarmerie et planning, menuiserie, distribution automobile ou immobilier\u003c/strong\u003e), je montrerai que l’IA est une opportunité de repenser durablement ses processus.\u003cbr\u003e\u003cstrong\u003eMon message est simple :\u003c/strong\u003e l’IA ne se gagne pas derrière un écran, elle se construit dans les territoires. Alors que les LLMs deviennent des commodités, les vraies avancées se situent dans les outils. \u003cstrong\u003eL’enjeu, c’est la valeur et le coût, pas la tech.\u003c/strong\u003e Le futur de l’IA n’est pas à coder : il est à vivre, ensemble, sur le terrain.","summary":"L’exposé défend une IA ancrée dans l’humain et le terrain : elle réussit lorsqu’elle répond à des besoins réels et implique les métiers dès le départ. À partir d’exemples concrets, il montre que l’IA est un levier de transformation locale, où la valeur prime sur la technologie.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":349,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":955,"slug":"keynote-25","name":"Keynote","duration":25,"pause":false,"invitationOnly":true,"freeTickets":2,"minSpeakers":1,"description":"Invitation only: Inspiring and thought provoking keynotes of 20 minutes.","cssColor":"#c8b0d4","scheduleInSmallRoom":false,"countInQuota":false,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":148905,"firstName":"Basile","lastName":"Perrin","fullName":"Basile Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"intelligence"},{"name":"humain"},{"name":"terrain"},{"name":"transformation"}],"timeSlots":[]},{"id":162102,"title":"L\u0027évolution du software engineering","description":"As coding agents like Codex reshape how software is built, the role of the engineer is evolving faster than ever. We’re moving from writing code manually to orchestrating teams of agents. This talk shares how both the OpenAI team and our customers have fundamentally changed the way they ship software.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":111,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":162254,"firstName":"Alice","lastName":"Da Silva","fullName":"Alice Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"engineering"},{"name":"agents"},{"name":"software"},{"name":"automation"}],"timeSlots":[]},{"id":77089,"title":"Carrefour de la concurrence : programmation réactive ou Virtual Threads ?","description":"Reactive programming has been the way to go for extra performance and concurrent programming, now we also have Virtual Threads (Project Loom). Which one should we choose? Can we leverage both? What\u0026#39;s the best approach to write high-performance non-blocking code in our application?\u003cbr\u003e\u003cbr\u003eIn this talk we\u0026#39;ll explain the background behind both paradigms and go over the details together. We will cover the advantages and disadvantages of both paradigms using real-world examples in Quarkus. Furthermore, we will tell you the gotchas so you don\u0026#39;t have to discover them yourself and we will also look ahead at what\u0026#39;s coming next in future Java versions.\u003cbr\u003e\u003cbr\u003eWe will aim to make this talk as simple as possible and show real code combined with live coding. After this talk you will understand both paradigms and be able to choose the right approach for your next project.\u003cbr\u003e","summary":"This talk compares Reactive Programming and Java Virtual Threads (Project Loom) for high-performance, non-blocking applications. Using real Quarkus examples and live coding, it explores advantages, drawbacks, and future trends, helping developers understand both paradigms and choose the optimal approach for their next Java project.","audienceLevel":"INTERMEDIATE","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":108,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":2352,"slug":"deep-dive-120","name":"2H Deep Dive","duration":120,"pause":false,"invitationOnly":false,"freeTickets":2,"description":"2 hours sessions where attendees can rapidly immerse themselves in a subject matter with an in-depth examination of a topic or technology.","cssColor":"#bac6e6","countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":7365,"firstName":"Chloé","lastName":"Garnier","fullName":"Chloé Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Netherlands"}],"keywords":[{"name":"threads"},{"name":"concurrency"},{"name":"reactive"},{"name":"performance"}],"timeSlots":[]},{"id":15170,"title":"Dépassés par nos enfants : 20 ans pour nous, 20 prompts pour eux !","description":"Ce qui nous a pris vingt ans — apprendre des frameworks, déboguer, débattre de la structure des dossiers — nos enfants l’ont fait en… 20 prompts.\u003cbr\u003eDeux papas tech racontent comment leurs fils de 11 et 12 ans ont créé des jeux complets grâce à des plateformes agentiques : niveaux, ennemis, sons, scoring… sans aucune expérience en programmation. Pas d’IDE, pas d’erreurs de syntaxe : seulement de l’intention, interprétée par des agents IA.\u003cbr\u003eNous comparons leur créativité fulgurante à notre approche de développement plus traditionnelle. Nous montrons leurs jeux, expliquons comment ces outils fonctionnent et ce que cela implique pour l’avenir du software.\u003cbr\u003eQuestions clés :\u003cbr\u003e – La programmation traditionnelle touche-t-elle à sa fin ?\u003cbr\u003e – Sommes-nous encore pertinents comme architectes et développeurs ?\u003cbr\u003e – Quelles compétences compteront dans un monde IA-first ?\u003cbr\u003e – Comment passer de “builder” à “orchestrateur” ?\u003cbr\u003eUn talk drôle, un peu piquant, et très actuel pour ceux qui se disent : « On ne faisait pas ça comme ça avant… »","summary":"Deux professionnels de la tech racontent comment leurs enfants ont créé des jeux complets grâce à des plateformes agentiques, sans coder. Ils comparent cette approche “IA‑first” à la programmation traditionnelle et questionnent l’avenir du métier : pertinence des développeurs, nouvelles compétences et rôle d’orchestrateur plutôt que de builder.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":107,"track":{"id":1251,"name":"Architecture \u0026 Design","description":"Designs, trade-offs and real-world decisions for building maintainable systems. Case studies, system evolution (monolith→services), DDD, event-driven approaches, resilience and architectural anti-patterns."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2273,"firstName":"Noé","lastName":"Moreau","fullName":"Noé Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Belgium"},{"id":7391,"firstName":"Lucas","lastName":"Garnier","fullName":"Lucas Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Belgium"}],"keywords":[{"name":"jeux"},{"name":"créativité"},{"name":"programmation"},{"name":"ia"}],"timeSlots":[]},{"id":60505,"title":"Fini la dette documentaire : industrialisez ADRs et READMEs avec Spec-kit","description":"On a tous hérité d\u0026#39;un projet sans trace du \u0026quot;pourquoi\u0026quot; derrière les choix d\u0026#39;architecture. Sachants partis, doc inexistante : chaque modification devient un risque. \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eRésultat : le Time-To-Market s\u0026#39;effondre et l\u0026#39;onboarding devient un calvaire.\u003c/strong\u003e\u003cbr\u003eLa documentation n\u0026#39;est pas un luxe, c\u0026#39;est l\u0026#39;assurance-vie de votre agilité. Mais comment transformer les \u0026quot;bonnes résolutions\u0026quot; en réalité durable sous la pression du delivery ?\u003cbr\u003eDans ce Tools-in-Action, implémentons \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eGitHub Spec-kit\u003c/strong\u003e en live. Pas de slides, uniquement du concret. Partons d\u0026#39;un dossier vide pour construire le socle d\u0026#39;un projet robuste :\u003cbr\u003e\u003cul\u003e\u003cli\u003e\u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eStandardisation\u003c/strong\u003e : Bootstrap d’une structure documentaire cohérente (Clean Arch + docs/) pilotée par le code.\u003c/li\u003e\u003cli\u003e\u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eDiscipline automatisée\u003c/strong\u003e : Configurer Spec-kit pour que votre CI devienne le garant du patrimoine technique (blocage de PR sans ADR, validation de structure).\u003c/li\u003e\u003cli\u003e\u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eFocus DevEx\u003c/strong\u003e : Réduire la charge cognitive des équipes en automatisant la conformité.\u003c/li\u003e\u003c/ul\u003eVenez découvrir comment transformer des intentions fragiles en \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003egarde-fous concrets\u003c/strong\u003e pour protéger la valeur de vos produits.","summary":"Cette session montre comment la documentation, souvent négligée, peut devenir un pilier d’agilité grâce à GitHub Spec‑kit. En live, on apprend à standardiser la structure documentaire, automatiser la discipline via la CI et améliorer l’expérience développeur pour transformer de simples bonnes intentions en pratiques durables et protectrices.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":268,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":34553,"firstName":"Zoé","lastName":"Dubois","fullName":"Zoé Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":53203,"firstName":"Théo","lastName":"Marchand","fullName":"Théo Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"agilité"},{"name":"documentation"},{"name":"automatisation"},{"name":"standardisation"}],"timeSlots":[]},{"id":60532,"title":"Concevoir une application asynchrone avec la Structured Concurrency","description":"Une des fonctionnalités les plus intéressantes de Java 21 sont les Threads Virtuels, développés dans le cadre du projet Loom. L\u0026#39;object est d\u0026#39;autoriser à nouveau le modèle de programmation \u0026quot;un thread par requête\u0026quot; tout en utilisant les capacités CPU du serveur à 100%. Avant l\u0026#39;introduction des threads virtuels, ces performances ne pouvaient être atteintes qu\u0026#39;avec la programmation réactive, au prix de l\u0026#39;écriture d\u0026#39;une code peu lisible et difficile à maintenir. Ce lab vous propose d\u0026#39;écrire une application utilisant les threads virtuels et la programmation concurrente structurée afin de pouvoir lancer vos requêtes réseau en parallèle, et des scoped values pour passer certaines informations d\u0026#39;un point à l\u0026#39;autre de votre application autrement qu\u0026#39;en les passant en paramètres de méthodes. Vous mettrez en application les patterns de code que Loom met à votre disposition. Il vous sera alors possible de les comparer avec d\u0026#39;autres approches, notamment réactive, avec de choisir ce que vous préférez.","summary":"Ce lab explore les **threads virtuels** de Java 21 issus du projet Loom. Les participants y développeront une application concurrente exploitant threads virtuels, programmation structurée et scoped values, afin d’exécuter des requêtes parallèles efficacement et comparer cette approche au modèle réactif en termes de performance et de lisibilité.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":78,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":968,"slug":"lab-180","name":"3H Hands-on Lab","duration":180,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"3 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2568,"firstName":"Élise","lastName":"Moreau","fullName":"Élise Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":60472,"firstName":"Ibrahim","lastName":"Marchand","fullName":"Ibrahim Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"java"},{"name":"concurrence"},{"name":"performances"},{"name":"loom"}],"timeSlots":[]},{"id":77057,"title":"Comment l\u0027IA a transformé la création graphique de BearConf","description":"\u003cstrong\u003eDepuis trois ans, les vidéos d\u0026#39;introduction et l\u0026#39;identité visuelle de BearConf ne passent pas inaperçues. Mais comment sont-elles fabriquées ?\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003eDerrière ces créations se cache une collaboration de 2 passionnés : Stéphane, graphiste, et Nicolas, organisateur de BearConf.\u003cbr\u003e\u003cbr\u003eStéphane explore et nous montre la révolution des outils de création. Cela impacte le métier de créatif, et quelques ressemblances avec l\u0026#39;impact sur le métier de développeur sont clairement visibles.\u003cbr\u003eEnsemble, ils ont exploré les outils de génération d\u0026#39;images et de vidéos les plus avancés du moment, comme Kling ou Weavy. Cette session est un témoignage à deux voix. Stéphane partagera comment ces technologies ont profondément transformé son métier : ses méthodes de travail, sa créativité, son rapport au temps et à l\u0026#39;itération. Un bouleversement qui fait écho à ce que nous vivons en tant que développeurs.\u003cbr\u003eNicolas anticipe que ce qui s\u0026#39;est passé dans l\u0026#39;univers créatif, n\u0026#39;est qu\u0026#39;une préfiguration de ce qui nous attend, côté développeur.\u003cbr\u003e\u003cbr\u003eNous vous montrerons les secrets, cela sera composé de démonstrations, de cascades, de bonnes rigolades et de l\u0026#39;émotion.\u003cbr\u003e\u003cbr\u003e","summary":"Deux passionnés dévoilent les coulisses de la création visuelle de BearConf et l’impact des outils d’IA sur le métier de créatif. Entre démonstrations et témoignages, ils montrent comment ces technologies transforment méthodes, créativité et rythme, annonçant des changements similaires pour les développeurs.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":85,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":1205,"firstName":"Léa","lastName":"Moreau","fullName":"Léa Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":65199,"firstName":"Malik","lastName":"Perrin","fullName":"Malik Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"technologie"},{"name":"création"},{"name":"créativité"},{"name":"vidéo"}],"timeSlots":[]},{"id":51618,"title":"Contribuer à de grands projets open source comme première expérience pro","description":"Je m’appelle Radia, jeune consultante HPC/Cloud chez ANEO.\u003cbr\u003eLorsque j’ai rejoint mon premier projet professionnel, le client, un acteur majeur de l’automobile utilisait un cluster hpc sur Google Cloud basé sur un fork du projet slurm-gcp créé 3 ans auparavant.\u003cbr\u003eCette base fonctionnait encore, mais elle était devenue isolée avec des limitations fonctionnelles.\u003cbr\u003eEntre‑temps, Google a lancé Cluster Toolkit, un ensemble de modules conçus pour déployer des environnements HPC cloud‑native sur GCP. \u003cbr\u003ePour que le client puisse bénéficier des nouvelles fonctionnalités GCP et d’une meilleure maintenabilité nous avons choisi de contribuer directement au projet Google.\u003cbr\u003eCette transition impliquait non seulement de comprendre un héritage technique complexe, mais aussi de participer directement à l’évolution de Cluster Toolkit.\u003cbr\u003eCe Lunch Talk raconte ce parcours : comment en tant que jeune consultante, j’ai trouvé ma place dans un environnement exigeant, comment j’ai appris à contribuer et à collaborer avec des équipes Google.\u003cbr\u003eUn retour d’expérience qui montre que l\u0026#39;on peut contribuer à des projets ouverts, évoluer dans l’écosystème cloud, et apporter de la valeur réelle même au début de sa carrière.\u003cbr\u003e ","summary":"Ce Lunch Talk raconte le parcours d’une jeune consultante HPC/Cloud ayant modernisé un cluster HPC automobile sur GCP en migrant d’un fork Slurm‑GCP vers Cluster Toolkit. Elle partage son apprentissage, sa contribution au projet open source Google et comment valoriser ses compétences dans un environnement cloud exigeant dès le début de carrière.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":30,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":31722,"firstName":"Noé","lastName":"Dubois","fullName":"Noé Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"google"},{"name":"hpc"},{"name":"clustertoolkit"},{"name":"cloud"}],"timeSlots":[]},{"id":61698,"title":"HTTP/3 : plongée dans 37 ans d\u0027histoire du protocole HTTP","description":"Depuis la création du protocole HTTP en 1989, le web a connu plusieurs transformations majeures.\u003cbr\u003eDans cette conférence, j’explore l\u0026#39;évolution de ce protocole clé, en mettant en lumière les avancées qui ont permis d\u0026#39;améliorer la performance, la sécurité et les fonctionnalités d\u0026#39;Internet.\u003cbr\u003eDe HTTP/0.9 à HTTP/3, découvrez comment ces innovations du protocole ont façonné le web moderne (exemples pêle-mêle : Gmail, Netflix, Zoom, Discord, Slack, les applications PWA, Gaming, etc …)","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":150,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":63412,"firstName":"Élise","lastName":"Marchand","fullName":"Élise Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"sécurité"},{"name":"web"},{"name":"http"},{"name":"performance"}],"timeSlots":[]},{"id":4001,"title":"Concevons-nous encore des applications pour les humains ?","description":"Le front-end a toujours été centré sur l’humain et les interfaces visuelles. Mais que se passe-t-il lorsque la majorité des utilisateurs du web ne sont plus des humains, mais des agents IA ?\u003cbr\u003e\u003cbr\u003eAvec l’émergence de protocoles comme MCP, qui permettent à ces agents de naviguer, d’interpréter et d’agir sur le web de manière indépendante, nous faisons face à un tournant radical. Les interfaces traditionnelles deviendront-elles obsolètes ? Les développeurs front-end vont-ils opérer un pivot, passant de la conception d’expériences utilisateur à celle d\u0026#39;optimisateur de prompt ? Les API sont-elles nos nouveaux front-ends ? \u003cbr\u003e\u003cbr\u003eDans cette présentation, nous explorerons ce que l’avenir peut réserver aux développeurs front-end lorsque l’utilisateur n’est plus une personne, mais une machine agissant pour le compte d’un utilisateur. Nous examinerons les implications d’un design axé sur les agents et comment nous devons nous adapter.\u003cbr\u003e\u003cbr\u003eNous aborderons aussi les risques commerciaux, géopolitiques et sociaux de ces changements.\u003cbr\u003e\u003cbr\u003eCette présentation est une introduction à une discussion que nous espérons animer et riche !","summary":"Cette présentation explore l’avenir du front-end à l’ère des agents IA, où interfaces traditionnelles et expérience utilisateur cèdent la place à l’optimisation pour machines. Elle analyse les enjeux techniques, sociaux et économiques, et invite à repenser le rôle du développeur face à cette transformation radicale du web.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":40,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":954,"slug":"bof-60","name":"BOF","duration":55,"pause":false,"freeTickets":0,"minSpeakers":1,"description":"Informal sessions of one hour, where like minded people get together and discuss technology.","cssColor":"#ffb8fd","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":3602,"firstName":"Théo","lastName":"Lefevre","fullName":"Théo Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":3613,"firstName":"Jade","lastName":"Lefevre","fullName":"Jade Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"protocoles"},{"name":"agents"},{"name":"front-end"},{"name":"interfaces"}],"timeSlots":[]},{"id":26832,"title":"Créez votre premier microservice en Rust","description":"Rust est probablement le langage le plus excitant de ces dernières années. Il souffre toutefois d’une réputation qui le cantonne parfois aux outils bas niveau. Dans cette présentation, nous vous montrerons qu’en plus de répondre aux problématiques bas niveau, Rust se prête très bien à la création d’une application REST.\u003cbr\u003eDans un premier temps, nous commencerons par une introduction à Rust (30 minutes) pour explorer les concepts de base : ownership, borrowing, structs, enums, traits…\u003cbr\u003eEnsuite, sous forme d’exercice, nous vous ferons créer pas à pas une application moderne :\u003cbr\u003e\u003cul\u003e\u003cli\u003eun modèle métier au cœur de l’architecture\u003c/li\u003e\u003cli\u003ela persistance dans une base de données SQL\u003c/li\u003e\u003cli\u003el’exposition sous forme d’API REST\u003c/li\u003e\u003cli\u003ela collecte de logs et de métriques OTLP\u003c/li\u003e\u003c/ul\u003e","summary":"Présentation interactive de **Rust** : après une introduction aux concepts clés (ownership, borrowing, structs, enums, traits), les participants développent pas à pas une application REST complète avec modèle métier, base SQL, API exposée et observabilité OTLP, démontrant la polyvalence de Rust au‑delà du bas niveau.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":92,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":984,"slug":"lab-120","name":"2H Hands-on Lab","duration":120,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"2 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":19279,"firstName":"Jade","lastName":"Renaud","fullName":"Jade Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":19281,"firstName":"Louise","lastName":"Renaud","fullName":"Louise Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"application"},{"name":"rest"},{"name":"métriques"},{"name":"rust"}],"timeSlots":[]},{"id":155451,"title":"De l\u0027acier contre les failles, de l\u0027argent contre les zombies : à la chasse aux monstres invisibles de Java","description":"\u0026quot;Evil is evil. Lesser, greater, middling… It’s all the same. But some monsters are harder to track than others.\u0026quot;\u003cbr\u003e\u003cbr\u003eYour \u003cstrong\u003eDependabot\u003c/strong\u003e alerts are cleared. Your \u003cstrong\u003eSnyk\u003c/strong\u003e dashboard is green. You think the contract is closed,  but a \u0026quot;Zombie\u0026quot; is lurking in your transitive dependencies. In the age of the \u003cstrong\u003eEU Cyber Resilience Act\u003c/strong\u003e, a library that is \u0026quot;vulnerability-free\u0026quot; but \u003cstrong\u003eEnd-of-Life (EOL)\u003c/strong\u003e is a monster waiting to strike during your next compliance audit.\u003cbr\u003e\u003cbr\u003eStandard SCA tools are your steel sword (great for known threats), but you need silver for the abandoned, the unmaintained, and the silently dead.\u003cbr\u003e\u003cbr\u003eIn this session, we’ll brew a \u0026quot;Security Decoction\u0026quot; using:\u003cbr\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eSnyk \u0026amp; Dependabot:\u003c/strong\u003e For frontline defence against known CVEs.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eOpenSSF Scorecards \u0026amp; deps.dev:\u003c/strong\u003e To track the \u0026quot;vital signs\u0026quot; of your maintainers.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eHeroDevs EOL Data:\u003c/strong\u003e To identify exactly when a dependency has crossed into the afterlife.\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eJoin us to learn how to build a Java stack that isn\u0026#39;t just secure for today’s build, but sustainable for the long trek ahead.\u003cbr\u003e\u003cbr\u003e","summary":"The session examines the hidden economics and sustainability of Java’s open-source supply chain, highlighting infrastructure costs, EU compliance pressures, and maintainer challenges. It reveals risks from unnoticed end-of-life dependencies and offers practical methods to detect them and decide when third-party EOL support is preferable to rushed migrations.","audienceLevel":"BEGINNER","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":18,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":38002,"firstName":"Ethan","lastName":"Dubois","fullName":"Ethan Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"UK"}],"keywords":[{"name":"security"},{"name":"dependencies"},{"name":"ecosystem"},{"name":"sustainability"}],"timeSlots":[]},{"id":4033,"title":"CVE vs CWE : de la correction des failles à l\u0027éradication des causes racines","description":"\u003cem\u003eVotre outil d\u0026#39;analyse statique vous affiche des CWE-79 ou CWE-89 ? \u003c/em\u003e\u003cbr\u003e\u003cem\u003eVous passez votre temps à appliquer des patchs de CVE sur vos dépendances ? \u003c/em\u003e\u003cbr\u003e\u003cem\u003eIl est temps de comprendre la différence fondamentale qui sépare une faiblesse CWE d\u0026#39;une vulnérabilité CVE. \u003c/em\u003e\u003cbr\u003e\u003cem\u003eEn 15 minutes, nous allons démystifier ce couple, voir des exemples de code concrets et \u003c/em\u003e\u003cbr\u003e\u003cem\u003evous donner les clés pour enfin traiter la cause, et non plus seulement le symptôme.\u003c/em\u003e\u003cbr\u003e\u003cbr\u003eNous commencerons par définir clairement la nature et le lien entre CWE et CVE : pourquoi un CVE fait toujours référence à une ou plusieurs CWE (par exemple, CVE-2022-XXXX lié à CWE-20) ?\u003cbr\u003ePuis nous verrons où croiser ces notions au quotidien (outils SAST/DAST) et ferrons une démo live avec un extrait de code vulnérable, mettant en lumière la CWE concernée et sa correction définitive.\u003cbr\u003eNous terminerons en donnant les clés pour utiliser le CWE Top 25 dans une revue de code, afin de passer d\u0026#39;une stratégie de patch réactif à une prévention durable des failles.","summary":"Cette présentation clarifie la différence entre CWE (faiblesses) et CVE (vulnérabilités), explique leur lien, et montre comment passer d’une gestion réactive des failles à une prévention durable via le CWE Top 25. Des exemples concrets et une démo illustrent l’identification et la correction des faiblesses dans le code.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":90,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":1556,"firstName":"Yanis","lastName":"Moreau","fullName":"Yanis Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"vulnérabilité"},{"name":"dépendances"},{"name":"faiblesse"},{"name":"symptôme"}],"timeSlots":[]},{"id":12085,"title":"Les gardiens du prompt : menaces et recettes de sécurité pour une prod sereine","description":"Les applications GenAI ne jouent pas selon les mêmes règles: non-déterminisme, surface d’attaque mouvante, pression réglementaire (EU AI Act, NIST, …). Bref, si vous ne pentestez pas votre LLM, ce sont vos nerfs qui le seront. Ce talk s’appuie sur plus de trois ans d’expertise terrain à concevoir, déployer et opérer des applications GenAI en production. \u003cbr\u003eOn pose d’abord le cadre, puis on passe aux choses sérieuses, démos à l’appui. Parce que la sécurité, ce n’est pas qu’un poster dans l’open space !\u003cbr\u003e\u003cbr\u003eD’abord, l’état de l’art pour ne pas piloter à vue: OWASP Top 10 for LLM Applications, EU AI Act, ...\u003cbr\u003ePuis, nous présenterons des démos interactives très pratico-pratiques sur une application GenAI:\u003cbr\u003e\u003cul\u003e\u003cli\u003eArchitecture défensive et observabilité d’abord (LangSmith, Langfuse).\u003c/li\u003e\u003cli\u003eAI Guards en I/O pour contrer prompt injections, fuites, ...\u003c/li\u003e\u003cli\u003ePrompt injection \u0026amp; output handling, filtrage sémantique; policy-as-code; quotas/rate limiting (les attaquants détestent).\u003c/li\u003e\u003cli\u003eQA sécurité en continu: jeux d’attaque Garak en CI/CD, et pentests externes pour valider le tout.\u003c/li\u003e\u003c/ul\u003eVous repartirez avec un playbook pratique pour passer de “ça marche en démo” à “c’est solide en prod”, sans magie !\u003cbr\u003e","summary":"Ce talk propose un état de l’art de la sécurité des applications GenAI, illustré par des démos pratiques : architecture défensive, outils d’observabilité, protection contre les attaques (prompt injection, fuites), tests de sécurité automatisés et bonnes pratiques pour passer d’un prototype à une solution de production robuste.","audienceLevel":"ADVANCED","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":88,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2269,"firstName":"Louise","lastName":"Moreau","fullName":"Louise Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":3604,"firstName":"Sacha","lastName":"Lefevre","fullName":"Sacha Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"genai"},{"name":"sécurité"},{"name":"pentest"},{"name":"observabilité"}],"timeSlots":[]},{"id":26828,"title":"Observabilité PostgreSQL : la config des logs qui change tout","description":"L’observabilité des logs PostgreSQL est souvent pauvre par défaut. La gestion est minimale, leur exploitation inexistante, et l’activité réelle de la base de données reste largement invisible, rendant difficile de répondre à des questions pourtant essentielles :\u003cbr\u003e\u003cbr\u003e\u003cul\u003e\u003cli\u003equelle requête attend en permanence la libération d’un verrou sur une table ?\u003c/li\u003e\u003cli\u003equels clients sollicitent le plus l’instance de base de données ?\u003c/li\u003e\u003cli\u003equelles sont les requêtes les plus lentes ?\u003c/li\u003e\u003cli\u003equels types de requêtes sont les plus fréquents pour un utilisateur donné ?\u003c/li\u003e\u003cli\u003eet surtout, \u003cstrong\u003epourquoi\u003c/strong\u003e ces requêtes sont lentes ?\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003ePourtant, correctement configurées, les logs PostgreSQL deviennent une source d’observabilité simple à exploiter, riche et historisée par défaut. Sans export Prometheus ni tableaux de bord coûteux et complexes à construire ou interpréter, il devient possible d’analyser finement les performances et de savoir précisément quoi optimiser dans ses applications.","summary":"Cette session explique comment transformer les logs PostgreSQL, souvent sous‑exploités, en une source d’observabilité riche et historique. Avec une configuration adaptée, il devient possible d’analyser les performances, d’identifier verrous, requêtes lentes ou fréquentes, et d’optimiser ses applications sans outils externes complexes ni tableaux de bord coûteux.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":84,"track":{"id":1254,"name":"Data \u0026 Analytics","description":"Data storage, streaming, processing and ML engineering. Topics include data architecture, feature stores, training pipelines, MLOps and scalable analytics workflows."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2572,"firstName":"Samir","lastName":"Moreau","fullName":"Samir Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"requêtes"},{"name":"logs"},{"name":"performances"},{"name":"observabilité"}],"timeSlots":[]},{"id":2745,"title":"Développer avec l\u0027IA : et si c\u0027était aussi simple qu\u0027ajouter une librairie ?","description":"Intégrer de l\u0026#39;intelligence artificielle (IA) dans nos développements peut nous paraître plus complexe que de les utiliser dans notre quotidien.\u003cbr\u003e\u003cbr\u003eDois-je apprendre un nouveau langage ou une nouvelle stack ?\u003cbr\u003eDurant ce workshop nous vous proposons de vous donner tous les éléments pour intégrer l\u0026#39;IA sans quitter votre langage de prédilection : Java 😍. Ce sera l\u0026#39;occasion de découvrir les Frameworks du moments : LangChain4j, Quarkus, ...\u003cbr\u003e\u003cbr\u003eNous vous invitons à découvrir toutes les facettes d\u0026#39;un chatbot avec l\u0026#39;IA générative (customiser un prompt, rajouter vos données (RAG), appeler des outils locaux ou distants (MCP) et créer des agents) mais aussi parce que l’IA ne se limite pas aux chatbots : faire de la transcription, créer de l\u0026#39;audio ou même faire un traducteur.\u003cbr\u003e\u003cbr\u003eÀ la suite de ce talk vous repartirez avec une boîte à outils vous permettant d\u0026#39;intégrer simplement la puissance des modèles d\u0026#39;IA au sein de vos développements de tous les jours.\u003cbr\u003eEt, toujours pour vous simplifier la vie, venez juste avec votre ordinateur et un navigateur Internet, on se charge du reste pour vous construire un environnement de développement aux petits oignons grâce aux CDE.","summary":"Ce workshop montre comment intégrer facilement l’IA générative dans des applications Java, sans changer de langage. Il explore frameworks (LangChain4j, Quarkus), création de chatbots, transcription, audio, traduction, et propose une boîte à outils pratique. Aucun prérequis, juste un ordinateur et un navigateur, l’environnement est fourni.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":80,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":968,"slug":"lab-180","name":"3H Hands-on Lab","duration":180,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"3 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2588,"firstName":"Léa","lastName":"Lefevre","fullName":"Léa Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":3606,"firstName":"Stéphane","lastName":"Philippart","fullName":"Stéphane Philippart","bio":"Durant plus de 20 ans dans le métier \u0026quot;d\u0026#39;informaticien\u0026quot; j\u0026#39;ai pu me confronter à beaucoup de technologies différentes. Et c\u0026#39;est cette diversité qui me fait continuer à autant aimer notre métier.\u003cbr\u003eDepuis maintenant 4 ans j\u0026#39;ai la chance d\u0026#39;évoluer au sein d\u0026#39;OVHcloud en tant que developer advocate. Cette position me permet de découvrir de nouvelles technologies ou disciplines comme l’Intelligence Artificielle ou le \u0026quot;cloud native\u0026quot; par exemple.\u003cbr\u003e\u003cbr\u003eMais mon cœur de vieux développeur Java ne peut pas trop s\u0026#39;éloigner de cette technologie qui est le fil rouge de mes nombreuses années de développeur.\u003cbr\u003e\u003cbr\u003eC\u0026#39;est avec humilité que je partage cette expérience mais aussi les nouveautés de notre écosystème à travers mes conférences et le meetup TADx co-créé à Tours.","anonymizedBio":"Cet·te intervenant·e cumule plus de vingt ans d’expérience dans le domaine informatique, au cours desquels il·elle a travaillé avec de nombreuses technologies, appréciant particulièrement cette diversité. Depuis quatre ans, il·elle évolue en tant que developer advocate au sein d’un acteur majeur du cloud, ce qui lui permet d’explorer de nouveaux domaines tels que l’intelligence artificielle ou le cloud native. Développeur·se Java de longue date, cette technologie reste le fil conducteur de sa carrière. Il·elle partage son expérience et les nouveautés de l’écosystème à travers des conférences et lors d’un meetup cofondé dans sa région.","company":"OVHcloud","twitterHandle":"wildagsx","linkedInUsername":"philippartstephane","blueskyUsername":"wilda.bsky.social","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"java"},{"name":"intelligence"},{"name":"chatbot"},{"name":"frameworks"}],"timeSlots":[]},{"id":22569,"title":"BOF des leaders de JUG","description":"Le bird-of-a-feather (BOF) est l\u0026#39;occasion pour l\u0026#39;ensemble des organisateurs de soirées techniques communautaires autour de l\u0026#39;écosystème Java de se réunir pour partager leur expérience et pour discuter des synergies possibles.\u003cbr\u003e\u003cbr\u003eC\u0026#39;est l\u0026#39;occasion d\u0026#39;échanger sur les sujets à venir (Valhalla, Leyden, …), les évènements transverses (JavaDay, Snowcamp, Summercamp, …), les tendances du moment (IA, LLM \u0026amp; Agents, Kubernetes \u0026amp; Cloud Native, ARM \u0026amp; native, …), comment les dernières années ont changé la façon d’organiser nos événements (capture vidéo, streaming live, interactions en ligne), et les bonnes pratiques (jeux, goodies, sponsoring, no-shows…). C\u0026#39;est enfin et avant tout un moment de partage entre passionnés qui animent notre communauté.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":33,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":954,"slug":"bof-60","name":"BOF","duration":55,"pause":false,"freeTickets":0,"m
