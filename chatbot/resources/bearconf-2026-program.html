ce de développeur (Windr.org) et de spécialiste IA/Copilot chez GitHub. \u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eDans cette session, nous allons :\u003c/strong\u003e\u003cbr\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eDécouvrir\u003c/strong\u003e le standard Agent Skills et son principe de \u0026quot;progressive disclosure\u0026quot; (divulgation progressive du contexte).\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eImplémenter\u003c/strong\u003e ensemble deux skills concrets lors de démos live focalisées sur le développement logiciel.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eExplorer\u003c/strong\u003e l’écosystème : portabilité entre agents (Copilot, Claude, etc.), ressources communautaires et bonnes pratiques.\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eTransformez votre IA généraliste en un véritable assistant spécialisé.","summary":"La session présente **Agent Skills**, un standard permettant de spécialiser les outils d’IA comme Copilot grâce à des *skills* regroupant instructions et ressources contextuelles. À travers des démos live, les participants apprendront à créer et partager ces *skills* pour transformer une IA généraliste en véritable assistant métier adaptable et collaboratif.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":244,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":31711,"firstName":"Jade","lastName":"Dubois","fullName":"Jade Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"développement"},{"name":"assistant"},{"name":"ia"},{"name":"skills"}],"timeSlots":[]},{"id":61681,"title":"Les design patterns agentiques dont vous êtes le héros","description":"Y en a marre des intros sur les agents IA, on va passer la seconde ! Il est temps de plonger dans le dur, loin des démos “hello world”.\u003cbr\u003e\u003cbr\u003ePour construire vos systèmes multi-agents, vous commencez souvent par assembler des briques classiques : des flux séquentiels, parallèles ou des boucles. La base, quoi ! Mais c’est en combinant ces composants qu’on crée des patterns vraiment puissants, comme les \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eboucles de réflexion\u003c/strong\u003e ou les duos \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003ecritique/reviewer\u003c/strong\u003e.\u003cbr\u003e\u003cbr\u003eMais pour atteindre la véritable « IA-llumination », il va falloir faire des choix : quel pattern de \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eroutage\u003c/strong\u003e adopter ? Comment piloter un \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eessaim\u003c/strong\u003e d\u0026#39;agents pour qu\u0026#39;ils collaborent sans partir dans tous les sens ? Et si on poussait encore plus loin ? Avec \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eMCP\u003c/strong\u003e et l\u0026#39;\u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eA2A\u003c/strong\u003e, on peut désormais imaginer tout un écosystème d\u0026#39;agents distants qui communiquent entre eux. Bref, tout ça et plus encore, mais avec des bouts de code dedans !\u003cbr\u003e\u003cbr\u003eEn tant que committer sur \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eLangChain4j\u003c/strong\u003e et \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eADK for Java\u003c/strong\u003e (Agent Development Kit), je vous propose de vous guider dans cette aventure « agentique ». Mon but : vous donner les clés pour choisir les bonnes abstractions et éviter les impasses techniques sur votre parcours.","summary":"Cette session propose un voyage concret au cœur des systèmes multi‑agents : au‑delà des démos simples, elle explore les patterns de coordination, le routage et la collaboration d’essaims d’agents. Avec LangChain4j et l’ADK for Java, l’objectif est d’apprendre à concevoir, combiner et piloter efficacement des architectures agentiques robustes.","audienceLevel":"ADVANCED","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":329,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":1215,"firstName":"Malik","lastName":"Moreau","fullName":"Malik Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"agents"},{"name":"abstractions"},{"name":"routage"},{"name":"patterns"}],"timeSlots":[]},{"id":83139,"title":"J\u0027ai codé 47 pipelines IaC avant de comprendre : le guide du pipeline ultime","description":"Ça commence toujours très simple: quelques ressources déclarées dans Terraform, un petit pipeline qui s\u0026#39;authentifie au cloud et fait \u0026quot;cd $TF_PATH; terraform init; terraform apply\u0026quot;.\u003cbr\u003e\u003cbr\u003eMais dans 6 mois vous vous retrouvez avec 20 environnements gérés par Terraform, imbriqués à des profondeurs improbables, pour des équipes qui créent de nouveaux projets plus vite que vous ne pouvez dire \u0026quot;terraform apply\u0026quot;. Perso, je n\u0026#39;aime pas devoir maintenir une liste hard-codée de quoi que ce soit, encore moins une liste d\u0026#39;environnements que je ne maintiens pas.\u003cbr\u003e\u003cbr\u003eDans ce talk, je vous montre comment construire un pipeline Terraform CI/CD universel et réutilisable qui :\u003cbr\u003e\u003cul\u003e\u003cli\u003eDétecte automatiquement quels environnements ont changé dans votre PR (sans maintenir de liste !)\u003c/li\u003e\u003cli\u003eExécute en parallèle grâce aux matrix strategies de GitHub Actions\u003c/li\u003e\u003cli\u003eScanne la sécurité et valide le code\u003c/li\u003e\u003cli\u003eRequiert une approbation manuelle pour déployer à la prod\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eVous repartirez avec un pipeline prêt à l\u0026#39;emploi qui scale de 3 à 30+ environnements sans toucher au code!","summary":"Ce talk présente la création d’un pipeline CI/CD Terraform universel et réutilisable, capable de détecter automatiquement les environnements modifiés, d’exécuter les déploiements en parallèle via GitHub Actions, d’intégrer des scans de sécurité et des validations, et de gérer les approbations manuelles pour la production, sans maintenance de listes statiques.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":99,"track":{"id":1256,"name":"Cloud \u0026 Plateformes","description":"Backend and platform engineering across technologies: frameworks (Java, Go, Node, Rust…), Kubernetes, serverless, observability, SRE practices and infrastructure-as-code for production systems."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":77875,"firstName":"Sacha","lastName":"Perrin","fullName":"Sacha Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"United Kingdom"}],"keywords":[{"name":"terraform"},{"name":"environnements"},{"name":"automatisation"},{"name":"pipeline"}],"timeSlots":[]},{"id":91525,"title":"Comment BGP fait tourner Internet — et peut le faire disparaître","description":"Ces dernières années, plusieurs pannes majeures d’Internet ont fait la une : réseaux sociaux inaccessibles, services cloud hors ligne, sites web mondiaux indisponibles …\u003cbr\u003e\u003cbr\u003eDerrière beaucoup de ces incidents se cache un protocole méconnu, discret, et pourtant fondamental : BGP.\u003cbr\u003e\u003cbr\u003eEn 15 minutes, ce talk propose une explication simple et vulgarisée du fonctionnement de BGP : comment Internet s’organise, comment les réseaux se parlent entre eux, et pourquoi une simple mauvaise annonce peut avoir des conséquences mondiales.\u003cbr\u003e\u003cbr\u003ePas de théorie réseau complexe, pas de prérequis : juste les bases e const esc = s => (s == null ? '' : String(s))
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const talks = PROGRAM.map(t => {
  const s = SCHEDULE[t.id] || {};
  const from = s.fromDate || '';
  return {
    title: t.title || '',
    summary: t.summary || '',
    track: (t.track && t.track.name) || '—',
    fmt: (t.sessionType && t.sessionType.name) || '',
    duration: (t.sessionType && t.sessionType.duration) || '',
    speakers: (t.speakers || []).map(x => x.fullName).join(', '),
    day: from.slice(0, 10),
    from: from.slice(11, 16),
    to: (s.toDate || '').slice(11, 16),
    room: (s.room && s.room.name) || ''
  };
}).filter(t => t.day);

const days = [...new Set(talks.map(t => t.day))].sort();
const tracks = [...new Set(talks.map(t => t.track))].sort();
const palette = ['#c0392b','#2980b9','#27ae60','#8e44ad','#d35400','#16a085','#2c3e50','#c2185b','#00838f','#7f8c8d'];
const trackColor = {};
tracks.forEach((tr, i) => trackColor[tr] = palette[i % palette.length]);

const dayLabel = d => new Date(d + 'T12:00:00')
  .toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

let activeDay = days[0];

document.getElementById('total').textContent = talks.length;

const trackSel = document.getElementById('track');
tracks.forEach(tr => {
  const o = document.createElement('option');
  o.value = tr; o.textContent = tr;
  trackSel.appendChild(o);
});

const tabsEl = document.getElementById('tabs');
days.forEach(d => {
  const b = document.createElement('button');
  b.className = 'tab' + (d === activeDay ? ' active' : '');
  b.textContent = dayLabel(d);
  b.onclick = () => { activeDay = d; render(); };
  b.dataset.day = d;
  tabsEl.appendChild(b);
});

document.getElementById('q').addEventListener('input', render);
trackSel.addEventListener('change', render);

function render() {
  [...tabsEl.children].forEach(b => b.classList.toggle('active', b.dataset.day === activeDay));
  const q = document.getElementById('q').value.trim().toLowerCase();
  const trackFilter = trackSel.value;
  const list = talks
    .filter(t => t.day === activeDay)
    .filter(t => !trackFilter || t.track === trackFilter)
    .filter(t => !q || (t.title + ' ' + t.speakers + ' ' + t.track + ' ' + t.summary).toLowerCase().includes(q))
    .sort((a, b) => a.from.localeCompare(b.from) || a.room.localeCompare(b.room));

  document.getElementById('count').textContent = list.length + ' session(s) — ' + dayLabel(activeDay);
  const el = document.getElementById('list');
  if (!list.length) { el.innerHTML = '<div class="empty">Aucune session ne correspond.</div>'; return; }
  el.innerHTML = list.map(t => `
    <div class="card">
      <div class="row1">
        <span class="time">${esc(t.from)}–${esc(t.to)}</span>
        <span class="chip" style="background:${trackColor[t.track]}">${esc(t.track)}</span>
        <span class="fmt">${esc(t.fmt)} · ${esc(t.duration)} min</span>
        <span class="room">${esc(t.room)}</span>
      </div>
      <div class="title">${esc(t.title)}</div>
      <div class="spk">${esc(t.speakers)}</div>
      <div class="sum">${esc(t.summary)}</div>
    </div>`).join('');
}

render();
</script>
