inSpeakers":1,"description":"Informal sessions of one hour, where like minded people get together and discuss technology.","cssColor":"#ffb8fd","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2272,"firstName":"Emma","lastName":"Moreau","fullName":"Emma Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":7386,"firstName":"Sacha","lastName":"Garnier","fullName":"Sacha Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":22478,"firstName":"Anaïs","lastName":"Renaud","fullName":"Anaïs Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"communauté"},{"name":"événements"},{"name":"java"},{"name":"tendances"}],"timeSlots":[]},{"id":15173,"title":"Domptez vos agents : AGENTS.md et context engineering pour une IA déterministe","description":"Alors que la plupart des développeurs se contentent de prompts isolés, comment transformer vos assistants (Claude, Cursor, etc) en véritables partenaires d\u0026#39;ingénierie fiables ? La réponse réside dans la standardisation du contexte.\u003cbr\u003e\u003cbr\u003eDans cette session, nous dépasserons le simple \u0026quot;prompt engineering\u0026quot; pour explorer le \u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: rgb(48, 48, 48);\"\u003eContext Engineering\u003c/strong\u003e via le standard \u003ccode style\u003d\"background-color: rgb(196, 199, 197); color: rgb(40, 42, 44);\" class\u003d\"ql-font-monospace\"\u003eAGENTS.md\u003c/code\u003e. Je vous montrerai comment j\u0026#39;ai transformé ce fichier de configuration en véritable \u0026quot;cerveau\u0026quot; du projet.\u003cbr\u003e\u003cbr\u003eNous verrons concrètement :\u003cbr\u003e• \u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: rgb(48, 48, 48);\"\u003eL\u0026#39;anatomie d\u0026#39;un \u003c/strong\u003e\u003cstrong style\u003d\"background-color: rgb(196, 199, 197); color: rgb(40, 42, 44);\" class\u003d\"ql-font-monospace\"\u003eAGENTS.md\u003c/strong\u003e\u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: rgb(48, 48, 48);\"\u003e performant :\u003c/strong\u003e Définir des personas, des limites (boundaries) et des commandes exécutables pour stopper les hallucinations.\u003cbr\u003e• \u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: rgb(48, 48, 48);\"\u003eLe workflow TDD/BDD assisté :\u003c/strong\u003e Comment structurer des User Stories qui forcent l\u0026#39;agent à écrire les tests \u003cem style\u003d\"background-color: rgb(255, 255, 255); color: rgb(48, 48, 48);\"\u003eavant\u003c/em\u003e le code (Red-Green-Refactor), garantissant ainsi la qualité et le respect des principes SOLID.\u003cbr\u003e• \u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: rgb(48, 48, 48);\"\u003eLa gestion de la mémoire :\u003c/strong\u003e Une approche technique pour gérer l\u0026#39;historique de conversation et éviter le \u0026quot;context rot\u0026quot; (dégradation du contexte) sur les tâches longues.\u003cbr\u003e\u003cbr\u003ePassez d\u0026#39;une IA qui \u0026quot;suggère du code\u0026quot; à une IA qui respecte vos standards d\u0026#39;architecture et vos exigences métier.\u003cbr\u003e\u003cbr\u003e","summary":"Présentation du Context Engineering avec le standard AGENTS.md : structuration des assistants IA en partenaires fiables via configuration avancée, définition de personas, gestion des limites et commandes, TDD/BDD assisté et mémoire conversationnelle, pour garantir qualité, respect des standards et éviter la dégradation du contexte sur projets complexes.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":244,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":7396,"firstName":"Jade","lastName":"Garnier","fullName":"Jade Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"agents"},{"name":"tests"},{"name":"contexte"},{"name":"mémoire"}],"timeSlots":[]},{"id":44003,"title":"Le vrai prix d\u0027un token : la facture cachée de l\u0027IA générative","description":"Nous mesurons le coût de l’IA générative en centimes par tranche de 1 000 tokens ou en millisecondes de latence. Mais chaque prompt s’accompagne d’une facture invisible, réglée en kilowattheures et en litres d’eau.\u003cbr\u003e\u003cbr\u003eÀ mesure que l’adoption de l’IA s’accélère, son impact environnemental devient une contrainte d’ingénierie majeure. Une seule interaction avec un LLM peut consommer jusqu’à dix fois plus d’énergie qu’une requête de recherche traditionnelle, tandis que le cycle de vie du matériel génère des niveaux record de déchets électroniques.\u003cbr\u003e\u003cbr\u003eDans cette session, nous évaluerons le « véritable coût d’un token », en dépassant le battage médiatique pour analyser les données concrètes liées à l’entraînement et à l’inférence des modèles d’IA.\u003cbr\u003e\u003cbr\u003eNous passerons ensuite des métriques aux solutions, en montrant que l’« IA verte » est bien souvent synonyme d’IA efficace et économiquement pertinente. \u003cbr\u003e\u003cbr\u003eVous repartirez avec une boîte à outils pratique pour mieux gérer notre dépendance à ces modèles : apprendre à dimensionner correctement votre architecture, optimiser vos pipelines et mettre en œuvre des approches sensibles au carbone afin de construire une intelligence qui ne coûte pas la planète.","summary":"Cette session analyse le coût environnemental réel de l’IA générative — énergie, eau, déchets — au‑delà des métriques économiques. Elle propose des stratégies d’optimisation et d’architecture pour une « IA verte », plus efficace et durable, conciliant performance technologique et responsabilité écologique.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":203,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpe ctionnalité de plus en plus obscures du css:\u003cbr\u003e\u003cul\u003e\u003cli\u003e\u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eSurface :\u003c/strong\u003e Les sélecteurs, la cascade, etc.\u003c/li\u003e\u003cli\u003e\u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eProfondeur :\u003c/strong\u003e Le \u003cem style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eStacking Context\u003c/em\u003e (pourquoi ton z-index t\u0026#39;ignore), les \u003cem style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eBlock Formatting Contexts\u003c/em\u003e (BFC), etc..\u003c/li\u003e\u003cli\u003e\u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eAbysses :\u003c/strong\u003e Le fonctionnement du moteur de rendu (Render Tree, Layout, Paint), l\u0026#39;enfer des préfixes, blue beanie, etc.\u003c/li\u003e\u003c/ul\u003e\u003cp class\u003d\"ql-align-justify\"\u003eVous repartirez avec une compréhension structurelle du CSS pour ne plus jamais subir vos mises en page et des supers fun facts pour votre prochain dinner mondain.","summary":"Cette session propose de passer de la **bidouille CSS** à une **approche d’ingénierie**. À travers la métaphore de l’iceberg, elle explore les différentes couches du langage : de la cascade aux contextes d’empilement et au moteur de rendu. Objectif : **comprendre structurellement le CSS** et dompter ses comportements cachés.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":111,"track":{"id":2760,"name":"Front-end \u0026 UX","description":"Web and mobile engineering: frameworks (Angular, React, Vue), performance, accessibility, design systems, PWAs and client-side integration patterns — including lightweight AI at the edge."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":51526,"firstName":"Alex","lastName":"Marchand","fullName":"Alex Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"css"},{"name":"debug"},{"name":"navigateur"},{"name":"rendu"}],"timeSlots":[]},{"id":60519,"title":"Supabase : l\u0027alternative open source à Firebase","description":"Comment gérer les données ? Quelle architecture pour l’authentification ? Un serveur pour stocker les fichiers ? Toutes ces questions alors que le développement de votre l’application n’a toujours pas commencé. Imaginez un outil qui fournit toutes les fonctionnalités d’un backend, open source et facilement auto-hébergeable avec docker !\u003cbr\u003e\u003cbr\u003ePendant ce talk, je vais vous présenter les fondations de Supabase : base de données, authentification et gestion des droits, stockage de fichiers avec S3, fonctions serverless etc… Le tout disponible avec des SDK pour différents langages. Nous allons créer, en live, un projet Supabase et nous construirons une application en JavaScript pour illustrer concrètement la simplicité de mettre en place un backend complet.\u003cbr\u003e\u003cbr\u003eVous repartirez avec une vision claire de tout ce qu’offre Supabase et l’étendu des fonctionnalités. Des lors que vous aurez besoin d’une fonctionnalité backend, vous saurez que Supabase est capable d’y répondre simplement et efficacement.","summary":"Ce talk présente **Supabase**, une alternative open source clé en main pour créer un backend complet : base de données, authentification, stockage S3, fonctions serverless et SDK multilangages. En live, une appli JavaScript illustrera sa simplicité, son auto‑hébergement via Docker et la richesse de ses fonctionnalités.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":74,"track":{"id":1251,"name":"Architecture \u0026 Design","description":"Designs, trade-offs and real-world decisions for building maintainable systems. Case studies, system evolution (monolith→services), DDD, event-driven approaches, resilience and architectural anti-patterns."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":60467,"firstName":"Zoé","lastName":"Marchand","fullName":"Zoé Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"authentification"},{"name":"données"},{"name":"backend"},{"name":"supabase"}],"timeSlots":[]},{"id":9733,"title":"Prolongez la vie de vos dashboards : le guide anti-sapin de Noël","description":"Vous voyez ce petit projet de tableau de bord que vous avez bricolé en quelques week-ends ? Celui que vous avez fièrement partagé avec votre équipe… et que plus personne n’ouvre aujourd’hui, y compris vous ?\u003cbr\u003eJe suis désolé de vous l’apprendre, mais vous n’êtes pas seul. La plupart des dashboards suivent le même destin : construits avec enthousiasme, abandonnés à une vitesse impressionnante.\u003cbr\u003e\u003cstrong\u003ePourquoi ? \u003c/strong\u003eEt surtout : \u003cstrong\u003ecomment arrêter de créer des dashboards qui deviennent des villes fantômes ?\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003eDans cette session, vous allez découvrir comment concevoir des visualisations avec \u003cem\u003eintention\u003c/em\u003e — pour que vos dashboards aident réellement à prendre des décisions, plutôt que de faire plisser les yeux.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eCe que vous apprendrez :\u003c/strong\u003e\u003cbr\u003e• Comment choisir la bonne visualisation en fonction de votre objectif\u003cbr\u003e• Quand un simple tableau est en réalité la meilleure option\u003cbr\u003e• Les erreurs de design les plus courantes — et comment les éviter\u003cbr\u003e• Comment prévenir les “sapins de Noël” (trop de couleurs, trop d’icônes, trop de tout) tout en améliorant l’accessibilité de vos dashboards\u003cbr\u003e\u003cbr\u003eEn résumé, une session pour vous aider à construire des dashboards que les gens ont \u003cem\u003eenvie\u003c/em\u003e d’utiliser.\u003cbr\u003e\u003cbr\u003e","summary":"Session dédiée à la conception de dashboards utiles et utilisés, abordant le choix pertinent des visualisations, l’option du tableau, les erreurs de design à éviter, et l’amélioration de l’accessibilité. Objectif : créer des tableaux de bord qui facilitent la prise de décision et évitent l’abandon par les utilisateurs.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":73,"track":{"id":2760,"name":"Front-end \u0026 UX","description":"Web and mobile engineering: frameworks (Angular, React, Vue), performance, accessibility, design systems, PWAs and client-side integration patterns — including lightweight AI at the edge."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":7361,"firstName":"Malik","lastName":"Garnier","fullName":"Malik Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"dashboard"},{"name":"décision"},{"name":"visualisation"},{"name":"design"}],"timeSlots":[]},{"id":19048,"title":"Lancez votre Café IA : 10 conseils pour parler d\u0027IA à tout le monde","description":"L\u0026#39;IA fascine, inquiète, mais reste souvent incomprise par le grand public. Et si vous pouviez changer ça ? Il vous suffit de créer un Café IA !\u003cbr\u003e\u003cbr\u003eCafé IA est un dispositif national et d’intérêt public. L’objectif est de sensibiliser 2 millions de citoyens aux enjeux de l’IA d’ici 2027. La Mission Café IA est de créer partout en France des espaces d\u0026#39;échange conviviaux où chacun peut découvrir, questionner et expérimenter l\u0026#39;intelligence artificielle, sans aucun prérequis technique.\u003cbr\u003e\u003cbr\u003eDans cette conférence, nous vous présentons le concept Café IA et partageons notre retour d\u0026#39;expérience après des mois d\u0026#39;animation. Comment trouver un lieu ? Comment toucher un public non-technophile ? Comment animer sans être expert ? Quels formats fonctionnent ?\u003cbr\u003e\u003cbr\u003eVous repartirez avec des conseils pratiques et actionnables pour lancer votre propre Café IA : dans votre quartier, votre entreprise ou votre communauté. Parce qu\u0026#39;en tant que professionnels du numérique, nous avons une responsabilité : rendre l\u0026#39;IA accessible à tous.\u003cbr\u003ePas besoin d\u0026#39;être formateur ou expert. Il suffit d\u0026#39;un lieu, d\u0026#39;un peu de temps, et de l\u0026#39;envie de partager. La recette est simple, et on vous la donne !\u003cbr\u003e","summary":"Cette conférence présente le dispositif Café IA, visant à sensibiliser 2 millions de citoyens à l’IA d’ici 2027 via des espaces conviviaux partout en France. Conseils pratiques pour créer et animer un Café IA, accessibles à tous, sans compétence technique requise, pour démocratiser l’IA auprès du grand public.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":69,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":22454,"firstName":"Ethan","lastName":"Renaud","fullName":"Ethan Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":22486,"firstName":"Nathan","lastName":"Renaud","fullName":"Nathan Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"échange"},{"name":"citoyens"},{"name":"ia"},{"name":"sensibilisation"}],"timeSlots":[]},{"id":32116,"title":"Trop d\u0027actus, pas assez de temps ? Génère tes propres podcasts de veille !","description":"Toi aussi, tu galères à suivre l\u0026#39;actu tech ? Comme moi, tu aimes garder la maîtrise de tes sources, mais tu empiles des vidéos ou des articles sans jamais trouver le temps de les lire ?\u003cbr\u003e\u003cbr\u003eAlors reprends le contrôle et optimise ton temps de cerveau disponible en créant tes propres podcasts de \u0026quot;revue de presse\u0026quot; à écouter pendant tes trajets, au sport ou chez toi.\u003cbr\u003eCertains outils actuels font en partie le job, mais aucun ne répond à 100% à mes contraintes (UX, diversité des sources, confidentialité, limites, coût, …), alors j\u0026#39;ai créé le mien !\u003cbr\u003e\u003cbr\u003eJe vous propose de passer en revue la stack technique et les challenges rencontrés pour chaque étape du workflow :\u003cbr\u003e\u003col\u003e\u003cli\u003e\u003cstrong\u003eCollecter \u003c/strong\u003edes liens simplement depuis n’importe où (mobile / laptop, sans avoir à créer d’appli dédiée). #lambda #s3\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eExtraire \u003c/strong\u003ele contenu utile (et réussir à gérer tous les formats 🤯). #webscraping #llm\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eSynthétiser\u003c/strong\u003e, enrichir et grouper par thèmes selon mes préférences. #llm\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eGénérer \u003c/strong\u003eun podcast naturel (écouter un robot ça va 2min…). #text2speech #podcastify\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eDiffuser \u003c/strong\u003ele flux pour une écoute partout et tout le temps (avec un mode privé, et une UX correcte). #streaming\u003c/li\u003e\u003c/ol\u003e","summary":"Cette présentation montre comment créer son propre podcast de revue de presse automatisé pour suivre l’actu tech efficacement. L’auteur partage sa stack et ses défis : collecte multi‑appareils, extraction de contenus, synthèse par LLM, génération audio naturelle et diffusion privée, alliant productivité, confidentialité et expérience utilisateur.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":189,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":3622,"firstName":"Noé","lastName":"Lefevre","fullName":"Noé Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"collecte"},{"name":"synthèse"},{"name":"contenu"},{"name":"podcast"}],"timeSlots":[]},{"id":5571,"title":"De 1 000 à 5 000 utilisateurs : scaler sa forge Git sans (trop) souffrir","description":"Passer de 1 000 à 5 000 utilisateurs, gérer la dépréciation brutale d’architectures historiques, repenser entièrement les sauvegardes, absorber une dette technique grandissante tout en maintenant un service critique… Ces dernières années ont souvent ressemblé à une course poursuite avec notre propre infrastructure.\u003cbr\u003e\u003cbr\u003eOn a plusieurs fois cru que la bête nous échappait complètement. Et pourtant, en 2025, on a enfin repris la main !\u003cbr\u003e\u003cbr\u003eDans ce talk 100 % concret, je partage notre retour d’expérience d’administration de GitLab à grande échelle dans un grand SI :\u003cbr\u003e\u003cul\u003e\u003cli\u003eLes vrais pièges du scaling (de 1 VM à 28 nœuds, Rails, Gitaly Cluster, Praefect, Sidekiq, Puma, répartition des charges…)\u003c/li\u003e\u003cli\u003eComment survivre à la dépréciation d’architectures (ex. abandon de NFS) et rebâtir une stratégie backup/restore fiable\u003c/li\u003e\u003cli\u003eLes choix techniques qui nous ont sauvés (et ceux qu’on regrette)\u003c/li\u003e\u003cli\u003eLes bonnes pratiques et leçons apprises pour garder le contrôle d’une plateforme en évolution permanente\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eOps, lead tech, SRE, passionnés de la tech : venez voir comment on a dompté la bête et repartez avec des solutions directement applicables !","summary":"Ce talk partage un **retour d’expérience concret** sur la gestion et le **scaling de GitLab à grande échelle** : défis d’architecture, dette technique, reprise de contrôle après dépréciations, refonte des sauvegardes et choix techniques clés. Il livre **bonnes pratiques et leçons apprises** pour administrer une plateforme critique en constante évolution.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":71,"track":{"id":1256,"name":"Cloud \u0026 Plateformes","description":"Backend and platform engineering across technologies: frameworks (Java, Go, Node, Rust…), Kubernetes, serverless, observability, SRE practices and infrastructure-as-code for production systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":3620,"firstName":"Rayan","lastName":"Lefevre","fullName":"Rayan Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":15658,"firstName":"Aurore","lastName":"Garnier","fullName":"Aurore Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"sauvegardes"},{"name":"gitlab"},{"name":"infrastructure"},{"name":"scaling"}],"timeSlots":[]},{"id":45201,"title":"QR Codes : suivez les points sans vous perdre !","description":"Les QR Codes, tout le monde connaît et les utilise régulièrement. Mais savez-vous vraiment comment ils fonctionnent, pourquoi c\u0026#39;est aussi rapide et fiable, même avec une caméra de faible qualité ou un code en partie caché ou détérioré ?\u003cbr\u003e\u003cbr\u003eNous vous proposons de coder ensemble un lecteur de QR Codes, avec un minimum d\u0026#39;outils :\u003cbr\u003e\u003cul\u003e\u003cli\u003ecapture et analyse de la vidéo issue de la webcam pour détecter la position du code, à l\u0026#39;aide d\u0026#39;OpenCV\u003c/li\u003e\u003cli\u003eextraction et décodage du contenu, avec correction d\u0026#39;erreur grâce à l\u0026#39;algorithme de Reed-Solomon.\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eÀ la fin de cette session, vous devriez être capables de décoder un QR Code à l\u0026#39;oeil nu 🕵️ (et un brouillon…)","summary":"Atelier pratique pour comprendre le fonctionnement des QR Codes et créer un lecteur simple avec OpenCV : capture vidéo, détection, extraction et décodage du contenu via l’algorithme de Reed‑Solomon. Les participants apprendront à analyser et décoder , beaucoup de talent… mais peu d’impact collectif.\u003cbr\u003eAlors plutôt que d’attendre une potion magique, nous avons tenté quelque chose d’assez radical : \u003cstrong style\u003d\"color: rgb(34, 34, 34); background-color: rgb(255, 255, 255);\"\u003ebâtir des communautés de pratique\u003c/strong\u003e.\u003cbr\u003eDans ce talk, nous vous raconterons comment une experte technologique et une ex-marketeuse reconvertie dans l’humain ont lancé une aventure qui allait :\u003cbr\u003e\u003cul\u003e\u003cli\u003etransformer des initiatives locales en véritables leviers d’innovation,\u003c/li\u003e\u003cli\u003efaire émerger de nouvelles opportunités produit et business,\u003c/li\u003e\u003cli\u003eet créer un cadre où apprendre, partager et évoluer devient un moteur stratégique.\u003c/li\u003e\u003c/ul\u003eMais attention : tout ne s’est pas passé comme prévu. Résistances, désillusions, communautés qui meurent, d’autres qui explosent…\u003cbr\u003eCe talk est le récit sincère d’une expérimentation humaine, technologique et organisationnelle, où l’on découvre que les communautés de pratique ne sont pas juste un outil de learning… mais une nouvelle façon d’avoir de l’impact.\u003cbr\u003eSans potion magique. Mais avec beaucoup de surprises.\u003cbr\u003e\u003cbr\u003e","summary":"Ce talk raconte comment la création de communautés de pratique a permis de briser les silos, stimuler l’innovation et renforcer l’impact collectif dans une organisation tech. À travers réussites et échecs, les intervenantes partagent une expérience humaine et organisationnelle où l’apprentissage devient un levier stratégique d’innovation.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":59,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":103756,"firstName":"Élise","lastName":"Perrin","fullName":"Élise Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Switzerland"},{"id":112406,"firstName":"Samir","lastName":"Perrin","fullName":"Samir Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Switzerland"}],"keywords":[{"name":"impact"},{"name":"apprentissage"},{"name":"communautés"},{"name":"innovation"}],"timeSlots":[]},{"id":51639,"title":"Dev agentique : explorer la constellation des agents de code","description":"Hein, quoi ? Et bien Google a lancé différents outils de dev IA. L’objectif de ce talk est de décrypter ces nouveaux outils \u0026quot;agentiques\u0026quot; pour savoir où et quand les utiliser.\u003cbr\u003e\u003cbr\u003eNous explorerons \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eAntigravity\u003c/strong\u003e, un nouvel IDE dont la vue principale est un tableau de bord d\u0026#39;agents de codage. Vous planifiez et reviewez le travail des agents autonomes exécutant les tâches. Bien sûr, vous pouvez à tout moment repasser en mode IDE avec les complétions habituelles.\u003cbr\u003e\u003cbr\u003eNous découvrirons \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eStitch\u003c/strong\u003e, un outil qui coinçoit des UIs mobiles et web, exportables pour \u0026quot;vibe coder\u0026quot; un premier proto directement avec \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eGoogle AI Studio\u003c/strong\u003e (ou autre).\u003cbr\u003e\u003cbr\u003ePlace à \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eJules\u003c/strong\u003e, un agent qui vit dans le cloud et travaille sur GitHub. Confiez lui les tâches ingrates (bugs, MàJ de tests) : il travaillera en arrière-plan et vous enverra une PR !\u003cbr\u003e\u003cbr\u003eEnfin, \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eGemini CLI\u003c/strong\u003e qui mets l\u0026#39;IA dans votre terminal. Mais pas seulement pour du code : un véritable couteau suisse pour toutes vos tâches !\u003cbr\u003e\u003cbr\u003eRejoignez-moi pour voir comment ces outils fonctionnent. Vous repartirez en sachant comment tirer parti de ces nouveaux outils, et surtout, comment devenir un excellent chef pour vos nouveaux stagiaires agentiques !\u003cbr\u003e","summary":"Présentation des nouveaux outils IA de Google : Antigravity (IDE à agents autonomes), Stitch (concepteur d’interfaces avec IA), Jules (agent GitHub automatisé) et Gemini CLI (assistant polyvalent). Le talk montre comment les exploiter efficacement et collaborer avec ces “agents” pour améliorer productivité et gestion des tâches.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":163,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":1215,"firstName":"Malik","lastName":"Moreau","fullName":"Malik Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"agents"},{"name":"outils"},{"name":"google"},{"name":"ia"}],"timeSlots":[]},{"id":26850,"title":"De Java à l\u0027IA : construisez votre premier système d\u0027agents intelligents","description":"🎯 \u003cstrong\u003eRévolutionnez votre vision du développement Java avec l\u0026#39;IA !\u003c/strong\u003e\u003cbr\u003eVous maîtrisez Java ? Vous détenez déjà \u003cstrong\u003e80 % des clés\u003c/strong\u003e pour bâtir des systèmes d\u0026#39;IA sophistiqués. Ne laissez pas Python monopoliser l\u0026#39;innovation : avec \u003cstrong\u003eLangChain4j\u003c/strong\u003e, Java devient le langage roi pour l\u0026#39;IA de production.\u003cbr\u003e\u003cstrong\u003eAu programme de cet atelier intensif :\u003c/strong\u003e\u003cbr\u003e🧱 \u003cstrong\u003ePartie 1 : L\u0026#39;IA comme un service.\u003c/strong\u003e Apprenez à injecter l\u0026#39;intelligence via CDI comme n\u0026#39;importe quel Bean. Gérez la mémoire contextuelle avec les scopes (\u003ccode\u003e@SessionScoped\u003c/code\u003e) et donnez des bras à vos agents grâce au \u003cem\u003eFunction Calling\u003c/em\u003e.\u003cbr\u003e🏗️ \u003cstrong\u003ePartie 2 : L\u0026#39;Architecte d\u0026#39;Agents.\u003c/strong\u003e Allez au-delà du simple chat. Concevez des workflows déclaratifs complexes (séquence, parallèle) et maîtrisez le \u003cstrong\u003ePattern Superviseur\u003c/strong\u003e : une IA capable de planifier et manager d\u0026#39;autres agents de manière autonome.\u003cbr\u003e\u003cbr\u003e🚀 \u003cstrong\u003ePourquoi venir ?\u003c/strong\u003e Repartez avec des \u003cstrong\u003epatterns prêts à l\u0026#39;emploi\u003c/strong\u003e, une maîtrise des protocoles \u003cstrong\u003eMCP/A2A\u003c/strong\u003e et la capacité d\u0026#39;intégrer des agents robustes dans vos architectures d\u0026#39;entreprise.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003ePassez de spectateur à architecte de l\u0026#39;IA !\u003c/strong\u003e 🚀\u003cbr\u003e \u003cbr\u003e\u003cstrong\u003ePlus d\u0026#39;infos et pré-requis\u003c/strong\u003e : \u003ca href\u003d\"https://github.com/ehsavoie/langchain4j-cdi-lab-2026\" rel\u003d\"noopener noreferrer\" target\u003d\"_blank\"\u003ehttps://github.com/ehsavoie/langchain4j-cdi-lab-2026\u003c/a\u003e","summary":"Atelier intensif pour exploiter Java et LangChain4j dans le développement de systèmes d’IA avancés : injection d’intelligence comme service, gestion contextuelle, conception de workflows d’agents autonomes et maîtrise de protocoles. Repartez avec des patterns concrets pour intégrer l’IA efficacement dans vos architectures d’entreprise, au-delà du simple chatbot.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":67,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":968,"slug":"lab-180","name":"3H Hands-on Lab","duration":180,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"3 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuo tion":"Data storage, streaming, processing and ML engineering. Topics include data architecture, feature stores, training pipelines, MLOps and scalable analytics workflows."},"sessionType":{"id":954,"slug":"bof-60","name":"BOF","duration":55,"pause":false,"freeTickets":0,"minSpeakers":1,"description":"Informal sessions of one hour, where like minded people get together and discuss technology.","cssColor":"#ffb8fd","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":77887,"firstName":"Adam","lastName":"Perrin","fullName":"Adam Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"bigdata"},{"name":"podcast"},{"name":"enregistrement"},{"name":"auditeurs"}],"timeSlots":[]},{"id":19008,"title":"Deux ans après, les devs sont toujours là : l\u0027IA ne sert donc à rien ?","description":"En 2023, on nous promettait la fin des développeurs, remplacés par une IA toute-puissante codant plus vite que son ombre. Deux ans plus tard… spoiler : les devs sont toujours là. \u003cbr\u003e\u003cbr\u003eAlors, l’IA, gadget marketing ou véritable game-changer ?\u003cbr\u003e✅ Code assisté ou code halluciné ?\u003cbr\u003e✅ Qu’est-ce que ça apporte au quotidien (et inversement) ?\u003cbr\u003e✅ Quelles nouvelles compétences pour les techs ?\u003cbr\u003e✅ Comment intégrer ces outils dans votre plateforme de développement tout en respectant votre gouvernance sécurité ?\u003cbr\u003e\u003cbr\u003eBref, un talk ludique, sans langue de bois, pour comprendre pourquoi l’IA ne va toujours pas remplacer les devs… mais peut bien les transformer en super-héros selon comment on s’en sert.\u003cbr\u003e\u003cbr\u003eEnfin, nous partagerons un retour d’expérience sans filtre sur deux ans de déploiement de l\u0026#39;IA en contexte réel (plusieurs milliers de développeurs) : les succès, les échecs, et surtout ce que nous avons appris. Histoire de voir si, finalement, l’IA ne sert pas à rien … mais plutôt à réinventer nos métiers.\u003cbr\u003e","summary":"Ce talk explore deux ans d’intégration de l’IA dans le développement logiciel : entre promesses et réalités, il analyse ses apports, ses limites et son impact sur les compétences, la sécurité et les pratiques. Avec humour et retour d’expérience, il montre comment l’IA transforme les développeurs sans les remplacer.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":224,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2589,"firstName":"Nadia","lastName":"Lefevre","fullName":"Nadia Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":19259,"firstName":"Malik","lastName":"Renaud","fullName":"Malik Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"développeurs"},{"name":"ia"},{"name":"transformation"},{"name":"compétences"}],"timeSlots":[]},{"id":51627,"title":"Virtual Threads, Structured Concurrency et Scoped Values dès Java 25","description":"Le projet Loom veut simplifier le modèle de programmation des systèmes asynchrones. Le moyen est de permettre le blocage du thread qui réalise les entrées / sorties sans dégrader les performances de l\u0026#39;application. Cela repose sur l\u0026#39;utilisation de threads virtuels, que Loom nous a apporté en Java 21. Alors que les threads Java classiques sont des enveloppes sur les threads de l\u0026#39;OS, les threads virtuels sont de simples objets Java, que l\u0026#39;on peut créer à la demande. Ils posaient toutefois des problèmes de performances en 21 lors de l\u0026#39;exécution d\u0026#39;un appel I/O dans un bloc synchronisé, point qui a été résolu en Java 24. Outre les threads virtuels, Java 21 nous a apporté deux fonctionnalités en preview : les Scoped Values, qui visent à remplacer l\u0026#39;ancienne API ThreadLocal, et l\u0026#39;API Structured Concurrency, qui permet d\u0026#39;organiser les tâches asynchrones d\u0026#39;une application. L\u0026#39;API Scope Value est finale en Java 25. L\u0026#39;API Structured Concurrency quant à elle a été remaniée en 25 et est toujours en preview en 26. Nous présenterons ces trois éléments en détails, avec des exemples et des patterns de code, et aborderons ce que l\u0026#39;on sait des évolutions futures du projet Loom.","summary":"Le projet Loom simplifie la programmation asynchrone en Java grâce aux threads virtuels, aux Scoped Values et à la Structured Concurrency. La session présente leurs évolutions de Java 21 à 26, les optimisations de performances, ainsi que des exemples et patterns illustrant leurs usages et perspectives futures.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":187,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":959,"slug":"deep-dive-180","name":"3H Deep Dive","duration":180,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"3 hours sessions where attendees can rapidly immerse themselves in a subject matter with an in-depth examination of a topic or technology.","cssColor":"#c2cced","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2568,"firstName":"Élise","lastName":"Moreau","fullName":"Élise Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":12008,"firstName":"Lina","lastName":"Garnier","fullName":"Lina Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"java"},{"name":"threads"},{"name":"asynchrones"},{"name":"loom"}],"timeSlots":[]},{"id":83109,"title":"Passkeys : adieu les mots de passe, bonjour la sécurité sans friction","description":"Avec les passkeys, l\u0026#39;authentification devient plus simple pour l\u0026#39;utilisateur qui n\u0026#39;a plus de mot de passe à retenir, tout en étant potentiellement plus sécurisée car les passkeys empêchent le phishing par nature.  \u003cbr\u003eMais comment ça marche exactement ?\u003cbr\u003e\u003cbr\u003eDans cette présentation, nous décortiquerons ensemble les concepts associés (FIDO, WebAuthn, cryptographie asymétrique, challenge/réponse) puis nous implémenterons pas à pas une authentification par passkey pour illustrer comment ça fonctionne en pratique.\u003cbr\u003e\u003cbr\u003eUne session pratique pour comprendre pourquoi les passkeys ne sont pas “un mot de passe de plus”, mais un véritable changement de paradigme.","summary":"Cette session explique le fonctionnement des passkeys, une méthode d’authentification sans mot de passe plus sûre et résistante au phishing. Elle détaille les principes techniques (FIDO, WebAuthn, cryptographie asymétrique) et propose une implémentation pratique pour illustrer ce changement de paradigme dans la gestion de l’identité numérique.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":175,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":1851,"firstName":"Inès","lastName":"Moreau","fullName":"Inès Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"authentification"},{"name":"sécurité"},{"name":"passkeys"},{"name":"cryptographie"}],"timeSlots":[]},{"id":19025,"title":"Effect-TS : libérer toute la puissance de TypeScript","description":"Ne loupez pas le prochain standard du développement TypeScript et embarquez dans l\u0026#39;aventure Effect-TS dès maintenant. TypeScript fait partie des langages les plus utilisés pour développer des applications et pourtant il est difficile de choisir une librairie qui exploite pleinement le typage pour nous garantir des applications robustes.\u003cbr\u003eC’est la promesse d’Effect-TS, avec une approche systémique combinant la gestion d’erreurs, des dépendances et l’asynchronie. À l’image de briques à assembler, l\u0026#39;approche fonctionnelle rend votre code composable. Effect-TS parvient à allier les avantages de la programmation fonctionnelle à la simplicité du code impératif.\u003cbr\u003eLe champ d\u0026#39;application est vaste et vous permettra de construire des applications de qualité professionnelle aussi bien côté back que front.\u003cbr\u003eCurieux.ses de l’expérimenter ? Que vous soyez débutant.e ou confirmé.e, vous êtes toutes et tous les bienvenu.e.s muni.e.s d’un ordinateur, pour explorer ensemble l’écosystème.\u003cbr\u003eÀ la fin de cet atelier, vous vous sentirez prêt.e.s pour construire vos applications avec Effect-TS.","summary":"Découvrez Effect-TS, une librairie TypeScript innovante qui exploite pleinement le typage pour créer des applications robustes. Elle combine gestion d’erreurs, dépendances et asynchronie avec une approche fonctionnelle simple et composable, adaptée au front comme au back. Atelier accessible à tous pour débuter avec cet écosystème.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":56,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":968,"slug":"lab-180","name":"3H Hands-on Lab","duration":180,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"3 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":12002,"firstName":"Alice","lastName":"Garnier","fullName":"Alice Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":19276,"firstName":"Lucas","lastName":"Renaud","fullName":"Lucas Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":19289,"firstName":"Emma","lastName":"Renaud","fullName":"Emma Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"typescript"},{"name":"typage"},{"name":"asynchronie"},{"name":"fonctionnelle"}],"timeSlots":[]},{"id":149105,"title":"L\u0027IA au service du bien commun : agir avec discernement dans l\u0027incertain","description":"« \u003cstrong\u003eAgir avec raison dans l\u0026#39;incertain\u003c/strong\u003e » disait Blaise Pascal. L’IA n’est ni un ange ni un démon : elle est un outil puissant qui amplifie nos capacités et reflète nos choix. Elle ne ressent rien, ne comprend pas, n\u0026#39;est pas neutre, mais s\u0026#39;intègre de plus en plus à nos vies.\u003cbr\u003eLorsqu’elle est utilisée avec \u003cstrong\u003ediscernement\u003c/strong\u003e, elle devient un levier majeur pour :\u003cbr\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eSoigner mieux\u003c/strong\u003e et comprendre le monde plus finement.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eAnticiper les crises\u003c/strong\u003e et éclairer des décisions complexes.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003ePersonnaliser l’éducation\u003c/strong\u003e et libérer du temps pour la création et l\u0026#39;échange.\u003c/li\u003e\u003c/ul\u003eCette co-évolution avec la machine est une source de progrès si nous en restons les acteurs. Ici, \u003cstrong\u003el’éducation devient clé\u003c/strong\u003e : comprendre ses limites, ses biais et ses forces permet de préserver notre esprit critique et de rester maîtres de nos choix.\u003cbr\u003eL’IA, bien utilisée, n’éteint pas l’humain : elle le rend plus \u003cstrong\u003eagile, curieux et solidaire\u003c/strong\u003e. Elle nous rappelle que le futur n’est pas écrit par les machines, mais par ceux qui savent les mettre au service du \u003cstrong\u003ebien commun\u003c/strong\u003e.","summary":"La présentation défend une IA outil de progrès, ni neutre ni consciente, mais amplificatrice des capacités humaines. Employée avec discernement et accompagnée d’éducation critique, elle peut soigner, anticiper, personnaliser et libérer du temps créatif, faisant de l’humain l’acteur central d’un futur orienté vers le bien commun.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":425,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":955,"slug":"keynote-25","name":"Keynote","duration":25,"pause":false,"invitationOnly":true,"freeTickets":2,"minSpeakers":1,"description":"Invitation only: Inspiring and thought provoking keynotes of 20 minutes.","cssColor":"#c8b0d4","scheduleInSmallRoom":false,"countInQuota":false,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":148904,"firstName":"Aurore","lastName":"Perrin","fullName":"Aurore Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"esprit"},{"name":"progrès"},{"name":"éducation"},{"name":"ia"}],"timeSlots":[]},{"id":85089,"title":"Protégez vos prototypes avec OAuth2-Proxy et Anubis","description":"Dans de nombreuses d’entreprise, il est fréquent de rencontrer des applications internes qui ne proposent pas de gestion native des utilisateurs. Et laisser aux développeurs leur sécurisation peut se révéler complexe et risquée. Ce talk vous propose de découvrir OAuth2-Proxy, un reverse proxy open source et cloud native qui agit comme une protection universelle devant vos applications, sans modifier leur code. \u003cbr\u003e\u003cbr\u003eGrâce à OAuth2-Proxy, il devient possible de déléguer l’authentification à un fournisseur externe (Google, Azure, Keycloak, etc.), assurant ainsi une connexion sécurisée et centralisée pour tous vos utilisateurs. En seulement 10 min, explorez comment protéger rapidement vos applications, gérer l’accès via des IdP (identity provider), et simplifier toutes les problématiques d’authentification, le tout avec une live demo accessible à tou.te.s, même sans compétence avancée en sécurité applicative.\u003cbr\u003e\u003cbr\u003eEnfin, pour éviter le scrapping par l\u0026#39;IA, nous allons ajouter une protection faite par l\u0026#39;outil open-source: Anubis.","summary":"Ce talk présente OAuth2-Proxy, un reverse proxy open source permettant d’ajouter facilement une authentification centralisée et sécurisée à des applications internes sans modifier leur code. Il montre comment déléguer la connexion à des fournisseurs externes et compléter la protection contre le scrapping via l’outil open source Anubis.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":54,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":89104,"firstName":"Zoé","lastName":"Perrin","fullName":"Zoé Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"authentification"},{"name":"sécurité"},{"name":"oauth2-proxy"},{"name":"applications"}],"timeSlots":[]},{"id":7857,"title":"Noms de domaine : la grande histoire des petites extensions","description":"Derrière les quelques lettres qui suivent un point (.com, .fr, .ai...) se cache un univers riche de stratégies techniques, d’enjeux géopolitiques et de batailles commerciales.\u003cbr\u003e\u003cbr\u003eÀ l’approche du nouveau round de l’ICANN prévu en 2026 qui va autoriser de nouvelles extensions, il est temps de revenir sur les fondations techniques du DNS, ainsi que sur les grands épisodes de cette aventure méconnue. Des TLD historiques aux extensions détournées, des dramas autour du .web aux ambitions du Web3, nous explorerons l’évolution d’un système devenu central dans les logiques de souveraineté numérique et d’innovation commerciale.\u003cbr\u003e\u003cbr\u003eUne plongée dans les coulisses d’un Internet en perpétuelle transformation.","summary":"Cette présentation explore l’histoire technique et stratégique des extensions DNS, l’importance des TLD dans la souveraineté numérique, les enjeux commerciaux et les évolutions récentes, à l’occasion du prochain round de l’ICANN en 2026, offrant un panorama inédit des coulisses et transformations du système de noms de domaine.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":63,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2563,"firstName":"Gabriel","lastName":"Moreau","fullName":"Gabriel Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":3616,"firstName":"Adam","lastName":"Lefevre","fullName":"Adam Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"souveraineté"},{"name":"dns"},{"name":"extensions"},{"name":"icann"}],"timeSlots":[]},{"id":149104,"title":"La course à l\u0027IA : risque-t-on de devenir un « territoire servant » ?","description":"En 2025, le \u003cstrong\u003eSommet pour l\u0026#39;action sur l\u0026#39;IA\u003c/strong\u003e a attiré des capitaux étrangers massifs dans les infrastructures de calcul. Parallèlement, la \u003cstrong\u003eCommission de régulation de l’énergie\u003c/strong\u003e a identifié soixante sites « clés en mains » pour faciliter l\u0026#39;approvisionnement électrique des data centers.\u003cbr\u003eCes évolutions soulèvent deux problématiques majeures :\u003cbr\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eLa souveraineté en question :\u003c/strong\u003e Les investissements étrangers entrent en contradiction avec les ambitions d’autonomie affichées par l’État et les collectivités.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eLes conflits d\u0026#39;usages :\u003c/strong\u003e Les pré-réservations d\u0026#39;électricité sont si importantes qu’elles menacent d\u0026#39;autres secteurs critiques comme l\u0026#39;industrie ou la santé.\u003c/li\u003e\u003c/ul\u003eLe retour à une \u003cstrong\u003egéopolitique dure\u003c/strong\u003e ne doit pas imposer des projets au nom de la souveraineté sans que les territoires puissent statuer sur leurs modalités d\u0026#39;implantation.\u003cbr\u003e\u003cstrong\u003eAxes de réflexion :\u003c/strong\u003e\u003cbr\u003e\u003cul\u003e\u003cli\u003eQuelles opportunités réelles pour les territoires accueillant ces infrastructures ?\u003c/li\u003e\u003cli\u003eComment éviter que la France ne devienne un \u003cstrong\u003e« territoire servant »\u003c/strong\u003e, sacrifié sur l\u0026#39;autel de la course à l’IA ?\u003c/li\u003e\u003c/ul\u003eNous répondrons à ces questions à travers l\u0026#39;analyse d\u0026#39;\u003cstrong\u003eexemples concrets\u003c/strong\u003e d’implantations de data centers.","summary":"La conférence analyse l’afflux d’investissements étrangers dans les infrastructures IA et ses tensions : perte de souveraineté, concurrence pour l’électricité avec d’autres secteurs clés. À partir d’exemples de data centers, elle interroge les bénéfices réels pour les territoires et le risque d’une France « territoire servant » de la course à l’IA.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":292,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":955,"slug":"keynote-25","name":"Keynote","duration":25,"pause":false,"invitationOnly":true,"freeTickets":2,"minSpeakers":1,"description":"Invitation only: Inspiring and thought provoking keynotes of 20 minutes.","cssColor":"#c8b0d4","scheduleInSmallRoom":false,"countInQuota":false,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":148903,"firstName":"Idris","lastName":"Perrin","fullName":"Idris Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"énergie"},{"name":"souveraineté"},{"name":"infrastructures"},{"name":"territoires"}],"timeSlots":[]},{"id":37763,"title":"Informatique quantique : cette fois, on vous dit tout !","description":"\u003cstrong\u003eInformatique quantique pour développeurs : comprendre, coder, passer à l’échelle\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003eL’informatique quantique sort du laboratoire et devient progressivement accessible aux développeurs via des SDK open source, des notebooks, des simulateurs et des QPU disponibles dans le cloud. En 2026, la question n’est plus \u003cem\u003e« qu’est-ce que le quantique ? »\u003c/em\u003e mais \u003cem\u003e« comment un développeur peut-il s’en emparer concrètement ? »\u003c/em\u003e\u003cbr\u003e\u003cbr\u003eNous commencerons par poser les bases essentielles pour comprendre le modèle de calcul quantique : qubit, superposition, intrication, et ce que ces concepts impliquent pour un développeur.\u003cbr\u003eNous passerons ensuite au \u003cstrong\u003ecode\u003c/strong\u003e : écrire et exécuter des circuits quantiques, utiliser des SDK modernes, travailler dans des notebooks, tester sur simulateur puis sur de vrais QPU. Vous verrez à quoi ressemble un workflow quantique aujourd’hui.\u003cbr\u003e\u003cbr\u003eEnfin, nous aborderons les \u003cstrong\u003ecas d’usage concrets\u003c/strong\u003e, illustrés par le retour d’expérience d’un grand compte : ce qui fonctionne déjà, les limites actuelles, et comment les équipes tech expérimentent le quantique de manière réaliste et industrielle.\u003cbr\u003e\u003cbr\u003eUne session technique pensée pour les développeurs qui veulent anticiper la prochaine évolution majeure du calcul.","summary":"Session technique pour développeurs sur l’**informatique quantique** : principes fondamentaux (qubit, superposition, intrication), mise en pratique avec SDK, notebooks, simulateurs et QPU ; exploration de workflows et cas d’usage réels issus d’industries. Objectif : comprendre, coder et exploiter concrètement le quantique à grande échelle.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":166,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":959,"slug":"deep-dive-180","name":"3H Deep Dive","duration":180,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"3 hours sessions where attendees can rapidly immerse themselves in a subject matter with an in-depth examination of a topic or technology.","cssColor":"#c2cced","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":7358,"firstName":"Hugo","lastName":"Garnier","fullName":"Hugo Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":148909,"firstName":"Nadia","lastName":"Da Silva","fullName":"Nadia Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":153151,"firstName":"Hugo","lastName":"Da Silva","fullName":"Hugo Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":159601,"firstName":"Sacha","lastName":"Da Silva","fullName":"Sacha Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"qubit"},{"name":"quantique"},{"name":"développeurs"},{"name":"simulateur"}],"timeSlots":[]},{"id":51608,"title":"Sept ans au pays de Kafka","description":"Depuis 7 ans, Michelin a fait le choix des architectures événementielles, avec Kafka comme bus d’événements. \u003cbr\u003e\u003cbr\u003eÀ travers ce retour d\u0026#39;expérience, nous partagerons nos défis et notre expertise. \u003cbr\u003e\u003cbr\u003eNous reviendrons sur les étapes clés : l’installation des premiers clusters, nos premiers pas dans l’exploitation d’architectures distribuées, puis la migration vers un service managé dans le cloud. \u003cbr\u003e\u003cbr\u003eDéployer une architecture événementielle ne se limite pas à Kafka : c’est aussi concevoir des architectures fonctionnelles basées sur les événements et utiliser des librairies comme Kafka Streams. \u003cbr\u003e\u003cbr\u003eEnfin, nous ouvrirons la discussion sur l’avenir : enjeux actuels, exploitation des flux pour l’analytics temps réel, et comment démocratiser le développement d’applications en streaming.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eTakeaways :\u003c/strong\u003e\u003cbr\u003e ✔ Les pièges à éviter et nos leçons apprises\u003cbr\u003e ✔ Bonnes pratiques Kafka Streams, nos contributions open source et nos outils\u003cbr\u003e ✔ Stratégies pour migrer vers le cloud\u003cbr\u003e ✔ Comment préparer l’avenir du streaming et de l’analytics temps réel\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eAudience cible :\u003c/strong\u003e\u003cbr\u003eArchitectes, software et data engineers, responsables IT et toute personne impliquée dans la conception d’architectures distribuées ou événementielles.","summary":"Ce retour d’expérience de Michelin retrace sept ans d’adoption de l’architecture événementielle avec Kafka : déploiement initial, exploitation distribuée, migration cloud et usage de Kafka Streams. Le talk partage bonnes pratiques, outils, erreurs à éviter et perspectives pour le streaming et l’analytics temps réel dans le cloud.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":148,"track":{"id":1254,"name":"Data \u0026 Analytics","description":"Data storage, streaming, processing and ML engineering. Topics include data architecture, feature stores, training pipelines, MLOps and scalable analytics workflows."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":51511,"firstName":"Mehdi","lastName":"Dubois","fullName":"Mehdi Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":51516,"firstName":"Aurore","lastName":"Dubois","fullName":"Aurore Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"streaming"},{"name":"événementiel"},{"name":"cloud"},{"name":"kafka"}],"timeSlots":[]},{"id":26847,"title":"Tic-tac… Maîtrisez le temps et NTP avant qu\u0027il ne soit trop tard","description":"\u003cstrong\u003eQuelle heure est-il vraiment ?\u003c/strong\u003e De l\u0026#39;ombre des cadrans solaires aux horloges atomiques des satellites GPS, la quête de la précision temporelle est un défi technique millénaire. \u003cbr\u003e\u003cbr\u003eEn informatique, \u003cstrong\u003eune dérive de quelques millisecondes peut pourtant ruiner vos transactions distribuées\u003c/strong\u003e, briser vos authentifications ou rendre vos logs illisibles. \u003cbr\u003e\u003cbr\u003eNous explorerons \u003cstrong\u003ecomment nos machines perçoivent le temps\u003c/strong\u003e, de l\u0026#39;oscillation du quartz au cœur de vos cartes mères jusqu\u0026#39;à la hiérarchie de stratum NTP, et de comment les horloges de références structurent une synchronisation fiable.\u003cbr\u003e\u003cbr\u003eCette session décortiquera les rouages internes du protocole (offset, jitter, leap seconds) pour comprendre comment il synchronise le monde malgré l\u0026#39;instabilité des réseaux. \u003cbr\u003e\u003cbr\u003eUn talk mêlant histoire, anecdotes techniques et bonnes pratiques pour des systèmes fiables en production !","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":54,"track":{"id":1256,"name":"Cloud \u0026 Plateformes","description":"Backend and platform engineering across technologies: frameworks (Java, Go, Node, Rust…), Kubernetes, serverless, observability, SRE practices and infrastructure-as-code for production systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":10019,"firstName":"Noé","lastName":"Garnier","fullName":"Noé Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":26782,"firstName":"Sofia","lastName":"Dubois","fullName":"Sofia Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"temps"},{"name":"précision"},{"name":"synchronisation"},{"name":"ntp"}],"timeSlots":[]},{"id":65346,"title":"TamboUI : faire de 2026 l\u0027année de Java dans le terminal","description":"Let\u0026#39;s face it: we\u0026#39;ve all become terminal people again. Between Claude Code, Aider, Cline and a dozen other AI coding assistants, we\u0026#39;re spending more time in our terminals than we have in years. And you know what? It\u0026#39;s actually nice. These tools have reminded us that terminal UIs can be fast, focused, and genuinely pleasant to use.\u003cbr\u003e\u003cbr\u003eRust developers figured this out a while ago with ratatui. Go has bubbletea. Python has textual. These frameworks power some of the most polished CLI tools you use daily. But Java? We\u0026#39;ve been stuck pretending System.out.println is good enough, or wrestling with libraries that feel like they belong in the last century.\u003cbr\u003e\u003cbr\u003eTamboUI (\u0026quot;tambouille\u0026quot;) changes that. It\u0026#39;s a modern TUI framework for Java, inspired by what works in other ecosystems but designed to feel natural on the JVM. Immediate-mode rendering, a constraint-based layout system, and widgets that actually compose well.\u003cbr\u003e\u003cbr\u003eAnd the timing isn\u0026#39;t accidental: GraalVM native-image gives us startup times that rival Go binaries. The excuses for avoiding Java in CLI tooling are gone, let\u0026#39;s embrace this new world!\u003cbr\u003e","summary":"TamboUI is a modern terminal UI framework for Java, inspired by popular Rust, Go, and Python libraries. It offers immediate‑mode rendering, flexible layouts, and composable widgets. Combined with GraalVM’s fast startup, it enables polished, efficient CLI tools and redefines Java’s role in terminal‑based development.","audienceLevel":"BEGINNER","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":54,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":65189,"firstName":"Nadia","lastName":"Perrin","fullName":"Nadia Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":65190,"firstName":"Hugo","lastName":"Perrin","fullName":"Hugo Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Denmark"}],"keywords":[{"name":"java"},{"name":"terminal"},{"name":"tui"},{"name":"framework"}],"timeSlots":[]},{"id":32132,"title":"De l\u0027intuition à l\u0027IA : automatiser l\u0027analyse des tests flaky","description":"\u003cblockquote\u003eClaude l\u0026#39;a fait pendant que je faisais chauffer l\u0026#39;eau pour mon thé.\u003c/blockquote\u003eVoilà comment nos ingénieurs décrivent maintenant l\u0026#39;investigation de tests flaky chez Alan. Pourtant, l\u0026#39;IA n\u0026#39;a pas résolu notre problème. C\u0026#39;est nous qui l\u0026#39;avons fait.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eLe point de départ: \u003c/strong\u003e27 000 tests pytest sur CI distribué. Seule une poignée d\u0026#39;experts avec des scripts non documentés et des années d\u0026#39;expérience pouvaient débugger ces échecs. Les autres ? un retry et on croise les doigts.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eAujourd’hui:\u003c/strong\u003e N\u0026#39;importe quel ingénieur peut investiguer et résoudre un test flaky en quelques minutes avec l\u0026#39;aide d\u0026#39;un agent IA.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eCe qui a fait la différence:\u003c/strong\u003e Pas l\u0026#39;IA. Quatre étapes clés qui ont transformé l\u0026#39;intuition d\u0026#39;experts en un système fiable. L\u0026#39;IA n\u0026#39;est arrivée qu\u0026#39;à la fin, comme cerise sur le gâteau.\u003cbr\u003eVenez découvrir\u003cbr\u003e→ Pourquoi la reproductibilité change tout\u003cbr\u003e→ Comment structurer vos outils pour qu\u0026#39;ils deviennent \u0026quot;IA-ready\u0026quot;\u003cbr\u003e→ Le vrai rôle de l\u0026#39;IA dans l\u0026#39;automation\u003cbr\u003e→ Une approche systématique réutilisable pour vos propres outils de dev\u003cbr\u003e\u003cbr\u003eUn retour d\u0026#39;expérience concret sur l\u0026#39;intégration de l\u0026#39;IA dans vos workflows.","summary":"Retour d’expérience sur la transformation du débogage de tests instables : d’un processus réservé aux experts à une investigation accessible à tous grâce à une approche structurée en quatre étapes. L’IA, ajoutée en fin de parcours, joue un rôle d’accélérateur dans un système reproductible et “IA‑ready” pour les outils de développement.","audienceLevel":"INTERMEDIATE","language":{"id":46,"al
