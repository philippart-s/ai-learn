e accessible à tous.","summary":"Ce talk explore, via la rétro-ingénierie d’une ampoule connectée, la complexité et la sécurité intégrées dans l’IoT. Il analyse l’évolution réglementaire, le code embarqué et les protections, soulignant l’importance croissante de la sécurité dans la conception des objets connectés, tout en restant accessible au grand public.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":128,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":7377,"firstName":"Théo","lastName":"Garnier","fullName":"Théo Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"réglementation"},{"name":"iot"},{"name":"sécurité"},{"name":"rétro-ingénierie"}],"timeSlots":[]},{"id":22562,"title":"Les Value Types ne sont pas si complexes","description":"Les \u003cem\u003evalue classes\u003c/em\u003e du projet Valhalla de l\u0026#39;OpenJDK est sans aucun doute la prochaine grosse évolution du langage Java.\u003cbr\u003eDans cette présentation, nous verrons comment elles permettent de créer des objets immuables, performants, tout en réduisant la consommation mémoire.\u003cbr\u003eNous utiliserons les fractales de Mandelbrot pour illustrer concrètement leur utilité.\u003cbr\u003e\u003cbr\u003eCette session a pour but de comprendre ce que sont les \u003cem\u003evalue classes\u003c/em\u003e, ce qui les distingue des classes traditionnelles et pourquoi Java en a besoin.\u003cbr\u003eAvec des exemples concrets et du live coding vous découvrirez comment elles réduisent les allocations mémoire et permettent de nouvelles optimisations pour la JVM.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":145,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":1210,"firstName":"Sofia","lastName":"Moreau","fullName":"Sofia Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":12008,"firstName":"Lina","lastName":"Garnier","fullName":"Lina Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"optimisation"},{"name":"valhalla"},{"name":"mémoire"},{"name":"immuabilité"}],"timeSlots":[]},{"id":4042,"title":"Automatisation en temps réel : quand Kafka rencontre n8n et l\u0027IA","description":"Dans cette session, nous explorerons comment combiner \u003cstrong\u003eKafka \u003c/strong\u003epour le streaming d’événements, \u003cstrong\u003en8n \u003c/strong\u003e(orchestrateur low-code permettant de connecter des systèmes, d’appeler des APIs, d’exécuter des workflows, ...) et des \u003cstrong\u003eagents IA\u003c/strong\u003e intégrés capables d’analyser et de décider en temps réel.\u003cbr\u003eNous verrons comment cette architecture permet de construire des pipelines de réaction capables de comprendre un événement, d’en interpréter le contexte et de déclencher automatiquement l’action la plus pertinente.\u003cbr\u003eUne démo live montrera comment différents événements Kafka (erreurs, événements métier, ...) sont analysés par un agent IA intégré dans n8n, qui les comprend, les classe et décide de l’action à mener : alerte, action technique, ticket… ou aucune action si c’est du bruit. n8n exécute ensuite cette décision. Un exemple concret de réaction en temps réel où l’interprétation de l’événement guide réellement l’action.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":78,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":3648,"firstName":"Anaïs","lastName":"Lefevre","fullName":"Anaïs Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"événements"},{"name":"n8n"},{"name":"kafka"},{"name":"ia"}],"timeSlots":[]},{"id":22591,"title":"Se retourner le cerveau avec les quiz Java de José et Jean-Michel","description":"Vous utilisez Java pour vos applications depuis des années, vous en connaissez les patterns, les principales API, et vous savez qu\u0026#39;ici ou là il peut y avoir des fonctionnalités méconnues, tout comme des pièges qu\u0026#39;il vaut mieux savoir éviter. Parmi elles, on peut citer la gestion des valeurs nulles, l\u0026#39;immutabilité, qui est de plus en plus utilisée, ou la façon dont l\u0026#39;égalité entre les objets est déterminée, qui peut varier suivant les cas. Même les classes les plus connues de l\u0026#39;API Collection ont parfois des comportements inattendus. Nous vous proposons de découvrir quelques-unes de ces perles cachées, sous forme de quiz auquel vous pourrez participer (n\u0026#39;oubliez pas votre smartphone). Rassurez-vous, toutes les réponses seront montrées par l\u0026#39;exemple, aucune question ne sera laissée sans réponse.","summary":"Ce talk propose un quiz interactif pour explorer des fonctionnalités méconnues et des pièges courants de Java (valeurs nulles, immutabilité, égalité, collections). Les participants découvriront, exemples à l’appui, comment éviter ces écueils et approfondir leur maîtrise du langage. Smartphones recommandés pour participer.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":216,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2568,"firstName":"Élise","lastName":"Moreau","fullName":"Élise Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":5541,"firstName":"Romane","lastName":"Lefevre","fullName":"Romane Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"java"},{"name":"égalité"},{"name":"quiz"},{"name":"immutabilité"}],"timeSlots":[]},{"id":22554,"title":"OSINT : l\u0027art de trouver ce qui ne devrait pas l\u0027être","description":"Dans un monde où l’information est partout, savoir chercher est un pouvoir. L’OSINT (Open Source Intelligence) permet de collecter et d’exploiter des informations publiquement accessibles pour découvrir et croiser des faits.\u003cbr\u003e\u003cbr\u003eDans ce talk vous allez découvrir les bases de l\u0026#39;OSINT en explorant des techniques et outils pour exploiter des données publiques de manière stratégiques. Et enfin nous mettrons ces techniques en pratique lors de plusieurs études de cas.\u003cbr\u003e","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":127,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":22461,"firstName":"Lina","lastName":"Renaud","fullName":"Lina Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"données"},{"name":"information"},{"name":"osint"},{"name":"techniques"}],"timeSlots":[]},{"id":15151,"title":"La magie d\u0027OpenTelemetry : instrumenter votre app en production","description":"OpenTelemetry fait apparaître des traces, des métriques et des logs comme par magie… mais que se passe-t-il réellement derrière cet agent JVM que nous ajoutons machinalement à nos applications ?\u003cbr\u003e\u003cbr\u003eCette présentation vous emmène \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003elà où personne ne regarde\u003c/strong\u003e. Vous verrez comment l’agent d’OpenTelemetry s’infiltre dans votre JVM, intercepte le chargement de vos classes et \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eréécrit votre application à la volée\u003c/strong\u003e. On dissèque le pouvoir du javaagent, de l’API Instrumentation, et la mécanique obscure de ByteBuddy qui permettent d’instrumenter Spring, Servlet, JDBC ou même gRPC, sans toucher à une seule ligne de code. Oui, votre appli tourne… mais pas tout à fait comme vous le croyez.\u003cbr\u003e\u003cbr\u003eVous repartirez avec une vision claire de \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003el’impact réel\u003c/strong\u003e de ces changements en production : latence, allocations, risques de conflits, comportements changés à chaud… ainsi que les bons réflexes pour diagnostiquer ce qui se passe vraiment.\u003cbr\u003e\u003cbr\u003eSi vous utilisez OpenTelemetry sans vraiment savoir ce qu’il se passe dans votre JVM, ou si vous voulez enfin comprendre comment un agent peut réécrire votre application en production, alors bienvenue : cette session vous ouvre la boîte noire… et révèle la magie.","summary":"Cette session dévoile le fonctionnement interne de l’agent OpenTelemetry dans la JVM : interception du chargement des classes, instrumentation à la volée avec javaagent et ByteBuddy, impacts en production (latence, conflits), et bonnes pratiques pour diagnostiquer ces transformations invisibles qui modifient le comportement de vos applications.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":171,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":7386,"firstName":"Sacha","lastName":"Garnier","fullName":"Sacha Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"opentelemetry"},{"name":"instrumentation"},{"name":"jvm"},{"name":"javaagent"}],"timeSlots":[]},{"id":12071,"title":"Avec l\u0027IA, la musique a-t-elle le blues ?","description":"Nous explorerons le fonctionnement des modèles génératifs pour la musique afin de comprendre comment ces systèmes « composent » réellement.\u003cbr\u003e Une démonstration en direct permettra de générer un morceau complet, révélant de façon concrète les forces et limites actuelles de l’IA musicale. Elle offrira aussi un contraste clair entre le processus créatif traditionnel et les nouvelles approches plus rapides, exploratoires et hybrides permises par l’IA.\u003cbr\u003e Nous décortiquerons ensuite l’industrie musicale : sa chaîne de valeur, ses acteurs clés (artistes, labels, éditeurs, plateformes, distributeurs…) et les nouveaux modèles qui émergent. Nous identifierons ceux qui tirent parti de la transformation et ceux qui la subissent.\u003cbr\u003e Enfin, nous proposerons plusieurs scénarios pour anticiper l’avenir du business musical à l’ère des modèles génératifs : démocratisation de la création, redéfinition des rôles, nouveaux marchés, tensions et défis culturels, économiques et juridiques.\u003cbr\u003e Une session pour comprendre, écouter et anticiper ce que l’IA joue déjà… et ce qu’elle s’apprête à réinventer.","summary":"Cette session analyse le fonctionnement des IA génératives musicales, avec démonstration, comparant création traditionnelle et nouvelles méthodes hybrides. Elle décrypte l’évolution de l’industrie musicale, ses acteurs, les bouleversements induits par l’IA, et propose des scénarios d’avenir, entre opportunités, nouveaux modèles et défis juridiques ou culturels.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":90,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":12019,"firstName":"Anaïs","lastName":"Garnier","fullName":"Anaïs Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"musique"},{"name":"industrie"},{"name":"modèles"},{"name":"ia"}],"timeSlots":[]},{"id":22579,"title":"APIs, contextes et prompts : la nouvelle stack du dev web","description":"En 2026, le métier de développeur web change. Entre les Web AI APIs (Prompt API, Summarizer API, …), le fichier LLMs.txt, les outils comme Context7 pour toujours disposer de la bonne documentation, Gemini dans votre navigateur pour débugger votre code avec de l’IA, et même les Chrome DevTools qui intègrent désormais un serveur MCP, une nouvelle stack s’impose.\u003cbr\u003e\u003cbr\u003eMais dans ce nouveau paysage, des questions se posent :\u003cbr\u003e\u003cul\u003e\u003cli\u003eEst-ce qu’un dev web écrit encore du code aujourd’hui ?\u003c/li\u003e\u003cli\u003eQuelle est la place de l’humain au milieu de tous ces agents ?\u003c/li\u003e\u003cli\u003eEt est-ce qu’un jour NPM installera enfin ce qu’on lui demande, sans télécharger la terre entière au passage ?\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eEntre copilotes dans le navigateur, APIs de contexte partagé et documentation générative, le métier ne disparaît pas: il change. Dans ce talk, nous suivrons la naissance d’une feature jusqu’à sa mise en production, en montrant comment ces outils transforment le quotidien d’un dev web pour le meilleur... mais aussi le pire 😅. Une démo concrète pour explorer ce que signifie coder en 2026, avec les pièges à éviter (qui a dit \u0026quot;vibe-coding?\u0026quot;).\u003cbr\u003e\u003cbr\u003eParce que l’IA, c’est pas que pour celles et ceux qui font du Python — mais aussi pour les devs web.","summary":"En 2026, le métier de développeur web évolue avec l’intégration massive d’outils IA, d’APIs et de copilotes. Ce talk explore, via une démo concrète, comment ces technologies transforment la création et la mise en production de fonctionnalités, en questionnant la place de l’humain et les nouveaux défis du métier.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":206,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2257,"firstName":"Lucas","lastName":"Moreau","fullName":"Lucas Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":3641,"firstName":"Lina","lastName":"Lefevre","fullName":"Lina Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"développeur"},{"name":"outils"},{"name":"documentation"},{"name":"ia"}],"timeSlots":[]},{"id":26837,"title":"Kubernetes et la JVM, le duo","description":"L\u0026#39;essor de Kubernetes pour l\u0026#39;orchestration de conteneurs soulève des défis spécifiques lors du déploiement d\u0026#39;applications Java. L\u0026#39;interaction entre les mécanismes internes de la JVM (threads, compilation JIT, collecteur de mémoire) et les contraintes des conteneurs peut induire des problèmes de performance.\u003cbr\u003eCe talk mettra en lumière les défis, les opportunités et les bonnes pratiques lors de l\u0026#39;exécution d\u0026#39;applications Java dans un contexte de conteneurisation sous Kubernetes pour comprendre et optimiser afin de tirer le meilleur parti de ces deux technologies : construction et optimisation des images, mécanismes internes de la JVM, gestion de la mémoire, limitations des ressources, amélioration du temps de démarrage, compilation native, fonctionnalités avancées de la JVM comme CDS, CRaC, AOT...","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":199,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":5541,"firstName":"Romane","lastName":"Lefevre","fullName":"Romane Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":26776,"firstName":"Nadia","lastName":"Dubois","fullName":"Nadia Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"java"},{"name":"kubernetes"},{"name":"jvm"},{"name":"conteneurs"}],"timeSlots":[]},{"id":2713,"title":"Quand un simple bug réseau vous entraîne dans les entrailles de Linux","description":"S\u0026#39;il y a bien un projet utilisé à l\u0026#39;échelle mondiale, c\u0026#39;est le Kernel Linux. Un énorme morceau de code, que celles et ceux qui en ont entendu parler considèrent comme un code mystique, inaccessible au commun des mortels. Il n\u0026#39;en est pourtant rien : derrière ce nom qui rebute, se cache en réalité du code, des gens, des communautés. Et comme tout code, on y retrouve des features à coder, des bugs à corriger, des smells à nettoyer.\u003cbr\u003e\u003cbr\u003eAujourd\u0026#39;hui, je vous propose de vous faire découvrir comment nous avons découvert, investigué, troubleshooté, corrigé, et proposé à la communauté un correctif pour un bug vieux de six ans dans le Kernel ; et ce sans expérience précédente sur cet énorme morceau de code.\u003cbr\u003e\u003cbr\u003eEt rassurez-vous ; le code le plus compliqué que vous allez voir aujourd\u0026#39;hui, c\u0026#39;est un \u003ccode style\u003d\"background-color: rgb(255, 255, 255); color: oklch(0.21 0.034 264.665);\"\u003eif\u003c/code\u003e de deux lignes. Aucune connaissance n\u0026#39;est requise, nous reprenons tout de zéro pour devenir des héros !\u003cbr\u003e","summary":"Découvrez comment, sans expérience préalable, nous avons identifié, corrigé et soumis un patch pour un bug de six ans dans le Kernel Linux. Cette présentation démystifie le Kernel, montre l’accessibilité de sa communauté et guide pas à pas, sans prérequis technique, vers une première contribution.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":87,"track":{"id":1256,"name":"Cloud \u0026 Plateformes","description":"Backend and platform engineering across technologies: frameworks (Java, Go, Node, Rust…), Kubernetes, serverless, observability, SRE practices and infrastructure-as-code for production systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2567,"firstName":"Maya","lastName":"Moreau","fullName":"Maya Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"communauté"},{"name":"bug"},{"name":"kernel"},{"name":"correctif"}],"timeSlots":[]},{"id":32126,"title":"Et si on débuguait notre rapport au temps ?","description":"« Je n\u0026#39;ai pas le temps » Cette phrase est sur toutes les lèvres. Entre livraisons toujours plus rapides, backlogs infinis et injonctions à l’efficacité, nous avons fait du temps une course contre la montre.\u003cbr\u003e\u003cbr\u003eLe problème ? Nous parlons beaucoup de dette technique, mais trop peu de \u003cstrong\u003edette temporelle \u003c/strong\u003e: cette surcharge chronique, ce multitâche permanent, ces rituels mal calibrés qui s\u0026#39;accumulent. Jusqu\u0026#39;à ce que notre cerveau sature, que la qualité s\u0026#39;effondre et que les équipes s\u0026#39;épuisent.\u003cbr\u003e\u003cbr\u003e\u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: rgb(34, 34, 34);\"\u003eL\u0026#39;IA nous sauve-t-elle de ce bug ?\u003c/strong\u003e Elle produit plus, plus vite et nous donne l\u0026#39;illusion d\u0026#39;absorber la surcharge.\u003cbr\u003eOu ne fait-elle qu\u0026#39;appuyer sur \u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: rgb(34, 34, 34);\"\u003el\u0026#39;accélérateur\u003c/strong\u003e ?\u003cbr\u003e\u003cbr\u003eEn se basant sur la sociologie et les neurosciences, cette conférence dévoile comment nos cerveaux, nos habitudes, nos outils et nos organisations entretiennent ce sprint perpétuel ... parfois malgré nous.\u003cbr\u003e\u003cbr\u003eMais surtout : elle propose une façon concrète de \u003cstrong style\u003d\"color: rgb(34, 34, 34); background-color: rgb(255, 255, 255);\"\u003edébuguer notre rapport au temps\u003c/strong\u003e, individuellement et collectivement, pour retrouver un rythme plus soutenable, plus lucide et plus performant.","summary":"La conférence explore la « dette temporelle » qui épuise nos équipes : surcharge, multitâche et accélération constante. En s’appuyant sur la sociologie et les neurosciences, elle questionne le rôle de l’IA dans ce rythme effréné et propose des pistes concrètes pour rééquilibrer notre rapport au temps et à la performance.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":337,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":31721,"firstName":"Emma","lastName":"Dubois","fullName":"Emma Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"temps"},{"name":"surcharge"},{"name":"soutenable"},{"name":"ia"}],"timeSlots":[]},{"id":19013,"title":"Docker Agent : simplifier encore plus la création d\u0027agents IA","description":"L\u0026#39;IA est partout et plus facile à utiliser. Nous pensons qu\u0026#39;elle peut être encore plus simple.\u003cbr\u003e\u003cbr\u003eAvec l\u0026#39;IA, soit on écrit un prompt, soit on utilise un agent pré-construit, soit on code des agents complexes. Nous pensons qu\u0026#39;il y a de la place pour des agents ad-hoc écrits en quelques secondes, sans code. Pourquoi ? Parce que l\u0026#39;IA est souvent utile pour des tâches jamais vues et c\u0026#39;est un superpouvoir d\u0026#39;assembler modèles, prompts et outils en une équipe d\u0026#39;agents créés pour cette tâche.\u003cbr\u003e\u003cbr\u003eNous présenterons Docker Agent, une boîte à outils agentique open-source. Il est efficace pour créer des agents de code, de cuisine, d\u0026#39;écriture ou tout autre type. Il convient aux agents jetables comme aux réutilisables et partageables. Il communique avec tous les LLM (locaux ou distants), utilise n\u0026#39;importe quel outil (MCP ou non), et se connecte à d\u0026#39;autres écosystèmes via HTTP, A2A, MCP ou ACP.\u003cbr\u003e\u003cbr\u003eNous l\u0026#39;avons utilisé pour implémenter Gordon v2, l\u0026#39;assistant IA de Docker. Il remplace des milliers de lignes de Python par un seul fichier YAML.\u003cbr\u003e\u003cbr\u003eLe public apprendra à construire des agents simples, puis une flotte d\u0026#39;agents, et découvrira comment nous l\u0026#39;utilisons au quotidien.","summary":"Présentation de **Docker Agent**, boîte à outils open‑source pour créer en quelques secondes des agents IA sans code. Compatible avec tous les LLM et outils, il permet de combiner modèles, prompts et services pour des tâches uniques. Démonstration avec Gordon v2, assistant Docker, et création d’agents réutilisables ou jetables.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":169,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":19266,"firstName":"Manon","lastName":"Renaud","fullName":"Manon Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":19267,"firstName":"Sacha","lastName":"Renaud","fullName":"Sacha Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"agents"},{"name":"open-source"},{"name":"automatisation"},{"name":"ia"}],"timeSlots":[]},{"id":15161,"title":"Quand la magie exécute du code","description":"Et, si les véritables secrets des magiciens ne se cachaient pas dans leurs mains… mais dans leurs algorithmes ? \u003cbr\u003eDans ce talk, nous explorerons les mécanismes invisibles qui se cachent derrière les tours de magie et qui ressemblent étonnamment à des algorithmes. De la simple prédiction “impossible” aux routines sophistiquées utilisées par les illusionnistes professionnels, beaucoup d’effets reposent en réalité sur des structures mathématiques et des modèles proches de l’informatique. \u003cbr\u003eEn déconstruisant quelques tours emblématiques, nous montrerons comment ils fonctionnent comme de véritables programmes : état initial, transformations contrôlées, contraintes, vérifications. \u003cbr\u003e« Toute technologie suffisamment avancée est indiscernable de la magie. » Ce voyage entre magie, maths et informatique propose une nouvelle manière d’aborder les concepts fondamentaux de l’algorithmique, tout en gardant intacts le mystère et l’émerveillement, car parfois, la magie n’est qu’une forme poétique de technologie.","summary":"Ce talk révèle comment de nombreux tours de magie reposent sur des algorithmes et structures mathématiques proches de l’informatique. En déconstruisant des illusions, il propose d’explorer l’algorithmique sous un angle original, mêlant magie, mathématiques et technologie, tout en conservant mystère et émerveillement.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":67,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":12002,"firstName":"Alice","lastName":"Garnier","fullName":"Alice Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":26780,"firstName":"Hugo","lastName":"Dubois","fullName":"Hugo Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"mathématiques"},{"name":"informatique"},{"name":"magie"},{"name":"algorithmes"}],"timeSlots":[]},{"id":29772,"title":"Bye bye vendor lock-in : standardisez vos feature flags avec OpenFeature","description":"Le Feature Flagging est devenu une pratique incontournable pour découpler le déploiement de la mise en production. \u003cbr\u003eMais avez-vous remarqué à quel point nos applications sont devenues dépendantes des SDKs propriétaires ? \u003cbr\u003eChanger de solution (SaaS ou maison) implique souvent de réécrire une bonne partie du code. C\u0026#39;est la définition même du vendor lock-in.\u003cbr\u003e\u003cbr\u003eC\u0026#39;est là qu\u0026#39;intervient \u003cstrong\u003eOpenFeature\u003c/strong\u003e. Projet incubé par le CNCF \u003cem\u003e(incubating stage)\u003c/em\u003e, le but est de faire pour le Feature Flagging ce qu\u0026#39;OpenTelemetry a fait pour l\u0026#39;observabilité : créer un standard unifié.\u003cbr\u003e\u003cbr\u003eDans ce talk, nous découvrirons :\u003cbr\u003e\u003cul\u003e\u003cli\u003eQu\u0026#39;est ce qu\u0026#39;un feature flag et pourquoi est ce devenu le meilleur outil pour les développeurs.\u003c/li\u003e\u003cli\u003ePourquoi nous avions besoin d\u0026#39;un standard.\u003c/li\u003e\u003cli\u003eL\u0026#39;architecture d\u0026#39;OpenFeature et comment elle unifie les APIs.\u003c/li\u003e\u003cli\u003eComment changer de backend de Feature Flag en changeant 3 lignes de configuration, sans toucher à votre code métier.\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eVenez découvrir comment reprendre le contrôle de vos feature flags !","summary":"Cette présentation explique comment OpenFeature, projet du CNCF, vise à standardiser le feature flagging pour éviter le verrouillage propriétaire des SDKs. Grâce à une API unifiée, il devient possible de changer de solution de feature flagging sans modifier le code métier, facilitant ainsi la gestion et l’interopérabilité des applications.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":147,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":30552,"firstName":"Manon","lastName":"Dubois","fullName":"Manon Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"feature"},{"name":"standard"},{"name":"déploiement"},{"name":"openfeature"}],"timeSlots":[]},{"id":5586,"title":"🤖 Apprendre à notre IA à ... apprendre 🧠  ","description":"RAG, MCP, tooling, function calling, agents, fine tuning, training, ... \u003cbr\u003eQue de termes barbares mais qui ont tous le même objectif : faire en sorte que le modèle d\u0026#39;intelligence artificielle que vous utilisez réponde correctement à vos questions et attentes 😅. \u003cbr\u003eEt pour ça il va falloir ajouter de la connaissance, des données (privée ou publiques, ...).\u003cbr\u003e\u003cbr\u003eDurant ce talk je vous propose d\u0026#39;y voir un peu plus clair dans cette jungle des acronymes puis, fort de connaître les différences, vous proposer comment l\u0026#39;implémenter en tant que développeuses et développeurs.\u003cbr\u003e\u003cbr\u003eChaque approche a ses spécificités, ses avantages et ses inconvénients. \u003cbr\u003eA la fin de ce talk, non seulement vous saurez choisir la bonne approche, mais aussi ajouter dans vos développements quotidiens la dose d\u0026#39;IA utile.","summary":"Ce talk clarifie les notions clés de l’IA moderne — RAG, MCP, agents, fine‑tuning, etc. — pour aider les développeurs à comprendre leurs différences, avantages et limites. Il fournit des repères concrets pour choisir la bonne approche et intégrer efficacement l’intelligence artificielle dans leurs projets quotidiens.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":264,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":2352,"slug":"deep-dive-120","name":"2H Deep Dive","duration":120,"pause":false,"invitationOnly":false,"freeTickets":2,"description":"2 hours sessions where attendees can rapidly immerse themselves in a subject matter with an in-depth examination of a topic or technology.","cssColor":"#bac6e6","countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":3606,"firstName":"Stéphane","lastName":"Philippart","fullName":"Stéphane Philippart","bio":"Durant plus de 20 ans dans le métier \u0026quot;d\u0026#39;informaticien\u0026quot; j\u0026#39;ai pu me confronter à beaucoup de technologies différentes. Et c\u0026#39;est cette diversité qui me fait continuer à autant aimer notre métier.\u003cbr\u003eDepuis maintenant 4 ans j\u0026#39;ai la chance d\u0026#39;évoluer au sein d\u0026#39;OVHcloud en tant que developer advocate. Cette position me permet de découvrir de nouvelles technologies ou disciplines comme l’Intelligence Artificielle ou le \u0026quot;cloud native\u0026quot; par exemple.\u003cbr\u003e\u003cbr\u003eMais mon cœur de vieux développeur Java ne peut pas trop s\u0026#39;éloigner de cette technologie qui est le fil rouge de mes nombreuses années de développeur.\u003cbr\u003e\u003cbr\u003eC\u0026#39;est avec humilité que je partage cette expérience mais aussi les nouveautés de notre écosystème à travers mes conférences et le meetup TADx co-créé à Tours.","anonymizedBio":"Cet·te intervenant·e cumule plus de vingt ans d’expérience dans le domaine informatique, au cours desquels il·elle a travaillé avec de nombreuses technologies, appréciant particulièrement cette diversité. Depuis quatre ans, il·elle évolue en tant que developer advocate au sein d’un acteur majeur du cloud, ce qui lui permet d’explorer de nouveaux domaines tels que l’intelligence artificielle ou le cloud native. Développeur·se Java de longue date, cette technologie reste le fil conducteur de sa carrière. Il·elle partage son expérience et les nouveautés de l’écosystème à travers des conférences et lors d’un meetup cofondé dans sa région.","company":"OVHcloud","twitterHandle":"wildagsx","linkedInUsername":"philippartstephane","blueskyUsername":"wilda.bsky.social","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"données"},{"name":"approche"},{"name":"intelligence"},{"name":"développeurs"}],"timeSlots":[]},{"id":32115,"title":"MLOps : comprendre et combattre la dégradation des modèles en production","description":"Déployer des modèles de machine learning en production, ce n’est jamais vraiment “terminé”. ll arrive fréquemment qu’un modèle affiche d’excellents résultats - par exemple 90 % de précision - lors des phases d’entraînement et de validation, puis, une fois en production, voie ses performances se dégrader progressivement. Après quelques semaines ou quelques mois, on peut constater une baisse significative (parfois jusqu’à 60 %) avec un impact direct sur la qualité du service rendu aux utilisateurs ou aux systèmes qui en dépendent.\u003cbr\u003e\u003cbr\u003eCette présentation s’intéresse à ce qui se passe \u003cem\u003eaprès\u003c/em\u003e le déploiement. En une quinzaine de minutes, nous verrons comment \u003cstrong\u003esuivre et évaluer correctement les performances d’un modèle en production\u003c/strong\u003e, \u003cstrong\u003eidentifier les causes les plus courantes de leur dégradation\u003c/strong\u003e (évolution des données, changements d’usage, biais, dérive du modèle, etc.) et, surtout, \u003cstrong\u003equelles actions mettre en place pour y remédier\u003c/strong\u003e.\u003cbr\u003e\u003cbr\u003eElle s’adresse à un public de niveau débutant à intermédiaire, intéressé de près ou de loin par le machine learning. Aucune connaissance approfondie en MLOps n’est nécessaire pour la suivre.","summary":"Cette présentation explique comment surveiller et maintenir les performances des modèles de machine learning après leur déploiement. Elle aborde les causes de dégradation (dérive, biais, évolution des données) et les actions correctives possibles, offrant aux participants une approche pratique du suivi en production, sans prérequis avancés en MLOps.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":58,"track":{"id":1254,"name":"Data \u0026 Analytics","description":"Data storage, streaming, processing and ML engineering. Topics include data architecture, feature stores, training pipelines, MLOps and scalable analytics workflows."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":31716,"firstName":"Rayan","lastName":"Dubois","fullName":"Rayan Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"déploiement"},{"name":"production"},{"name":"dérive"},{"name":"performance"}],"timeSlots":[]},{"id":19027,"title":"De développeur à hacker : savoir casser pour mieux protéger","description":"Aujourd\u0026#39;hui, on prend conscience de l\u0026#39;importance de la cybersécurité. Le moindre piratage peut causer des pertes importantes, tant au niveau image que financier.\u003cbr\u003eLes premiers acteurs de la sécurité sont les développeurs.\u003cbr\u003eAvec une vision basée sur la seule protection des SI, ils n\u0026#39;envisagent pas les possibilités de l\u0026#39;attaquant.\u003cbr\u003eNe faudrait-il pas changer ce fonctionnement et passer dans la peau de l\u0026#39;attaquant pour élargir notre vision de la cybersécurité ?\u003cbr\u003eComme le dit le dicton : \u0026quot;ce sont les braconniers qui font les meilleurs gardes-chasse\u0026quot; 😉\u003cbr\u003eChaque développeur devrait coder avec en tête : \u0026quot;comment je pourrais bien casser ça ?\u0026quot;\u003cbr\u003eDevenir hacker c\u0026#39;est revenir aux basiques (modèle OSI, algorithmie...) et accroître sa polyvalence.\u003cbr\u003eAu cours de ce talk, nous allons voir pourquoi la cybersécurité embarquée dans les équipes de développement est un atout majeur pour les projets, et quelles compétences doivent être apprises afin d\u0026#39;acquérir une maîtrise complète des systèmes d\u0026#39;information en place.\u003cbr\u003eL\u0026#39;objectif est qu\u0026#39;en sortant, vous soyez convaincu qu\u0026#39;il est essentiel de \u0026quot;penser au hack de son code\u0026quot; au moment même de son écriture, et que vous soyez armés pour proposer une correction 💪","summary":"Ce talk montre pourquoi intégrer la cybersécurité au cœur du développement est essentiel. En adoptant la vision d’un attaquant, les développeurs renforcent la robustesse de leurs systèmes. L’objectif : apprendre les bases du hacking pour anticiper les failles et coder en pensant dès l’origine à la sécurité.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":157,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":19283,"firstName":"Rayan","lastName":"Renaud","fullName":"Rayan Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"développeur"},{"name":"cybersécurité"},{"name":"attaquant"},{"name":"hacker"}],"timeSlots":[]},{"id":44751,"title":"5 piliers pour manager une équipe performante, même à distance","description":"Le remote ne casse pas la performance, il révèle les problèmes d\u0026#39;une équipe: décisions floues, travail invisible, flux chaotique, coordination coûteuse.\u003cbr\u003e\u003cbr\u003eTiré de mon expérience de manager en scale-up mais aussi de coaching, je partagerai 5 piliers actionnables que j’utilise pour remettre du rythme et de la confiance : autonomie avec cadre, maîtrise du flux, prévention des dysfonctions d’équipe, documentation qui sert de source de vérité, et amélioration continue qui produit des changements réels.\u003cbr\u003e\u003cbr\u003eVous repartirez avec des outils concrets et et des anti-patterns à éviter quand on veut “manager moins” sans manager “moins bien”.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":202,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":44151,"firstName":"Maya","lastName":"Dubois","fullName":"Maya Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"flux"},{"name":"autonomie"},{"name":"amélioration"},{"name":"confiance"}],"timeSlots":[]},{"id":54203,"title":"PostgreSQL Analytics : It\u0027s a Trap !","description":"\u0026quot;PostgreSQL n\u0026#39;est pas fait pour l\u0026#39;analytique\u0026quot; — cette phrase magique justifie 90% des migrations vers ClickHouse, DuckDB, Snowflake et consorts. Mais si on regardait vraiment ce qui se passe sous le capot ?\u003cbr\u003e\u003cbr\u003eAprès 20 ans à triturer des bases en prod, j\u0026#39;en ai marre des décisions prises sur des benchmarks qui comparent un épervier dressé (ClickHouse) avec un corbeau en configuration d\u0026#39;usine (PostgreSQL) — alors que le corbeau peut tout faire s\u0026#39;il est bien entraîné.\u003cbr\u003e\u003cbr\u003eDans ce talk, on va démonter l\u0026#39;architecture de Postgres pour comprendre où sont ses vrais handicaps (spoiler: le stockage en ligne, c\u0026#39;est pas une légende). On verra ce que PostgreSQL 18 apporte comme améliorations, pourquoi les benchmarks classiques comme ClickBench racontent une histoire très... partielle, et ce qu\u0026#39;on perd vraiment quand on abandonne ACID pour gagner en vitesse.\u003cbr\u003e\u003cbr\u003eLa vraie question n\u0026#39;est pas \u0026quot;quel système est le plus rapide sur un benchmark ?\u0026quot; mais \u0026quot;votre workload justifie-t-il vraiment la complexité d\u0026#39;une stack multi-bases ?\u0026quot; Dans 95% des cas, le meilleur moteur analytique reste celui que votre équipe sait déjà réparer.","summary":"Cette présentation déconstruit le mythe selon lequel PostgreSQL serait inadapté à l’analytique. Elle examine ses réels points faibles, les apports de PostgreSQL 18, les limites des benchmarks classiques et interroge la pertinence des migrations vers d’autres moteurs quand Postgres, bien configuré, suffit souvent à la majorité des usages.","audienceLevel":"ADVANCED","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":84,"track":{"id":1254,"name":"Data \u0026 Analytics","description":"Data storage, streaming, processing and ML engineering. Topics include data architecture, feature stores, training pipelines, MLOps and scalable analytics workflows."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":53214,"firstName":"Manon","lastName":"Marchand","fullName":"Manon Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"postgresql"},{"name":"analytique"},{"name":"benchmarks"},{"name":"stockage"}],"timeSlots":[]},{"id":29756,"title":"Comment les développeurs lisent-ils le code ?","description":"Est-ce que vous vous êtes déja demandé ce qu\u0026#39;il se passe dans la tête d\u0026#39;un développeur ?\u003cbr\u003eDans cette présentation, nous allons reprendre des éléments provenant de The Programmer\u0026#39;s Brain, mais aussi de Sapiens, pour vous expliquer ce qu\u0026#39;il se passe dans votre tête entre le moment où vous lisez du code et le moment où vous êtes capables d\u0026#39;écrire du code.\u003cbr\u003eOn parlera donc\u003cbr\u003e\u003cul\u003e\u003cli\u003eDe mémoire à courte terme et de mémoire à long terme\u003c/li\u003e\u003cli\u003eDe la manière dont le texte devient un modèle mental\u003c/li\u003e\u003cli\u003eDe la complexité, et de la manière dont elle peut affecter notre capacité de compréhension\u003c/li\u003e\u003cli\u003eDe syntaxe des langages, et de leurs propriétés cognitives\u003c/li\u003e\u003c/ul\u003eVous en tirerez des conclusions sur la manière dont le code devrait être écrit pour en faciliter la compréhension à petite et à grande échelle, mais aussi des leçons sur votre capacité de concentration.","summary":"Cette présentation explore les processus cognitifs des développeurs entre la lecture et l’écriture de code, en s’appuyant sur \"The Programmer’s Brain\" et \"Sapiens\". Elle aborde mémoire, modélisation mentale, complexité et propriétés cognitives des langages pour améliorer la compréhension et la rédaction du code.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":188,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":12035,"firstName":"Karim","lastName":"Garnier","fullName":"Karim Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":26790,"firstName":"Chloé","lastName":"Dubois","fullName":"Chloé Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"complexité"},{"name":"syntaxe"},{"name":"compréhension"},{"name":"mémoire"}],"timeSlots":[]},{"id":60507,"title":"Moins d\u0027outils, plus d\u0027impact : les tests automatisés en scale-up","description":"Quand on parle d’automatisation des tests, on parle souvent d’outils. Dans notre cas, le problème n’a jamais été de savoir lesquels utiliser, mais lesquels ne pas utiliser tout de suite. Parce qu’en scale-up, on ne manque pas d’idées… on manque de temps, de personnes et de marge d’erreur.\u003cbr\u003eCe talk propose un retour d’expérience concret sur la construction progressive d’une stratégie de tests fonctionnels et d’intégration automatisés, orientés API, au sein d’une équipe QA en cours de structuration sur un produit SaaS. L’initiative a démarré avec des tests API manuels avant d’évoluer vers une automatisation, intégrée à un pipeline CI/CD GitHub/AWS.\u003cbr\u003eL’automatisation, en plus de permettre un reporting centralisé, a défini de véritables critères d’acceptation conditionnant la mise en production. Les tests incluent désormais la vérification des CVE, des ports ouverts et des performances, directement liés à la \u003cstrong\u003esécurité, la stabilité et la fiabilité du pipeline\u003c/strong\u003e.\u003cbr\u003eToutes ces contraintes doivent être ordonnées et calibrées autour d’une stratégie de tests pragmatique, permettant de livrer rapidement un produit stable malgré une équipe QA limitée.","summary":"Ce talk présente le retour d’expérience d’une scale-up ayant bâti progressivement une stratégie d’automatisation des tests fonctionnels et d’intégration API. Partis de tests manuels, ils ont intégré un pipeline CI/CD GitHub/AWS, alliant sécurité, performance et fiabilité, avec une approche pragmatique adaptée à une équipe QA restreinte.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":53,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":60456,"firstName":"Noé","lastName":"Marchand","fullName":"Noé Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"sécurité"},{"name":"tests"},{"name":"automatisation"},{"name":"pipeline"}],"timeSlots":[]},{"id":60515,"title":"Troubleshooting en production : boostez vos skills sur une étude de cas","description":"Quand un incident critique survient, la pression monte immédiatement: données incohérentes, comportements imprévisibles, utilisateurs en alerte. Le réflexe naturel ? Chercher un coupable évident, pointer du doigt le dernier changement effectué, ou se laisser guider par l\u0026#39;intuition... sans progresser.\u003cbr\u003eDans cette session, je vous propose une exploration guidée d\u0026#39;une enquête technique réelle. Spark apparaît dans l\u0026#39;histoire, mais il n\u0026#39;est qu\u0026#39;un prétexte : le vrai sujet, c\u0026#39;est la méthode. Comment diagnostiquer un problème complexe sans s\u0026#39;éparpiller ? Comment éviter le biais de confirmation qui sabote nos investigations ? Comment découper progressivement un incident obscur en hypothèses claires et testables ?\u003cbr\u003e\u003cbr\u003eLe cas concret ? Des jobs Spark qui produisent de la data corrompue, avec des lignes en doublon et d\u0026#39;autres manquantes, en pleine migration de datacenter forcément. En revivant cet incident, vous découvrirez comment :\u003cbr\u003e\u003cbr\u003e - Construire une investigation pas-à-pas, même en terrain inconnu\u003cbr\u003e - Éliminer les mauvaises pistes\u003cbr\u003e - Vérifier les hypothèses de façon méthodique\u003cbr\u003e - Distinguer corrélation, coïncidence et véritable root cause\u003cbr\u003e\u003cbr\u003e...et ce qui s\u0026#39;est vraiment passé !","summary":"À partir d’un incident réel impliquant des jobs Spark corrompant des données, cette session explore une méthode rigoureuse d’investigation technique : formuler et tester des hypothèses, éviter les biais, distinguer corrélation et cause réelle. Objectif : apprendre à diagnostiquer efficacement tout incident complexe, même en environnement incertain.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":100,"track":{"id":1256,"name":"Cloud \u0026 Plateformes","description":"Backend and platform engineering across technologies: frameworks (Java, Go, Node, Rust…), Kubernetes, serverless, observability, SRE practices and infrastructure-as-code for production systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":51521,"firstName":"Camille","lastName":"Marchand","fullName":"Camille Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"méthode"},{"name":"diagnostic"},{"name":"incident"},{"name":"hypothèses"}],"timeSlots":[]},{"id":51625,"title":"Silence is Coming : survivre au chaos dans une archi événementielle distribuée","description":"Imaginez un projet mobilisant plusieurs squads distribuées, reposant sur des briques technologiques existantes. La DSI impose un découplage strict des responsabilités applicatives, tandis que le business réclame des réponses en temps réel. Dans ce contexte, l’architecture événementielle (EDA) se pose comme un choix structurant.\u003cbr\u003eRésilience, scalabilité et tolérance aux pannes : tout semble sous contrôle. Les services sont disponibles, les dashboards au vert, les pics de trafics absorbés.\u003cbr\u003eJusqu’au jour où… plus rien ne se passe.\u003cbr\u003eLes événements ne circulent plus. Les processus métier ralentissent, puis s’arrêtent. Ce silence radio est le symptôme d\u0026#39;un chaos systémique, amplifié par la fragmentation de l’ownership entre équipes.\u003cbr\u003eÀ travers un retour d’expérience en production, ce talk explore en quoi le silence est un anti-pattern sous-estimé en EDA et pourquoi il est souvent précurseur d\u0026#39;un impact business majeur.\u003cbr\u003eNous verrons comment concevoir des systèmes réellement Build to Last: observabilité orientée processus, contrats explicites entre producteurs et consommateurs, et définition claire des responsabilités.\u003cbr\u003eParce qu’en EDA, le vrai danger n’est pas le bruit… mais le silence.","summary":"Ce talk présente un retour d’expérience sur une architecture événementielle confrontée au “silence” : absence d’événements révélant un chaos systémique. Il met en lumière cet anti‑pattern critique et propose des solutions : meilleure observabilité métier, contrats explicites et responsabilités claires pour des systèmes réellement résilients.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":98,"track":{"id":1251,"name":"Architecture \u0026 Design","description":"Designs, trade-offs and real-world decisions for building maintainable systems. Case studies, system evolution (monolith→services), DDD, event-driven approaches, resilience and architectural anti-patterns."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":51513,"firstName":"Idris","lastName":"Dubois","fullName":"Idris Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":51519,"firstName":"Basile","lastName":"Dubois","fullName":"Basile Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"eda"},{"name":"résilience"},{"name":"silence"},{"name":"observabilité"}],"timeSlots":[]},{"id":2740,"title":"Handicap invisible : l\u0027accessibilité commence dès les réunions (et l\u0027IA aide)","description":"Réunions qui s’éternisent, infos perdues, fatigue mentale… et si quelques gestes simples pouvaient changer tout ça ?\u003cbr\u003e\u003cbr\u003eDans ce talk, je partagerai des astuces concrètes et immédiatement actionnables pour rendre vos dailys, standups et conférences accessibles à tous, en combinant bonnes pratiques et outils d’IA (sous-titres, transcription, résumés intelligents…).\u003cbr\u003e\u003cbr\u003eBasé sur mon expérience de Product Owner malentendante, ce talk montre comment l’accessibilité peut transformer la qualité et l’efficacité des échanges.\u003cbr\u003e\u003cbr\u003eVos réunions n’auront jamais été aussi productives, inclusives… et prêtes pour demain.\u003cbr\u003e","summary":"Ce talk présente des pratiques simples et outils d’IA (sous-titres, transcription, résumés) pour rendre réunions et stand‑ups plus **accessibles, inclusifs et efficaces**. À partir de l’expérience d’une Product Owner malentendante, il démontre comment l’accessibilité améliore la **qualité, la productivité et l’équité** des échanges professionnels.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":50,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":3601,"firstName":"Inès","lastName":"Lefevre","fullName":"Inès Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"productivité"},{"name":"accessibilité"},{"name":"réunions"},{"name":"ia"}],"timeSlots":[]},{"id":51626,"title":"Green architecture : moins de gras, plus d\u0027impact, plus d\u0027efficacité","description":"Vos APIs ont pris un peu de poids ? Elles consomment plus que nécessaire ? Pas de panique, on sort la boîte à outils pour leur faire un Green relooking !\u003cbr\u003eDans ce Tools-in-Action, nous appliquerons pas à pas le framework \u0026quot;API Green Score\u0026quot; sur une API réelle et existante, avec des outils open-source et des métriques concrètes.\u003cbr\u003eLe constat est simple : les APIs modernes sont souvent gourmandes.\u003cbr\u003eLe problème ? Pas le manque de principes, mais l’absence de règles mesurables et automatisées.\u003cbr\u003e\u003cbr\u003eEn live, nous :\u003cbr\u003e\u003cul\u003e\u003cli\u003eprendrons les mesures (payload, latence, cache),\u003c/li\u003e\u003cli\u003ecalculerons le Green Score par endpoint,\u003c/li\u003e\u003cli\u003emettrons en place des règles actionnables : compression GZIP/Brotli, champs partiels, allègement des données transférées, pagination obligatoire, …\u003c/li\u003e\u003cli\u003eautomatiserons la non-régression (SonarQube, Spectral).\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eRésultat ? Une API plus légère, plus rapide, et un impact environnemental réduit.\u003cbr\u003eNous vous montrerons les gains en direct (avant/après) : trafic réseau réduit, latence stabilisée, cache optimisé.\u003cbr\u003e\u003cbr\u003eEt pour repartir avec du concret, un \u003cstrong\u003erepo GitHub\u003c/strong\u003e vous attend avec tout le nécessaire pour reproduire la démarche.","summary":"Cette session montre comment alléger et verdir une API existante grâce au framework **API Green Score** : mesure d’indicateurs (payload, latence, cache), application de bonnes pratiques (compression, pagination, données minimales) et automatisation du suivi. Résultat : une API plus performante, économe en ressources et reproductible via un repo GitHub.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":146,"track":{"id":1251,"name":"Architecture \u0026 Design","description":"Designs, trade-offs and real-world decisions for building maintainable systems. Case studies, system evolution (monolith→services), DDD, event-driven approaches, resilience and architectural anti-patterns."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2552,"firstName":"Ibrahim","lastName":"Moreau","fullName":"Ibrahim Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":25801,"firstName":"Juliette","lastName":"Renaud","fullName":"Juliette Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"optimisation"},{"name":"api"},{"name":"mesure"},{"name":"performance"}],"timeSlots":[]},{"id":65319,"title":"L\u0027email à grande échelle : comment on a survécu à 800M de mails/an (et au DNS)","description":"Envoyer des emails “ça marche”… jusqu’au jour où ça ne marche plus. Et quand on en traite ~800 millions par an, chaque détail compte : performance, délivrabilité, fiabilité et observabilité. Dans ce talk, nous partageons le retour d’expérience de la refonte complète de la gestion des emails chez Mirakl : migration d’infrastructure et changement d’architecture.\u003cbr\u003e\u003cbr\u003eNous sommes passés d’une approche plutôt \u003cstrong\u003ebatch\u003c/strong\u003e  à une \u003cstrong\u003ebrique logicielle centrale\u003c/strong\u003e, alimentée par \u003cstrong\u003eKafka\u003c/strong\u003e, mutualisable pour tous les produits. Nous détaillons le design du pipeline et les choix qui ont permis d’absorber la variabilité SMTP : \u003cstrong\u003etraitement basé sur la durée\u003c/strong\u003e, plus des patterns de \u003cstrong\u003erésilience\u003c/strong\u003e.\u003cbr\u003eNous abordons aussi la migration “terrain” : \u003cstrong\u003echangement de provider\u003c/strong\u003e, \u003cstrong\u003ewhite labelling\u003c/strong\u003e, accompagnement sur les \u003cstrong\u003erecords DNS\u003c/strong\u003e, stratégie de bascule progressive, et mise en place de \u003cstrong\u003edashboards/alerting\u003c/strong\u003e. Enfin, nous partageons les difficultés réelles : validation de domaines, propagation DNS, limites de SPF (lookups), configurations DNS “créatives”, warmup et réputation IP.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eKey takeaways :\u003c/strong\u003e archi event-driven mutualisée, stratégie slow topic, résilience, plan de migration + checklist DNS/délivrabilité.","summary":"Retour d’expérience de Mirakl sur la refonte de sa plateforme d’envoi d’emails : passage d’un traitement batch à une architecture event‑driven centralisée sur Kafka, améliorant performance et résilience. Le talk détaille le pipeline, la migration d’infrastructure, la stratégie DNS/délivrabilité et les bonnes pratiques pour une messagerie fiable et scalable.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":48,"track":{"id":1251,"name":"Architecture \u0026 Design","description":"Designs, trade-offs and real-world decisions for building maintainable systems. Case studies, system evolution (monolith→services), DDD, event-driven approaches, resilience and architectural anti-patterns."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":51512,"firstName":"Romane","lastName":"Dubois","fullName":"Romane Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":65169,"firstName":"Camille","lastName":"Perrin","fullName":"Camille Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"migration"},{"name":"résilience"},{"name":"emails"},{"name":"kafka"}],"timeSlots":[]},{"id":91504,"title":"Tests end-to-end d\u0027API générés par IA : un REX de refonte de legacy","description":"Les refontes legacy restent particulièrement périlleuses, même en 2026. Que peut apporter l’IA ?\u003cbr\u003e\u003cbr\u003eDans cette session, nous partageons un retour d’expérience concret d’un projet de génération de tests end-to-end par IA, pour sécuriser une refonte d’API complexes qui portent 500 M€ de chiffre d’affaires annuel.\u003cbr\u003e\u003cbr\u003eNous montrerons comment nous avons conçu un workflow IA (agents avec MCP) pour régénérer de façon fiable et répétable des tests d’API permettant de comparer des JSON complexes de plus de 200 Ko.\u003cbr\u003e\u003cbr\u003eAvec une petite démo, nous montrerons comment le rôle de dev évolue vers le design de prompts qui génèrent des prompts qui génèrent du code, l’intérêt d’être exigeant dans les règles de qualité de code, et comment les sub-tasks avec chacune son contexte peuvent réduire les coûts IA dans la durée.","summary":"Cette session présente un retour d’expérience sur l’usage de l’IA pour générer automatiquement des tests end‑to‑end lors d’une refonte d’API critiques. Elle détaille un workflow d’agents MCP, la comparaison de JSON volumineux et l’évolution du rôle développeur vers la conception de prompts et l’optimisation des coûts IA.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":235,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":89112,"firstName":"Ethan","lastName":"Perrin","fullName":"Ethan Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":89114,"firstName":"Lina","lastName":"Perrin","fullName":"Lina Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"tests"},{"name":"refonte"},{"name":"api"},{"name":"ia"}],"timeSlots":[]},{"id":65339,"title":"Spécialisez vos agents grâce aux Skills","description":"Les outils de développement IA, comme GitHub Copilot, sont puissants mais restent généralistes. Comment leur transmettre vos standard et vos connaissances métier sans répéter les mêmes instructions à chaque conversation ?\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eAgent Skills\u003c/strong\u003e est un nouveau standard qui répond à ce défi. Un \u0026quot;Skill\u0026quot; est un dossier regroupant des instructions, des scripts et des ressources que l’agent charge automatiquement selon le contexte pour spécialiser son comportement sur des tâches précises.\u003cbr\u003e\u003cbr\u003eTugdual partage avec vous les clés pour créer, utiliser et partager vos propres skills, à travers des démos live issues de son expérien
