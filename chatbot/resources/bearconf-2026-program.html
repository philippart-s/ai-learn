kers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":10009,"firstName":"Rayan","lastName":"Garnier","fullName":"Rayan Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":148002,"firstName":"Mehdi","lastName":"Perrin","fullName":"Mehdi Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"architecture"},{"name":"poker"},{"name":"plateforme"},{"name":"performance"}],"timeSlots":[]},{"id":61670,"title":"Du texte aux données structurées complexes : quand le simple prompt ne suffit plus","description":"L’option “\u003cem\u003estructured output”\u003c/em\u003e des LLMs transforme les textes en données structurées. Mais lorsque le schéma cible présente des contraintes métier complexes peut-on faire confiance à un simple prompt ?\u003cbr\u003e\u003cbr\u003eChez PayFit, nous avons automatisé l\u0026#39;extraction des paramètres de paie à partir de la loi, un processus historiquement très manuel (et répétitif) mené par des experts conformité.\u003cbr\u003e\u003cbr\u003eLes mécanismes mis en oeuvre s’appuient sur deux approches complémentaires, applicables aux agents (e.g. pré-validation de \u003cem\u003epayload\u003c/em\u003e API) comme aux workflows :\u003cbr\u003e\u003col\u003e\u003cli\u003e\u003cstrong\u003eune feedback loop \u003cem\u003epré-programmée\u003c/em\u003e\u003c/strong\u003e orchestrant automatiquement le dialogue avec le LLM, afin de valider la syntaxe et la sémantique et de corriger automatiquement ses outputs selon les contraintes prédéfinies.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eune approche d’évaluation systématique\u003c/strong\u003e basée sur des métriques métier claires pour guider le choix d’un modèle adapté et itérer sur les prompts en détectant les régressions.\u003c/li\u003e\u003c/ol\u003eCe talk partage des patterns \u003cstrong\u003eapplicables immédiatement\u003c/strong\u003e, quel que soit votre langage de prédilection, pour dépasser le caractère non-déterministe des LLMs et générer des outputs respectant vos contraintes métier, tout en gardant une place pour la supervision de l’expert humain.","summary":"Chez PayFit, l’extraction automatisée de paramètres de paie via les LLMs s’appuie sur une boucle de feedback et une évaluation métier systématique pour fiabiliser la génération de données structurées. Ce retour d’expérience présente des méthodes concrètes pour dépasser le non‑déterminisme des LLMs et garantir le respect des contraintes métier.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":55,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":26761,"firstName":"Basile","lastName":"Renaud","fullName":"Basile Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"llm"},{"name":"contraintes"},{"name":"automatisation"},{"name":"extraction"}],"timeSlots":[]},{"id":61684,"title":"Dagger à grande échelle : éviter de se poignarder avec ses pipelines","description":"\u003cstrong\u003eDagger \u003c/strong\u003eest un puissant moteur (trop ?) de CI/CD programmable basé sur des conteneurs et créé par le papa de Docker. Il permet de définir des pipelines reproductibles directement en code.\u003cbr\u003e\u003cbr\u003eMal utilisé, il peut vite devenir un cauchemar à maintenir quand les pipelines se multiplient et que les équipes s’en emparent.\u003cbr\u003eDans ce \u003cem\u003eTools in Action\u003c/em\u003e, on part du terrain : démos live, exemples concrets et situations vécues.\u003cbr\u003eOn vous montrera ce qu’il faut faire (et surtout ce qu’il ne faut pas faire) pour utiliser \u003cstrong\u003eDagger\u003c/strong\u003e à grande échelle : organisation des modules, performances et expérience développeur.\u003cbr\u003e\u003cbr\u003eUn retour pragmatique et sans filtre pour tirer le meilleur de Dagger… sans se tirer une balle dans le pied.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":54,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":53215,"firstName":"Sacha","lastName":"Marchand","fullName":"Sacha Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":63423,"firstName":"Samir","lastName":"Marchand","fullName":"Samir Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"pipelines"},{"name":"performances"},{"name":"conteneurs"},{"name":"ci/cd"}],"timeSlots":[]},{"id":77052,"title":"La réplication de données avec Apache Accord","description":"La réplication des données est centrale dans les infrastructures informatiques modernes. Elle permet de préserver les données en cas de panne et d\u0026#39;assurer leur haute disponibilité. Cette présentation explique Apache Accord, le nouvel algorithme de réplication utilisé dans Apache Cassandra. Accord autorise des transactions ACID sur les données de Cassandra. Il repose sur des avancées récentes en systèmes distribués, en particulier les protocoles de réplication « leaderless », où chaque réplique peut traiter des opérations en communiquant avec un quorum de pairs. Pour mieux comprendre la genèse d’Accord, nous aborderons les algorithmes classiques de consensus comme Paxos et Raft. Nous évoquerons ensuite Egalitarian Paxos, qui a inspiré une tentative d’implémentation dans Cassandra, finalement abandonnée. Nous discuterons des défis associés à ces algorithmes, qu’il s’agisse de leur implémentation (par exemple, en Go ou Java), de leur validation avec des outils de vérification (comme le model checking), ou via des tests de robustesse (à la Jepsen). Enfin, l’utilisation d’Accord dans Cassandra sera illustrée par des exemples applicatifs simples.","summary":"Cette présentation explore Apache Accord, le nouvel algorithme de réplication de Cassandra offrant des transactions ACID via un protocole « leaderless ». Elle retrace son origine à partir de Paxos, Raft et Egalitarian Paxos, détaille ses défis d’implémentation et de validation, et illustre son usage pratique dans des applications distribuées.","audienceLevel":"ADVANCED","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":56,"track":{"id":1251,"name":"Architecture \u0026 Design","description":"Designs, trade-offs and real-world decisions for building maintainable systems. Case studies, system evolution (monolith→services), DDD, event-driven approaches, resilience and architectural anti-patterns."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":65197,"firstName":"Sofia","lastName":"Perrin","fullName":"Sofia Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"réplication"},{"name":"cassandra"},{"name":"algorithme"},{"name":"consensus"}],"timeSlots":[]},{"id":91501,"title":"L\u0027avenir du logiciel libre pour toi, moi… et les IA","description":"Les outils de programmation autonomes ont fait leur apparition il y a seulement quelques années, mais sont pourtant partout présents aujourd’hui. De notre terminal, à nos plateformes de collaborations en passant par notre éditeur, ils se sont installés partout. Que l’on soit sceptique quant à leur utilité ou un avide utilisateur de ces nouveaux compagnons, ils transforment de plus en plus le quotidien de nos projets.\u003cbr\u003eIl en va de même pour le logiciel libre, où de plus en plus de projets modifient leurs directives de contributions pour y inclure l’utilisation, voire l’interdiction totale de l’intelligence artificielle générative. Alors que cela signifie-t-il pour le logiciel libre? Et que l’on soit utilisateur, contributeur ou mainteneur de projets, cela nécessite réflexion dès aujourd’hui. Cette présentation fait un état des lieux, en utilisant plusieurs exemples de projets, de l’utilisation de l’intelligence artificielle générative dans le logiciel libre; tente d’y voir plus clair quant aux motivations qui poussent à faire certains choix et tâche de soulever les questions qui méritent réponse à fin de créer un avenir du développement logiciel soutenable pour tous.","summary":"Cette présentation analyse l’impact croissant des **outils de programmation autonomes** et de l’**IA générative** sur le **logiciel libre**. À travers divers exemples, elle explore leurs usages, les nouvelles règles de contribution, les motivations derrière ces choix et les enjeux pour un développement open source durable et éthique.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":53,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":89109,"firstName":"Alice","lastName":"Perrin","fullName":"Alice Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Canada"}],"keywords":[{"name":"outils"},{"name":"autonomes"},{"name":"terminal"},{"name":"programmation"}],"timeSlots":[]},{"id":83101,"title":"Du sidecar à l\u0027ambient : comprendre l\u0027évolution du service mesh avec Istio","description":"Si le modèle \u0026quot;Sidecar\u0026quot; a imposé le Service Mesh comme un standard de sécurité incontournable, il implique une adhérence forte entre le cycle de vie applicatif et l\u0026#39;infrastructure. Avec l\u0026#39;arrivée du mode \u003cstrong\u003eAmbient\u003c/strong\u003e en version stable, Istio ouvre une nouvelle ère : celle du \u0026quot;Sidecar-less\u0026quot;. Cette révolution architecturale promet de conserver la robustesse du Mesh tout en réduisant drastiquement son empreinte opérationnelle.\u003cbr\u003eMais concrètement, comment fonctionne un Service Mesh sans conteneur injecté dans chaque pod ?\u003cbr\u003eDans cette session, nous plongerons sous le capot de cette nouvelle architecture (ztunnel, waypoint proxies) pour comprendre comment elle sépare les couches L4 et L7. Pas de slides interminables, place à la pratique :\u003cbr\u003e\u003cul\u003e\u003cli\u003eDéploiement live de l\u0026#39;application \u003cstrong\u003eBookinfo dans un cluster kubernetes\u003c/strong\u003e.\u003c/li\u003e\u003cli\u003eComparaison visuelle et technique : cohabitation du mode Sidecar et du mode Ambient.\u003c/li\u003e\u003cli\u003eAnalyse de l\u0026#39;observabilité via Kiali pour visualiser concrètement les flux.\u003c/li\u003e\u003c/ul\u003eVenez découvrir si le mode Ambient est prêt à simplifier votre stack Kubernetes !","summary":"La session présente le mode **Ambient** d’Istio, évolution « sidecar‑less » du Service Mesh. Elle détaille son architecture (ztunnel, waypoint proxies), la séparation L4/L7 et son impact opérationnel. Une démonstration live sur Kubernetes compare les modes Sidecar et Ambient, avec analyse d’observabilité via Kiali pour évaluer sa maturité.","audienceLevel":"ADVANCED","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":52,"track":{"id":1256,"name":"Cloud \u0026 Plateformes","description":"Backend and platform engineering across technologies: frameworks (Java, Go, Node, Rust…), Kubernetes, serverless, observability, SRE practices and infrastructure-as-code for production systems."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":77863,"firstName":"Inès","lastName":"Perrin","fullName":"Inès Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"architecture"},{"name":"kubernetes"},{"name":"istio"},{"name":"mesh"}],"timeSlots":[]},{"id":77092,"title":"ReBAC à grande échelle : sauvons le p99","description":"L\u0026#39;access management est souvent perçu comme un détail d’implémentation… jusqu’au jour où il devient un point de passage obligatoire pour tout le produit. Après plus de deux ans de ReBAC centralisé en production, nous avons eu un signal clair : la latence ne tenait plus la promesse d’autorisations fines “quasi instantanées”. Produit et modèle grandissant, le coût d’évaluation explosait.\u003cbr\u003e\u003cbr\u003eDans ce retour d’expérience, nous partageons ce qui casse à l\u0026#39;échelle (explosion des relations, hot paths, cache qui se dégrade, migrations sans downtime) et comment nous avons repris le contrôle : quelles métriques suivre, quels refactors de modèle apportent les plus gros gains, et quels leviers techniques (caching, read replicas) stabilisent durablement la performance.\u003cbr\u003e\u003cbr\u003eAu final, la performance ne se gagne pas seulement au niveau de la plateforme : elle se gagne surtout dans le modèle. Et même si vous n’utilisez pas (encore) ReBAC, les mécanismes et les erreurs décrits sont ceux de nombreux systèmes centralisés. Vous repartirez avec des règles de modélisation, des anti-patterns, et une checklist pour garder une plateforme critique rapide, résiliente et évolutive.","summary":"Ce retour d’expérience sur un **système ReBAC à grande échelle** décrit les **limites de performance** rencontrées (latence, explosion des relations, cache dégradé) et les **solutions** mises en œuvre : refactors de modèle, métriques clés, optimisations techniques. Il en dégage des **principes généraux** pour concevoir des plateformes rapides et résilientes.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":57,"track":{"id":1251,"name":"Architecture \u0026 Design","description":"Designs, trade-offs and real-world decisions for building maintainable systems. Case studies, system evolution (monolith→services), DDD, event-driven approaches, resilience and architectural anti-patterns."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":53236,"firstName":"Louise","lastName":"Marchand","fullName":"Louise Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":65151,"firstName":"Romane","lastName":"Marchand","fullName":"Romane Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"rebac"},{"name":"plateforme"},{"name":"performance"},{"name":"modèle"}],"timeSlots":[]},{"id":41357,"title":"Unconference : le management sans filtre","description":"L’unconference est un espace dédié aux \u003cstrong\u003eéchanges entre pairs\u003c/strong\u003e sur les défis concrets du management. Que vous soyez déjà Engineering Manager, VP, Head of, CTO, ou développeur/tech lead en réflexion sur une évolution vers le management, \u003cstrong\u003evotre expérience et vos questions sont au cœur de cette session\u003c/strong\u003e.\u003cbr\u003ePas de programme prédéterminé : \u003cstrong\u003evous proposez les sujets\u003c/strong\u003e, et ensemble, on explore des solutions adaptées à vos réalités. Les discussions peuvent porter sur :\u003cbr\u003e\u003cul\u003e\u003cli\u003eDébuter en tant qu\u0026#39;Engineering Manager\u003c/li\u003e\u003cli\u003eLa recherche d’une posture équilibrée\u003c/li\u003e\u003cli\u003eLa gestion des tensions ou des dynamiques d’équipe.\u003c/li\u003e\u003cli\u003eL’articulation entre livraison, excellence et accompagnement\u003c/li\u003e\u003cli\u003eOu encore, pour les profils plus expérimentés, les enjeux d’échelle : \u003cstrong\u003estructuration des équipes, alignement produit/tech/business, fidélisation des talents, ou communication avec la direction\u003c/strong\u003e.\u003c/li\u003e\u003c/ul\u003eL’objectif ? \u003cstrong\u003eCroiser les regards\u003c/strong\u003e, s’inspirer des retours d’expérience des autres participants, et repartir avec des pistes d’action \u003cstrong\u003etestées sur le terrain\u003c/strong\u003e.\u003cbr\u003eQue vous veniez avec une question précise ou simplement l’envie de contribuer, cette session collaborative est conçue pour \u003cstrong\u003evous\u003c/strong\u003e.","summary":"Session collaborative sans programme prédéfini, l’unconference favorise les échanges entre pairs autour des défis du management technique : prise de poste, posture, gestion d’équipe, équilibre livraison/excellence, structuration à l’échelle. Les participants proposent les sujets, partagent leurs expériences et repartent avec des pistes d’action concrètes et adaptées à leurs réalités.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":44,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":984,"slug":"lab-120","name":"2H Hands-on Lab","duration":120,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"2 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":41304,"firstName":"Anaïs","lastName":"Dubois","fullName":"Anaïs Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":63418,"firstName":"Juliette","lastName":"Marchand","fullName":"Juliette Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":65181,"firstName":"Léa","lastName":"Perrin","fullName":"Léa Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"équipe"},{"name":"expérience"},{"name":"collaboration"},{"name":"management"}],"timeSlots":[]},{"id":51650,"title":"De la galère des setups locaux aux DevContainers : notre REX","description":"\u0026quot;Ça marche sur ma machine !\u0026quot; Qui n\u0026#39;a jamais entendu ou prononcé cette phrase ? La multiplication des outils, des versions et des configurations rend la maintenance d\u0026#39;environnements de développement ISO-production de plus en plus complexe.\u003cbr\u003e\u003cbr\u003eChez ADEO, nous avons d\u0026#39;abord tenté de résoudre ce problème avec des \u003cstrong style\u003d\"color: rgb(0, 0, 0);\"\u003escripts bash\u003c/strong\u003e pour standardiser l\u0026#39;installation des postes. Mais cette approche ayant des limites, nous avons exploré les \u003cstrong style\u003d\"color: rgb(0, 0, 0);\"\u003eDevContainers\u003c/strong\u003e.\u003cbr\u003e\u003cbr\u003eDans ce \u0026quot;Tool in Action\u0026quot;, nous vous montrerons concrètement comment nous avons transformé notre expérience de développement. Tout d\u0026#39;abord comment à l\u0026#39;aide d\u0026#39;un \u003cstrong style\u003d\"color: rgb(0, 0, 0);\"\u003epackage manager\u003c/strong\u003e, nous avons accélérer l\u0026#39;installation des postes des nouveaux arrivants. \u003cbr\u003e\u003cbr\u003eEt aussi, oubliez les \u0026quot;README\u0026quot; d\u0026#39;installation à rallonge ! Nous vous guiderons pas à pas pour :\u003cbr\u003e\u003col\u003e\u003cli\u003e\u003cstrong style\u003d\"color: rgb(0, 0, 0);\"\u003eDémarrer un projet en un clic\u003c/strong\u003e grâce à un environnement unifié et versionné.\u003c/li\u003e\u003cli\u003e\u003cstrong style\u003d\"color: rgb(0, 0, 0);\"\u003eConfigurer et personnaliser\u003c/strong\u003e votre DevContainer (outils, extensions, authentification).\u003c/li\u003e\u003cli\u003e\u003cstrong style\u003d\"color: rgb(0, 0, 0);\"\u003eIntégrer des registries privées\u003c/strong\u003e et gérer les contraintes d\u0026#39;entreprise.\u003c/li\u003e\u003c/ol\u003e\u003cbr\u003eÀ la fin de cette session, vous aurez toutes les clés pour mettre en place des DevContainers sur vos propres projets et dire adieu aux problèmes de configuration locale.","summary":"Ce **Tool in Action** d’**ADEO** présente l’adoption des **DevContainers** pour unifier et automatiser les environnements de développement. Après les limites des scripts bash, la solution simplifie l’installation, la personnalisation et l’intégration en entreprise, permettant de lancer un projet en un clic et d’éliminer les problèmes de configuration locale.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":94,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":12032,"firstName":"Élise","lastName":"Garnier","fullName":"Élise Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"devcontainers"},{"name":"environnement"},{"name":"développement"},{"name":"configuration"}],"timeSlots":[]},{"id":54216,"title":"Code criminel : résolvez l\u0027enquête grâce à DuckDB","description":"Découvrir un moteur de calcul analytique… en résolvant une enquête criminelle ? Et si l’apprentissage de DuckDB devenait une expérience ludique et immersive plutôt qu’une simple démo technique ?\u003cbr\u003eDans ce workshop, plongez dans l’univers de DuckDB via un \u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: rgb(17, 20, 24);\"\u003eescape game\u003c/strong\u003e. Vous analyserez des jeux de données, croiserez des indices et exploiterez plusieurs sources pour identifier le suspect avant la fin du temps imparti. Chaque étape met en lumière une fonctionnalité clé de DuckDB, de façon concrète.\u003cbr\u003eVous comprendrez pourquoi DuckDB s’impose dans l’analytique moderne : hautes performances, exploration rapide, lecture et manipulation simplifiées de fichiers (locaux ou distants) et extensions qui démultiplient ses capacités.\u003cbr\u003e \u003cbr\u003e\u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: rgb(17, 20, 24);\"\u003eCe que vous apprendrez :\u003c/strong\u003e fondamentaux et cas d’usage, interrogation/analyse de données locales et distantes en SQL, manipulation de formats variés et fonctions analytiques avancées — le tout par la pratique et la résolution de problèmes.\u003cbr\u003e\u003cbr\u003e\u003cstrong style\u003d\"background-color: rgb(255, 255, 255); color: rgb(17, 20, 24);\"\u003eÀ qui s’adresse ce workshop ?\u003c/strong\u003e Développeurs et profils data (engineer/analyst/…) curieux de découvrir DuckDB autrement. Pas de prérequis avancés : si vous aimez les énigmes, les données et apprendre en vous amusant, ce workshop est pour vous.","summary":"Atelier ludique sous forme d’escape game pour apprendre DuckDB en résolvant une enquête. Les participants explorent et analysent des données pour découvrir ses performances, sa simplicité et ses capacités analytiques avancées. Destiné aux développeurs et profils data souhaitant maîtriser DuckDB de manière concrète et interactive.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":38,"track":{"id":1254,"name":"Data \u0026 Analytics","description":"Data storage, streaming, processing and ML engineering. Topics include data architecture, feature stores, training pipelines, MLOps and scalable analytics workflows."},"sessionType":{"id":984,"slug":"lab-120","name":"2H Hands-on Lab","duration":120,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"2 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":53220,"firstName":"Nour","lastName":"Marchand","fullName":"Nour Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":53222,"firstName":"Jade","lastName":"Marchand","fullName":"Jade Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"atelier"},{"name":"données"},{"name":"duckdb"},{"name":"analytique"}],"timeSlots":[]},{"id":26829,"title":"Jujutsu : la fin de la peur du rebase","description":"Je vous propose de découvrir \u003cstrong\u003eJujutsu(jj)\u003c/strong\u003e, un \u003cstrong\u003eoutil de versioning moderne\u003c/strong\u003e qui repense en profondeur la façon dont on manipule l\u0026#39;historique. Avec Jujutsu, modifier, réecrire ou réorganiser ses changements devient sûr, explicite et réversible, au point de faire disparaitre \u003cstrong\u003ela peur du rebase\u003c/strong\u003e !\u003cbr\u003e\u003cbr\u003eJe suis coach craft et spécialiste de la performance du delivery et de la DevEx, je montrerai comment Jujutsu peut être utilisé en complément de Git, sans révolutionner vos workflows existants, tout en améliorant drastiquement le flow, la confiance et le confort des développeurs.\u003cbr\u003e\u003cbr\u003eUne démonstration de l\u0026#39;outil et très peu de slides pour vous motiver à utiliser \u0026quot;jj\u0026quot; dès le lendemain !","audienceLevel":"ADVANCED","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":109,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":26762,"firstName":"Camille","lastName":"Dubois","fullName":"Camille Dubois","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"jujutsu"},{"name":"historique"},{"name":"versioning"},{"name":"développeurs"}],"timeSlots":[]},{"id":5587,"title":"Speechless Live @ BearConf","description":"Speechless Live est un show unique en france. Initialement créé dans la Silicon Valley, il s\u0026#39;exporte maintenant dans le monde et a posé ses valises à Nantes depuis 2017. Cettte session hors norme s\u0026#39;exporte maintenant dans les différentes conférences de France afin d\u0026#39;offrir un temps de pause bien mérité pour les neurones.\u003cbr\u003eL\u0026#39;objectif est simple : faire s\u0026#39;affronter des speakers.euses dans un exercice d\u0026#39;improvisation ! Au programme :\u003cbr\u003e\u003cul\u003e\u003cli\u003e3 speakers.euses\u003c/li\u003e\u003cli\u003e2 Juré.ées\u003c/li\u003e\u003cli\u003eUn thème tiré au sort\u003c/li\u003e\u003cli\u003eUn sujet donné par le public\u003c/li\u003e\u003cli\u003eDes slides sans queue ni tête imposées\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eCette session est donc avant tout une performance et un bon moyen de se détendre entre 2 conférences techniques\u003cbr\u003e","summary":"Speechless Live est un show d’improvisation unique où des speakers s’affrontent sur des sujets et slides imprévus, avec jury et public. Né dans la Silicon Valley, il s’exporte en France pour offrir un moment ludique et détendant entre deux conférences techniques.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":55,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":100201,"slug":"speechless","name":"Speechless","duration":45,"pause":false,"invitationOnly":true,"freeTickets":1,"minSpeakers":1,"description":"Speechless Live","cssColor":"#ff8400","countInQuota":false,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":7352,"firstName":"Camille","lastName":"Garnier","fullName":"Camille Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"improvisation"},{"name":"conférences"},{"name":"speakers"},{"name":"performance"}],"timeSlots":[]},{"id":5595,"title":"Observabilité CI/CD : normaliser avec CDEvents","description":"Les platform engineers gèrent des pipelines hétérogènes (GitHub Actions, Jenkins, ArgoCD) mais manquent d\u0026#39;une visibilité unifiée. Impossible de mesurer la \u0026quot;delivery performance\u0026quot; sans corréler manuellement des logs dispersés.\u003cbr\u003e\u003cbr\u003eCe Tools in Action montre comment construire une observabilité CI/CD avec \u003ca href\u003d\"https://cdevents.dev\" rel\u003d\"noopener noreferrer\" target\u003d\"_blank\"\u003eCDEvents\u003c/a\u003e :\u003cbr\u003e\u003cul\u003e\u003cli\u003eLe problème : fragmentation entre outils CI/CD\u003c/li\u003e\u003cli\u003eCDEvents : événements normalisés pour la delivery avec ses avantages, ses inconvénients, sa roadmap\u003c/li\u003e\u003cli\u003eArchitecture \u003ca href\u003d\"https://cdviz.dev\" rel\u003d\"noopener noreferrer\" target\u003d\"_blank\"\u003eCDviz\u003c/a\u003e : collecteur + PostgreSQL/TimescaleDB + Grafana\u003c/li\u003e\u003cli\u003eDémo: dashboards avec deployment frequency, promotion delays, pipeline duration\u003c/li\u003e\u003cli\u003eOuverture vers l\u0026#39;automation\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eArchitecture réutilisable basée sur une norme ouverte pour mesurer vos pipelines \u0026quot;sans vendor lock-in\u0026quot;.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":92,"track":{"id":1256,"name":"Cloud \u0026 Plateformes","description":"Backend and platform engineering across technologies: frameworks (Java, Go, Node, Rust…), Kubernetes, serverless, observability, SRE practices and infrastructure-as-code for production systems."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":7353,"firstName":"Alex","lastName":"Garnier","fullName":"Alex Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"événements"},{"name":"architecture"},{"name":"pipelines"},{"name":"observabilité"}],"timeSlots":[]},{"id":161702,"title":"Sécurité de l\u0027IA : du PoC à la production","description":"Les agents IA s’intègrent désormais dans de nombreux environnements de production, mais leur adoption crée de nouvelles surfaces d’attaque cyber spécifiques. Pour sécuriser ces agents, il est essentiel de mettre en place des solutions comme des « guardrails » pour encadrer leurs comportements, des firewalls IA pour filtrer les requêtes, et d’appliquer de bonnes pratiques telles que la gestion fine des accès et la surveillance continue. Dans ce talk, nous parlerons de la Battlebox, un toolkit de sécurisation d’IA génératives développé par CortAIx et intégré dans une solution de pentest de Thales. Pour illustrer certaines attaques et PoCs, nous présenterons des démonstrations.","summary":"Les agents IA en production créent de nouvelles surfaces d’attaque. Cette présentation décrit les mesures de sécurisation essentielles — guardrails, firewalls IA, gestion des accès et surveillance continue — et présente Battlebox, un toolkit de protection des IA génératives développé par CortAIx et intégré à une solution de pentest Thales, avec démonstrations.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":41,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":161403,"firstName":"Emma","lastName":"Da Silva","fullName":"Emma Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":161404,"firstName":"Noé","lastName":"Da Silva","fullName":"Noé Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"agents ia"},{"name":"cybersécurité"},{"name":"guardrails"},{"name":"firewalls ia"}],"timeSlots":[]},{"id":77063,"title":"Vos agents de code en mode YOLO… mais en toute sécurité","description":"Il existe ce que l’on appelle la \u003cstrong\u003epermission fatigue\u003c/strong\u003e : à force de valider des demandes, on finit par accepter sans vraiment regarder ce que notre coding agent s’apprête à exécuter.\u003cbr\u003ePour contourner cela, les outils proposent aujourd’hui des \u003cstrong\u003emodes YOLO\u003c/strong\u003e (\u003cem\u003etrust-all-tools, bypass permissions…\u003c/em\u003e), donnant aux agents une autonomie totale.\u003cbr\u003eMais cette autonomie a un coût : ces modes permettent aux agents d’effectuer \u003cstrong\u003en’importe quelle opération sur la machine du développeur\u003c/strong\u003e. Les retours de développeurs ayant perdu du travail ou vu leur environnement local altéré se multiplient .\u003cbr\u003eLa question devient : \u003cstrong\u003ecomment offrir un maximum d’autonomie aux agents sans mettre en danger la machine hôte ?\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003eEn combinant \u003cstrong\u003eVMs et conteneurs\u003c/strong\u003e, \u003cstrong\u003eDocker Sandboxes\u003c/strong\u003e permet d’exécuter des agents IA dans des environnements réellement isolés. Les agents peuvent installer des outils, modifier leur environnement et lancer des workloads complexes en s’appuyant sur un \u003cstrong\u003eengine Docker isolé\u003c/strong\u003e, sans accès direct au host.\u003cbr\u003eLe trafic réseau sortant est contrôlé via les règles d’entreprise, et les agents n’ont accès ni aux clés d’API ni aux credentials, offrant une solution pour exécuter des coding agents \u003cstrong\u003een mode YOLO, mais en toute sécurité\u003c/strong\u003e.","summary":"Ce talk présente **Docker Sandboxes**, une solution pour exécuter des **agents IA en mode autonome** sans compromettre la sécurité du poste développeur. En combinant **VMs et conteneurs isolés**, elle permet aux agents d’agir librement tout en **protégeant le host**, contrôlant le réseau et sécurisant les **clés et credentials**.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":93,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":7356,"firstName":"Nadia","lastName":"Garnier","fullName":"Nadia Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"agents"},{"name":"autonomie"},{"name":"sécurité"},{"name":"isolation"}],"timeSlots":[]},{"id":25904,"title":"Prolog : un langage mûr et sous-estimé pour l\u0027IA symbolique","description":"Prolog fait partie de ces langages qui promeuvent, tout comme les langages fonctionnels, une autre façon de programmer : l’approche déclarative. Plutôt que de donner la procédure à suivre pour un calcul, une recette, on décrit les propriétés du résultat et le système fait le reste. Grâce à la logique du premier ordre et plus particulièrement aux clauses de Horns, l’expression d’un problème est faite via l’écriture de règles. Au cœur se trouve le principe d’unification qui est la clé de voute du système introduisant de facto la notion d’héritage ou/et de synthèse de valeurs.\u003cbr\u003e\u003cbr\u003eTout cela semble obscur ? Et pourtant, à son apogée, Prolog fût un champs de recherche fécond, un langage de choix pour ce que l’on appelait les ordinateurs de cinquième génération dans les années 90, pour l’IA ou le traitement du langage naturel.\u003cbr\u003e\u003cbr\u003eAvec l’avènement des I.A. probabilistes, redécouvrir ce langage hors norme permet d’avoir une approche différente voire complémentaire pour l’élaboration de systèmes déductifs. Nous vous proposons donc de découvrir (ou redécouvrir pour les plus chevronnés) aujourd’hui Prolog.","summary":"Cette session propose de redécouvrir **Prolog**, langage déclaratif fondé sur la logique du premier ordre et l’unification. Autrefois pilier de la recherche en IA et en traitement du langage naturel, il offre aujourd’hui une approche complémentaire aux IA probabilistes pour concevoir des systèmes déductifs et expressifs.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":35,"track":{"id":2754,"name":"Langages \u0026 JVM","description":"Java, JVM and polyglot ecosystems: JDK features, JVM tuning, GraalVM, Kotlin and other languages, language interop, tooling and performance insights."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2265,"firstName":"Adam","lastName":"Moreau","fullName":"Adam Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":5523,"firstName":"Karim","lastName":"Lefevre","fullName":"Karim Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"prolog"},{"name":"unification"},{"name":"déclaratif"},{"name":"règles"}],"timeSlots":[]},{"id":163352,"title":"À la rencontre d\u0027OpenRewrite","description":"Meet the folks behind OpenRewrite for a free form discussion on deterministic modernization tools \u0026amp; recipes, leveraged by humans and agents alike. Share what you\u0026#39;re working on, struggling with, or aim to achieve, and we\u0026#39;ll look at how that relates to our experience. Open to all levels, but not shy to go into depth. Hope to see you there for a lively session!","summary":"Free-form discussion with the OpenRewrite team on deterministic modernization tools and recipes for humans and agents. Share your projects, challenges, and goals, and connect them to our experience. Open to all skill levels, with room for deep technical discussion.","audienceLevel":"BEGINNER","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":21,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":3651,"slug":"meet-with","name":"Meet with ...","duration":90,"pause":false,"invitationOnly":true,"freeTickets":0,"minSpeakers":1,"description":"Meet with ... open-source communities. \nThis type of session doesn\u0027t provide a ticket and requires to have another session accepted.","cssColor":"#b8dbde","scheduleInSmallRoom":true,"countInQuota":false,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":60494,"firstName":"Gabriel","lastName":"Marchand","fullName":"Gabriel Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Netherlands"}],"keywords":[{"name":"openrewrite"},{"name":"recipes"},{"name":"deterministic"},{"name":"modernization"}],"timeSlots":[]},{"id":65333,"title":"Une modernisation déterministe à l\u0027ère de l\u0027IA","description":"AI is reshaping how we develop new software, as it\u0026#39;s cheaper than ever to jump from an idea into an implementation. But how does that capability translate into maintaining software? Can we accelerate modernization, without introducing risk?\u003cbr\u003e\u003cbr\u003eAt OpenRewrite \u0026amp; Moderne we explore these topics daily together with some of the largest companies in the world. We\u0026#39;ll share our lessons learned, and a practical approach to arrive at repeatable automations. We\u0026#39;ll show how we analyze the scale of a migration challenge, generate a deterministic outline, expand that with dedicated automations, and finally close the loop for the last mile.\u003cbr\u003e\u003cbr\u003eJoin us for a practical real-world use case, with an approach you can adopt as well. Ideally everyone benefits from the collective efforts of community, determinism \u0026amp; AI to automate away toil, as we collectively accelerate how software gets produced \u0026amp; maintained.","summary":"This session explores how OpenRewrite and Moderne use AI and deterministic automation to modernize and maintain large-scale software safely. Through real-world use cases, it demonstrates analyzing migration scope, generating repeatable automations, and leveraging community and AI to accelerate software evolution while minimizing risk and manual effort.","audienceLevel":"INTERMEDIATE","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":32,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":60494,"firstName":"Gabriel","lastName":"Marchand","fullName":"Gabriel Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Netherlands"}],"keywords":[{"name":"software"},{"name":"ai"},{"name":"automation"},{"name":"modernization"}],"timeSlots":[]},{"id":4025,"title":"Une histoire de l\u0027informatique au féminin","description":"Venez tester votre culture G autour de l’histoire de l’informatique !\u003cbr\u003eSi je vous dis Hedy Lamarr, il y a des chances que vous pensiez “Hollywood” ou “Wifi” (et si ça ne vous parle pas… ce talk est fait pour vous : il est temps de rattraper ça !).\u003cbr\u003eMais est-ce que vous sauriez reconnaître les dix femmes aux parcours remarquables présentées dans ce talk ?\u003cbr\u003eParticipez à un quizz entrecoupé d\u0026#39;explications sur leurs carrières et leurs inventions pour une pause culturelle et un regard différent sur l\u0026#39;histoire de la tech. Du spatial à l\u0026#39;IA en passant par l\u0026#39;open source, leurs contributions ont façonné la tech d’aujourd’hui. (Re)découvrez comment elles ont marqué l’histoire, parfois sans jamais être pleinement reconnues.\u003cbr\u003eEt grâce à ce talk, vous pourrez vous la raconter à la pose café en parlant de l\u0026#39;effet Mathilda !","summary":"Ce talk interactif propose un quiz pour découvrir dix femmes pionnières de l’histoire de l’informatique et leurs contributions majeures, du spatial à l’IA. Il offre explications et anecdotes pour valoriser leur impact souvent méconnu, et aborde la question de la reconnaissance avec l’effet Mathilda.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":88,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":3631,"firstName":"Ibrahim","lastName":"Lefevre","fullName":"Ibrahim Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"inventions"},{"name":"informatique"},{"name":"femmes"},{"name":"tech"}],"timeSlots":[]},{"id":61657,"title":"#NoFrameworks : inventez votre agilité, brûlez le playbook","description":"Agile frameworks like Scrum, SAFe, LeSS, Nexus, etc. promise packaged, structured solutions, but they are often criticized for their rigidity, cost, and limitations in complex environments. This session explores the #NoFrameworks approach, a philosophy that puts specific needs, local strengths, and co-creation at the heart of organizational transformations. \u003cbr\u003e\u003cbr\u003eThrough case studies and real-world examples, you’ll discover:\u003cbr\u003e- Why going by the book often fails.\u003cbr\u003e- How to diagnose your organization’s true needs and design bespoke solutions.\u003cbr\u003e- Tools and practices that allow you to create custom agile practices at scale, while maintaining alignment and impact.\u003cbr\u003e\u003cbr\u003eThis radically different approach invites you to rethink your strategic choices regarding agility to move forward with more relevance and achieve more sustainable results.","audienceLevel":"ADVANCED","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":64,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":26759,"firstName":"Aurore","lastName":"Renaud","fullName":"Aurore Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"agility"},{"name":"customization"},{"name":"co-creation"},{"name":"transformation"}],"timeSlots":[]},{"id":9714,"title":"De la théorie à la pratique : leçons de terrain sur la migration post-quantique","description":"Quantum computing is no longer a distant concept—it’s an imminent threat to today’s cryptographic standards. Transitioning to Post-Quantum Cryptography (PQC) is inevitable, and early adoption is critical. Yet, practical steps for adapting existing applications and ensuring compatibility remain unclear.\u003cbr\u003eThis session goes beyond theory. We’ll start with a concise overview of PQC fundamentals, then share real-world migration insights—what worked, what didn’t, and why. Through lessons learned from hands-on projects, attendees will gain actionable best practices for both future migrations and new application designs.\u003cbr\u003eIf you’ve ever wondered, “Where do I start?” or “What pitfalls should I avoid?”, this talk provides answers grounded in real-world experience and focused on practical success.\u003cbr\u003e\u003cstrong\u003eKey Takeaways\u003c/strong\u003e\u003cbr\u003e\u003cul\u003e\u003cli\u003eUnderstand PQC fundamentals and why early adoption matters\u003c/li\u003e\u003cli\u003eIdentify challenges and pitfalls from real-world migration projects\u003c/li\u003e\u003cli\u003eApply proven best practices to maintain security and performance\u003c/li\u003e\u003cli\u003eBuild a practical roadmap for integrating PQC into legacy and new systems\u003c/li\u003e\u003c/ul\u003e","summary":"This session demystifies Post-Quantum Cryptography (PQC) migration by sharing practical lessons and best practices from real-world projects. Attendees will learn PQC fundamentals, discover common pitfalls, and gain actionable strategies for integrating PQC into both legacy and new systems, ensuring security and performance in a quantum-ready future.","audienceLevel":"INTERMEDIATE","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":33,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2559,"firstName":"Ethan","lastName":"Moreau","fullName":"Ethan Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Japan"}],"keywords":[{"name":"migration"},{"name":"quantum"},{"name":"compatibility"},{"name":"cryptography"}],"timeSlots":[]},{"id":34401,"title":"Mise : le couteau suisse de votre poste Dev \u0026 Ops","description":"Marre de devoir jongler entre plusieurs contextes clients, projets et environnements ?\u003cbr\u003e\u003cbr\u003eDécouvrez \u0026quot;\u003ca href\u003d\"https://mise.jdx.dev/\" rel\u003d\"noopener noreferrer\" target\u003d\"_blank\"\u003eMise-En-Place\u003c/a\u003e\u0026quot;, un outil facilitant la vie des devs \u0026amp; des ops, permettant de gérer tout un environnement de travail.\u003cbr\u003e\u003cbr\u003eAu travers de \u003cstrong\u003edémonstrations live\u003c/strong\u003e, je vous propose un aperçu des fonctionnalités :\u003cbr\u003e\u003cbr\u003e\u003cul\u003e\u003cli\u003eGestion des \u003cstrong\u003evariables d\u0026#39;environnement\u003c/strong\u003e\u003c/li\u003e\u003cli\u003eGestion des différentes versions d\u0026#39;\u003cstrong\u003eapplications \u0026amp; runtimes\u003c/strong\u003e\u003c/li\u003e\u003cli\u003eGestion des scripts avec les \u003cstrong\u003etasks\u003c/strong\u003e\u003c/li\u003e\u003cli\u003eGestion des \u003cstrong\u003esecrets multi-sources \u003c/strong\u003eavec l\u0026#39;outil complémentaire \u003ca href\u003d\"https://fnox.jdx.dev/\" rel\u003d\"noopener noreferrer\" target\u003d\"_blank\"\u003efnox\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eMigration\u003c/strong\u003e depuis des outils type asdf \u0026amp; direnv\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eLimites\u003c/strong\u003e de l\u0026#39;outil\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eÀ l\u0026#39;issue de cette session, vous aurez toutes les clés pour adopter mise/fnox sur vos projets, et qu\u0026#39;une envie, l\u0026#39;installer ;)","summary":"Ce talk présente **Mise‑En‑Place**, un outil pour simplifier la gestion des environnements de travail multi‑projets. À travers des démonstrations, il montre la gestion des variables, versions, scripts et secrets (via *fnox*), ainsi que la migration depuis *asdf* ou *direnv*, pour adopter une configuration unifiée et efficace.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":87,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2582,"firstName":"Basile","lastName":"Moreau","fullName":"Basile Moreau","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"outil"},{"name":"gestion"},{"name":"environnement"},{"name":"automatisation"}],"timeSlots":[]},{"id":9717,"title":"GitOps et multi-environnements : une histoire de promotion","description":"Depuis quelques années déjà, le GitOps est devenu un standard quand on parle de déploiement sur Kubernetes...\u003cbr\u003e\u003cbr\u003eSi l\u0026#39;on se concentre sur l\u0026#39;écosystème de la Cloud Native Computing Foundation (CNCF), deux outils sont largement plébiscités : Flux CD et Argo CD. Ils sont d\u0026#39;ailleurs au statut \u0026quot;Graduated\u0026quot;, tous deux reconnus par leur maturité et leur utilisation dans des environnements de production.\u003cbr\u003e\u003cbr\u003eNéanmoins, l\u0026#39;approche GitOps n\u0026#39;offre pas de méthode spécifique pour reporter les modifications d\u0026#39;un environnement à un autre.\u003cbr\u003e\u003cbr\u003eComment faire pour reporter la nouvelle version d\u0026#39;image de mon API qui a été testée sur mon environnement de développement vers la qualité ou la production ?\u003cbr\u003e\u003cbr\u003eC\u0026#39;est là que Kargo, avec son mécanisme de promotions, rentre en scène...","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":90,"track":{"id":1256,"name":"Cloud \u0026 Plateformes","description":"Backend and platform engineering across technologies: frameworks (Java, Go, Node, Rust…), Kubernetes, serverless, observability, SRE practices and infrastructure-as-code for production systems."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":10018,"firstName":"Emma","lastName":"Garnier","fullName":"Emma Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Switzerland"}],"keywords":[{"name":"kubernetes"},{"name":"kargo"},{"name":"promotions"},{"name":"gitops"}],"timeSlots":[]},{"id":29779,"title":"Doper votre productivité avec un clavier 2.0 ergonomique","description":"Pour en connaître plus sur l’histoire et l’ergonomie des claviers ou améliorer votre productivité en configurant ou en programmant votre \u003cstrong\u003eclavier\u003c/strong\u003e pour rendre plus accessibles des combinaisons de touches fréquemment utilisées quand vous développez, cette présentation est faite pour vous.\u003cbr\u003e\u003cbr\u003eNous évoquerons d’abord rapidement l\u0026#39;histoire des dispositions clavier à travers les âges dont les plus récentes de type \u003cstrong\u003e1DFH\u003c/strong\u003e utilisables en français comme en anglais telle que Qwerty-Lafayette, Bepolar, \u003cstrong\u003eErgo-L\u003c/strong\u003e ou Ergolace.\u003cbr\u003e\u003cbr\u003eNous verrons ce qu’est un clavier ergonomique en analysant la géométrie de différents claviers orthogonaux (comme le \u003cstrong\u003ePreonic\u003c/strong\u003e ou \u003cstrong\u003ePlank\u003c/strong\u003e) ou \u0026quot;column stagger\u0026quot; (comme le \u003cstrong\u003eKeyboardio Model 100\u003c/strong\u003e, \u003cstrong\u003eCorne\u003c/strong\u003e ou \u003cstrong\u003eFerris\u003c/strong\u003e).\u003cbr\u003e\u003cbr\u003eEnsuite, nous présenterons ce qu’il est possible de faire pour améliorer l’ergonomie de votre clavier en le programmant via \u003cstrong\u003eKaleidoscope\u003c/strong\u003e/\u003cstrong\u003eQMK\u003c/strong\u003e/\u003cstrong\u003eZMK\u003c/strong\u003e ou en le configurant via \u003cstrong\u003eKanata\u003c/strong\u003e, \u003cstrong\u003eKalamine\u003c/strong\u003e et \u003cstrong\u003eArsenik\u003c/strong\u003e s’il n’est pas programmable avec mon retour d’expérience personnelle.\u003cbr\u003e\u003cbr\u003ePour conclure, nous verrons les raisons qui peuvent vous pousser à tenter l\u0026#39;aventure avec un nouveau type de clavier ou une nouvelle configuration en vous donnant quelques astuces quel que soit votre futur choix.","summary":"Cette présentation explore l’histoire et l’ergonomie des claviers, des dispositions modernes aux modèles orthogonaux ou “column stagger”. Elle montre comment programmer ou configurer son clavier pour améliorer confort et productivité, à l’aide d’outils comme QMK, ZMK ou Kanata, et partage des conseils pour adopter de nouvelles configurations.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":73,"track":{"id":1701,"name":"Pratiques de dev","description":"How teams deliver high-quality software: testing (TDD/BDD), CI/CD, automation, developer experience, code review, repo strategies and practical process improvements."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":30556,"firstName":"Nour","lastName":"Dubois","fullName":"Nour Dubois","bio":"I
