odèles eux-mêmes, nous aborderons la manière dont ces technologies sont passées de la recherche à la production à grande échelle, afin de soutenir la transparence des contenus et le suivi de provenance sur des plateformes comme \u003cstrong\u003eInstagram\u003c/strong\u003e et \u003cstrong\u003eFacebook\u003c/strong\u003e.\u003cbr\u003e\u003cbr\u003eLa présentation mettra également en lumière des axes de recherche futurs, tels que le tatouage des jeux de données pour tracer l’utilisation des données d’entraînement, et examinera les limites actuelles ainsi que les perspectives d’avenir du tatouage numérique invisible.","summary":"La présentation décrit **Meta Seal**, cadre open source pour intégrer des tatouages numériques invisibles et robustes (image, vidéo, audio, texte). Elle détaille ses modules (PixelSeal, AudioSeal, TextSeal), leur passage de la recherche à la production chez Meta, leurs limites actuelles et les perspectives de tatouage pour la traçabilité des contenus et données.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":61,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":148906,"firstName":"Camille","lastName":"Da Silva","fullName":"Camille Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":148907,"firstName":"Alex","lastName":"Da Silva","fullName":"Alex Da Silva","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"filigrane"},{"name":"robustesse"},{"name":"contenu"},{"name":"transparence"}],"timeSlots":[]},{"id":5554,"title":"L\u0027autorisation avec Spring Security : permissions, rôles et bien plus","description":"Pour les applications Spring Boot, Spring Security est le premier choix pour tous les use-case liés à la sécurité. La librairie offre des fonctionnalités de protections contre les attaques, authentification (qui est l\u0026#39;utilisateur?) et autorisation (a-t-il le droit de faire X?). En terme d\u0026#39;autorisation, les cas basiques comme `.hasRole(\u0026quot;...\u0026quot;)` sont très répandus, mais les choses se compliquent rapidement avec les use-cases avancés.\u003cbr\u003e\u003cbr\u003ePour mettre en place des permissions dans son appli, il faut penser à différentes choses. Durant la phase initiale de login de l\u0026#39;utilisateur, les informations pertinentes doivent être extraites, transformées et stockées. Puis, il faut définir et placer les points de \u0026quot;policy decision\u0026quot; et \u0026quot;position enforcement\u0026quot; dans le context d\u0026#39;une requête. Enfin, les implémentations concrètes sont exprimées via du code.\u003cbr\u003e\u003cbr\u003eVia de nombreux exemples en live-coding, vous acquérerez une solide compréhension des sujets d\u0026#39;autorisation dans vos applis Spring. Nous verrons les patterns de control d\u0026#39;accès, et comment les appliquer à Spring Security. Et nous verrons les trade-offs entre les différents méchanismes d\u0026#39;autorisation disponibles.","summary":"Cette présentation explore la gestion avancée de l’autorisation avec Spring Security pour Spring Boot, détaillant l’extraction des permissions lors du login, la définition des points de décision, et l’implémentation concrète. Des exemples pratiques illustrent les patterns de contrôle d’accès et les compromis entre différentes méthodes d’autorisation.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":94,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":959,"slug":"deep-dive-180","name":"3H Deep Dive","duration":180,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"3 hours sessions where attendees can rapidly immerse themselves in a subject matter with an in-depth examination of a topic or technology.","cssColor":"#c2cced","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":5502,"firstName":"Nathan","lastName":"Lefevre","fullName":"Nathan Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"authentification"},{"name":"autorisation"},{"name":"sécurité"},{"name":"permissions"}],"timeSlots":[]},{"id":50552,"title":"Les erreurs « normales » : anatomie d\u0027un renoncement collectif","description":"En théorie, une exception dans les logs est une anomalie à corriger d\u0026#39;urgence. En pratique, c\u0026#39;est souvent un bruit de fond que l\u0026#39;équipe a décidé, tacitement, d\u0026#39;ignorer parce que \u003cem\u003e\u0026quot;ça n\u0026#39;impacte pas le client\u0026quot;\u003c/em\u003e.\u003cbr\u003e\u003cbr\u003eComment une erreur critique devient-elle \u0026quot;normale\u0026quot; ? À quel moment précis une équipe décide-t-elle collectivement de dire \u003cem\u003e\u0026quot;C\u0026#39;est rouge, mais c\u0026#39;est pas grave\u0026quot;\u003c/em\u003e ?\u003cbr\u003e\u003cbr\u003eDans ce talk, nous allons explorer la psychologie du déni technique qui nous pousse à accepter l\u0026#39;inacceptable. Nous classifierons ces erreurs \u0026quot;domestiques\u0026quot; que nous avons adoptées comme des animaux de compagnie, et nous comprendrons pourquoi, parfois, le meilleur fix... c\u0026#39;est de filtrer les logs (ou pas).","summary":"Cette présentation analyse la « normalisation » des erreurs dans les logs : comment des exceptions critiques deviennent tolérées par habitude. Elle explore la psychologie du déni technique, la manière dont les équipes s’y résignent, et propose une réflexion sur la gestion, la classification et la pertinence du filtrage des logs.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":121,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":960,"slug":"lunch-talk-15","name":"Lunch Talk","duration":15,"pause":false,"freeTickets":1,"minSpeakers":1,"description":"Lunch sessions of 15 minutes on a range of different technologies, practices and methodologies.","cssColor":"#a7e8db","scheduleInSmallRoom":false,"maxSpeakers":1,"countInQuota":true,"dinerInvite":false},"fieldGroupValues":[],"speakers":[{"id":15665,"firstName":"Alex","lastName":"Renaud","fullName":"Alex Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"logs"},{"name":"psychologie"},{"name":"déni"},{"name":"erreur"}],"timeSlots":[]},{"id":5588,"title":"Petit éloge de la simplicité","description":"Les méthodes agiles se sont construites en opposition à des fonctionnements lourds, bureaucratiques, prédictifs. Mais les années passant, l’écosystème agile n’a‑t‑il pas généré sa propre complexité ?\u003cbr\u003e\u003cbr\u003eLes pratiques actuelles sont‑elles légères ? Nos approches sont‑elles vraiment adaptatives ? Aurions‑nous la possibilité de faire plus simple ?\u003cbr\u003e\u003cbr\u003eBienvenue dans une conférence où la provocation et l’humour ont vocation à ébranler quelques certitudes solidement établies.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":135,"track":{"id":1253,"name":"Humain \u0026 Culture","description":"The human side of software: leadership, team dynamics, inclusion, wellbeing, career development and practices that build healthier, more effective engineering organizations."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":7354,"firstName":"Léa","lastName":"Garnier","fullName":"Léa Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"complexité"},{"name":"agile"},{"name":"pratiques"},{"name":"conférence"}],"timeSlots":[]},{"id":26844,"title":"Au cœur d\u0027un pipeline front : démystifions Vite et ses plugins","description":"Dans le paysage du frontend, il y en a un qui met (presque) tout le monde d’accord. Au point où, mi-2025, \u003cstrong\u003eson nombre de téléchargements a dépassé celui de Webpack\u003c/strong\u003e.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eVite\u003c/strong\u003e est devenu, en l’espace de quelques années, \u003cstrong\u003eun incontournable\u003c/strong\u003e, une plateforme et une infrastructure communes pour le frontend. Vue, Nuxt, Remix, TanStack Start, Angular, Analog, Solid, Qwik, Astro, Slidev, Storybook, Tailwind CSS, Cloudflare, Laravel, Nitro et bien d’autres se basent désormais dessus. Il n’y a que Next qui résiste.\u003cbr\u003e\u003cbr\u003eAu-delà d’utiliser Vite, toutes ces librairies et frameworks reposent sur un unique et même concept : \u003cstrong\u003eles plugins\u003c/strong\u003e, seul moyen d’étendre les capacités de Vite. Même les fonctionnalités de Vite sont des plugins ! Mais sais-tu comment ils fonctionnent ? Comment en développer un ? Et ce qui se cache dans la pipeline qui les orchestre tous ?\u003cbr\u003e\u003cbr\u003eDans cette session, plonge dans le monde fascinant (et parfois énigmatique) de la pipeline de Vite. Ensemble, nous repasserons sur l’histoire de Vite, de son passé à son futur, puis nous nous intéresserons à son fonctionnement en analysant la pipeline à travers de véritables plugins. À la fin, Vite n’aura plus de secret pour toi.","summary":"Cette session explore l’ascension de Vite comme standard du frontend et dévoile le cœur de sa puissance : sa pipeline de plugins. À travers histoire, architecture et exemples concrets, elle explique leur fonctionnement et leur création, pour comprendre en profondeur le moteur extensible qui propulse l’écosystème moderne.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":88,"track":{"id":2760,"name":"Front-end \u0026 UX","description":"Web and mobile engineering: frameworks (Angular, React, Vue), performance, accessibility, design systems, PWAs and client-side integration patterns — including lightweight AI at the edge."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":15656,"firstName":"Idris","lastName":"Garnier","fullName":"Idris Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"vite"},{"name":"plugins"},{"name":"pipeline"},{"name":"frontend"}],"timeSlots":[]},{"id":148101,"title":"Bearer of Good News : bonnes nouvelles côté tokens Bearer","description":"OAuth 2.0 shipped in 2012 with glaring gaps. Public clients leaked secrets. Bearer tokens could be stolen and replayed. Authorization required users at their screens. Metadata lived in documentation, not discoverable endpoints. Token delegation meant copying credentials. Developers patched these with workarounds until the spec caught up.\u003cbr\u003e\u003cbr\u003eOAuth 2.1 consolidates best practices. PKCE becomes mandatory. DPoP adds cryptographic proof to bearer tokens, preventing replay attacks. CIBA decouples authorization from browser sessions. Client ID Metadata Documents and Authorization Server Metadata enable discovery over copy-paste configuration. Token Exchange enables delegation without credential copying—secrets never leave the authorization server. Cross-App Access extends this with identity assertion grants. Each solves a real problem; together, they modernize OAuth.\u003cbr\u003e\u003cbr\u003eThis talk explores why these extensions exist and when to use them. Build systems secure by default, not by accident. Understand which specs matter for your use case—from traditional apps to AI agents to B2B integrations.\u003cbr\u003e\u003cbr\u003eWe\u0026#39;ll assume basic OAuth and OIDC knowledge but explain each new concept from scratch.","summary":"OAuth 2.1 addresses major OAuth 2.0 flaws by integrating modern security and usability enhancements. Mandatory PKCE, DPoP proofs, CIBA flows, metadata discovery, token exchange, and cross‑app access together prevent token replay, eliminate secret leakage, and simplify configuration. The talk explains these updates, their use cases, and how they enable secure‑by‑default systems.","audienceLevel":"INTERMEDIATE","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":79,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":148001,"firstName":"Clara","lastName":"Perrin","fullName":"Clara Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Belgium"}],"keywords":[{"name":"labor"},{"name":"pleasure"},{"name":"pain"},{"name":"exercise"}],"timeSlots":[]},{"id":65306,"title":"L\u0027observabilité de zéro avec OpenTelemetry","description":"Passez de \u0026quot;Je pense qu\u0026#39;il y a une erreur\u0026quot; à \u0026quot;Voici exactement où se situe le goulot d\u0026#39;étranglement\u0026quot;.\u003cbr\u003e\u003cbr\u003eDans cet atelier de 3h, nous apprendrons à \u003cstrong\u003egénérer, collecter et corréler les signaux\u003c/strong\u003e (Traces, métriques et logs) avec OpenTelemetry. De l\u0026#39;\u003cstrong\u003eauto-instrumentation\u003c/strong\u003e rapide aux \u003cstrong\u003emesures manuelles ciblées\u003c/strong\u003e, vous découvrirez comment transformer un bruit de fond complexe en \u003cstrong\u003eune vue unifiée et intelligente de votre système.\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003eAu programme de cette immersion :\u003cbr\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eDe 0 à 100 :\u003c/strong\u003e Déployez l\u0026#39;auto-instrumentation pour capturer vos premiers signaux sans effort.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003ePrécision chirurgicale :\u003c/strong\u003e Passez à l\u0026#39;instrumentation manuelle pour exposer la logique métier critique.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eUnification :\u003c/strong\u003e Corrélez métriques, logs et traces pour obtenir une vision holistique de votre système.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eVisualisation \u0026amp; Diagnostic :\u003c/strong\u003e Propulsez vos données vers une stack performante (Prometheus/VictoriaMetrics, OpenSearch/Quickwit/Jaeger) et utilisez des dashboards Grafana exploitables en temps réel.\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eCet atelier pratique vous donnera les clés pour détecter les anomalies, \u003cstrong\u003eréduire votre MTTR\u003c/strong\u003e (\u003cem\u003eMean Time To Recovery\u003c/em\u003e) et \u003cstrong\u003eaméliorer la fiabilité\u003c/strong\u003e de vos applications.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eNote\u003c/strong\u003e: pas besoin de maitriser de langage de programmation.","summary":"Atelier pratique de 3 h pour maîtriser l’observabilité avec OpenTelemetry : de l’auto‑instrumentation aux mesures manuelles, corrélation de traces, métriques et logs, visualisation via Grafana et outils open source. Objectif : diagnostiquer précisément les anomalies, réduire le MTTR et accroître la fiabilité applicative, sans prérequis en programmation.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":115,"track":{"id":1256,"name":"Cloud \u0026 Plateformes","description":"Backend and platform engineering across technologies: frameworks (Java, Go, Node, Rust…), Kubernetes, serverless, observability, SRE practices and infrastructure-as-code for production systems."},"sessionType":{"id":968,"slug":"lab-180","name":"3H Hands-on Lab","duration":180,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"3 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":60452,"firstName":"Emma","lastName":"Marchand","fullName":"Emma Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":65161,"firstName":"Aurore","lastName":"Marchand","fullName":"Aurore Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"diagnostics"},{"name":"instrumentation"},{"name":"performance"},{"name":"observabilité"}],"timeSlots":[]},{"id":45203,"title":"Gérer vos tickets support avec l\u0027IA, sans cramer la planète","description":"L\u0026#39;IA générative, c\u0026#39;est pratique, mais mon ticket \u0026#39;J\u0026#39;ai perdu mon mot de passe\u0026#39; a-t-il vraiment besoin d\u0026#39;être traité par un modèle de 175 milliards de paramètres ? \u003cbr\u003e\u003cbr\u003eDans ce talk, on vous expliquera comment passer par des LLM locaux nécessitant des ressources raisonnables pour gérer vos tickets par exemple plutôt que des plateformes comme ChatGPT, Claude.ai \u0026amp; cie \u003cbr\u003e\u003cbr\u003eEn découpant en étapes simples le cycle de vie, on peut  arriver à utiliser uniquement des « TLM » (Tiny Langage Model) spécialisés plutôt que des très gros modèles génériques tels que Opus, GPT-5 … : \u003cbr\u003e\u003cul\u003e\u003cli\u003eIngestion des nouveaux tickets\u003c/li\u003e\u003cli\u003eClassification d’après des thématiques préconfigurées\u003c/li\u003e\u003cli\u003eSimilarité avec la base globale\u003c/li\u003e\u003cli\u003eRAG pour préparer une réponse\u003c/li\u003e\u003cli\u003eCapitalisation pour enrichir la base de connaissance\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003eToutes ces opérations, bien orchestrées, peuvent être réalisées sans avoir besoin de brûler une forêt à chaque requête et on vous le montrera avec des démos live ! \u003cbr\u003e\u003cbr\u003eDurant cette session, nous présenterons les résultats de notre « proof of concept » : avantages, contraintes, limites et points à creuser \u003cbr\u003e\u003cbr\u003eUn talk pour repenser nos utilisations de l’IA générative pour qu’elle soit utile sans pour autant sortir un tank pour tuer une mouche","summary":"Ce talk montre comment remplacer les grands modèles d’IA par des « Tiny Language Models » locaux pour automatiser la gestion de tickets. En suivant un cycle de vie simple (ingestion, classification, similarité, RAG, capitalisation), on réduit coûts et empreinte carbone sans sacrifier efficacité, avec démonstration et retour d’expérience.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":179,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":2589,"firstName":"Nadia","lastName":"Lefevre","fullName":"Nadia Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":26753,"firstName":"Idris","lastName":"Renaud","fullName":"Idris Renaud","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"llm"},{"name":"tlm"},{"name":"rag"},{"name":"ia"}],"timeSlots":[]},{"id":91531,"title":"Découvrir Linux à travers l\u0027analyse forensique de la RAM","description":"Si vous travaillez dans la tech, vous utilisez sûrement Linux dans votre quotidien. La ligne de commande, ça vous connaît ! Peut-être que vous savez même pourquoi on dit \u0026quot;everything is a file\u0026quot;, et peut-être même que vous savez sortir de Vim. Mais savez-vous vraiment comment il fonctionne, comment il gère la mémoire, les processus, les services, les fichiers, l\u0026#39;historique des commandes ? \u003cbr\u003e\u003cbr\u003eVenez découvrir votre OS comme vous ne l\u0026#39;avez probablement jamais fait : au travers de l\u0026#39;analyse forensique de la mémoire vive. À partir d\u0026#39;une capture de l\u0026#39;état de la RAM d\u0026#39;une machine infectée, vous apprendrez à mener l\u0026#39;enquête afin de révéler le mystère derrière cette scène de crime numérique. Vous découvrirez pour cela des notions clés comme la pagination, les syscalls, les crontabs, ou les processus. \u003cbr\u003e\u003cbr\u003ePas besoin d\u0026#39;être expert.e en investigation numérique, il vous faudra juste une machine et l\u0026#39;envie d\u0026#39;être là :)","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":72,"track":{"id":1255,"name":"Sécurité \u0026 Vie privée","description":"Practical approaches to secure software and data privacy: secure-by-design, supply-chain security, secrets management, app security testing and defenses for AI-specific threats (e.g., prompt injection)."},"sessionType":{"id":984,"slug":"lab-120","name":"2H Hands-on Lab","duration":120,"pause":false,"freeTickets":3,"minSpeakers":2,"description":"2 hours hands-on sessions where you delve into a specific technology or methodology under expert guidance.","cssColor":"#bcf7c8","scheduleInSmallRoom":true,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":89119,"firstName":"Gabriel","lastName":"Perrin","fullName":"Gabriel Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"},{"id":92812,"firstName":"Anaïs","lastName":"Perrin","fullName":"Anaïs Perrin","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"linux"},{"name":"processus"},{"name":"mémoire"},{"name":"forensique"}],"timeSlots":[]},{"id":32129,"title":"De la genAI directement dans le navigateur, c\u0027est possible ? (spoiler : oui)","description":"Accéder au dernier LLM à la mode booste indéniablement nos performances. Mais a-t-on vraiment besoin d’une puissance de calcul colossale pour corriger un post LinkedIn ou générer l’alternative textuelle d’une image ? Entre les coûts d\u0026#39;infrastructure, la dépendance à une connexion internet et les enjeux de confidentialité, le \u0026quot;tout cloud\u0026quot; pose question.\u003cbr\u003eEt si la solution se trouvait déjà dans l\u0026#39;outil que vous utilisez pour lire ces lignes ?\u003cbr\u003eDepuis les années 90, le navigateur n’a cessé d’évoluer. Aujourd\u0026#39;hui, il franchit une nouvelle étape en intégrant nativement des briques d’IA prêtes à l\u0026#39;emploi. Ce talk vous propose un tour d’horizon pratique des capacités d\u0026#39;IA embarquées dans nos navigateurs actuels. Au programme : de l\u0026#39;usage concret, de l\u0026#39;accessibilité et, bien sûr, l’incontournable \u0026quot;effet démo\u0026quot; (risques de plantage inclus 😅).","summary":"Cette présentation interroge la nécessité du « tout cloud » pour des tâches simples et explore comment les navigateurs modernes, désormais dotés de briques d’IA intégrées, offrent des alternatives locales, accessibles et économiques. Une démonstration pratique illustrera leurs capacités et limites, avec humour et esprit « effet démo ».","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":66,"track":{"id":2760,"name":"Front-end \u0026 UX","description":"Web and mobile engineering: frameworks (Angular, React, Vue), performance, accessibility, design systems, PWAs and client-side integration patterns — including lightweight AI at the edge."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":7352,"firstName":"Camille","lastName":"Garnier","fullName":"Camille Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"cloud"},{"name":"accessibilité"},{"name":"navigateur"},{"name":"ia"}],"timeSlots":[]},{"id":63903,"title":"Industrialisez la maintenance de vos stacks Dev et Ops","description":"La maintenance des dépendances et des configurations est souvent le parent pauvre du cycle de vie logiciel : manuelle, chronophage et source d\u0026#39;erreurs, elle devient un véritable goulot d\u0026#39;étranglement dès que le nombre de projets augmente. Et si nous traitions ces mises à jour comme du code ?\u003cbr\u003eDécouvrez l\u0026#39;\u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eUpdate-as-Code\u003c/strong\u003e avec \u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eUpdatecli\u003c/strong\u003e, l\u0026#39;outil conçu pour automatiser les changements partout où ils se trouvent (fichiers YAML, Dockerfiles, Terraform, Helm charts, etc.).\u003cbr\u003eDans cette session pensée pour les profils Dev et Ops, nous explorerons comment passer d\u0026#39;une maintenance subie à une stratégie industrielle. À travers un retour d\u0026#39;expérience concret, nous verrons comment :\u003cbr\u003e\u003cul\u003e\u003cli\u003e\u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eDéfinir des politiques de mise à jour\u003c/strong\u003e claires et reproductibles.\u003c/li\u003e\u003cli\u003e\u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003eConnecter vos outils\u003c/strong\u003e pour détecter, modifier et valider les changements automatiquement.\u003c/li\u003e\u003cli\u003e\u003cstrong style\u003d\"background-color: transparent; color: rgb(0, 0, 0);\"\u003ePasser à l\u0026#39;échelle\u003c/strong\u003e en gérant la maintenance de dizaines de projets sans augmenter la charge de travail.\u003c/li\u003e\u003c/ul\u003eQue vous soyez débutant en automatisation ou curieux de découvrir une nouvelle approche GitOps, vous repartirez avec les clés pour libérer votre temps et sécuriser vos infrastructures.\u003cbr\u003e","summary":"Cette session présente l’approche **Update-as-Code** avec **Updatecli**, outil d’automatisation des mises à jour de dépendances et configurations. Destinée aux profils Dev et Ops, elle montre comment industrialiser la maintenance, définir des politiques reproductibles et automatiser les changements à grande échelle pour gagner du temps et fiabiliser les infrastructures.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":139,"track":{"id":1256,"name":"Cloud \u0026 Plateformes","description":"Backend and platform engineering across technologies: frameworks (Java, Go, Node, Rust…), Kubernetes, serverless, observability, SRE practices and infrastructure-as-code for production systems."},"sessionType":{"id":957,"slug":"tia","name":"Tools-in-Action","duration":30,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Half an hour sessions focused on demonstrating technical tools or solutions.","cssColor":"#afb2e0","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":51540,"firstName":"Chloé","lastName":"Marchand","fullName":"Chloé Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"Belgium"},{"id":60475,"firstName":"Ethan","lastName":"Marchand","fullName":"Ethan Marchand","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"maintenance"},{"name":"gitops"},{"name":"automatisation"},{"name":"updatecli"}],"timeSlots":[]},{"id":5557,"title":"Bootiful Spring Boot 4 !","description":"Spring Boot 4.x and Java 25 have arrived, making it an exciting time to be a Java/Kotlin developer! Join me, Josh Long (@starbuxman), as we dive into the future of Spring Boot with Java 25+. We\u0026#39;ll learn how to scale your applications and codebases effortlessly and explore the robust Spring Boot ecosystem, featuring AI, modularity, seamless data access, security, and cutting-edge production optimizations such as Project Loom\u0026#39;s virtual threads, GraalVM, Java AOT, and more. Let\u0026#39;s explore the latest-and-greatest in Spring Boot to build faster, more scalable, more efficient, more modular, more secure, and more intelligent systems and services.\u003cbr\u003e\u003cbr\u003e","summary":"Discover the advancements in Spring Boot 4.x and Java 25+, including AI integration, modularity, data access, enhanced security, and production optimizations like virtual threads and GraalVM. Learn how these features empower developers to build faster, more scalable, secure, and intelligent applications and services for the future.","audienceLevel":"BEGINNER","language":{"id":39,"alpha2":"en","name":"English","flag32":"GB-32.png"},"totalFavourites":192,"track":{"id":1256,"name":"Cloud \u0026 Plateformes","description":"Backend and platform engineering across technologies: frameworks (Java, Go, Node, Rust…), Kubernetes, serverless, observability, SRE practices and infrastructure-as-code for production systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":5514,"firstName":"Élise","lastName":"Lefevre","fullName":"Élise Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"United States of America"}],"keywords":[{"name":"java"},{"name":"spring"},{"name":"ai"},{"name":"modularity"}],"timeSlots":[]},{"id":12093,"title":"Les fantastiques petits modèles de langage (SLM) et quand les utiliser","description":"Les Petits Modèles de Langue (SLM) gagnent en popularité, portés par la nécessité de construire des systèmes d’IA plus rapides, moins coûteux et mieux maîtrisés. \u003cbr\u003eCette présentation a pour but de vous présenter les SLM ainsi que leur place dans vos problématiques RAG ou agentiques, avec ou sans LLM complémentaire.\u003cbr\u003e\u003cbr\u003eNous explorerons les approches et architectures qui rendent ces petits modèles étonnamment performants, ainsi que les limites et compromis à connaître pour les intégrer efficacement dans des workflows d’IA ou des systèmes agentiques. \u003cbr\u003eÀ l\u0026#39;issue du talk, vous aurez une vision claire de ce que les SLM peuvent (et ne peuvent pas) offrir, et comment les utiliser pour construire vos applications d’IA.\u003cbr\u003e\u003cbr\u003eCe talk s\u0026#39;adresse à tout le monde et cherche à donner les clés de compréhension sur ces « hot topics » du moment.\u003cbr\u003eQue vous soyez développeur, décideur tech, data scientist ou ML/AI engineer, ce talk est fait pour vous.","summary":"Cette présentation explore les Petits Modèles de Langue (SLM), leurs performances, limites et intégration dans les systèmes RAG ou agentiques, avec ou sans LLM. Elle fournit une compréhension claire des apports et compromis des SLM pour concevoir des applications d’IA plus rapides, économiques et maîtrisées.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":111,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":7370,"firstName":"Yanis","lastName":"Garnier","fullName":"Yanis Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"agentique"},{"name":"architecture"},{"name":"slm"},{"name":"rag"}],"timeSlots":[]},{"id":22595,"title":"LLMs et hallucinations : comprendre, mesurer, maîtriser","description":"Les LLMs bluffent souvent par leur assurance… même quand ils inventent. Ces hallucinations ternissent leur fiabilité et limitent leur usage dans des domaines critiques comme la santé ou la finance.   \u003cbr\u003eMais d’où viennent-elles ? Comment les détecter, les évaluer, ou même les prévenir ?   \u003cbr\u003eDans ce talk, nous explorerons leurs origines, les méthodes de détection et d’évaluation, puis les stratégies de réduction de leur fréquence et de leur impact. Nous verrons comment des approches issues du context engineering — comme les workflows agentiques ou le RAG — peuvent aider, ainsi que les bénéfices de certaines architectures pour des cas d’usage spécifiques.   \u003cbr\u003eL’objectif : démystifier ce phénomène et repartir avec les clés pour concevoir des systèmes d’IA plus fiables et robustes. \u003cbr\u003e","summary":"Ce talk analyse les hallucinations des LLMs : leurs causes, méthodes de détection et d’atténuation. Il présente des solutions comme le context engineering, les workflows agentiques, le RAG et certaines architectures, pour concevoir des IA plus fiables, adaptées aux usages critiques. Objectif : mieux comprendre et limiter ce phénomène.","audienceLevel":"INTERMEDIATE","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":174,"track":{"id":1252,"name":"IA \u0026 Agents autonomes","description":"Generative AI, LLMs and agents in production: prompt engineering, RAG, agent design, evaluation, governance, safety and ethical considerations for deploying agentic systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":7371,"firstName":"Inès","lastName":"Garnier","fullName":"Inès Garnier","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"détection"},{"name":"architectures"},{"name":"hallucinations"},{"name":"fiabilité"}],"timeSlots":[]},{"id":4018,"title":"Détectives de la prod : élucider l\u0027enquête avant le crash","description":"Saviez-vous que, derrière les coulisses de vos outils de travail, se cachent des équipes prêtes à intervenir à tout moment ?\u003cbr\u003e\u003cbr\u003eCes équipes, souvent discrètes mais essentielles, gèrent des dizaines de projets avec des effectifs réduits. Mais quand une alerte survient, elles doivent réagir vite. Très vite. Comment réussir à diagnostiquer et résoudre un incident en pleine production, sans perdre une précieuse seconde ?\u003cbr\u003e\u003cbr\u003eDans ce talk je vous emmène au cœur de l’action, où je partage notre méthodologie pour transformer chaque crise en une enquête méthodique et efficace. Nous explorerons comment des outils bien pensés, une organisation affûtée, et un soupçon d’intuition transforment la gestion d’incidents en une véritable enquête… parfois aussi palpitante qu’une partie de Cluedo.\u003cbr\u003e\u003cbr\u003eAu programme : bonnes pratiques de troubleshooting, logging et monitoring, pour que vous repartiez avec des clés concrètes pour dompter les incidents dans vos propres projets.\u003cbr\u003e\u003cbr\u003eVous verrez qu’en production, chaque problème cache une histoire… à résoudre en équipe !","summary":"Cette conférence dévoile la gestion des incidents en production par des équipes réduites mais réactives. Elle présente une méthodologie d’enquête efficace, alliant outils, organisation et intuition, et propose des bonnes pratiques de troubleshooting, logging et monitoring pour optimiser la résolution collective des incidents.","audienceLevel":"BEGINNER","language":{"id":46,"alpha2":"fr","name":"French","flag32":"FR-32.png"},"totalFavourites":121,"track":{"id":1256,"name":"Cloud \u0026 Plateformes","description":"Backend and platform engineering across technologies: frameworks (Java, Go, Node, Rust…), Kubernetes, serverless, observability, SRE practices and infrastructure-as-code for production systems."},"sessionType":{"id":953,"slug":"conf-45","name":"Conference","duration":45,"pause":false,"freeTickets":2,"minSpeakers":1,"description":"Tech sessions of 45 minutes on a range of different technologies, practices and methodologies.","cssColor":"#c2a68c","scheduleInSmallRoom":false,"countInQuota":true,"dinerInvite":true},"fieldGroupValues":[],"speakers":[{"id":3630,"firstName":"Zoé","lastName":"Lefevre","fullName":"Zoé Lefevre","bio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","anonymizedBio":"Intervenant·e à BearConf 2026, passionné·e par la tech et le partage de connaissances.","twitterHandle":"","linkedInUsername":"","blueskyUsername":"","mastodonUsername":"","countryName":"France"}],"keywords":[{"name":"outils"},{"name":"méthodologie"},{"name":"production"},{"name":"incident"}],"timeSlots":[]},{"id":9711,"title":"All-in sur la plateforme : le nouveau poker d\u0027un opérateur de jeux en ligne","description":"Un an pour créer de zéro une \u003ca href\u003d\"https://www.betclic.fr/poker/\" rel\u003d\"noopen
